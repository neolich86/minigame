name: Build Dongne AAB

# Actions 탭 → "Build Dongne AAB" → Run workflow 로 수동 실행.
# 서명 키는 저장소 Secrets 에서만 읽는다 (저장소가 public 이므로 키를 파일/아티팩트로 만들지 않는다).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (Play 에 올릴 때마다 이전보다 큰 정수)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-dongne
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for n in KS KSP KA KP; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secret 이 비어 있음 ($n). README 의 '서명 키 등록' 단계를 먼저 하세요."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-dongne/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 러너에는 Android SDK 가 이미 들어 있다. 라이선스만 수락해 두면 Gradle 이 부족한 플랫폼을 받는다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install deps and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle
        working-directory: android-dongne/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::group::gradle log tail"; tail -n 80 "$RUNNER_TEMP/gradle.log"; echo "::endgroup::"
            # 원인 줄을 Annotations 에 바로 보이게 한다
            # 원인 줄을 Annotations 에 바로 보이게 한다 (한 줄에 모아서)
            msg=$(grep -E "Build file|What went wrong|Value is null|Caused by|problem occurred" -A3 "$RUNNER_TEMP/gradle.log" | head -30 | tr '\n' '|')
            echo "::error::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: dongne-app-release-aab
          path: android-dongne/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
