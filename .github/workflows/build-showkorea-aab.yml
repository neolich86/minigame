name: Build Show Korea AAB

# Actions 탭 → "Build Show Korea AAB" → Run workflow 로 수동 실행.
# 앱 화면은 public/games/korea-kit 의 파일을 앱 안에 그대로 넣는다(오프라인 동작). 웹을 고친 뒤 이 빌드를 다시 돌리면 앱에도 반영된다.
# 서명 키는 저장소 Secrets 에서만 읽는다 (저장소가 public 이므로 키를 파일/아티팩트로 만들지 않는다).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (Play 에 올릴 때마다 이전보다 큰 정수)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-showkorea
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for n in KS KSP KA KP; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secret 이 비어 있음 ($n)."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-showkorea/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Copy web files and sync Capacitor
        run: |
          npm ci
          npm run sync

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle
        working-directory: android-showkorea/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::group::gradle log tail"; tail -n 80 "$RUNNER_TEMP/gradle.log"; echo "::endgroup::"
            msg=$(grep -E "Build file|What went wrong|Value is null|Caused by|problem occurred" -A3 "$RUNNER_TEMP/gradle.log" | head -30 | tr '\n' '|')
            echo "::error::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: show-korea-app-release-aab
          path: android-showkorea/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
