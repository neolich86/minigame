name: Build Archer AAB

# Actions 탭 → "Build Archer AAB" → Run workflow 로 수동 실행.
# 서명 키는 저장소 Secrets 에서만 읽는다 (저장소가 public 이므로 키를 파일/아티팩트로 만들지 않는다).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (Play 에 올릴 때마다 이전보다 큰 정수)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-archer
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for n in KS KSP KA KP; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secret 이 비어 있음 ($n). README 의 '서명 키 등록' 단계를 먼저 하세요."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-archer/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install deps and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle
        working-directory: android-archer/android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: archer-app-release-aab
          path: android-archer/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
