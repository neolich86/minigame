<style>
  :root{
    --bg:#0e1420;
    --bg-panel:#161f30;
    --bg-panel-hi:#1c2740;
    --line:#2a3550;
    --text:#eef1f7;
    --text-dim:#8a93ac;
    --gold:#ffb84d;
    --gold-dim:#5a4526;
    --teal:#4ddbc7;
    --teal-dim:#1f4a45;
    --violet:#b48cff;
    --violet-dim:#3b2f5e;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #1b2846 0%, transparent 45%),
      radial-gradient(circle at 90% 0%, #251c3d 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
  }

  /* scanline atmosphere */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:999;
    mix-blend-mode:overlay;
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  /* ---------- HERO ---------- */
  header.hero{
    text-align:center;
    margin-bottom:44px;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing:.35em;
    font-size:11px;
    color:var(--teal);
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(77,219,199,0.06);
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px var(--teal);
    animation:blink 1.6s infinite ease-in-out;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  h1.title{
    font-family:'Gothic A1', sans-serif;
    font-weight:300;
    font-size:clamp(40px, 7vw, 76px);
    margin:22px 0 14px;
    letter-spacing:1px;
    background:linear-gradient(180deg, #fff 0%, #ffe4b8 55%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 0 40px rgba(255,184,77,0.25);
  }
  .subtitle{
    color:var(--text-dim);
    font-size:15px;
    max-width:520px;
    margin:0 auto;
    line-height:1.7;
  }
  .subtitle b{color:var(--text); font-weight:600;}

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:30px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:all .18s ease;
  }
  .filter-btn:hover{color:var(--text); border-color:#3c4a6e;}
  .filter-btn.active{
    color:#0e1420;
    background:var(--text);
    border-color:var(--text);
  }
  .filter-btn .count{
    font-family:'Space Mono', monospace;
    opacity:.6;
    margin-left:5px;
    font-size:11px;
  }

  .view-toggle{
    display:flex;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
    gap:4px;
    position:relative;
  }
  .view-toggle button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:'Space Mono', monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:color .18s ease;
    z-index:1;
  }
  .view-toggle button.active{color:#0e1420;}
  .view-toggle button svg{width:14px;height:14px;}
  .view-toggle .slider{
    position:absolute;
    top:4px; left:4px;
    width:calc(50% - 4px);
    height:calc(100% - 8px);
    background:var(--gold);
    border-radius:7px;
    transition:transform .28s cubic-bezier(.65,0,.35,1);
    box-shadow:0 0 16px rgba(255,184,77,.35);
  }
  .view-toggle.mode-list .slider{transform:translateX(0);}
  .view-toggle.mode-grid .slider{transform:translateX(100%);}

  /* ---------- GAME CARD (shared / cartridge look) ---------- */
  .card{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    display:block;
    opacity:0;
    transform:translateY(14px);
    animation:rise .5s ease forwards;
    transition:border-color .22s ease, transform .22s ease, box-shadow .22s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent, var(--gold));
    box-shadow:0 14px 30px -12px rgba(0,0,0,.55), 0 0 0 1px var(--accent, var(--gold)) inset;
  }
  @keyframes rise{to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){
    .card{animation:none; opacity:1; transform:none;}
  }

  /* cartridge notch cut on thumbnail corner */
  .thumb{
    position:relative;
    overflow:hidden;
    background:#0a0f18;
  }
  .thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .45s ease, filter .3s ease;
    filter:saturate(.92) brightness(.94);
  }
  .card:hover .thumb img{transform:scale(1.06); filter:saturate(1.05) brightness(1);}
  .notch{
    position:absolute;
    top:0; right:0;
    width:26px; height:26px;
    background:var(--bg);
    clip-path:polygon(100% 0, 0 0, 100% 100%);
  }

  .play-pill{
    position:absolute;
    display:flex; align-items:center; gap:6px;
    font-family:'Space Mono', monospace;
    font-size:11px; font-weight:700; letter-spacing:.05em;
    color:#0e1420;
    background:var(--gold);
    padding:7px 12px;
    border-radius:999px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .card:hover .play-pill{opacity:1; transform:translateY(0);}

  .genre-chip{
    font-family:'Space Mono', monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    padding:4px 9px;
    border-radius:5px;
    display:inline-block;
  }

  /* ---------- GRID (thumbnail) VIEW ---------- */
  .games.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
  }
  .games.grid .thumb{aspect-ratio:3/4;}
  .games.grid .info{
    padding:16px 18px 18px;
    border-top:1px solid var(--line);
  }
  .games.grid .right{display:none;}
  .games.grid .play-pill{bottom:14px; right:14px;}
  .games.grid .num-badge{
    position:absolute; top:12px; left:12px;
    font-family:'Space Mono', monospace;
    font-size:11px; color:rgba(255,255,255,.75);
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(3px);
    padding:3px 8px;
    border-radius:6px;
    z-index:2;
  }
  .games h3 .idx{
    font-family:'Space Mono', monospace;
    font-weight:400;
    font-size:12px;
    color:var(--text-dim);
    margin-right:2px;
  }
  .games.grid h3{
    font-family:'Gothic A1', sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 8px;
    letter-spacing:.2px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .games.grid p{
    margin:0 0 12px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
    min-height:38px;
  }
  .games.grid .meta-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  /* ---------- LIST VIEW ---------- */
  .games.list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .games.list .card{
    display:flex;
    align-items:stretch;
    gap:0;
  }
  .games.list .thumb{
    width:96px; min-width:96px; aspect-ratio:1/1;
  }
  .games.list .notch{width:18px; height:18px;}
  .games.list .info{
    flex:1;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .games.list .left h3{
    font-family:'Gothic A1', sans-serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 6px;
    display:flex; align-items:baseline; gap:8px;
  }
  .games.list .left p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .games.list .meta-row{display:none;}
  .games.list .right{
    display:flex; align-items:center; gap:14px;
    flex-shrink:0;
  }
  .games.list .play-pill{
    position:static; opacity:1; transform:none;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
  }
  .games.list .card:hover .play-pill{
    background:var(--gold); color:#0e1420; border-color:var(--gold);
  }

  .games.list .card{animation-delay:0s !important;}

  @media (max-width:480px){
    .games.list .thumb{width:72px; min-width:72px;}
    .games.list .info{padding:12px 12px;}
    .games.list .idx{display:none;}
  }

  /* hidden state for filtering */
  .card.is-hidden{display:none;}

  footer{
    margin-top:64px;
    padding-top:24px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
</style>
</head>

<script>
const GAMES = [
  {
    id:"oripa",
    title:"오리파 시뮬레이터",
    titleEn:"Oripa Simulator",

const ACCENTS = {
  action:{c:"var(--gold)", bg:"var(--gold-dim)"},
  strategy:{c:"var(--teal)", bg:"var(--teal-dim)"},
  casual:{c:"var(--violet)", bg:"var(--violet-dim)"}
};

const I18N = {
  ko: {
    eyebrow:"MINI GAME COLLECTION",
    pageTitle:"미니 게임 천국 | Mini Game Heaven",
    metaDescription:"타이핑, 슈팅, 타워디펜스, 카드게임, 보드게임, 추첨기까지 직접 제작한 브라우저 게임을 한곳에 모은 미니 게임 포털. 설치 없이 바로 플레이하세요.",
    title:"미니 게임 천국",
    subtitle:"직접 만든 브라우저 게임을 한곳에 모았습니다. 카드를 클릭하면 설치 없이 바로 플레이할 수 있어요.",
    filterAll:"전체", filterAction:"액션", filterStrategy:"전략", filterCasual:"캐주얼",
    viewList:"리스트형", viewGrid:"썸네일형",
    viewListAria:"리스트형 보기", viewGridAria:"썸네일형 보기",
    play:"▶ PLAY",
    thumbAlt:(t)=>`${t} 썸네일`,
    footer:"© 제임스웹 · 개인 제작 브라우저 게임 모음",
    gamesUnit:"GAMES"
  },
  en: {
    eyebrow:"MINI GAME COLLECTION",
    pageTitle:"Mini Game Heaven | 미니 게임 천국",
    metaDescription:"A personal portal collecting the browser games I built myself — typing, shooter, tower defense, card games, board games, and lottery tools. Play instantly, no install needed.",
    title:"Mini Game Heaven",
    subtitle:"A collection of browser games I built myself. Click a card to play instantly — no install needed.",
    filterAll:"All", filterAction:"Action", filterStrategy:"Strategy", filterCasual:"Casual",
    viewList:"List", viewGrid:"Grid",
    viewListAria:"List view", viewGridAria:"Grid view",
    play:"▶ PLAY",
    thumbAlt:(t)=>`${t} thumbnail`,
    footer:"© JamesWeb · A personal collection of browser games",
    gamesUnit:"GAMES"
  }
};

function detectLang(){
  const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for (const l of langs){
    if (/^ko/i.test(l)) return "ko";
  }
  return "en";
}

const LANG = detectLang();
const T = I18N[LANG];
const GENRE_LABEL = { action:T.filterAction, strategy:T.filterStrategy, casual:T.filterCasual };

function applyI18n(){
  document.documentElement.lang = LANG;
  document.title = T.pageTitle;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', T.metaDescription);

  document.getElementById('txtEyebrow').textContent = T.eyebrow;
  document.getElementById('txtTitle').textContent = T.title;
  document.getElementById('txtSubtitle').textContent = T.subtitle;
  document.getElementById('txtFilterAll').textContent = T.filterAll;
  document.getElementById('txtFilterAction').textContent = T.filterAction;
  document.getElementById('txtFilterStrategy').textContent = T.filterStrategy;
  document.getElementById('txtFilterCasual').textContent = T.filterCasual;
  document.getElementById('txtViewList').textContent = T.viewList;
  document.getElementById('txtViewGrid').textContent = T.viewGrid;
  document.getElementById('btnViewList').setAttribute('aria-label', T.viewListAria);
  document.getElementById('btnViewGrid').setAttribute('aria-label', T.viewGridAria);
  document.getElementById('txtFooter').textContent = T.footer;
}

const gamesEl = document.getElementById('games');
const viewToggle = document.getElementById('viewToggle');
const filtersEl = document.getElementById('filters');
const visibleCountEl = document.getElementById('visibleCount');

function renderGames(){
  gamesEl.innerHTML = GAMES.map((g,i)=>{
    const a = ACCENTS[g.genre];
    const title = LANG === 'ko' ? g.title : (g.titleEn || g.title);
    const desc = LANG === 'ko' ? g.desc : (g.descEn || g.desc);
    const genreLabel = GENRE_LABEL[g.genre];
    return `
    <a class="card" href="${g.url}" target="_blank" rel="noopener" data-genre="${g.genre}" style="--accent:${a.c}; animation-delay:${i*0.05}s">
      <div class="thumb">
        <span class="num-badge">${String(i+1).padStart(2,'0')}</span>
        <div class="notch"></div>
        <img src="${g.img}" alt="${T.thumbAlt(title)}" loading="lazy">
        <span class="play-pill">${T.play}</span>
      </div>
      <div class="info">
        <div class="left">
          <h3><span class="idx">${String(i+1).padStart(2,'0')}</span>${title}</h3>
          <p>${desc}</p>
          <div class="meta-row">
            <span class="genre-chip" style="color:${a.c}; background:${a.bg};">${genreLabel}</span>
          </div>
        </div>
        <div class="right">
          <span class="genre-chip" style="color:${a.c}; background:${a.bg};">${genreLabel}</span>
          <span class="play-pill">${T.play}</span>
        </div>
      </div>
    </a>`;
  }).join('');
  applyFilter(currentFilter);
}

let currentFilter = 'all';

function applyFilter(filter){
  currentFilter = filter;
  const cards = gamesEl.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(c=>{
    const show = filter==='all' || c.dataset.genre===filter;
    c.classList.toggle('is-hidden', !show);
    if(show) visible++;
  });
  visibleCountEl.textContent = `${visible} / ${GAMES.length} ${T.gamesUnit}`;
}

function updateCounts(){
  const counts = { all:GAMES.length, action:0, strategy:0, casual:0 };
  GAMES.forEach(g=>{ counts[g.genre] = (counts[g.genre]||0) + 1; });
  document.getElementById('countAll').textContent = counts.all;
  document.getElementById('countAction').textContent = counts.action;
  document.getElementById('countStrategy').textContent = counts.strategy;
  document.getElementById('countCasual').textContent = counts.casual;
}

filtersEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  filtersEl.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter(btn.dataset.filter);
});

viewToggle.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  const view = btn.dataset.view;
  viewToggle.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  viewToggle.classList.remove('mode-list','mode-grid');
  viewToggle.classList.add(view==='list' ? 'mode-list' : 'mode-grid');
  gamesEl.classList.remove('list','grid');
  gamesEl.classList.add(view);
});

applyI18n();
updateCounts();
renderGames();
</script>
