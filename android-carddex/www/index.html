<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 도감</title>
<style>
  html,body{margin:0;height:100%;background:#121218;color:#f1eee6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  h1{margin:0 0 10px;font-size:28px;color:#f1eee6}
  p{margin:0 0 20px;font-size:15px;color:#9b98a8;line-height:1.6}
  button{font-size:16px;font-weight:800;padding:13px 30px;border:0;border-radius:12px;background:linear-gradient(180deg,#f0d27e,#c99b3c);color:#2a1f08}
</style></head><body>
<div>
  <h1>카드 도감</h1>
  <p id="msg">도감을 불러오는 중…</p>
  <button id="retry">다시 시도</button>
</div>
<script>
  var SITE = "https://playwithme.kr/card-dex-app";
  document.getElementById("retry").onclick = function(){ location.href = SITE; };
  setTimeout(function(){ location.href = SITE; }, 300);
</script>
</body></html>
