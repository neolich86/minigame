<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>궁수 키우기</title>
<style>
  html,body{margin:0;height:100%;background:#12161c;color:#e8eefa;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  h1{margin:0 0 10px;font-size:28px;color:#ffc45a;letter-spacing:.04em}
  p{margin:0 0 20px;font-size:15px;color:#9fb0c8;line-height:1.6}
  button{font-size:16px;font-weight:800;padding:13px 30px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffd27a,#e0951e);color:#2b1a00}
</style></head><body>
<div>
  <h1>궁수 키우기</h1>
  <p id="msg">인터넷에 연결되어 있지 않아요.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button id="retry">다시 시도</button>
</div>
<script>
  var SITE = "https://playwithme.kr/archer-app";
  document.getElementById("retry").onclick = function(){ location.href = SITE; };
  window.addEventListener('online', function(){ location.href = SITE; });
</script>
</body></html>
