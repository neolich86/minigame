const TER_FN = { forest: artForest, pasture: artPasture, fields: artFields, hills: artHills, mountains: artMountains, desert: artDesert };

/* ── 정적 레이어: 바다·섬 슬래브·타일·숫자·항구 ─────────── */
function buildStaticSVG() {
  const B = S.B, R = B.R, o = [];

  o.push('<defs>');
  for (const k in TER_ART) {
    o.push(`<linearGradient id="tg-${k}" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="${shade(TER_ART[k].top, .1)}"/>
      <stop offset="0.55" stop-color="${TER_ART[k].top}"/>
      <stop offset="1" stop-color="${TER_ART[k].bot}"/></linearGradient>`);
  }
  o.push(`<linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b5738"/><stop offset="1" stop-color="#3a2c1b"/></linearGradient>`);
  o.push(`<radialGradient id="tok" cx="0.36" cy="0.28" r="0.85">
    <stop offset="0" stop-color="#fdf7e6"/><stop offset="1" stop-color="#dcd0b0"/></radialGradient>`);
  o.push(`<linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9c7a4c"/><stop offset="1" stop-color="#6a4f2e"/></linearGradient>`);
  o.push(`<clipPath id="hexclip"><polygon points="${hexPath({ cx: 0, cy: 0 }, R - 1.5)}"/></clipPath>`);
  o.push('</defs>');

  // 바다 물결
  o.push('<g opacity=".13" fill="none" stroke="#93d6e6" stroke-width="1.2">');
  for (let i = 0; i < 6; i++) o.push(`<circle cx="330" cy="302" r="${228 + i * 25}"/>`);
  o.push('</g>');

  // 섬 그림자 + 두께
  const ring = B.ringV.map(id => B.vertices[id]);
  const poly = d => ring.map(v => `${f1(v.x)},${f1(v.y + d)}`).join(' ');
  o.push(`<polygon points="${poly(22)}" fill="#061b25" opacity=".45"/>`);
  o.push(`<polygon points="${poly(13)}" fill="url(#slab)"/>`);
  o.push(`<polygon points="${poly(13)}" fill="none" stroke="#2a2013" stroke-width="2"/>`);
  o.push(`<polygon points="${poly(0)}" fill="#7a6440"/>`);

  // 타일
  for (const h of B.hexes) {
    const a = TER_ART[h.terrain], rnd = tileRnd(h.id * 7 + 3);
    o.push(`<g transform="translate(${f1(h.cx)},${f1(h.cy)})">
      <polygon points="${hexPath({ cx: 0, cy: 0 }, R - 1.5)}" fill="url(#tg-${h.terrain})"/>
      <g clip-path="url(#hexclip)">${TER_FN[h.terrain](rnd)}
        <polygon points="${hexPath({ cx: 0, cy: 0 }, R - 1.5)}" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="9"/>
        <path d="M${f1(-(R - 1.5) * 0.866)},${f1(-(R - 1.5) * .5)} L0,${f1(-(R - 1.5))} L${f1((R - 1.5) * .866)},${f1(-(R - 1.5) * .5)}" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="3"/>
      </g>
      <polygon points="${hexPath({ cx: 0, cy: 0 }, R - 1.5)}" fill="none" stroke="#20180d" stroke-opacity=".55" stroke-width="1.8" stroke-linejoin="round"/>
    </g>`);

    // 자원 이름표
    o.push(`<g transform="translate(${f1(h.cx)},${f1(h.cy - 30)})">
      <rect x="-22" y="-9" width="44" height="17" rx="8.5" fill="#14100a" opacity=".5"/>
      <text class="hexlabel" y="4">${a.ko}</text></g>`);

    // 숫자 토큰
    if (h.number) {
      const hot = h.number === 6 || h.number === 8, np = pips(h.number);
      o.push(`<g transform="translate(${f1(h.cx)},${f1(h.cy - 2)})">
        <ellipse cy="5" rx="17.5" ry="16" fill="#12100a" opacity=".42"/>
        <circle r="17" fill="#8d7f5f"/>
        <circle r="15.6" cy="-1.2" fill="url(#tok)"/>
        <circle r="13" cy="-1.2" fill="none" stroke="#b6a582" stroke-width=".9" opacity=".8"/>
        <text class="toknum${hot ? ' hot' : ''}" y="1" style="font-size:${h.number >= 10 ? 13 : 15}px">${h.number}</text>
        <g>${Array.from({ length: np }, (_, i) =>
          `<circle class="tokpip${hot ? ' hot' : ''}" cx="${f1((i - (np - 1) / 2) * 4.4)}" cy="9.5" r="1.35"/>`).join('')}</g>
      </g>`);
    }
  }

  // 항구 — 나무 부두
  for (const port of B.ports) {
    const e = B.edges[port.edge];
    const a = B.vertices[e.v[0]], b = B.vertices[e.v[1]];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const hc = B.hexes[e.hexes[0]];
    let dx = mx - hc.cx, dy = my - hc.cy;
    const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const px = mx + dx * 31, py = my + dy * 31;
    const col = port.type === 'any' ? '#c3ae83' : shade(RHEX[port.type], .18);
    o.push(`<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(px)}" y2="${f1(py)}" stroke="#2b1f12" stroke-width="4.5" stroke-linecap="round" opacity=".55"/>`);
    o.push(`<line x1="${f1(b.x)}" y1="${f1(b.y)}" x2="${f1(px)}" y2="${f1(py)}" stroke="#2b1f12" stroke-width="4.5" stroke-linecap="round" opacity=".55"/>`);
    o.push(`<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(px)}" y2="${f1(py)}" stroke="#a5854f" stroke-width="2.6" stroke-linecap="round"/>`);
    o.push(`<line x1="${f1(b.x)}" y1="${f1(b.y)}" x2="${f1(px)}" y2="${f1(py)}" stroke="#a5854f" stroke-width="2.6" stroke-linecap="round"/>`);
    o.push(`<g transform="translate(${f1(px)},${f1(py)})">
      <rect x="-22" y="-11" width="44" height="30" rx="7" fill="#1a1108" opacity=".5"/>
      <rect x="-22" y="-14" width="44" height="29" rx="7" fill="url(#dock)" stroke="#2f2113" stroke-width="1.6"/>
      <rect x="-18" y="-11" width="36" height="3" rx="1.5" fill="#c39b5f" opacity=".5"/>
      <text class="port-l" y="-1">${port.ratio}:1</text>
      <text class="port-l" y="10" style="font-size:8.5px;fill:${col}">${port.type === 'any' ? '아무거나' : RKO[port.type]}</text>
    </g>`);
  }

  return o.join('');
}

/* ── 3D 말 ───────────────────────────────────────────────── */
const DVX = 6, DVY = -4;   // 깊이 방향 벡터

function gSettlement(pi) {
  const c = PIECE[pi], P = (x, y) => `${f1(x)},${f1(y)}`;
  const w = 11.5, H = 12, rh = 10.5, dx = 7.5, dy = -5.5;
  const roofR = shade(c.base, .26), roofF = shade(c.base, .1);
  return `<g>
    <ellipse cx="4" cy="11" rx="17" ry="5.4" fill="#0a1519" opacity=".42"/>
    <polygon points="${P(w, 0)} ${P(w + dx, dy)} ${P(w + dx, -H + dy)} ${P(w, -H)}" fill="${c.side}" stroke="${c.dark}" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="${P(w, -H)} ${P(0, -H - rh)} ${P(dx, -H - rh + dy)} ${P(w + dx, -H + dy)}" fill="${roofR}" stroke="${c.dark}" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="${P(-w, 0)} ${P(w, 0)} ${P(w, -H)} ${P(-w, -H)}" fill="${c.base}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="${P(-w - 1.5, -H)} ${P(w + 1.5, -H)} ${P(0, -H - rh)}" fill="${roofF}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="-3.6" y="-8" width="7.2" height="8" rx="1" fill="${c.dark}" opacity=".65"/>
    <rect x="-9" y="-9.5" width="4" height="4" rx=".8" fill="#ffe9b0" opacity=".55"/>
    <rect x="5" y="-9.5" width="4" height="4" rx=".8" fill="#ffe9b0" opacity=".4"/>
    <path d="M${P(-w, 0)} L${P(-w, -H)} L${P(0, -H - rh)}" fill="none" stroke="${shade(c.top, .3)}" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>
  </g>`;
}

function gCity(pi) {
  const c = PIECE[pi], P = (x, y) => `${f1(x)},${f1(y)}`;
  const dx = 7.5, dy = -5.5;
  const roofR = shade(c.base, .26), roofF = shade(c.base, .1);
  const bl = -18, br = 1, bH = 11, brh = 8;          // 본채
  const tl = 3, tr = 17, tH = 23, trh = 8;           // 탑
  return `<g>
    <ellipse cx="4" cy="12" rx="25" ry="6" fill="#0a1519" opacity=".44"/>
    <polygon points="${P(tr, 0)} ${P(tr + dx, dy)} ${P(tr + dx, -tH + dy)} ${P(tr, -tH)}" fill="${c.side}" stroke="${c.dark}" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="${P(tr, -tH)} ${P((tl + tr) / 2, -tH - trh)} ${P((tl + tr) / 2 + dx, -tH - trh + dy)} ${P(tr + dx, -tH + dy)}" fill="${roofR}" stroke="${c.dark}" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="${P(br, 0)} ${P(br + dx, dy)} ${P(br + dx, -bH + dy)} ${P(br, -bH)}" fill="${shade(c.side, -.08)}" stroke="${c.dark}" stroke-width="1.1" stroke-linejoin="round"/>
    <polygon points="${P(bl, 0)} ${P(br, 0)} ${P(br, -bH)} ${P(bl, -bH)}" fill="${c.base}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="${P(bl - 1.5, -bH)} ${P(br + 1.5, -bH)} ${P((bl + br) / 2, -bH - brh)}" fill="${roofF}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="${P(tl, 0)} ${P(tr, 0)} ${P(tr, -tH)} ${P(tl, -tH)}" fill="${c.base}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="${P(tl - 1.5, -tH)} ${P(tr + 1.5, -tH)} ${P((tl + tr) / 2, -tH - trh)}" fill="${roofF}" stroke="${c.dark}" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="-14" y="-7.5" width="4.6" height="7.5" rx="1" fill="${c.dark}" opacity=".6"/>
    <rect x="-6.5" y="-9" width="4.6" height="4.4" rx=".8" fill="#ffe9b0" opacity=".5"/>
    <rect x="6" y="-19" width="5" height="5" rx="1" fill="#ffe9b0" opacity=".55"/>
    <rect x="6" y="-10" width="5" height="5" rx="1" fill="#ffe9b0" opacity=".4"/>
    <rect x="12" y="-19" width="3.4" height="5" rx=".8" fill="${c.dark}" opacity=".45"/>
    <path d="M${P(bl, 0)} L${P(bl, -bH)} L${P((bl + br) / 2, -bH - brh)}" fill="none" stroke="${shade(c.top, .3)}" stroke-width="1.5" stroke-linejoin="round" opacity=".85"/>
    <path d="M${P(tl, -tH * .55)} L${P(tl, -tH)} L${P((tl + tr) / 2, -tH - trh)}" fill="none" stroke="${shade(c.top, .3)}" stroke-width="1.5" stroke-linejoin="round" opacity=".85"/>
  </g>`;
}

function gRoad(a, b, pi) {
  const c = PIECE[pi];
  const ux = (b.x - a.x) * .18, uy = (b.y - a.y) * .18;
  const x1 = a.x + ux, y1 = a.y + uy, x2 = b.x - ux, y2 = b.y - uy;
  const L = (dy, col, w) => `<line x1="${f1(x1)}" y1="${f1(y1 + dy)}" x2="${f1(x2)}" y2="${f1(y2 + dy)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  return L(6, '#0b1a1f', 11) + L(4.5, c.dark, 10.5) + L(2.6, c.side, 10.5) + L(0, c.base, 9.5) + L(-1.9, c.top, 4.4);
}

function gRobber(x, y) {
  return `<g class="robber" transform="translate(${f1(x)},${f1(y)})">
    <ellipse cy="17" rx="13" ry="4.2" fill="#07131a" opacity=".5"/>
    <path d="M-11,17 C-11,6 -6,1 -3,-2 L3,-2 C6,1 11,6 11,17 Z" fill="#39424a"/>
    <path d="M-11,17 C-11,6 -6,1 -3,-2 L0,-2 L0,17 Z" fill="#4d5860"/>
    <ellipse cx="0" cy="-8" rx="7.2" ry="7.6" fill="#39424a"/>
    <ellipse cx="-2.2" cy="-9.5" rx="4.6" ry="5" fill="#5a666f"/>
    <ellipse cy="17" rx="11" ry="3.4" fill="#232a30"/>
  </g>`;
}

/* ── 게임판 렌더 ─────────────────────────────────────────── */
function drawBoard() {
  const B = S.B, R = B.R, out = [];
  if (!S.staticSVG) S.staticSVG = buildStaticSVG();
  out.push(S.staticSVG);

  // 도적이 막은 타일 어둡게
  const rh = B.hexes[S.robber];
  out.push(`<polygon points="${hexPath(rh, R - 1.5)}" fill="#080d10" opacity=".46"/>`);

  // 도로 → 건물 (위쪽부터 그려 겹침이 자연스럽게)
  for (const e of B.edges) {
    if (e.road === null) continue;
    out.push(gRoad(B.vertices[e.v[0]], B.vertices[e.v[1]], e.road));
  }
  const built = B.vertices.filter(v => v.b).sort((a, b) => a.y - b.y);
  for (const v of built) {
    out.push(`<g transform="translate(${f1(v.x)},${f1(v.y + 5)})">${v.b.type === 'city' ? gCity(v.b.p) : gSettlement(v.b.p)}</g>`);
  }

  out.push(gRobber(rh.cx - 26, rh.cy - 6));

  // 선택 하이라이트
  if (S.pick && S.pick.seat === ME) {
    const col = PIECE[S.cur].base;
    if (S.pick.kind === 'v') {
      for (const id of S.pick.options) {
        const v = B.vertices[id];
        out.push(`<g class="spot" data-pick="v" data-id="${id}" transform="translate(${f1(v.x)},${f1(v.y)})">
          <circle class="halo" r="17" fill="${col}" opacity=".2"/>
          <circle class="core" r="9" fill="${col}" stroke="#fff" stroke-width="2.6" opacity=".92"/>
        </g>`);
      }
    } else if (S.pick.kind === 'e') {
      for (const id of S.pick.options) {
        const e = B.edges[id], a = B.vertices[e.v[0]], b = B.vertices[e.v[1]];
        const ux = (b.x - a.x) * .18, uy = (b.y - a.y) * .18;
        out.push(`<g class="eplace" data-pick="e" data-id="${id}">
          <line x1="${f1(a.x + ux)}" y1="${f1(a.y + uy)}" x2="${f1(b.x - ux)}" y2="${f1(b.y - uy)}" stroke="transparent" stroke-width="22" stroke-linecap="round"/>
          <line class="core" x1="${f1(a.x + ux)}" y1="${f1(a.y + uy)}" x2="${f1(b.x - ux)}" y2="${f1(b.y - uy)}" stroke="#0b1a1f" stroke-width="11" stroke-linecap="round" stroke-opacity=".45"/>
          <line class="core" x1="${f1(a.x + ux)}" y1="${f1(a.y + uy)}" x2="${f1(b.x - ux)}" y2="${f1(b.y - uy)}" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-opacity=".85"/>
        </g>`);
      }
    } else if (S.pick.kind === 'h') {
      for (const id of S.pick.options) {
        const h = B.hexes[id];
        out.push(`<g class="spot" data-pick="h" data-id="${id}">
          <polygon points="${hexPath(h, R - 5)}" fill="#0b1216" opacity=".3"/>
          <circle class="core" cx="${f1(h.cx)}" cy="${f1(h.cy)}" r="11" fill="#f4efe1" stroke="#14181a" stroke-width="2.6" opacity=".95"/>
        </g>`);
      }
    }
  }

  $('#board').innerHTML = out.join('');
}

/* ═══════════════════════════════════════════════════════════════
   화면·조작·진행
   ═══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let SPEED = 1;

let ME = 0;        // 이 화면이 조작하는 자리
let NET = null;    // null = 혼자 하기, { role: 'host' | 'guest' } = 온라인 방

function logMsg(html, sys) {
  if (!S) return;
  S.log.push({ html, sys });
  if (S.log.length > 400) S.log.splice(0, S.log.length - 300);
  renderLog();
}

/* ── 선택 상태 ───────────────────────────────────────────── */
function setPick(kind, options, fn, label, cancelable) {
  S.pick = { kind, options: new Set(options), fn, label: label || '', cancelable: !!cancelable, seat: S.cur };
  render();
}
function clearPick() { S.pick = null; }

/* ── 게임판 그리기 ───────────────────────────────────────── */
function hexPath(h, R) {
  const p = [];
  for (let k = 0; k < 6; k++) {
    const a = (60 * k - 30) * Math.PI / 180;
    p.push(`${(h.cx + R * Math.cos(a)).toFixed(2)},${(h.cy + R * Math.sin(a)).toFixed(2)}`);
  }
  return p.join(' ');
}

/* ── 주사위 ──────────────────────────────────────────────── */
const DIEPIP = {
  1: [[2, 2]], 2: [[1, 1], [3, 3]], 3: [[1, 1], [2, 2], [3, 3]],
  4: [[1, 1], [1, 3], [3, 1], [3, 3]], 5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]],
  6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
};
function renderDice(animate) {
  const box = $('#diceover');
  if (!S.dice[0]) { box.innerHTML = ''; return; }
  box.innerHTML = S.dice.map(d =>
    `<div class="die${animate ? ' roll' : ''}">${DIEPIP[d].map(([r, c]) => `<i style="grid-row:${r};grid-column:${c}"></i>`).join('')}</div>`
  ).join('');
}

/* ── 사이드바 ────────────────────────────────────────────── */
function render() {
  if (!S) return;
  drawBoard();
  const me = S.players[ME], cur = S.players[S.cur];
  const myTurn = S.cur === ME && !me.ai;

  // 점수판
  $('#plist').innerHTML = S.players.map(p => {
    const own = p.i === ME;
    const vp = own ? vpOf(p) : publicVP(p);
    const tags = [];
    tags.push(`<span>손패 ${handCount(p)}</span>`);
    tags.push(`<span>도로 ${15 - p.roadsLeft}</span>`);
    if (p.roadLen >= 3) tags.push(`<span class="${S.longestOwner === p.i ? 'on' : ''}">최장 ${p.roadLen}</span>`);
    if (p.knights) tags.push(`<span class="${S.armyOwner === p.i ? 'on' : ''}">기사 ${p.knights}</span>`);
    const dcount = p.devs.length + p.newDevs.length + p.vpCards;
    if (dcount) tags.push(`<span>발전 ${dcount}</span>`);
    const badge = p.ai ? ' <span style="font-weight:400;color:var(--ink-3);font-size:11px">AI</span>'
      : (NET && own ? ' <span style="font-weight:400;color:var(--ink-3);font-size:11px">(나)</span>' : '');
    const off = NET && !p.ai && NET.offline && NET.offline.includes(p.i)
      ? ' <span style="font-weight:600;color:#c0433f;font-size:11px">접속 끊김</span>' : '';
    return `<div class="prow${p.i === S.cur ? ' active' : ''}">
      <span class="swatch" style="background:${p.color}"></span>
      <div><div class="pname">${esc(p.name)}${badge}${off}</div>
      <div class="pmeta">${tags.join('')}</div></div>
      <div class="pvp">${vp}<small>${own ? '점' : '공개'}</small></div>
    </div>`;
  }).join('');
  $('#deckcount').textContent = `발전카드 ${S.deck.length}`;

  // 내 자원
  $('#hand').innerHTML = RES.map(r =>
    `<div class="rc" data-r="${r}"><div class="bar" style="background:${RVAR[r]}"></div>
      <span class="n">${me.res[r]}</span><span class="l">${RKO[r]}</span></div>`).join('');
  $('#handcount').textContent = `${handCount(me)}장${handCount(me) > 7 ? ' · 7 위험' : ''}`;

  // 발전카드
  const canPlay = myTurn && !me.playedDev && (S.phase === 'action' || S.phase === 'roll') && S.winner === null && !S.pick && !S.busy;
  const counts = {};
  me.devs.forEach(c => counts[c] = (counts[c] || 0) + 1);
  const newCounts = {};
  me.newDevs.forEach(c => newCounts[c] = (newCounts[c] || 0) + 1);
  let dv = Object.keys(counts).map(c =>
    `<button class="dev" data-dev="${c}" ${canPlay ? '' : 'disabled'} title="${DEV_DESC[c]}">${DEV_KO[c]}<span class="k">${counts[c]}</span></button>`).join('');
  dv += Object.keys(newCounts).map(c =>
    `<button class="dev" disabled title="이번 턴에 산 카드는 다음 턴부터 사용할 수 있습니다">${DEV_KO[c]}<span class="k">${newCounts[c]} · 대기</span></button>`).join('');
  if (me.vpCards) dv += `<button class="dev" disabled>승리점수<span class="k">${me.vpCards}</span></button>`;
  $('#devs').innerHTML = dv || '<div class="empty">아직 없습니다.</div>';

  // 행동 버튼
  const acting = myTurn && S.phase === 'action' && S.winner === null && !S.pick && !S.busy;
  $('#aRoad').disabled = !(acting && canAfford(me, COST.road) && me.roadsLeft > 0 && legalRoads(ME).length);
  $('#aSettle').disabled = !(acting && canAfford(me, COST.settle) && me.settLeft > 0 && legalSettlements(ME, false).length);
  $('#aCity').disabled = !(acting && canAfford(me, COST.city) && me.cityLeft > 0 && legalCities(ME).length);
  $('#aDev').disabled = !(acting && canAfford(me, COST.dev) && S.deck.length > 0);
  $('#aTrade').disabled = !acting;
  $('#stockline').textContent = `정착지 ${me.settLeft} · 도시 ${me.cityLeft} · 도로 ${me.roadsLeft}`;

  // 상태바
  $('#turnchip').querySelector('.swatch').style.background = cur.color;
  $('#turnname').textContent = S.winner !== null ? '게임 종료' : (S.cur === ME && !NET ? '나의 차례' : `${cur.name}의 차례`);
  $('#phasemsg').innerHTML = tx(phaseMessage());

  const mb = $('#btnMain');
  if (S.pick && S.pick.seat === ME) {
    mb.innerHTML = '<span class="t">선택 취소</span>';
    mb.disabled = !S.pick.cancelable;
    mb.className = 'btn center';
  } else if (S.winner !== null) {
    mb.innerHTML = NET ? '<span class="t">게임 종료</span>' : '<span class="t">새 게임</span>';
    mb.disabled = !!NET; mb.className = 'btn primary center';
  } else if (!myTurn || S.busy) {
    mb.innerHTML = '<span class="t">기다리는 중</span>'; mb.disabled = true; mb.className = 'btn center';
  } else if (S.phase === 'roll') {
    mb.innerHTML = '<span class="t">주사위 굴리기</span>'; mb.disabled = false; mb.className = 'btn primary center';
  } else if (S.phase === 'action') {
    mb.innerHTML = '<span class="t">턴 종료</span>'; mb.disabled = false; mb.className = 'btn primary center';
  } else {
    mb.innerHTML = '<span class="t">진행 중</span>'; mb.disabled = true; mb.className = 'btn center';
  }
  renderDice(false);
  renderLog();
  syncPromptUI();
  if (tradeUI) tradeUI.redraw();
  if (NET && NET.role === 'host') pushState();
}

function phaseMessage() {
  const cur = S.players[S.cur];
  const mine = S.cur === ME && !cur.ai;
  const who = `<b>${esc(cur.name)}</b>`;
  if (S.winner !== null) return `<b>${esc(S.players[S.winner].name)}</b>가 10점을 달성했습니다.`;
  if (S.prompt && S.prompt.seat !== ME) {
    const pp = S.players[S.prompt.seat];
    if (S.prompt.kind === 'discard') return `<b>${esc(pp.name)}</b>가 버릴 자원을 고르는 중…`;
    return `<b>${esc(pp.name)}</b>가 고르는 중…`;
  }
  if (S.pick && mine) return S.pick.label;
  switch (S.phase) {
    case 'setupS': return !mine ? `${who}가 정착지를 고르는 중…` : '시작 정착지를 놓을 자리를 고르세요.';
    case 'setupR': return !mine ? `${who}가 도로를 놓는 중…` : '방금 놓은 정착지에 붙는 도로를 고르세요.';
    case 'roll': return !mine ? `${who}의 차례입니다…` : '주사위를 굴려 생산을 시작하세요.';
    case 'action': return !mine ? `${who}가 생각 중…` : `주사위 <b>${S.dice[0] + S.dice[1]}</b> · 건설·교역 후 턴을 넘기세요.`;
    default: return !mine ? `${who}가 진행 중…` : '진행 중…';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 언어별 문장 번역 (영어일 때 /mgh/i18n/catan.js 의 CATAN_TR)
function tx(html) { return window.CATAN_TR ? window.CATAN_TR(html) : html; }
function nm(p) { return `<b style="color:${p.hex}">${esc(p.name)}</b>`; }

/* ── 기록 ────────────────────────────────────────────────── */
let logShown = 0, logRef = null;
function renderLog() {
  const box = $('#log');
  if (!box) return;
  if (logRef !== S.log || logShown > S.log.length) { box.innerHTML = ''; logShown = 0; logRef = S.log; }
  for (; logShown < S.log.length; logShown++) {
    const l = S.log[logShown];
    const d = document.createElement('div');
    if (l.sys) d.className = 'sys';
    d.innerHTML = tx(l.html);
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}

/* ═══════════════════════════════════════════════════════════════
   온라인 (미니게임천국 방) — 방장 브라우저가 규칙 엔진을 돌리고,
   다른 참가자는 상태를 받아 그리며 자기 행동(의도)만 방장에게 보낸다.
   ═══════════════════════════════════════════════════════════════ */
let VER = 0, pushQueued = false, winShown = false, finishSent = false;

function serialize() {
  return {
    v: 1, rng: S.rnd.state(), seed: S.seed, B: S.B,
    players: S.players.map(p => ({ ...p, ports: [...p.ports] })),
    deck: S.deck, bank: S.bank, robber: S.robber, cur: S.cur, phase: S.phase, dice: S.dice, turn: S.turn,
    setupOrder: S.setupOrder, setupIdx: S.setupIdx, lastSettle: S.lastSettle, freeRoads: S.freeRoads,
    longestOwner: S.longestOwner, longestLen: S.longestLen, armyOwner: S.armyOwner, armySize: S.armySize,
    winner: S.winner, log: S.log.slice(-80), busy: S.busy,
    pick: S.pick ? { kind: S.pick.kind, options: [...S.pick.options], label: S.pick.label, cancelable: !!S.pick.cancelable, seat: S.pick.seat } : null,
    prompt: S.prompt || null, offer: S.offer || null, promptSeq: S.promptSeq || 0
  };
}
function deserialize(o) {
  return {
    ...o, rnd: mulberry32(o.rng),
    players: o.players.map(p => ({ ...p, ports: new Set(p.ports) })),
    pick: o.pick ? { ...o.pick, options: new Set(o.pick.options), fn: null } : null,
    prompt: o.prompt || null, offer: o.offer || null, staticSVG: null
  };
}

function pushState() {
  if (pushQueued) return;
  pushQueued = true;
  queueMicrotask(() => {
    pushQueued = false;
    if (!S || !NET || NET.role !== 'host') return;
    VER++;
    MGH.net.send({ type: 'net:state', ver: VER, state: serialize(), turn: S.turn, cur: S.cur, winner: S.winner });
  });
}

// 참가자: 방장이 보낸 상태 적용
function applyRemoteState(msg) {
  // 순서 보장은 포털이 담당(현재 방장이 보낸 것만 순서대로 전달)
  const prev = S;
  const board = prev && prev.staticSVG && prev.seed === msg.state.seed ? prev.staticSVG : null;
  S = deserialize(msg.state);
  S.staticSVG = board;
  if (tradeUI && !(S.cur === ME && S.phase === 'action')) closeTrade();
  render();
  if (prev && prev.dice && (prev.dice[0] !== S.dice[0] || prev.dice[1] !== S.dice[1] || prev.turn !== S.turn) && S.dice[0]) renderDice(true);
  if (S.winner !== null && !winShown) showWin();
}

// 이 화면에서 한 행동 — 방장/혼자면 바로 적용, 참가자면 방장에게 전송
function act(intent) {
  if (!NET || NET.role === 'host') applyIntent(ME, intent);
  else MGH.net.send({ type: 'net:intent', intent });
}

function applyIntent(seat, it) {
  if (!S || !it) return;
  const p = S.players[seat];
  if (!p) return;
  switch (it.t) {
    case 'pick': if (S.pick && S.pick.seat === seat && S.pick.fn) onPick(it.kind, +it.id); return;
    case 'cancel': if (S.pick && S.pick.seat === seat && S.pick.cancelable) { clearPick(); render(); } return;
    case 'prompt': resolvePrompt(seat, it.value); return;
    case 'respond': respondOffer(seat, !!it.yes); return;
  }
  if (S.winner !== null || S.cur !== seat || p.ai || S.busy) return;
  switch (it.t) {
    case 'roll': if (S.phase === 'roll' && !S.pick) rollDice(); return;
    case 'end': if (S.phase === 'action' && !S.pick) endTurn(); return;
    case 'road':
      if (S.phase === 'action' && !S.pick && canAfford(p, COST.road) && p.roadsLeft > 0 && legalRoads(seat).length) startBuildRoad(seat, false);
      return;
    case 'settle':
      if (S.phase === 'action' && !S.pick && canAfford(p, COST.settle) && p.settLeft > 0 && legalSettlements(seat, false).length) {
        setPick('v', legalSettlements(seat, false), vid => { placeSettlement(seat, vid); afterBuild(); }, '정착지를 놓을 교차점을 고르세요.', true);
      }
      return;
    case 'city':
      if (S.phase === 'action' && !S.pick && canAfford(p, COST.city) && p.cityLeft > 0 && legalCities(seat).length) {
        setPick('v', legalCities(seat), vid => { upgradeCity(seat, vid); afterBuild(); }, '도시로 키울 정착지를 고르세요.', true);
      }
      return;
    case 'buyDev':
      if (S.phase === 'action' && !S.pick && canAfford(p, COST.dev) && S.deck.length) {
        const c = buyDev(seat);
        if (!NET) {
          if (c === 'vp') logMsg('숨겨진 승리점수 카드를 뽑았습니다. +1점');
          else if (c) logMsg(`<b>${DEV_KO[c]}</b> 카드를 뽑았습니다. 다음 턴부터 사용할 수 있습니다.`);
        }
        afterBuild();
      }
      return;
    case 'dev': playDev(seat, it); return;
    case 'bank': bankTrade(seat, it.give, it.get); return;
    case 'offer': makeOffer(seat, it.give, it.get); return;
    case 'accept': acceptOffer(seat, +it.to); return;
    case 'closeOffer': if (S.offer && S.offer.from === seat) { S.offer = null; render(); } return;
  }
}

/* ── 선택 요청(프롬프트): 주사위 7 버리기, 도적 피해자 고르기 ── */
let promptWaiter = null;
function askSeat(seat, kind, data) {
  return new Promise(resolve => {
    S.promptSeq = (S.promptSeq || 0) + 1;
    S.prompt = { seat, kind, id: S.promptSeq, ...data };
    promptWaiter = { seat, kind, resolve };
    render();
    if (S.players[seat].ai) autoPrompt();
  });
}
function resolvePrompt(seat, value) {
  const w = promptWaiter;
  if (!w || !S.prompt || S.prompt.seat !== seat) return;
  const p = S.players[seat];
  if (w.kind === 'discard') {
    if (value && value.auto) { /* AI가 이미 처리 */ }
    else {
      const sel = value || {};
      const tot = RES.reduce((s, r) => s + (+sel[r] || 0), 0);
      if (tot !== S.prompt.n || RES.some(r => (+sel[r] || 0) < 0 || (+sel[r] || 0) > p.res[r])) return;
      for (const r of RES) { const k = +sel[r] || 0; p.res[r] -= k; S.bank[r] += k; }
    }
    logMsg(`${nm(p)} 자원 ${S.prompt.n}장 버림`);
  } else if (w.kind === 'victim') {
    if (!S.prompt.list.includes(+value)) return;
    value = +value;
  }
  S.prompt = null; promptWaiter = null;
  w.resolve(value);
}
function autoPrompt() {
  if (!S.prompt || !promptWaiter) return;
  const p = S.players[S.prompt.seat];
  if (S.prompt.kind === 'discard') { aiDiscard(p, S.prompt.n); resolvePrompt(p.i, { auto: true }); }
  else if (S.prompt.kind === 'victim') resolvePrompt(p.i, aiPickVictim(S.prompt.list));
}

/* ── 방장: 자리 주인이 나가거나 돌아올 때 ── */
function setSeatAI(seat, ai) {
  const p = S && S.players[seat];
  if (!p || p.ai === ai) return;
  p.ai = ai;
  logMsg(ai ? `${nm(p)} 자리를 AI가 이어받습니다.` : `${nm(p)} 님이 돌아왔습니다.`, true);
  if (ai) {
    if (S.prompt && S.prompt.seat === seat) autoPrompt();
    if (S.offer && S.offer.resp[seat] === 'pending') {
      const j = aiJudgeTrade(p, S.offer.give, S.offer.get, S.players[S.offer.from]);
      S.offer.resp[seat] = { ok: j.ok, why: j.why };
    }
    if (S.cur === seat && S.winner === null) driveAI(seat);
  }
  render();
}

function autoPick(seat) {
  const pk = S.pick, fn = pk.fn;
  if (!fn) { clearPick(); return; }
  if (pk.kind === 'h') { S.pick = null; fn(aiRobberTarget(seat)); return; }
  if (S.phase === 'setupS' && pk.kind === 'v') { clearPick(); fn(aiSetupSettlement(seat)); return; }
  if (S.phase === 'setupR' && pk.kind === 'e') { clearPick(); fn(aiSetupRoad(seat, S.lastSettle)); return; }
  if (pk.kind === 'e' && !pk.cancelable) {
    const e = aiBestRoad(seat);
    clearPick();
    if (e !== null) fn(e); else { S.freeRoads = 0; afterBuild(); }
    return;
  }
  clearPick(); render();
}

// AI가 된 자리(또는 복원된 AI 차례)를 현재 단계부터 이어서 진행
async function driveAI(seat) {
  for (let i = 0; i < 300; i++) {
    if (!S || S.winner !== null || S.cur !== seat || !S.players[seat].ai) return;
    if (S.prompt && S.prompt.seat === seat) { autoPrompt(); await sleep(60); continue; }
    if (S.pick && S.pick.seat === seat) { autoPick(seat); await sleep(60); continue; }
    if (S.busy) { await sleep(250); continue; }
    if (S.phase === 'setupS') { setupStep(); return; }
    if (S.phase === 'setupR') {
      const e = aiSetupRoad(seat, S.lastSettle);
      if (e === undefined) { S.setupIdx++; clearPick(); render(); setTimeout(setupStep, 200); }
      else doSetupRoad(e);
      return;
    }
    if (S.phase === 'roll') { aiTurn(seat); return; }
    if (S.phase === 'action') { aiContinue(seat); return; }
    await sleep(250);
  }
}

// 저장된 상태에서 이어하기 (방장 새로고침 / 방장 교체)
function resumeFlow() {
  S.busy = false;
  S.pick = null;
  S.prompt = null;
  S.offer = null;
  promptWaiter = null;
  if (S.phase === 'busy') S.phase = S.dice[0] ? 'action' : 'roll';
  if (S.winner !== null) { render(); showWin(); return; }
  const p = S.players[S.cur];
  if (p.ai) { render(); driveAI(S.cur); return; }
  if (S.phase === 'setupS') { setupStep(); return; }
  if (S.phase === 'setupR') {
    const opts = legalSetupRoads(S.lastSettle);
    if (!opts.length) { S.setupIdx++; setupStep(); return; }
    setPick('e', opts, doSetupRoad, '정착지에 이어지는 도로를 놓으세요.');
    return;
  }
  if (S.phase === 'action' && S.freeRoads > 0 && p.roadsLeft > 0 && legalRoads(S.cur).length) { startBuildRoad(S.cur, true); return; }
  render();
}

// 포털(부모 창)에서 오는 메시지
MGH.net.on(msg => {
  if (msg.type === 'net:init') {
    NET = { role: msg.role, offline: [] };
    ME = msg.mySeat | 0;
    hideModal();
    $('#btnNew').hidden = true;
    if (msg.role === 'host') {
      if (msg.state) {
        S = deserialize(msg.state);
        (msg.players || []).forEach((q, i) => { if (S.players[i]) { S.players[i].ai = !!q.ai; if (q.name && !q.ai) S.players[i].name = q.name; } });
        VER = (msg.ver | 0) + 1;
        logShown = 0; logRef = null;
        resumeFlow();
      } else {
        startGame(msg.players.length, false, msg.players);
      }
    } else if (msg.state) {
      applyRemoteState({ ver: msg.ver, state: msg.state });
    } else {
      $('#phasemsg').textContent = '방장이 게임을 준비하는 중…';
    }
  } else if (msg.type === 'net:state') {
    if (NET && NET.role === 'guest') applyRemoteState(msg);
  } else if (msg.type === 'net:intent') {
    if (NET && NET.role === 'host') applyIntent(msg.seat | 0, msg.intent);
  } else if (msg.type === 'net:setAI') {
    if (NET && NET.role === 'host') setSeatAI(msg.seat | 0, !!msg.ai);
  } else if (msg.type === 'net:presence') {
    if (NET) { NET.offline = msg.offline || []; if (S) render(); }
  } else if (msg.type === 'net:requestState') {
    if (NET && NET.role === 'host' && S) { VER++; MGH.net.send({ type: 'net:state', ver: VER, state: serialize(), turn: S.turn, cur: S.cur, winner: S.winner }); }
  }
});

/* ── 진행 ────────────────────────────────────────────────── */
function startGame(n, allAI, seats) {
  newGame(n, seats);
  if (allAI) { S.players.forEach(p => p.ai = true); }
  hideModal();
  winShown = false;
  logShown = 0; logRef = null;
  logMsg(`<b>${n}인 게임</b> — 먼저 10점에 닿는 개척자가 승리합니다.`, true);
  logMsg('정착지 2곳과 도로 2개를 번갈아 놓습니다. 두 번째 정착지는 시작 자원을 줍니다.', true);
  setupStep();
}

function setupStep() {
  if (S.setupIdx >= S.setupOrder.length) {
    S.cur = 0; S.phase = 'roll'; clearPick();
    logMsg('초기 배치가 끝났습니다. 첫 턴을 시작합니다.', true);
    startTurn();
    return;
  }
  S.cur = S.setupOrder[S.setupIdx];
  S.phase = 'setupS';
  const p = S.players[S.cur];
  if (p.ai) {
    clearPick(); render();
    const seat = S.cur, idx = S.setupIdx;
    setTimeout(async () => {
      if (S.cur !== seat || S.setupIdx !== idx || S.phase !== 'setupS') return;
      const v = aiSetupSettlement(S.cur);
      doSetupSettle(v);
      await sleep(430 * SPEED);
      if (S.cur !== seat || S.phase !== 'setupR') return;
      const e = aiSetupRoad(S.cur, v);
      if (e === undefined) { S.setupIdx++; clearPick(); render(); setTimeout(setupStep, 200); }
      else doSetupRoad(e);
    }, 480 * SPEED);
  } else {
    setPick('v', legalSettlements(S.cur, true), doSetupSettle, '시작 정착지를 놓을 자리를 고르세요.');
  }
}
function doSetupSettle(vid) {
  placeSettlement(S.cur, vid, true);
  S.lastSettle = vid;
  S.phase = 'setupR';
  if (S.setupIdx >= S.players.length) {
    const p = S.players[S.cur], got = [];
    for (const hid of S.B.vertices[vid].hexes) {
      const h = S.B.hexes[hid];
      if (h.res) { give(p, h.res, 1); got.push(RKO[h.res]); }
    }
    if (got.length) logMsg(`${nm(p)} 시작 자원 ${got.join(' ')}`);
  }
  const opts = legalSetupRoads(vid);
  if (S.players[S.cur].ai) { clearPick(); render(); }
  else if (!opts.length) { S.setupIdx++; clearPick(); render(); setTimeout(setupStep, 250); }
  else setPick('e', opts, doSetupRoad, '정착지에 이어지는 도로를 놓으세요.');
}
function doSetupRoad(eid) {
  placeRoad(S.cur, eid, true);
  S.setupIdx++;
  clearPick(); render();
  setTimeout(setupStep, 300 * SPEED);
}

function startTurn() {
  const p = S.players[S.cur];
  p.playedDev = false;
  S.dice = [0, 0];
  S.phase = 'roll';
  S.offer = null;
  clearPick();
  render();
  if (p.ai) { const seat = p.i, turn = S.turn; setTimeout(() => { if (S.cur === seat && S.turn === turn && S.phase === 'roll') aiTurn(seat); }, 520 * SPEED); }
}

async function rollDice() {
  const p = S.players[S.cur];
  const d1 = 1 + Math.floor(S.rnd() * 6), d2 = 1 + Math.floor(S.rnd() * 6);
  S.dice = [d1, d2];
  S.phase = 'busy'; S.busy = true;
  render(); renderDice(true);
  await sleep(520 * SPEED);
  const sum = d1 + d2;
  logMsg(`${nm(p)} 주사위 <b>${sum}</b> (${d1}+${d2})`);
  if (sum === 7) {
    await handleSeven();
  } else {
    const out = produce(sum);
    if (out.lines.length) out.lines.forEach(l => logMsg(l));
    else logMsg('아무도 생산하지 못했습니다.', true);
    S.lastGain = out.gains[ME];
  }
  S.busy = false;
  if (S.winner === null) S.phase = 'action';
  render();
  if (S.lastGain) { flashGains(S.lastGain); S.lastGain = null; }
}
function flashGains(g) {
  if (!g) return;
  for (const r of RES) if (g[r]) {
    const el = document.querySelector(`.rc[data-r="${r}"]`);
    if (el) { el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain'); }
  }
}

async function handleSeven() {
  logMsg('7! 손패가 8장 이상이면 절반을 버립니다.', true);
  for (const p of S.players) {
    const n = handCount(p);
    if (n <= 7) continue;
    const d = Math.floor(n / 2);
    if (p.ai) {
      aiDiscard(p, d);
      logMsg(`${nm(p)} 자원 ${d}장 버림`);
      render(); await sleep(320 * SPEED);
    } else {
      await askSeat(p.i, 'discard', { n: d });
      render();
    }
  }
  await moveRobber(S.cur);
}

async function moveRobber(pi) {
  const p = S.players[pi];
  if (p.ai) {
    await sleep(420 * SPEED);
    S.robber = aiRobberTarget(pi);
    render();
    logMsg(`${nm(p)}가 도적을 ${TERRAIN[S.B.hexes[S.robber].terrain].ko}(${S.B.hexes[S.robber].number || '-'})(으)로 옮겼습니다.`);
    await sleep(300 * SPEED);
    const v = robberVictims(S.robber, pi);
    if (v.length) {
      const t = aiPickVictim(v);
      const r = stealFrom(pi, t);
      if (r) logMsg(`${nm(p)}가 ${nm(S.players[t])}에게서 자원 1장을 훔쳤습니다${!NET && t === ME ? ` — ${RKO[r]}` : ''}.`);
      render();
    }
  } else {
    const opts = S.B.hexes.filter(h => h.id !== S.robber).map(h => h.id);
    const hex = await new Promise(res => {
      S.pick = { kind: 'h', options: new Set(opts), fn: res, label: '도적을 옮길 타일을 고르세요.', cancelable: false, seat: pi };
      render();
      if (S.players[pi].ai) driveAI(pi);
    });
    clearPick();
    S.robber = hex;
    logMsg(`${nm(p)}가 도적을 ${TERRAIN[S.B.hexes[hex].terrain].ko}(${S.B.hexes[hex].number || '-'})(으)로 옮겼습니다.`);
    render();
    const v = robberVictims(hex, pi);
    let t = null;
    if (v.length === 1) t = v[0];
    else if (v.length > 1) t = await askSeat(pi, 'victim', { list: v });
    if (t !== null) {
      const r = stealFrom(pi, t);
      if (!r) logMsg(`${nm(S.players[t])}에게 훔칠 자원이 없습니다.`, true);
      else if (NET) logMsg(`${nm(p)}가 ${nm(S.players[t])}에게서 자원 1장을 빼앗았습니다.`);
      else logMsg(`${nm(S.players[t])}에게서 <b>${RKO[r]}</b> 1장을 빼앗았습니다.`);
    } else {
      logMsg('훔칠 상대가 없습니다.', true);
    }
    render();
  }
}

function afterBuild() {
  updateLongest(); updateArmy();
  if (checkWin()) { render(); showWin(); return true; }
  render();
  return false;
}

function endTurn() {
  const p = S.players[S.cur];
  p.devs.push(...p.newDevs); p.newDevs = [];
  p.playedDev = false;
  S.offer = null;
  clearPick();
  if (checkWin()) { render(); showWin(); return; }
  S.cur = (S.cur + 1) % S.players.length;
  S.turn++;
  startTurn();
}

/* ── AI 턴 ───────────────────────────────────────────────── */
async function aiTurn(pi) {
  const p = S.players[pi];
  S.busy = true;
  // 도적이 내 타일에 있으면 굴리기 전에 기사
  if (p.devs.includes('knight') && !p.playedDev &&
      S.B.hexes[S.robber].corners.some(v => S.B.vertices[v].b && S.B.vertices[v].b.p === pi)) {
    await aiPlayKnight(pi);
  }
  await sleep(260 * SPEED);
  await rollDice();
  if (S.winner !== null) { S.busy = false; return; }
  await aiContinue(pi);
}

async function aiContinue(pi) {
  S.busy = true;
  const turn = S.turn;
  for (let k = 0; k < 16; k++) {
    if (S.turn !== turn || S.cur !== pi) return;
    const acted = await aiAction(pi);
    if (!acted || S.winner !== null) break;
    await sleep(360 * SPEED);
  }
  S.busy = false;
  if (S.winner !== null) { render(); return; }
  await sleep(240 * SPEED);
  if (S.turn === turn && S.cur === pi) endTurn();
}

async function aiPlayKnight(pi) {
  const p = S.players[pi];
  p.devs.splice(p.devs.indexOf('knight'), 1);
  p.knights++; p.playedDev = true;
  logMsg(`${nm(p)} 기사 카드 사용`);
  updateArmy(); render();
  await moveRobber(pi);
  if (checkWin()) { render(); showWin(); return true; }
  render();
  return true;
}

async function aiAction(pi) {
  const p = S.players[pi];
  if (S.winner !== null) return false;

  if (p.cityLeft > 0 && canAfford(p, COST.city)) {
    const v = aiBestCity(pi);
    if (v !== null) { upgradeCity(pi, v); return !afterBuild(); }
  }
  if (p.settLeft > 0 && canAfford(p, COST.settle)) {
    const v = aiBestSettlement(pi);
    if (v !== null) { placeSettlement(pi, v); return !afterBuild(); }
  }
  if (!p.playedDev && p.devs.length) {
    if (await aiPlayDev(pi)) return S.winner === null;
  }
  if (p.roadsLeft > 0 && canAfford(p, COST.road)) {
    const wantRoad = legalSettlements(pi, false).length === 0 ||
      (p.res.lumber >= 2 && p.res.brick >= 2) || p.roadLen >= 4;
    if (wantRoad) {
      const e = aiBestRoad(pi);
      if (e !== null) {
        placeRoad(pi, e);
        logMsg(`${nm(p)} 도로 건설`);
        return !afterBuild();
      }
    }
  }
  if (S.deck.length && canAfford(p, COST.dev)) { buyDev(pi); return !afterBuild(); }
  if (aiBankTrade(p)) { render(); return true; }
  return false;
}

async function aiPlayDev(pi) {
  const p = S.players[pi];
  const has = c => p.devs.includes(c);
  const need = aiNeed(p);
  const use = c => { p.devs.splice(p.devs.indexOf(c), 1); p.playedDev = true; logMsg(`${nm(p)} ${DEV_KO[c]} 카드 사용`); };

  if (has('knight') && (p.knights + 1 >= 3 && p.knights + 1 > S.armySize && S.armyOwner !== pi)) {
    return await aiPlayKnight(pi);
  }
  if (has('monopoly')) {
    let best = null, bs = 0;
    for (const r of RES) {
      const t = S.players.reduce((s, q) => s + (q.i === pi ? 0 : q.res[r]), 0);
      if (t > bs) { bs = t; best = r; }
    }
    if (bs >= 3) {
      use('monopoly');
      let got = 0;
      for (const q of S.players) if (q.i !== pi) { got += q.res[best]; p.res[best] += q.res[best]; q.res[best] = 0; }
      logMsg(`${nm(p)}가 <b>${RKO[best]}</b>를 독점해 ${got}장을 가져갔습니다.`);
      render(); return true;
    }
  }
  if (has('year_of_plenty')) {
    const want = RES.filter(r => need[r] > 0);
    if (want.length) {
      use('year_of_plenty');
      const picks = [];
      for (let i = 0; i < 2; i++) {
        const n2 = aiNeed(p);
        const w = RES.filter(r => n2[r] > 0 && S.bank[r] > 0);
        const r = w.length ? w[0] : RES.find(x => S.bank[x] > 0);
        if (r) { give(p, r, 1); picks.push(RKO[r]); }
      }
      logMsg(`${nm(p)}가 풍년으로 ${picks.join(' ')}를 받았습니다.`);
      render(); return true;
    }
  }
  if (has('road_building') && p.roadsLeft >= 1 && legalRoads(pi).length) {
    use('road_building');
    for (let i = 0; i < 2; i++) {
      if (!p.roadsLeft) break;
      const e = aiBestRoad(pi);
      if (e === null) break;
      placeRoad(pi, e, true);
    }
    logMsg(`${nm(p)}가 무료 도로를 놓았습니다.`);
    return !afterBuild();
  }
  if (has('knight')) return await aiPlayKnight(pi);
  return false;
}

/* ── 사람 조작 (방장/혼자 모드에서 실제 규칙 적용) ───────── */
function onPick(kind, id) {
  if (!S.pick || S.pick.kind !== kind || !S.pick.options.has(id) || !S.pick.fn) return;
  const fn = S.pick.fn;
  if (kind !== 'h') clearPick();
  fn(id);
}

function startBuildRoad(pi, free) {
  const p = S.players[pi];
  setPick('e', legalRoads(pi), eid => {
    placeRoad(pi, eid, free);
    logMsg(`${nm(p)} 도로 건설`);
    if (free && S.freeRoads > 1 && p.roadsLeft > 0 && legalRoads(pi).length) {
      S.freeRoads--;
      startBuildRoad(pi, true);
      afterBuild();
      return;
    }
    S.freeRoads = 0;
    afterBuild();
  }, free ? `무료 도로를 놓으세요 (남은 ${S.freeRoads}개)` : '도로를 놓을 변을 고르세요.', !free);
}

async function playDev(pi, it) {
  const p = S.players[pi];
  const card = it.card;
  if (p.playedDev || !p.devs.includes(card) || S.pick) return;
  if (!(S.phase === 'action' || S.phase === 'roll')) return;
  if (card === 'knight') {
    p.devs.splice(p.devs.indexOf('knight'), 1);
    p.knights++; p.playedDev = true;
    logMsg(`${nm(p)} 기사 카드 사용`);
    updateArmy(); render();
    const wasRoll = S.phase === 'roll';
    S.busy = true;
    await moveRobber(pi);
    S.busy = false;
    if (wasRoll && S.phase === 'roll') { /* 굴리기 전 기사 — 계속 굴리기 단계 */ }
    afterBuild();
    return;
  }
  if (S.phase !== 'action') return;
  if (card === 'road_building') {
    if (!legalRoads(pi).length || !p.roadsLeft) { logMsg('놓을 수 있는 도로가 없습니다.', true); render(); return; }
    p.devs.splice(p.devs.indexOf('road_building'), 1);
    p.playedDev = true;
    S.freeRoads = Math.min(2, p.roadsLeft);
    logMsg(`${nm(p)} 도로 건설 카드 사용 — 도로 2개 무료`);
    startBuildRoad(pi, true);
    return;
  }
  if (card === 'year_of_plenty') {
    const picks = Array.isArray(it.picks) ? it.picks.slice(0, 2) : [];
    if (picks.length !== 2 || picks.some(r => !RES.includes(r))) return;
    const need = {}; picks.forEach(r => need[r] = (need[r] || 0) + 1);
    if (Object.keys(need).some(r => S.bank[r] < need[r])) return;
    p.devs.splice(p.devs.indexOf('year_of_plenty'), 1);
    p.playedDev = true;
    picks.forEach(r => give(p, r, 1));
    logMsg(`${nm(p)} 풍년 카드 사용 — ${picks.map(r => RKO[r]).join(' ')} 획득`);
    afterBuild();
    return;
  }
  if (card === 'monopoly') {
    const r = it.res;
    if (!RES.includes(r)) return;
    p.devs.splice(p.devs.indexOf('monopoly'), 1);
    p.playedDev = true;
    let got = 0;
    for (const q of S.players) if (q.i !== pi) { got += q.res[r]; p.res[r] += q.res[r]; q.res[r] = 0; }
    logMsg(`${nm(p)} 독점 카드 사용 — <b>${RKO[r]}</b> ${got}장 확보`);
    afterBuild();
  }
}

/* ── 교역 규칙 ── */
function cleanAmounts(o) {
  const out = {};
  for (const r of RES) out[r] = Math.max(0, Math.min(40, Math.floor(+((o || {})[r]) || 0)));
  return out;
}
function bankTradeOK(p, give_, get_) {
  const gt = RES.reduce((s, r) => s + get_[r], 0);
  if (!gt) return false;
  let units = 0;
  for (const r of RES) {
    if (!give_[r]) continue;
    if (give_[r] > p.res[r]) return false;
    const rate = tradeRate(p, r);
    if (give_[r] % rate !== 0) return false;
    units += give_[r] / rate;
  }
  if (!units || units !== gt) return false;
  return RES.every(r => S.bank[r] >= get_[r]);
}
function tradeText(o) { return RES.filter(r => o[r]).map(r => `${RKO[r]}${o[r]}`).join(' '); }

function bankTrade(pi, g, t) {
  const p = S.players[pi];
  if (S.phase !== 'action' || S.pick) return;
  const give_ = cleanAmounts(g), get_ = cleanAmounts(t);
  if (!bankTradeOK(p, give_, get_)) return;
  for (const r of RES) if (give_[r]) { p.res[r] -= give_[r]; S.bank[r] += give_[r]; }
  for (const r of RES) if (get_[r]) { p.res[r] += get_[r]; S.bank[r] -= get_[r]; }
  logMsg(`${nm(p)} 은행 교역 — ${tradeText(give_)} → ${tradeText(get_)}`);
  render();
}

function makeOffer(pi, g, t) {
  const p = S.players[pi];
  if (S.phase !== 'action' || S.pick) return;
  const give_ = cleanAmounts(g), get_ = cleanAmounts(t);
  if (!RES.some(r => give_[r]) || !RES.some(r => get_[r])) return;
  if (RES.some(r => give_[r] > p.res[r])) return;
  const resp = {};
  for (const q of S.players) {
    if (q.i === pi) continue;
    if (q.ai) { const j = aiJudgeTrade(q, give_, get_, p); resp[q.i] = { ok: j.ok, why: j.why }; }
    else resp[q.i] = 'pending';
  }
  S.offer = { from: pi, give: give_, get: get_, resp, id: Date.now() };
  if (NET) logMsg(`${nm(p)} 교역 제안 — ${tradeText(give_)} 주고 ${tradeText(get_)} 받기`, true);
  render();
}

function respondOffer(seat, yes) {
  const o = S.offer;
  if (!o || o.resp[seat] !== 'pending') return;
  const q = S.players[seat];
  const can = RES.every(r => (o.get[r] || 0) <= q.res[r]);
  o.resp[seat] = yes && can ? { ok: true, why: '수락' } : { ok: false, why: yes ? '그 자원이 없습니다' : '거절' };
  render();
}

function acceptOffer(pi, to) {
  const o = S.offer;
  if (!o || o.from !== pi) return;
  const r_ = o.resp[to];
  if (!r_ || r_ === 'pending' || !r_.ok) return;
  const p = S.players[pi], q = S.players[to];
  if (RES.some(r => o.give[r] > p.res[r]) || RES.some(r => o.get[r] > q.res[r])) {
    o.resp[to] = { ok: false, why: '그 자원이 없습니다' };
    render();
    return;
  }
  for (const r of RES) if (o.give[r]) { p.res[r] -= o.give[r]; q.res[r] += o.give[r]; }
  for (const r of RES) if (o.get[r]) { q.res[r] -= o.get[r]; p.res[r] += o.get[r]; }
  logMsg(`${nm(p)} ↔ ${nm(q)} 교역 — ${tradeText(o.give)} 주고 ${tradeText(o.get)} 받음`);
  S.offer = null;
  render();
}

let promptKey = null;
function syncPromptUI() {
  if (!S) return;
  let want = null;
  if (S.prompt && S.prompt.seat === ME && !S.players[ME].ai) want = `p:${S.prompt.kind}:${S.prompt.id}`;
  else if (S.offer && S.offer.resp && S.offer.resp[ME] === 'pending') want = `o:${S.offer.id}`;
  if (want === promptKey) return;
  if (promptKey && (modalKind === 'discard' || modalKind === 'victim' || modalKind === 'respond')) hideModal();
  promptKey = want;
  if (!want) return;
  if (modalKind === 'rules') return;   // 규칙을 닫으면 다시 띄움
  if (tradeUI) closeTrade();
  if (want.startsWith('p:discard')) drawDiscard();
  else if (want.startsWith('p:victim')) drawVictim();
  else drawRespond();
}

          <span class="swatch" style="background:${q.color}"></span>${esc(q.name)}
          <span class="verdict">${pend ? '응답 기다리는 중…' : `${v.ok ? '수락' : '거절'} — ${v.why}`}</span>
          ${!pend && v.ok ? `<button class="chip" data-acc="${q.i}" style="padding:3px 10px">교환</button>` : ''}
        </div>`;
      }).join('');
    }
    const view = o ? { g: o.give, r: o.get } : { g: give_, r: get_ };
    const scroll = $('#modal').scrollTop;
    showModal(`<div class="mh"><span class="eyebrow">교역</span><h2>무엇을 주고 무엇을 받을까요?</h2></div>
      <div class="mb">
        <div class="trade-grid">
          <div class="trade-col"><span class="eyebrow">내가 주는 것</span>
            ${RES.map(r => stepRow(me, r, view.g[r], 'g', view.g[r] >= me.res[r], !!o)).join('')}</div>
          <div class="trade-col"><span class="eyebrow">내가 받는 것</span>
            ${RES.map(r => stepRow(me, r, view.r[r], 'r', view.r[r] >= S.bank[r], !!o)).join('')}</div>
        </div>
        <p class="note">내 교역 비율 — ${rates}</p>
        ${responses ? `<div class="resp">${responses}</div>` : ''}
      </div>
      <div class="mf">
        <button class="btn" id="tClose"><span class="t">${o ? '제안 취소' : '닫기'}</span></button>
        ${o ? '' : `<button class="btn" id="tOffer" ${anyOffer() ? '' : 'disabled'}><span class="t">개척자들에게 제안</span></button>
        <button class="btn primary" id="tBank" ${bankTradeOK(me, give_, get_) ? '' : 'disabled'}><span class="t">은행·항구와 교환</span></button>`}
      </div>`, true, 'trade');
    $('#modal').scrollTop = scroll;

    $('#modal').querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.t === 'g' ? give_ : get_;
      t[b.dataset.r] = Math.max(0, t[b.dataset.r] + (+b.dataset.d));
      redraw();
    }));
    $('#tClose').addEventListener('click', closeTrade);
    const tb = $('#tBank');
    if (tb) tb.addEventListener('click', () => {
      const g = { ...give_ }, r = { ...get_ };
      tradeUI = null; hideModal();
      act({ t: 'bank', give: g, get: r });
    });
    const to = $('#tOffer');
    if (to) to.addEventListener('click', () => act({ t: 'offer', give: { ...give_ }, get: { ...get_ } }));
    $('#modal').querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => {
      tradeUI = null; hideModal();
      act({ t: 'accept', to: +b.dataset.acc });
    }));
  };
  tradeUI = { redraw };
  redraw();
}

/* ── 결과 ────────────────────────────────────────────────── */
function showWin() {
  winShown = true;
  if (tradeUI) { tradeUI = null; }
  const w = S.players[S.winner];
  const ranking = S.players.slice().sort((a, b) => vpOf(b) - vpOf(a));
  const rows = ranking.map(p => {
    const bits = [];
    let base = 0;
    for (const v of S.B.vertices) if (v.b && v.b.p === p.i) base += v.b.type === 'city' ? 2 : 1;
    bits.push(`건물 ${base}`);
    if (p.vpCards) bits.push(`카드 ${p.vpCards}`);
    if (S.longestOwner === p.i) bits.push('최장 교역로 2');
    if (S.armyOwner === p.i) bits.push('최대 기사력 2');
    return `<div class="scoreline"><span><span class="swatch" style="background:${p.color};display:inline-block;vertical-align:-1px;margin-right:6px"></span>${esc(p.name)}</span><span>${bits.join(' · ')} = <b>${vpOf(p)}점</b></span></div>`;
  }).join('');
  showModal(`<div class="mh"><span class="eyebrow">게임 종료 · ${S.turn}턴</span></div>
    <div class="mb"><div class="win"><div class="big" style="color:${w.hex}">${esc(w.name)} 승리</div>
    <p style="margin-top:6px">${w.i === ME ? '섬은 당신의 것입니다.' : '다음 판에서 되갚아 줍시다.'}</p></div>
    <div>${rows}</div></div>
    <div class="mf"><button class="btn" id="wLook"><span class="t">판 살펴보기</span></button>
    ${NET ? '' : '<button class="btn primary" id="wNew"><span class="t">새 게임</span></button>'}</div>`, true, 'win');
  $('#wLook').addEventListener('click', hideModal);
  if (!NET) $('#wNew').addEventListener('click', showSetupModal);
  if (NET && NET.role === 'host' && !finishSent) {
    finishSent = true;
    pushState();
    MGH.net.send({ type: 'net:finished', winner: S.winner, turn: S.turn, scores: S.players.map(p => vpOf(p)) });
  }
}

/* ── 자동 대국 (검증용) ──────────────────────────────────── */
window.__sim = function (n) {
  SPEED = 0;
  startGame(n, true);
  return true;
};
window.__state = () => ({
  winner: S.winner, turn: S.turn, phase: S.phase, busy: S.busy,
  vps: S.players.map(p => vpOf(p)),
  hexes: S.B.hexes.length, verts: S.B.vertices.length, edges: S.B.edges.length,
  ports: S.B.ports.length, perim: S.B.edges.filter(e => e.hexes.length === 1).length,
  portVerts: S.B.vertices.filter(v => v.port).length,
  bank: S.bank, deck: S.deck.length,
  totalRes: S.players.reduce((a, p) => a + handCount(p), 0),
  numbers: S.B.hexes.filter(h => h.number).length,
  adj6_8: S.B.hexes.some(h => (h.number === 6 || h.number === 8) && h.adj.some(a => [6, 8].includes(S.B.hexes[a].number)))
});
window.__net = { serialize: () => serialize(), applyIntent: (s, i) => applyIntent(s, i), setSeatAI: (s, a) => setSeatAI(s, a), me: () => ME };

/* ── 시작 ────────────────────────────────────────────────── */
bindUI();
newGame(4);
render();
// 포털 온라인 방에서 열리면(?online=1) 방장의 신호를 기다리고, 아니면 혼자 하기 설정 창
if (new URLSearchParams(location.search).get('online') === '1') {
  $('#btnNew').hidden = true;
  $('#phasemsg').textContent = '온라인 방에 연결하는 중…';
  MGH.net.send({ type: 'net:ready' });
} else {
  showSetupModal();
}

</script>
</body>
