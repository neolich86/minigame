<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="canonical" href="/play/catan">
<script src="/mgh/bridge.js"></script><script src="/mgh/i18n/catan.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카탄 섬 개척기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ── 토큰: 라이트가 기본, 다크는 토큰만 재정의 ───────────────── */
:root{
  --sea-1:#123443; --sea-2:#17414f; --sea-line:#0d2733;
  --brass:#a8792c; --brass-soft:#c9993f;
  --bg:#dfe4e3; --panel:#f4f6f5; --panel-2:#e8ecea; --sunk:#d5dbd9;
  --ink:#111b1d; --ink-2:#3d4d4f; --ink-3:#6d7d7e;
  --line:#c3ccca; --line-2:#aab5b3;
  --good:#2f7d55; --warn:#a8792c; --bad:#a8402f;
  --shadow:0 1px 2px rgba(12,28,32,.10), 0 6px 20px rgba(12,28,32,.09);
  --radius:9px;
  --lumber:#2b5738; --wool:#89a944; --grain:#d6a634; --brick:#b05f31; --ore:#69767f; --desert:#cbb68e;
  --p0:#c8433d; --p1:#2f79c4; --p2:#e08a2b; --p3:#e6e0d0;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-dis:"Fraunces",Georgia,"Times New Roman",serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1416; --panel:#161f22; --panel-2:#1d282b; --sunk:#101a1c;
    --ink:#e7eceb; --ink-2:#a7b5b4; --ink-3:#74827f;
    --line:#28353a; --line-2:#3a4a4f;
    --good:#54b183; --warn:#c9993f; --bad:#d4705e;
    --brass:#c9993f; --brass-soft:#e0b45c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1416; --panel:#161f22; --panel-2:#1d282b; --sunk:#101a1c;
  --ink:#e7eceb; --ink-2:#a7b5b4; --ink-3:#74827f;
  --line:#28353a; --line-2:#3a4a4f;
  --good:#54b183; --warn:#c9993f; --bad:#d4705e;
  --brass:#c9993f; --brass-soft:#e0b45c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit}
h1,h2,h3{margin:0; text-wrap:balance}

/* ── 레이아웃 ─────────────────────────────────────────────── */
#app{
  display:grid; grid-template-columns:minmax(0,1fr) 372px;
  gap:14px; padding:14px; min-height:100vh; align-content:start;
}
#stage{display:flex; flex-direction:column; gap:12px; min-width:0}
#rail{display:flex; flex-direction:column; gap:12px; min-width:0}

.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.card-h{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 12px; border-bottom:1px solid var(--line);
}
.eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3);
}

/* ── 헤더 ─────────────────────────────────────────────────── */
#top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:0 2px}
#top h1{
  font-family:var(--font-dis); font-weight:700; font-size:26px; letter-spacing:-.01em;
  font-variation-settings:"SOFT" 8,"WONK" 1;
}
#top .sub{color:var(--ink-3); font-size:12.5px}
#top .spacer{flex:1}
.iconbtn{
  background:var(--panel); border:1px solid var(--line); border-radius:7px;
  padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer;
}
.iconbtn:hover{border-color:var(--line-2); background:var(--panel-2)}

/* ── 보드 ─────────────────────────────────────────────────── */
#boardwrap{
  position:relative; border-radius:var(--radius); overflow:hidden;
  display:grid; place-items:center;
  border:1px solid var(--sea-line); box-shadow:var(--shadow);
  background:radial-gradient(120% 118% at 50% -8%, #1d5468 0%, var(--sea-2) 34%, var(--sea-1) 68%, #071c26 100%);
}
#board{display:block; width:100%; height:auto; max-height:calc(100vh - 168px); touch-action:manipulation}
.hexlabel{
  font-family:var(--font-ui); font-size:10.5px; font-weight:700; letter-spacing:.02em;
  fill:#f2ede1; text-anchor:middle; pointer-events:none;
}
.toknum{font-family:var(--font-num); font-weight:600; text-anchor:middle; fill:#241d12}
.toknum.hot{fill:#a02b23}
.tokpip{fill:#4a4234}
.tokpip.hot{fill:#a02b23}
.port-l{font-family:var(--font-num); font-size:10.5px; font-weight:600; text-anchor:middle; fill:#f4ecdb}
.spot{cursor:pointer}
.spot circle{transition:r .12s ease, opacity .12s ease}
.spot:hover .halo{opacity:.55}
@keyframes breathe{0%,100%{opacity:.85; r:8.5}50%{opacity:1; r:11}}
.spot .core{animation:breathe 1.9s ease-in-out infinite}
.eplace{cursor:pointer}
.eplace:hover line{stroke-opacity:.95}
@keyframes ebreathe{0%,100%{stroke-opacity:.6}50%{stroke-opacity:1}}
.eplace line.core{animation:ebreathe 1.9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .spot .core,.eplace line.core{animation:none}
}
#diceover{display:flex; gap:7px; pointer-events:none; flex:none}
.die{
  width:32px; height:32px; border-radius:7px; background:#f6f2e6;
  border:1px solid #c4bca4; box-shadow:0 2px 5px rgba(20,28,30,.28), inset 0 -2px 0 rgba(0,0,0,.12);
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:5px; gap:1px;
}
.die i{width:5px; height:5px; border-radius:50%; background:#22292c; align-self:center; justify-self:center}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-14px) rotate(-18deg)}70%{transform:translateY(3px) rotate(9deg)}100%{transform:translateY(0) rotate(0)}}
.die.roll{animation:tumble .5s ease}

/* ── 상태바 ───────────────────────────────────────────────── */
#phasebar{
  display:flex; align-items:center; gap:12px; padding:10px 13px;
}
#phasebar .msg{flex:1; min-width:0; font-size:13.5px}
#phasebar .msg b{font-weight:700}
.turnchip{
  display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 6px;
  border-radius:999px; background:var(--panel-2); border:1px solid var(--line);
  font-size:12px; font-weight:600; white-space:nowrap;
}
.swatch{width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,.28); flex:none}

/* ── 점수판 ───────────────────────────────────────────────── */
.plist{display:flex; flex-direction:column}
.prow{
  display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center;
  padding:8px 12px; border-bottom:1px solid var(--line);
}
.prow:last-child{border-bottom:0}
.prow.active{background:var(--panel-2)}
.prow.active .pname{color:var(--ink)}
.pname{font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px}
.pmeta{
  font-family:var(--font-num); font-size:10.5px; color:var(--ink-3);
  display:flex; gap:8px; flex-wrap:wrap; margin-top:1px;
}
.pmeta .on{color:var(--brass); font-weight:600}
.pvp{
  font-family:var(--font-num); font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600; text-align:right; line-height:1;
}
.pvp small{display:block; font-size:9px; letter-spacing:.1em; color:var(--ink-3); font-family:var(--font-ui); font-weight:700}

/* ── 자원 패 ──────────────────────────────────────────────── */
.hand{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; padding:11px 12px}
.rc{
  border-radius:7px; border:1px solid var(--line); background:var(--panel-2);
  padding:7px 4px 6px; text-align:center; position:relative; overflow:hidden;
}
.rc .bar{position:absolute; inset:0 0 auto 0; height:4px}
.rc .n{
  font-family:var(--font-num); font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600; line-height:1.15; display:block;
}
.rc .l{font-size:9.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-3)}
.rc.gain{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.13); background:var(--brass-soft)}100%{transform:scale(1)}}

/* ── 액션 ─────────────────────────────────────────────────── */
.acts{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:11px 12px}
.acts .wide{grid-column:1 / -1}
.btn{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; cursor:pointer; text-align:left; transition:border-color .12s, background .12s;
}
.btn:hover:not(:disabled){border-color:var(--brass); background:var(--panel)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn .t{font-weight:600; font-size:12.5px}
.btn .c{font-family:var(--font-num); font-size:10px; line-height:1.35; color:var(--ink-3); letter-spacing:.01em}
.btn.primary{background:var(--brass); border-color:var(--brass); color:#fff}
.btn.primary .c{color:rgba(255,255,255,.8)}
.btn.primary:hover:not(:disabled){background:var(--brass-soft); border-color:var(--brass-soft)}
.btn.center{align-items:center; text-align:center}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

/* ── 발전카드 ─────────────────────────────────────────────── */
.devs{display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 11px}
.dev{
  border:1px solid var(--line); border-radius:6px; background:var(--panel-2);
  padding:5px 9px; font-size:11.5px; font-weight:600; cursor:pointer;
}
.dev:hover:not(:disabled){border-color:var(--brass)}
.dev:disabled{opacity:.45; cursor:default}
.dev .k{font-family:var(--font-num); color:var(--ink-3); margin-left:4px}
.empty{padding:0 12px 11px; color:var(--ink-3); font-size:12px}

/* ── 로그 ─────────────────────────────────────────────────── */
#log{
  padding:8px 12px 10px; max-height:210px; overflow-y:auto; background:var(--sunk);
  border-radius:0 0 var(--radius) var(--radius);
  font-family:var(--font-num); font-size:11.5px; line-height:1.55;
}
#log div{padding:1.5px 0; border-bottom:1px solid transparent}
#log .sys{color:var(--ink-3)}
#log b{font-weight:600}

/* ── 모달 ─────────────────────────────────────────────────── */
.veil{
  position:fixed; inset:0; background:rgba(8,18,22,.62); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:18px; z-index:40;
}
.veil[hidden]{display:none}
.modal{
  width:min(520px,100%); background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.4); max-height:90vh; overflow-y:auto;
}
.modal .mh{padding:15px 18px 0}
.modal h2{font-family:var(--font-dis); font-size:20px; font-weight:700}
.modal .mb{padding:13px 18px 16px; display:flex; flex-direction:column; gap:13px}
.modal p{margin:0; color:var(--ink-2); font-size:13px}
.mf{display:flex; gap:8px; justify-content:flex-end; padding:0 18px 16px; flex-wrap:wrap}
.mf .btn{flex-direction:row; align-items:center; padding:8px 16px}

.trade-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.trade-col .eyebrow{margin-bottom:7px; display:block}
.stepper{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:5px 7px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel-2); margin-bottom:6px;
}
.stepper .nm{font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; min-width:0}
.stepper .ct{display:flex; align-items:center; gap:5px}
.stepper button{
  width:22px; height:22px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel); cursor:pointer; font-size:13px; line-height:1; font-weight:700;
}
.stepper button:disabled{opacity:.35; cursor:default}
.stepper .v{font-family:var(--font-num); font-variant-numeric:tabular-nums; width:16px; text-align:center; font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12px;
  font-weight:600; background:var(--panel-2); cursor:pointer;
}
.chip:hover:not(:disabled){border-color:var(--brass)}
.chip:disabled{opacity:.4; cursor:default}
.chip.sel{background:var(--brass); border-color:var(--brass); color:#fff}
.note{font-size:11.5px; color:var(--ink-3); font-family:var(--font-num)}
.resp{display:flex; flex-direction:column; gap:6px}
.resp .r{
  display:flex; align-items:center; gap:8px; font-size:12.5px;
  padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel-2);
}
.resp .r.yes{border-color:var(--good)} .resp .r.no{opacity:.65}
.resp .verdict{margin-left:auto; font-weight:700; font-size:11.5px}
.resp .yes .verdict{color:var(--good)} .resp .no .verdict{color:var(--ink-3)}

.setup-grid{display:flex; gap:8px; flex-wrap:wrap}
.win{text-align:center; padding:6px 0 2px}
.win .big{font-family:var(--font-dis); font-size:34px; font-weight:700; line-height:1.1}
.scoreline{
  display:flex; justify-content:space-between; gap:10px; font-size:12.5px;
  padding:5px 0; border-bottom:1px solid var(--line); font-family:var(--font-num);
}
.scoreline:last-child{border-bottom:0}

@media (max-width:1080px){
  #app{grid-template-columns:minmax(0,1fr); padding:10px; gap:10px}
  #rail{order:2}
  #board{max-height:none}
  #log{max-height:150px}
  #phasebar{flex-wrap:wrap}
  #phasebar .msg{order:3; flex-basis:100%}
}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <header id="top">
      <h1>카탄 섬 개척기</h1>
      <span class="sub">10점 선취 &middot; 정식 규칙</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnTheme" type="button">테마</button>
      <button class="iconbtn" id="btnRules" type="button">규칙</button>
      <button class="iconbtn" id="btnNew" type="button">새 게임</button>
    </header>

    <div id="boardwrap">
      <svg id="board" viewBox="44 54 572 496" role="img" aria-label="카탄 게임판"></svg>
    </div>

    <div class="card" id="phasebar">
      <span class="turnchip" id="turnchip"><span class="swatch"></span><span id="turnname">—</span></span>
      <div id="diceover"></div>
      <div class="msg" id="phasemsg">게임을 시작합니다.</div>
      <button class="btn primary center" id="btnMain" type="button" style="min-width:118px"><span class="t">주사위 굴리기</span></button>
    </div>
  </div>

  <aside id="rail">
    <section class="card">
      <div class="card-h"><span class="eyebrow">점수판</span><span class="eyebrow" id="deckcount">발전카드 25</span></div>
      <div class="plist" id="plist"></div>
    </section>

    <section class="card">
      <div class="card-h"><span class="eyebrow">내 자원</span><span class="eyebrow" id="handcount">0장</span></div>
      <div class="hand" id="hand"></div>
      <div class="card-h" style="border-top:1px solid var(--line)"><span class="eyebrow">내 발전카드</span></div>
      <div class="devs" id="devs"></div>
    </section>

    <section class="card">
      <div class="card-h"><span class="eyebrow">행동</span><span class="eyebrow" id="stockline"></span></div>
      <div class="acts" id="acts">
        <button class="btn" id="aRoad" type="button"><span class="t">도로</span><span class="c">나무1 흙1</span></button>
        <button class="btn" id="aSettle" type="button"><span class="t">정착지</span><span class="c">나무1 흙1 양털1 밀1</span></button>
        <button class="btn" id="aCity" type="button"><span class="t">도시</span><span class="c">밀2 광석3</span></button>
        <button class="btn" id="aDev" type="button"><span class="t">발전카드</span><span class="c">양털1 밀1 광석1</span></button>
        <button class="btn wide" id="aTrade" type="button"><span class="t">교역</span><span class="c">은행 · 항구 · 다른 개척자에게 제안</span></button>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><span class="eyebrow">기록</span></div>
      <div id="log"></div>
    </section>
  </aside>
</div>

<div class="veil" id="veil" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   카탄 섬 개척기 — 규칙 엔진
   ═══════════════════════════════════════════════════════════════ */
'use strict';

const RES = ['lumber', 'brick', 'wool', 'grain', 'ore'];
const RKO = { lumber: '나무', brick: '흙', wool: '양털', grain: '밀', ore: '광석' };
const RVAR = { lumber: 'var(--lumber)', brick: 'var(--brick)', wool: 'var(--wool)', grain: 'var(--grain)', ore: 'var(--ore)' };
const RHEX = { lumber: '#3f8050', brick: '#c8794a', wool: '#a6c761', grain: '#eac152', ore: '#93a0aa' };
const TERRAIN = {
  forest:    { res: 'lumber', ko: '숲',   fill: 'var(--lumber)' },
  hills:     { res: 'brick',  ko: '언덕', fill: 'var(--brick)' },
  pasture:   { res: 'wool',   ko: '초원', fill: 'var(--wool)' },
  fields:    { res: 'grain',  ko: '밭',   fill: 'var(--grain)' },
  mountains: { res: 'ore',    ko: '산',   fill: 'var(--ore)' },
  desert:    { res: null,     ko: '사막', fill: 'var(--desert)' }
};
const COST = {
  road:     { lumber: 1, brick: 1 },
  settle:   { lumber: 1, brick: 1, wool: 1, grain: 1 },
  city:     { grain: 2, ore: 3 },
  dev:      { wool: 1, grain: 1, ore: 1 }
};
const DEV_KO = {
  knight: '기사', road_building: '도로 건설', year_of_plenty: '풍년', monopoly: '독점', vp: '승리점수'
};
const DEV_DESC = {
  knight: '도적을 옮기고 자원 1장을 훔칩니다. 3장 이상이면 최대 기사력(2점).',
  road_building: '도로 2개를 무료로 놓습니다.',
  year_of_plenty: '은행에서 원하는 자원 2장을 가져옵니다.',
  monopoly: '자원 1종을 지정해 모든 상대에게서 전부 빼앗습니다.',
  vp: '숨겨진 승리점수 1점. 자동으로 계산됩니다.'
};
const PCOLORS = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)'];
const PHEX = ['#c0433f', '#3a7cc0', '#c1701a', '#8d8371'];  // 로그·텍스트용 (밝은 배경에서도 읽히는 값)
const AI_NAMES = ['라헬', '도르', '벤야민'];

const pips = n => (n ? 6 - Math.abs(7 - n) : 0);
const shuffle = (a, rnd) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function mulberry32(s) { const f = function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.state = () => s; return f; }

let S = null;   // 게임 상태

/* ── 게임판 생성 ─────────────────────────────────────────── */
function buildBoard(rnd) {
  const R = 52, ROWS = [3, 4, 5, 4, 3], W = Math.sqrt(3) * R, VS = 1.5 * R;
  const CX = 330, CY = 302;
  const B = { R, hexes: [], vertices: [], edges: [], ports: [] };

  const getV = (x, y) => {
    for (const v of B.vertices) if (Math.abs(v.x - x) < 1.2 && Math.abs(v.y - y) < 1.2) return v;
    const v = { id: B.vertices.length, x, y, hexes: [], edges: [], adj: [], b: null, port: null };
    B.vertices.push(v); return v;
  };
  const getE = (a, b) => {
    const lo = Math.min(a.id, b.id), hi = Math.max(a.id, b.id);
    for (const e of B.edges) if (e.v[0] === lo && e.v[1] === hi) return e;
    const e = { id: B.edges.length, v: [lo, hi], hexes: [], road: null };
    B.edges.push(e);
    a.edges.push(e.id); b.edges.push(e.id);
    a.adj.push(b.id); b.adj.push(a.id);
    return e;
  };

  ROWS.forEach((n, r) => {
    for (let i = 0; i < n; i++) {
      const cx = CX + (i - (n - 1) / 2) * W, cy = CY + (r - 2) * VS;
      const h = { id: B.hexes.length, cx, cy, corners: [], edges: [], terrain: null, res: null, number: null, adj: [] };
      const cs = [];
      for (let k = 0; k < 6; k++) {
        const a = (60 * k - 30) * Math.PI / 180;
        cs.push(getV(cx + R * Math.cos(a), cy + R * Math.sin(a)));
      }
      cs.forEach(v => { h.corners.push(v.id); v.hexes.push(h.id); });
      for (let k = 0; k < 6; k++) {
        const e = getE(cs[k], cs[(k + 1) % 6]);
        h.edges.push(e.id); e.hexes.push(h.id);
      }
      B.hexes.push(h);
    }
  });
  // 육각 타일 인접 관계
  for (const e of B.edges) if (e.hexes.length === 2) {
    B.hexes[e.hexes[0]].adj.push(e.hexes[1]);
    B.hexes[e.hexes[1]].adj.push(e.hexes[0]);
  }

  // 지형 분배
  const terr = shuffle([
    ...Array(4).fill('forest'), ...Array(4).fill('pasture'), ...Array(4).fill('fields'),
    ...Array(3).fill('hills'), ...Array(3).fill('mountains'), 'desert'
  ], rnd);
  B.hexes.forEach((h, i) => { h.terrain = terr[i]; h.res = TERRAIN[terr[i]].res; });

  // 숫자 토큰 — 6과 8이 서로 붙지 않을 때까지 재배치
  const land = B.hexes.filter(h => h.terrain !== 'desert');
  const NUMS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
  for (let tryN = 0; tryN < 400; tryN++) {
    const ns = shuffle(NUMS.slice(), rnd);
    land.forEach((h, i) => { h.number = ns[i]; });
    const bad = land.some(h => (h.number === 6 || h.number === 8) &&
      h.adj.some(a => B.hexes[a].number === 6 || B.hexes[a].number === 8));
    if (!bad) break;
  }
  B.hexes.forEach(h => { if (h.terrain === 'desert') h.number = null; });

  // 항구 — 외곽 30개 변을 한 바퀴 정렬한 뒤 2·2·3 간격으로 9곳
  const perim = B.edges.filter(e => e.hexes.length === 1);
  const ring = [perim[0]]; const used = new Set([perim[0].id]);
  let end = perim[0].v[1];
  B.ringV = [perim[0].v[0], end];          // 섬 외곽선 (입체 슬래브용)
  while (ring.length < perim.length) {
    const nx = perim.find(e => !used.has(e.id) && (e.v[0] === end || e.v[1] === end));
    if (!nx) break;
    used.add(nx.id); ring.push(nx);
    end = nx.v[0] === end ? nx.v[1] : nx.v[0];
    B.ringV.push(end);
  }
  B.ringV.pop();                            // 시작점 중복 제거
  const ptypes = shuffle(['lumber', 'brick', 'wool', 'grain', 'ore', 'any', 'any', 'any', 'any'], rnd);
  const gaps = [2, 2, 3, 2, 2, 3, 2, 2, 3];
  let idx = Math.floor(rnd() * ring.length);
  ptypes.forEach((t, i) => {
    const e = ring[idx % ring.length];
    const port = { id: i, type: t, ratio: t === 'any' ? 3 : 2, edge: e.id, v: e.v.slice() };
    B.ports.push(port);
    e.v.forEach(vid => { B.vertices[vid].port = port; });
    idx += gaps[i] + 1;
  });

  return B;
}

/* ── 새 게임 ─────────────────────────────────────────────── */
function newGame(nPlayers, seats) {
  const seed = (Math.random() * 2 ** 32) >>> 0;
  const rnd = mulberry32(seed);
  const B = buildBoard(rnd);
  const players = [];
  for (let i = 0; i < nPlayers; i++) {
    players.push({
      i, name: seats ? (seats[i].ai ? `${AI_NAMES[i % 3]} AI` : seats[i].name) : (i === 0 ? '나' : AI_NAMES[i - 1]),
      ai: seats ? !!seats[i].ai : i > 0, color: PCOLORS[i], hex: PHEX[i],
      res: { lumber: 0, brick: 0, wool: 0, grain: 0, ore: 0 },
      devs: [], newDevs: [], knights: 0, vpCards: 0,
      roadsLeft: 15, settLeft: 5, cityLeft: 4,
      ports: new Set(), roadLen: 0, playedDev: false
    });
  }
  const deck = shuffle([
    ...Array(14).fill('knight'), ...Array(5).fill('vp'),
    ...Array(2).fill('road_building'), ...Array(2).fill('year_of_plenty'), ...Array(2).fill('monopoly')
  ], rnd);

  const order = [];
  for (let i = 0; i < nPlayers; i++) order.push(i);
  for (let i = nPlayers - 1; i >= 0; i--) order.push(i);

  S = {
    seed, rnd, B, players, deck,
    bank: { lumber: 19, brick: 19, wool: 19, grain: 19, ore: 19 },
    robber: B.hexes.findIndex(h => h.terrain === 'desert'),
    cur: 0, phase: 'setupS', dice: [0, 0], turn: 0,
    setupOrder: order, setupIdx: 0, lastSettle: null, freeRoads: 0,
    longestOwner: null, longestLen: 4, armyOwner: null, armySize: 2,
    discardQueue: [], stealFrom: [], winner: null, log: [], busy: false,
    pick: null, prompt: null, offer: null, promptSeq: 0
  };
  return S;
}

/* ── 계산 ────────────────────────────────────────────────── */
function handCount(p) { return RES.reduce((s, r) => s + p.res[r], 0); }
function canAfford(p, cost) { return Object.keys(cost).every(r => p.res[r] >= cost[r]); }
function pay(p, cost) { for (const r in cost) { p.res[r] -= cost[r]; S.bank[r] += cost[r]; } }
function refund(p, cost) { for (const r in cost) { p.res[r] += cost[r]; S.bank[r] -= cost[r]; } }
function give(p, r, n) { const k = Math.min(n, S.bank[r]); p.res[r] += k; S.bank[r] -= k; return k; }

function vpOf(p, hidden) {
  let v = 0;
  for (const vx of S.B.vertices) if (vx.b && vx.b.p === p.i) v += vx.b.type === 'city' ? 2 : 1;
  if (S.longestOwner === p.i) v += 2;
  if (S.armyOwner === p.i) v += 2;
  if (hidden !== false) v += p.vpCards;
  return v;
}
function publicVP(p) { return vpOf(p, false); }

function tradeRate(p, r) {
  let rate = 4;
  for (const port of p.ports) {
    if (port.type === 'any') rate = Math.min(rate, 3);
    else if (port.type === r) rate = Math.min(rate, 2);
  }
  return rate;
}

/* ── 합법 수 ─────────────────────────────────────────────── */
function vertexFree(v) {
  if (v.b) return false;
  return !v.adj.some(id => S.B.vertices[id].b);
}
function legalSettlements(pi, setup) {
  const out = [];
  for (const v of S.B.vertices) {
    if (!vertexFree(v)) continue;
    if (!setup) {
      const linked = v.edges.some(eid => S.B.edges[eid].road === pi);
      if (!linked) continue;
    }
    out.push(v.id);
  }
  return out;
}
function legalRoads(pi) {
  const out = [];
  for (const e of S.B.edges) {
    if (e.road !== null) continue;
    const ok = e.v.some(vid => {
      const v = S.B.vertices[vid];
      if (v.b) return v.b.p === pi;
      return v.edges.some(eid => S.B.edges[eid].road === pi);
    });
    if (ok) out.push(e.id);
  }
  return out;
}
function legalSetupRoads(vid) {
  return S.B.vertices[vid].edges.filter(eid => S.B.edges[eid].road === null);
}
function legalCities(pi) {
  return S.B.vertices.filter(v => v.b && v.b.p === pi && v.b.type === 'settlement').map(v => v.id);
}

/* ── 최장 교역로 ─────────────────────────────────────────── */
function longestRoadFor(pi) {
  const mine = S.B.edges.filter(e => e.road === pi);
  if (!mine.length) return 0;
  const own = new Set(mine.map(e => e.id));
  let best = 0;
  const walk = (vid, used) => {
    if (used.size > best) best = used.size;
    const v = S.B.vertices[vid];
    if (v.b && v.b.p !== pi) return;              // 상대 건물이 길을 끊는다
    for (const eid of v.edges) {
      if (!own.has(eid) || used.has(eid)) continue;
      const e = S.B.edges[eid];
      used.add(eid);
      walk(e.v[0] === vid ? e.v[1] : e.v[0], used);
      used.delete(eid);
    }
  };
  for (const e of mine) for (const vid of e.v) {
    walk(e.v[0] === vid ? e.v[1] : e.v[0], new Set([e.id]));
  }
  return best;
}
function updateLongest() {
  const before = S.longestOwner;
  S.players.forEach(p => { p.roadLen = longestRoadFor(p.i); });
  if (S.longestOwner !== null && S.players[S.longestOwner].roadLen < 5) {
    S.longestOwner = null; S.longestLen = 4;
  }
  if (S.longestOwner !== null) S.longestLen = S.players[S.longestOwner].roadLen;
  let bestLen = Math.max(4, S.longestLen), cand = null, tie = false;
  S.players.forEach(p => {
    if (p.i === S.longestOwner) return;
    if (p.roadLen > bestLen) { bestLen = p.roadLen; cand = p.i; tie = false; }
    else if (p.roadLen === bestLen && cand !== null) tie = true;
  });
  if (cand !== null && !tie) { S.longestOwner = cand; S.longestLen = bestLen; }
  if (S.longestOwner !== before && S.longestOwner !== null)
    logMsg(`<b style="color:${S.players[S.longestOwner].hex}">${S.players[S.longestOwner].name}</b>가 최장 교역로(${S.longestLen})를 차지했습니다. +2점`);
}
function updateArmy() {
  const before = S.armyOwner;
  for (const p of S.players) {
    if (p.knights >= 3 && p.knights > S.armySize) { S.armySize = p.knights; S.armyOwner = p.i; }
  }
  if (S.armyOwner !== before)
    logMsg(`<b style="color:${S.players[S.armyOwner].hex}">${S.players[S.armyOwner].name}</b>가 최대 기사력(기사 ${S.armySize})을 차지했습니다. +2점`);
}

/* ── 건설 ────────────────────────────────────────────────── */
function placeSettlement(pi, vid, free) {
  const p = S.players[pi], v = S.B.vertices[vid];
  if (!free) pay(p, COST.settle);
  v.b = { p: pi, type: 'settlement' };
  p.settLeft--;
  if (v.port) p.ports.add(v.port);
  updateLongest();
  logMsg(`<b style="color:${p.hex}">${p.name}</b> 정착지 건설`);
}
function placeRoad(pi, eid, free) {
  const p = S.players[pi];
  if (!free) pay(p, COST.road);
  S.B.edges[eid].road = pi;
  p.roadsLeft--;
  updateLongest();
}
function upgradeCity(pi, vid) {
  const p = S.players[pi];
  pay(p, COST.city);
  S.B.vertices[vid].b.type = 'city';
  p.cityLeft--; p.settLeft++;
  logMsg(`<b style="color:${p.hex}">${p.name}</b> 도시 건설`);
}
function buyDev(pi) {
  const p = S.players[pi];
  if (!S.deck.length) return null;
  pay(p, COST.dev);
  const c = S.deck.pop();
  if (c === 'vp') p.vpCards++; else p.newDevs.push(c);
  logMsg(`<b style="color:${p.hex}">${p.name}</b> 발전카드 구입`);
  return c;
}

/* ── 생산 ────────────────────────────────────────────────── */
function produce(roll) {
  const gains = S.players.map(() => ({}));
  const hitHexes = [];
  for (const h of S.B.hexes) {
    if (h.number !== roll || h.id === S.robber || !h.res) continue;
    hitHexes.push(h.id);
    for (const vid of h.corners) {
      const v = S.B.vertices[vid];
      if (!v.b) continue;
      gains[v.b.p][h.res] = (gains[v.b.p][h.res] || 0) + (v.b.type === 'city' ? 2 : 1);
    }
  }
  // 은행 부족 처리: 한 명만 요구하면 남은 만큼, 여러 명이면 아무도 못 받음
  for (const r of RES) {
    const total = gains.reduce((s, g) => s + (g[r] || 0), 0);
    if (total > S.bank[r]) {
      const claim = gains.filter(g => g[r] > 0);
      if (claim.length === 1) claim[0][r] = S.bank[r];
      else gains.forEach(g => { if (g[r]) g[r] = 0; });
    }
  }
  const lines = [];
  gains.forEach((g, i) => {
    const parts = [];
    for (const r of RES) if (g[r]) { give(S.players[i], r, g[r]); parts.push(`${RKO[r]}${g[r]}`); }
    if (parts.length) lines.push(`<b style="color:${S.players[i].hex}">${S.players[i].name}</b> +${parts.join(' ')}`);
  });
  return { gains, lines, hitHexes };
}

function robberVictims(hexId, pi) {
  const set = new Set();
  for (const vid of S.B.hexes[hexId].corners) {
    const v = S.B.vertices[vid];
    if (v.b && v.b.p !== pi && handCount(S.players[v.b.p]) > 0) set.add(v.b.p);
  }
  return [...set];
}
function stealFrom(pi, target) {
  const t = S.players[target], p = S.players[pi];
  const pool = [];
  for (const r of RES) for (let i = 0; i < t.res[r]; i++) pool.push(r);
  if (!pool.length) return null;
  const r = pool[Math.floor(S.rnd() * pool.length)];
  t.res[r]--; p.res[r]++;
  return r;
}

function checkWin() {
  for (const p of S.players) {
    if (vpOf(p) >= 10) { S.winner = p.i; S.phase = 'over'; return true; }
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════════
   AI 개척자
   ═══════════════════════════════════════════════════════════════ */

const RESW = { brick: 1.15, lumber: 1.15, grain: 1.05, ore: 1.0, wool: .92 };

function aiGoal(p) {
  if (p.cityLeft > 0 && legalCities(p.i).length) return { name: 'city', cost: COST.city };
  if (p.settLeft > 0 && legalSettlements(p.i, false).length) return { name: 'settle', cost: COST.settle };
  if (p.roadsLeft > 0 && legalRoads(p.i).length) return { name: 'road+', cost: COST.settle };
  return { name: 'dev', cost: COST.dev };
}
function aiNeed(p) {
  const g = aiGoal(p), need = { lumber: 0, brick: 0, wool: 0, grain: 0, ore: 0 };
  for (const r in g.cost) need[r] = Math.max(0, g.cost[r] - p.res[r]);
  return need;
}
function aiValue(p, r) {
  const need = aiNeed(p);
  if (need[r] > 0) return 3;
  if (p.res[r] <= 1) return 1.1;
  return 0.45;
}

function vertexScore(pi, vid) {
  const v = S.B.vertices[vid];
  let score = 0; const kinds = {};
  for (const hid of v.hexes) {
    const h = S.B.hexes[hid];
    if (!h.res) continue;
    score += pips(h.number) * RESW[h.res];
    kinds[h.res] = (kinds[h.res] || 0) + pips(h.number);
  }
  score += Object.keys(kinds).length * 1.7;
  // 이미 가진 자원과 겹치지 않으면 가산
  const have = {};
  for (const vx of S.B.vertices) if (vx.b && vx.b.p === pi)
    for (const hid of vx.hexes) { const h = S.B.hexes[hid]; if (h.res) have[h.res] = true; }
  for (const r in kinds) if (!have[r]) score += 2.2;
  if (v.port) score += v.port.type === 'any' ? 1.3 : (kinds[v.port.type] ? 2.4 : 0.7);
  return score;
}

function aiSetupSettlement(pi) {
  const spots = legalSettlements(pi, true);
  let best = spots[0], bs = -1;
  for (const vid of spots) {
    const s = vertexScore(pi, vid) + S.rnd() * 0.8;
    if (s > bs) { bs = s; best = vid; }
  }
  return best;
}
function aiSetupRoad(pi, vid) {
  const opts = legalSetupRoads(vid);
  let best = opts[0], bs = -1;
  for (const eid of opts) {
    const e = S.B.edges[eid];
    const far = e.v[0] === vid ? e.v[1] : e.v[0];
    // 도로 끝에서 뻗어나갈 좋은 자리가 있는지
    let s = 0;
    for (const nid of S.B.vertices[far].adj) {
      const nv = S.B.vertices[nid];
      if (nv.b) continue;
      s = Math.max(s, vertexScore(pi, nid));
    }
    s += vertexScore(pi, far) * 0.35 + S.rnd() * 0.6;
    if (s > bs) { bs = s; best = eid; }
  }
  return best;
}

function aiRobberTarget(pi) {
  let best = null, bs = -1;
  const leader = S.players.reduce((a, b) => (publicVP(b) > publicVP(a) ? b : a), S.players[0]);
  for (const h of S.B.hexes) {
    if (h.id === S.robber || !h.res) continue;
    let own = false, s = 0;
    for (const vid of h.corners) {
      const v = S.B.vertices[vid];
      if (!v.b) continue;
      if (v.b.p === pi) { own = true; continue; }
      const mult = v.b.type === 'city' ? 2 : 1;
      let w = pips(h.number) * mult;
      if (v.b.p === leader.i) w *= 1.7;
      w *= 1 + publicVP(S.players[v.b.p]) * 0.08;
      if (handCount(S.players[v.b.p]) > 0) w += 1.2;
      s += w;
    }
    if (own) s -= 60;
    s += S.rnd() * 0.4;
    if (s > bs) { bs = s; best = h.id; }
  }
  return best === null ? (S.robber + 1) % S.B.hexes.length : best;
}
function aiPickVictim(list) {
  return list.reduce((a, b) => {
    const va = handCount(S.players[a]) + publicVP(S.players[a]) * 1.5;
    const vb = handCount(S.players[b]) + publicVP(S.players[b]) * 1.5;
    return vb > va ? b : a;
  }, list[0]);
}
function aiDiscard(p, n) {
  const need = aiNeed(p);
  for (let k = 0; k < n; k++) {
    let worst = null, ws = -1;
    for (const r of RES) {
      if (!p.res[r]) continue;
      const s = p.res[r] - need[r] * 3 + S.rnd() * 0.2;
      if (s > ws) { ws = s; worst = r; }
    }
    if (worst) { p.res[worst]--; S.bank[worst]++; }
  }
}

/* 사람이 제안한 교역을 AI가 평가 — offer.give = 사람이 주는 것, offer.get = AI가 내주는 것 */
function aiJudgeTrade(p, giveToAI, takeFromAI, from) {
  for (const r of RES) if ((takeFromAI[r] || 0) > p.res[r]) return { ok: false, why: '그 자원이 없습니다' };
  let gain = 0, loss = 0;
  for (const r of RES) {
    gain += (giveToAI[r] || 0) * aiValue(p, r);
    loss += (takeFromAI[r] || 0) * aiValue(p, r);
  }
  // 승점이 높은 상대는 잘 도와주지 않는다
  const human = from || S.players[0];
  const rival = publicVP(human) >= 7 ? 1.9 : publicVP(human) >= 5 ? 1.35 : 1.12;
  if (gain > loss * rival + 0.4) return { ok: true, why: '좋은 거래군요' };
  if (gain <= loss) return { ok: false, why: '손해입니다' };
  return { ok: false, why: '조금 부족하네요' };
}

/* AI가 은행/항구 교역으로 목표에 다가갈 수 있으면 실행 */
function aiBankTrade(p) {
  const need = aiNeed(p);
  const wanted = RES.filter(r => need[r] > 0);
  if (!wanted.length) return false;
  for (const want of wanted) {
    for (const r of RES) {
      if (r === want || need[r] > 0) continue;
      const rate = tradeRate(p, r);
      if (p.res[r] >= rate && S.bank[want] > 0) {
        p.res[r] -= rate; S.bank[r] += rate; p.res[want]++; S.bank[want]--;
        logMsg(`<b style="color:${p.hex}">${p.name}</b> ${rate}:1 교역 — ${RKO[r]}${rate} → ${RKO[want]}1`);
        return true;
      }
    }
  }
  return false;
}

/* 도로를 놓을 최적 위치 (새 정착지 자리를 여는 방향) */
function aiBestRoad(pi) {
  const opts = legalRoads(pi);
  if (!opts.length) return null;
  let best = null, bs = -1;
  for (const eid of opts) {
    const e = S.B.edges[eid];
    let s = 0;
    for (const vid of e.v) {
      const v = S.B.vertices[vid];
      if (vertexFree(v)) s = Math.max(s, vertexScore(pi, vid) * 1.0);
      for (const nid of v.adj) {
        const nv = S.B.vertices[nid];
        if (vertexFree(nv)) s = Math.max(s, vertexScore(pi, nid) * 0.62);
      }
    }
    s += S.rnd() * 0.5;
    if (s > bs) { bs = s; best = eid; }
  }
  return best;
}
function aiBestSettlement(pi) {
  const spots = legalSettlements(pi, false);
  if (!spots.length) return null;
  return spots.reduce((a, b) => (vertexScore(pi, b) > vertexScore(pi, a) ? b : a), spots[0]);
}
function aiBestCity(pi) {
  const spots = legalCities(pi);
  if (!spots.length) return null;
  const val = vid => S.B.vertices[vid].hexes.reduce((s, hid) => s + pips(S.B.hexes[hid].number), 0);
  return spots.reduce((a, b) => (val(b) > val(a) ? b : a), spots[0]);
}

/* 말 색 — 면마다 명암을 주려면 실제 값이 필요하다 */
const PIECE = [
  { top: '#e0675f', base: '#c8433d', side: '#93292a', dark: '#6a1c1e' },
  { top: '#5d9ee0', base: '#2f79c4', side: '#1d5089', dark: '#123657' },

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function tileRnd(id) {
  let s = (id * 9301 + 49297) % 233280;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
const f1 = n => n.toFixed(1);

/* ── 지형 일러스트 ───────────────────────────────────────── */
