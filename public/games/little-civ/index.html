<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/play/little-civ">
<script src="/mgh/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>나만의 문명 만들기 - 미니게임천국</title>
<meta name="description" content="작은 섬에 생명을 탄생시키고 숲·호수·산을 만들어 주면, 종족들이 스스로 원시 시대부터 미래 문명까지 발전해요. 신의 능력으로 문명을 돕는 신 시뮬레이션 게임.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233fa7d6'/%3E%3Cellipse cx='32' cy='38' rx='22' ry='14' fill='%23f2dc9b'/%3E%3Cellipse cx='32' cy='35' rx='17' ry='10' fill='%238fd16a'/%3E%3Ccircle cx='26' cy='28' r='7' fill='%233d8b3d'/%3E%3C/svg%3E">
<style>
:root{--ink:#2f2a45;--dim:#6f6886;--card:#fffaf0;--line:#eadfc8;--acc:#ff8a3d;--good:#3fb27f;--bad:#e5484d;--bg:#2a79b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none !important}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{background:rgba(255,250,240,.95);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
/* 위 */
#hudTop{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:3;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bar{display:flex;gap:6px;align-items:center;pointer-events:auto}
.mana{flex:1;min-width:0;height:44px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center}
.mana .l{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.mana .l span:last-child{color:var(--dim)}
.mbar{height:9px;border-radius:9px;background:#e9dcc5;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a98bff,#ffd36b);transition:width .3s}
.ibtn{min-width:44px;height:44px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
#tribes{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 2px;height:44px}
.chip span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip b{font-size:12.5px}.chip small{font-size:11px;color:var(--dim)}
.chip.warn{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:wob 1s infinite}
@keyframes wob{50%{transform:translateY(-2px)}}
/* 아래 */
#hudBot{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;gap:6px}
#hint{align-self:center;max-width:100%;padding:7px 12px;font-size:12.5px;font-weight:800;text-align:center;background:rgba(47,42,69,.9);color:#fff;border-radius:12px}
.dock{padding:6px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tab{flex:1;height:36px;border-radius:10px;background:#f1e6d1;font-weight:900;font-size:13.5px}
.tab.on{background:var(--ink);color:#fff}
#tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:66px;min-height:84px;border-radius:12px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;position:relative}
.tool b{font-size:12px;margin-top:1px}.tool small{font-size:11px;color:var(--dim);font-weight:700}
.tool.on{border-color:var(--acc);background:#fff0e3;transform:translateY(-3px)}
.tool.dis{opacity:.45}
.tool .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 3px #000}
.tool .cd:empty{display:none}
/* 시트 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:72vh;overflow:auto;background:var(--card);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -4px 0 rgba(0,0,0,.15);padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:up .22s}
@keyframes up{from{transform:translateY(40%);opacity:.3}}
.shead{display:flex;gap:10px;align-items:center}
.shead h2{margin:0;font-size:20px}.shead p{margin:2px 0;font-size:13px}
.shead .x{margin-left:auto;align-self:flex-start;width:44px;height:44px;font-size:20px;flex:none}
.dimt{color:var(--dim);font-size:12.5px;line-height:1.5}
#sheet h3,.pop h3{font-size:14.5px;margin:12px 0 6px}
.resg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.rs{display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 8px}
.rs span{display:flex;flex-direction:column;line-height:1.15}.rs b{font-size:15px}.rs small{font-size:11px;color:var(--dim)}
.rs.neg small{color:var(--bad);font-weight:800}
.techs{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.tech{display:grid;grid-template-columns:1fr auto;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 10px;min-height:44px}
.tech b{font-size:13.5px}.tech small{grid-column:1;font-size:11.5px;color:var(--dim)}.tech i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:800;font-size:12px}
.tech.cur{border-color:var(--acc);background:#fff3e8}.tech.got{opacity:.55}.tech.lock{opacity:.5}
.note{display:flex;flex-direction:column;gap:5px}
.nrow{display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;line-height:1.35}
.nrow.good{border-color:#bfe8d2}.nrow.bad{border-color:#f5c2c3}.nrow.era{border-color:#ffd88a;background:#fffaeb}
.nrow small{color:var(--dim);flex:none}
.bar2{flex:1;height:8px;border-radius:8px;background:#eadfc8;overflow:hidden}.bar2 i{display:block;height:100%;background:#7b6cff}
.buff{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:#fff6d6;border:2px solid #ffd65a;border-radius:10px;padding:6px 9px;animation:glow 1.6s infinite}
.buff b{font-weight:900}.buff span{margin-left:auto;font-weight:900;color:#a8740a;font-variant-numeric:tabular-nums}
.buff.bad{background:#ffecec;border-color:#f5a3a3;animation:none}.buff.bad span{color:var(--bad)}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,214,90,.35)}}
.rs em{font-style:normal;font-size:11px;font-weight:900;color:#a8740a}.rs em:empty{display:none}
.rs.spec b::after{content:' ★특산';font-size:10.5px;color:#e0761a;font-weight:900}
.rs.buffed{border-color:#ffd65a;background:#fffaf0}
.chip .bi{font-style:normal;font-size:12px}
.need{margin-top:6px;font-size:13px;font-weight:800;color:#b25b16;background:#fff1df;border-radius:10px;padding:7px 10px}
.jobs{display:flex;flex-wrap:wrap;gap:5px}.jobs span{font-size:12.5px;font-weight:800;background:#f1e6d1;border-radius:999px;padding:4px 9px}
/* 카드 */
.dim{position:fixed;inset:0;background:rgba(25,20,45,.55);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.pop{width:100%;max-width:380px;max-height:86vh;overflow:auto;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;text-align:center;animation:pin .25s}
@keyframes pin{from{transform:scale(.88);opacity:0}}
.pop h2{margin:4px 0;font-size:22px}.pop p{font-size:14px;line-height:1.55;margin:6px 0}
.pop .good{color:var(--good);font-weight:800}
.pop .nrow{text-align:left}
.pop .log{display:flex;flex-direction:column;gap:5px;max-height:38vh;overflow:auto}
.big{font-size:48px}
.meet{display:flex;align-items:center;justify-content:center;gap:6px}.meet b{font-size:30px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:10px;border-radius:14px;background:var(--acc);color:#fff;font-weight:900;font-size:16px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn small{font-size:11.5px;font-weight:700;opacity:.9}
.btn.w{background:#fff;color:var(--ink)}.btn.g{background:var(--good)}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;background:rgba(47,42,69,.94);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14.5px;z-index:20;transition:.2s;pointer-events:none;text-align:center;max-width:86vw}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* 튜토리얼 */
#tutHi{position:fixed;z-index:9;border:3px solid #ffd65a;border-radius:16px;pointer-events:none;box-shadow:0 0 0 4px rgba(255,214,90,.35);animation:hi 1s infinite}
@keyframes hi{50%{box-shadow:0 0 0 10px rgba(255,214,90,0)}}
#tut{position:fixed;left:10px;right:10px;z-index:11;max-width:420px;margin:0 auto;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;animation:pin .22s}
#tut p{margin:4px 0 8px;font-size:14px;line-height:1.55}#tut small{color:var(--dim);font-size:12px}
.tstep{font-size:11.5px;font-weight:900;color:var(--acc)}
.trow{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.tskip{min-height:44px;padding:0 10px;font-size:12.5px;font-weight:800;color:var(--dim)}
.tnext{min-height:44px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:900;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
/* 타이틀 */
#title{position:fixed;inset:0;z-index:12;background:#2a79b4 center top/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:24px 24px calc(36px + env(safe-area-inset-bottom))}
#title::before{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(20,40,70,.65))}
#title .box{position:relative;width:100%;max-width:360px;text-align:center}
#title h1{margin:0;font-size:34px;line-height:1.1;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(0,0,0,.35);letter-spacing:-1px}
#title h1 small{display:block;font-size:13px;letter-spacing:3px;margin-top:4px}
#title p{color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6);margin:10px 0 6px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;z-index:30;background:var(--bg)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hudTop" hidden>
  <div class="bar">
    <div class="panel mana"><div class="l"><span>✨ 신력 <b id="manaTxt"></b></span><span><span id="year"></span> · 🏆 <span id="score"></span></span></div><div class="mbar"><i id="manaFill"></i></div></div>
    <button class="panel ibtn" id="spd">▶ 1×</button><button class="panel ibtn" id="menuBtn" aria-label="메뉴">📜</button>
  </div>
  <div id="tribes"></div>
</div>
<div id="hudBot" hidden>
  <div id="hint" hidden></div>
  <div class="panel dock">
    <div class="tabs"><button class="tab" data-tab="life">🐣 생명</button><button class="tab" data-tab="terra">🌱 지형</button><button class="tab" data-tab="power">⚡ 신의 능력</button></div>
    <div id="tools"></div>
  </div>
</div>
<div id="sheet" hidden><div id="sheetIn"></div></div>
<div class="dim" id="cardDim" hidden><div class="pop" id="card"></div></div>
<div id="tutHi" hidden></div>
<div id="tut" hidden></div>
<div class="toast" id="toast"></div>
<div id="title" style="background-image:url(assets/title.webp)"><div class="box"><h1>나만의 문명 만들기<small>MY LITTLE CIVILIZATION</small></h1><p>작은 섬에 생명을 탄생시키고, 문명이 스스로 자라는 걸 지켜보세요</p><button class="btn" id="newBtn">시작하기</button><button class="btn w" id="contBtn" hidden>이어하기</button></div></div>
<div id="load">섬을 만드는 중…</div>
<script type="module" src="game.js"></script>
</body>
</html>
