<div id="game-container">
  <canvas id="gameCanvas" width="405" height="720"></canvas>

  <div id="hud">
    <div id="gold">💰 100</div>
    <div id="round">Round <b id="roundNum">1</b><br><span id="waveStatus">준비 중...</span></div>
  </div>
  <button id="probBtn">📊 확률표</button>
  <button id="saveLoadBtn">💾 세이브/로드</button>

  <div id="saveLoadPanel">
    <div id="saveLoadCard">
      <div class="tp-header">
        <span id="slTitle">세이브 / 로드</span>
        <button id="slClose">✕</button>
      </div>
      <div class="sl-section">
        <div class="sl-label" id="slSaveLabel">현재 상태 저장</div>
        <button id="slGenBtn">코드 생성하기</button>
        <div id="slCodeRow" style="display:none;">
          <input id="slCodeOutput" type="text" readonly>
          <button id="slCopyBtn">복사</button>
        </div>
      </div>
      <div class="sl-section">
        <div class="sl-label" id="slLoadLabel">코드로 불러오기</div>
        <div id="slLoadRow">
          <input id="slCodeInput" type="text" placeholder="세이브 코드 붙여넣기">
          <button id="slLoadBtn">불러오기</button>
        </div>
      </div>
      <div id="slStatus"></div>
    </div>
  </div>
  <div id="speedControl">
    <button class="speedBtn active" data-speed="1">1x</button>
    <button class="speedBtn" data-speed="2">2x</button>
    <button class="speedBtn" data-speed="4">4x</button>
  </div>
  <div id="hillhp-wrap"><div id="hillhp-fill"></div><span id="hillhp-text">life : 100</span></div>

  <div id="probPanel">
    <div id="probCard">
      <div class="tp-header">
        <span id="probTitle">등급별 뽑기 확률</span>
        <button id="probClose">✕</button>
      </div>
      <table id="probTable"><tbody></tbody></table>
      <div id="probFoot">뽑기 1회 비용: 10G</div>
    </div>
  </div>

  <div id="towerPanel">
    <div class="tp-header">
      <span id="tpTitle">타워 정보</span>
      <button id="tpClose">✕</button>
    </div>
    <div id="tpBody"></div>
    <button id="tpSellBtn">판매하기</button>
  </div>

  <div id="bottom-bar">
    <div id="bulk-sell-row">
      <button id="bulk_common" class="bulk-sell-btn">일반 판매(0)</button>
      <button id="bulk_rare" class="bulk-sell-btn">레어 판매(0)</button>
      <button id="bulk_ancient" class="bulk-sell-btn">고대 판매(0)</button>
      <button id="bulk_relic" class="bulk-sell-btn">유물 판매(0)</button>
    </div>
    <button id="placeBtn">🎲 랜덤 타워 뽑기 (10G)</button>
    <div id="status"></div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">GAME OVER</h1>
    <p id="overlayText">언덕이 함락되었습니다.</p>
    <button id="restartBtn">다시 시작</button>
  </div>
</div>

  };
  const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const LANG = browserLang.startsWith('ko') ? 'ko' : 'en';
  const S = STRINGS[LANG];

  // ---------- Config ----------
  const GRID_COLS = 4;
  const GRID_ROWS = 4;
  const TILE = 31;
  const GRID_PX_W = GRID_COLS * TILE;

  const HILL_CY = GRID_Y0 + GRID_PX_H/2;

  function tileRect(idx){
    const c = idx % GRID_COLS, r = Math.floor(idx / GRID_COLS);
    return { x: GRID_X0 + c*TILE, y: GRID_Y0 + r*TILE, w: TILE, h: TILE, row: r, col: c, scale: 1 };

  // ---------- Grade (gacha) system ----------
  const GRADES = [
    { key:'common',  name:'일반', color:'#b8b8c2', prob:0.50,    mult:1.0,  sell:3    },
    { key:'rare',    name:'레어', color:'#4fc3f7', prob:0.331,   mult:1.2,  sell:8    },

    { key:'heroic',  name:'영웅', color:'#ff8a65', prob:0.008,   mult:2.63,  sell:100  },
    { key:'legend',  name:'전설', color:'#ffd54f', prob:0.005,   mult:3.94,  sell:220  },

    { key:'primal',  name:'태초', color:'#ffffff', prob:0.00019, mult:13.29, sell:3000, rainbow:true, fullRange:true }
  ];
  const GRADE_BY_KEY = {};
  GRADES.forEach(g => GRADE_BY_KEY[g.key] = g);
  const BULK_SELL_GRADES = ['common','rare','ancient','relic'];

  function renderProbTable(){
    const total = GRADES.reduce((s,g)=>s+g.prob, 0);
    probTableBodyEl.innerHTML = GRADES.map(g => {
      const pct = (g.prob/total*100);
      const pctStr = pct >= 1 ? pct.toFixed(1) : pct.toFixed(3);
      return `<tr>
        <td><span class="prob-swatch" style="background:${g.color}"></span></td>
        <td>${S.gradeName[g.key]}</td>
        <td>${pctStr}%</td>
      </tr>`;
    }).join('');
  }

  function toggleProbPanel(){
    if (probPanelEl.classList.contains('visible')){
      probPanelEl.classList.remove('visible');

      renderProbTable();
      probPanelEl.classList.add('visible');

  function toggleSaveLoadPanel(){
    if (saveLoadPanelEl.classList.contains('visible')){

      slCodeRowEl.style.display = 'none';
      slCodeInputEl.value = '';

  function rollGrade(){
    const total = GRADES.reduce((s,g)=>s+g.prob, 0);
    let r = Math.random() * total;
    for (const g of GRADES){
      if (r < g.prob) return g;
      r -= g.prob;
    }
    return GRADES[0];
  }

  function sellPriceForGrade(gradeKey){
    const g = GRADE_BY_KEY[gradeKey];
    return g ? g.sell : 0;
  }

  function tileCenter(idx){
    const rect = tileRect(idx);
    return { x: rect.x + rect.w/2, y: rect.y + rect.h/2 };
  }

  const FULL_SCREEN_RANGE = Math.hypot(W, H) * 1.2; // covers the entire screen regardless of tower position
  function rangeForGrade(mult, gradeKey){
    const g = gradeKey ? GRADE_BY_KEY[gradeKey] : null;
    if (g && g.fullRange) return FULL_SCREEN_RANGE;
    return (TILE * 2.2) + (Math.sqrt(mult)-1) * (TILE * 2.2);
  }
  function cooldownForElement(el, mult){
    const base = { fire: 1.05, lightning: 0.85, water: 1.15, poison: 1.3 }[el];
    return Math.max(0.28, base / (1 + (mult-1)*0.55));
  }

  // ---------- Tower placement (gacha draw) ----------
  function emptySlots(){
    const out = [];
    towers.forEach((t,i)=>{ if(!t) out.push(i); });
    return out;
  }

  function placeTower(){
    if (gameOver) return;
    if (gold < 10) { flashStatus(S.goldShort); return; }
    const empties = emptySlots();
    if (empties.length === 0) { flashStatus(S.noSpace); return; }
    gold -= 10;
    const slot = empties[Math.floor(Math.random()*empties.length)];
    const element = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
    const grade = rollGrade();
    towers[slot] = { element, grade: grade.key, cooldown: 0, flash: 0.4 };
    if (grade.mult >= 2.1){
      effects.push({ type:'rareFlash', color: grade.color, life: 0.5, maxLife: 0.5 });
      flashStatus(S.rareGet(S.gradeName[grade.key]));
    }
    updateHUD();
    refreshBulkSellUI();
  }

  function sellAllOfGrade(gradeKey){
    let count = 0;
    towers.forEach((t, idx) => {
      if (t && t.grade === gradeKey){
        count++;
        towers[idx] = null;
      }
    });
    if (count === 0) return;
    const total = count * sellPriceForGrade(gradeKey);
    gold += total;
    if (selectedTowerIdx !== null && !towers[selectedTowerIdx]) closeTowerPanel();
    updateHUD();
    refreshBulkSellUI();
    flashStatus(S.bulkSellDone(S.gradeName[gradeKey], count, total));
  }

  function refreshBulkSellUI(){
    BULK_SELL_GRADES.forEach(key => {
      const btn = document.getElementById('bulk_' + key);
      if (!btn) return;
      const count = towers.filter(t => t && t.grade === key).length;
      btn.textContent = S.bulkSellLabel(S.gradeName[key], count);
      btn.disabled = count === 0;
    });
  }

  // ---------- Save / Load (self-contained code, no server needed) ----------
  const ELEMENT_CODE = { fire:'f', lightning:'l', water:'w', poison:'p' };
  const CODE_TO_ELEMENT = { f:'fire', l:'lightning', w:'water', p:'poison' };
  const GRADE_ORDER = GRADES.map(g => g.key); // index 0-8, matches array order

  function encodeSaveCode(){
    const towerStr = towers.map(t => {
      if (!t) return '--';
      const gi = GRADE_ORDER.indexOf(t.grade);
      return ELEMENT_CODE[t.element] + gi.toString(36);
    }).join('');
    const raw = [
      round,
      Math.round(gold),
      Math.round(hillHP),
      towerStr
    ].join(',');
    try {
      return btoa(unescape(encodeURIComponent(raw)));
    } catch (e) {
      return null;
    }
  }

  function decodeSaveCode(code){
    try {
      const raw = decodeURIComponent(escape(atob(code.trim())));
      const parts = raw.split(',');
      if (parts.length !== 4) return null;
      const r = parseInt(parts[0], 10);
      const g = parseInt(parts[1], 10);
      const hp = parseInt(parts[2], 10);
      const towerStr = parts[3];
      if (isNaN(r) || isNaN(g) || isNaN(hp)) return null;
      if (towerStr.length !== GRID_COLS*GRID_ROWS*2) return null;
      const newTowers = [];
      for (let i=0; i<towerStr.length; i+=2){
        const pair = towerStr.slice(i, i+2);
        if (pair === '--'){ newTowers.push(null); continue; }
        const el = CODE_TO_ELEMENT[pair[0]];
        const gi = parseInt(pair[1], 36);
        const gradeKey = GRADE_ORDER[gi];
        if (!el || !gradeKey) return null;
        newTowers.push({ element: el, grade: gradeKey, cooldown: 0, flash: 0 });
      }
      return { round: r, gold: g, hillHP: hp, towers: newTowers };
    } catch (e) {
      return null;
    }
  }

  function applyLoadedState(state){
    round = state.round - 1; // startRound() below increments by 1
    gold = state.gold;
    hillHP = Math.min(hillMaxHP, state.hillHP);
    towers = state.towers;
    monsters = [];
    effects = [];
    spawnQueue = [];
    gameOver = false;
    closeTowerPanel();
    overlayEl.style.display = 'none';

  function flashStatus(msg){

  // ---------- Tower info panel ----------
  function getTowerCombatInfo(tower){
    const g = GRADE_BY_KEY[tower.grade];
    const mult = g.mult;
    const range = rangeForGrade(mult, tower.grade);
    const cooldown = cooldownForElement(tower.element, mult);
    const info = { range, cooldown };
    if (tower.element === 'fire'){
      info.damage = Math.round(16 * mult);
      info.extra = null;
    } else if (tower.element === 'lightning'){
      const chainCount = 2 + Math.floor((mult-1)*2);
      info.damage = Math.round(9 * mult);
      info.extra = S.chainDesc(chainCount);
    } else if (tower.element === 'water'){
      info.damage = Math.round(6 * mult);
      const slowDur = (1.5 + (mult-1)*0.25).toFixed(1);
      info.extra = S.slowDesc(slowDur);
    } else if (tower.element === 'poison'){
      info.damage = S.dpsUnit((3 * mult).toFixed(1));
      info.extra = S.poisonDesc(Math.round(34 + (mult-1)*18), (2.4+(mult-1)*0.6).toFixed(1));
    }
    return info;
  }

  function openTowerPanel(idx){
    selectedTowerIdx = idx;

  function refreshTowerPanel(){
    if (selectedTowerIdx === null) return;
    const tower = towers[selectedTowerIdx];
    if (!tower){ closeTowerPanel(); return; }
    const g = GRADE_BY_KEY[tower.grade];

      <div class="stat-row"><span class="stat-label">${S.statRange}</span><span>${rangeText}</span></div>
      <div class="stat-row"><span class="stat-label">${S.statSpeed}</span><span>${S.perSec((1/info.cooldown).toFixed(2))}</span></div>
      ${info.extra ? `<div class="stat-row"><span class="stat-label">${S.statExtra}</span><span>${info.extra}</span></div>` : ''}
      <div class="desc">${S.elementDesc[tower.element]}</div>
    `;
    const price = sellPriceForGrade(tower.grade);
    tpSellBtnEl.textContent = S.sellBtn(price);

  function sellSelectedTower(){
    if (selectedTowerIdx === null) return;
    const tower = towers[selectedTowerIdx];
    if (!tower) return;
    const price = sellPriceForGrade(tower.grade);
    gold += price;
    towers[selectedTowerIdx] = null;
    closeTowerPanel();
    updateHUD();
    refreshBulkSellUI();
    flashStatus(S.sellDone(price));
  }

  function tileIndexAtPoint(px, py){
    if (px < GRID_X0 || px > GRID_X1 || py < GRID_Y0 || py > GRID_Y1) return -1;
    const c = Math.floor((px - GRID_X0) / TILE);
    const r = Math.floor((py - GRID_Y0) / TILE);
    if (c<0||c>=GRID_COLS||r<0||r>=GRID_ROWS) return -1;
    return r*GRID_COLS + c;
  }

  // ---------- Monster spawning ----------
  function poolForRound(rnd){
    let pool = [...TIER1_POOL];
    if (rnd >= 6) pool = pool.concat(TIER2_POOL);
    if (rnd >= 13) pool = pool.concat(TIER3_POOL);
    return pool;
  }

  function spawnPointForEdge(){
    const edge = Math.floor(Math.random()*4);
    const pad = 20;
    if (edge === 0) return { x: Math.random()*W, y: -pad };
    if (edge === 1) return { x: Math.random()*W, y: H+pad };
    if (edge === 2) return { x: -pad, y: Math.random()*H };
    return { x: W+pad, y: Math.random()*H };
  }

  function makeMonster(spriteKey, hp, speed, isBoss){
    const sp = spawnPointForEdge();
    const dx = HILL_CX - sp.x, dy = HILL_CY - sp.y;
    const dist = Math.hypot(dx,dy) || 1;
    return {
      id: monsterIdSeed++,
      x: sp.x, y: sp.y,
      dirX: dx/dist, dirY: dy/dist,
      hp, maxHp: hp,
      speed,
      sprite: spriteKey,
      size: isBoss ? 46 : 30,
      dot: null, // {dps, timeLeft}
      slow: null // {mult, timeLeft}
    };
  }

  function startRound(){
    round += 1;
    roundTimeLeft = ROUND_DURATION;
    roundNumEl.textContent = round;

    const hpScale = 1 + (round-1)*0.16;
    const speedScale = Math.min(1.6, 1 + (round-1)*0.025);
    const baseSpeed = 17;

    const count = 5 + Math.floor(round*1.4);
    const pool = poolForRound(round);

    for (let i=0;i<count;i++){
      const key = pool[Math.floor(Math.random()*pool.length)];
      spawnQueue.push({ key, hp: Math.round(18*hpScale), speed: baseSpeed*speedScale, boss:false });
    }
    if (round % 5 === 0){
      const bkey = BOSS_POOL[Math.floor(Math.random()*BOSS_POOL.length)];
      spawnQueue.push({ key: bkey, hp: Math.round(220*hpScale), speed: baseSpeed*speedScale*0.75, boss:true });
    }
    spawnTimer = 0;
  }

  // ---------- Combat ----------
  function applyDamage(monster, dmg, element){
    let mult = 1;
    const resist = MONSTER_RESIST[monster.sprite];
    if (resist && (element in resist)) mult = resist[element];
    monster.hp -= dmg * mult;
  }

  function generateZigzag(x1,y1,x2,y2, segments, jitter){
    const pts = [{x:x1,y:y1}];
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    for (let i=1;i<segments;i++){
      const t = i/segments;
      const bx = x1 + dx*t, by = y1 + dy*t;
      const off = (Math.random()-0.5) * 2 * jitter;
      pts.push({ x: bx + nx*off, y: by + ny*off });
    }
    pts.push({x:x2,y:y2});
    return pts;
  }

  function makePoisonBubbles(radius){
    const count = 7 + Math.floor(radius/12);
    const bubbles = [];
    for (let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const dist = Math.random()*radius*0.85;
      bubbles.push({
        ox: Math.cos(ang)*dist,
        oy: Math.sin(ang)*dist,
        phase: Math.random()*Math.PI*2,
        speed: 0.6 + Math.random()*0.8,
        size: 2 + Math.random()*3
      });
    }
    return bubbles;
  }

  function attackWithTower(tower, tileIdx){
    const pos = tileCenter(tileIdx);
    const g = GRADE_BY_KEY[tower.grade];
    const mult = g.mult;
    const range = rangeForGrade(mult, tower.grade);
    let nearest = null, nearestDist = Infinity;
    for (const m of monsters){
      const d = Math.hypot(m.x-pos.x, m.y-pos.y);
      if (d <= range && d < nearestDist){ nearest = m; nearestDist = d; }
    }
    if (!nearest) return;

    tower.flash = 0.15;

    if (tower.element === 'fire'){
      const dmg = 16 * mult;
      applyDamage(nearest, dmg, 'fire');
      const dist = Math.hypot(nearest.x-pos.x, nearest.y-pos.y);
      const travelTime = Math.min(0.45, Math.max(0.12, dist/420));
      effects.push({
        type:'fireball', x1:pos.x, y1:pos.y, x2:nearest.x, y2:nearest.y,
        life: travelTime, maxLife: travelTime, color: ELEMENT_COLOR.fire
      });
    } else if (tower.element === 'lightning'){
      const chainCount = 2 + Math.floor((mult-1)*2);
      const chainRadius = 90;
      let dmg = 9 * mult;
      let current = nearest;
      let hit = new Set([current.id]);
      let prevPos = pos;
      for (let c=0; c<chainCount; c++){
        applyDamage(current, dmg, 'lightning');
        const segs = 5 + Math.floor(Math.hypot(current.x-prevPos.x, current.y-prevPos.y)/28);
        effects.push({
          type:'lightning',
          points: generateZigzag(prevPos.x, prevPos.y, current.x, current.y, segs, 9),
          life:0.18, maxLife:0.18, color: ELEMENT_COLOR.lightning
        });
        prevPos = {x: current.x, y: current.y};
        dmg *= 0.72;
        let next = null, nd = Infinity;
        for (const m of monsters){
          if (hit.has(m.id)) continue;
          const d = Math.hypot(m.x-current.x, m.y-current.y);
          if (d <= chainRadius && d < nd){ next = m; nd = d; }
        }
        if (!next) break;
        hit.add(next.id);
        current = next;
      }
    } else if (tower.element === 'water'){
      const dmg = 6 * mult;
      applyDamage(nearest, dmg, 'water');
      const resist = MONSTER_RESIST[nearest.sprite];
      const immune = resist && resist.slowImmune === true;
      if (!immune){
        const slowDuration = 1.5 + (mult-1)*0.25;
        if (!nearest.slow || nearest.slow.timeLeft < slowDuration){
          nearest.slow = { mult: 0.5, timeLeft: slowDuration };
        }
      }
      const waveDur = 0.32;
      effects.push({
        type:'wave', x1:pos.x, y1:pos.y, x2:nearest.x, y2:nearest.y,
        life: waveDur, maxLife: waveDur, color: ELEMENT_COLOR.water
      });
    } else if (tower.element === 'poison'){
      const radius = 34 + (mult-1)*18;
      const dps = 3 * mult;
      const duration = 2.4 + (mult-1)*0.6;
      effects.push({
        type:'poisoncloud', x:nearest.x, y:nearest.y, r:radius, life:duration, maxLife: duration, dps,
        bubbles: makePoisonBubbles(radius)
      });
    }
  }

  // ---------- Update ----------
  let lastTime = performance.now();
  function update(dt){
    if (gameOver) return;

    // spawn queue
    if (spawnQueue.length > 0){
      spawnTimer -= dt;
      if (spawnTimer <= 0){
        const s = spawnQueue.shift();
        monsters.push(makeMonster(s.key, s.hp, s.speed, s.boss));
        spawnTimer = 0.55;
      }
    }

    // monster movement & hill collision
    for (let i=monsters.length-1; i>=0; i--){
      const m = monsters[i];
      if (m.dot){
        m.hp -= m.dot.dps * dt;
        m.dot.timeLeft -= dt;
        if (m.dot.timeLeft <= 0) m.dot = null;
      }
      if (m.hp <= 0){
        monsters.splice(i,1);
        gold += 5;
        continue;
      }
      let effSpeed = m.speed;
      if (m.slow){
        effSpeed *= m.slow.mult;
        m.slow.timeLeft -= dt;
        if (m.slow.timeLeft <= 0) m.slow = null;
      }
      m.x += m.dirX * effSpeed * dt;
      m.y += m.dirY * effSpeed * dt;
      const pad = 8;
      if (m.x >= GRID_X0-pad && m.x <= GRID_X1+pad && m.y >= GRID_Y0-pad && m.y <= GRID_Y1+pad){
        hillHP = Math.max(0, hillHP - 1);
        monsters.splice(i,1);
        if (hillHP <= 0){ triggerGameOver(); }
      }
    }

    // poison clouds apply damage over time
    for (const e of effects){
      if (e.type === 'poisoncloud'){
        for (const m of monsters){
          const d = Math.hypot(m.x-e.x, m.y-e.y);
          if (d <= e.r){
            if (!m.dot || m.dot.dps < e.dps) m.dot = { dps: e.dps, timeLeft: 0.35 };
          }
        }
      }
    }

    // towers attack
    towers.forEach((t, idx) => {
      if (!t) return;
      t.cooldown -= dt;
      if (t.flash > 0) t.flash -= dt;
      if (t.cooldown <= 0){
        attackWithTower(t, idx);
        t.cooldown = cooldownForElement(t.element, GRADE_BY_KEY[t.grade].mult);
      }
    });

    // effects lifetime
    for (let i=effects.length-1;i>=0;i--){
      const e = effects[i];
      e.life -= dt;
      if (e.type === 'poisoncloud' && e.bubbles){
        for (const b of e.bubbles) b.phase += dt * b.speed * 3;
      }
      if (e.life <= 0) effects.splice(i,1);
    }

    // round timer countdown
    roundTimeLeft -= dt;
    if (roundTimeLeft <= 0){
      gold += 15;
      startRound();
    }
    const secLeft = Math.max(0, Math.ceil(roundTimeLeft));
    waveStatusEl.textContent = S.nextRoundStatus(secLeft);

    updateHUD();
    if (selectedTowerIdx !== null) refreshTowerPanel();
  }

  function triggerGameOver(){
    gameOver = true;
    closeTowerPanel();
    overlayTextEl.textContent = S.gameOverText(round);
    overlayEl.style.display = 'flex';
  }

  function updateHUD(){
    goldEl.textContent = '💰 ' + gold;
    hillFillEl.style.width = Math.max(0,(hillHP/hillMaxHP*100)) + '%';
    hillTextEl.textContent = S.lifeLabel + ' : ' + Math.round(hillHP);
    if (hillHP < 35) hillFillEl.style.background = 'linear-gradient(90deg, #ff6b5b, #b03030)';
    else if (hillHP < 65) hillFillEl.style.background = 'linear-gradient(90deg, #ffd15b, #c98a1a)';
    else hillFillEl.style.background = 'linear-gradient(90deg, #6bd46b, #3fae3f)';
    placeBtn.disabled = gold < 10;
  }

  // ---------- Render ----------
  function drawBackground(){
    const g = ctx.createRadialGradient(HILL_CX, HILL_CY, 40, HILL_CX, HILL_CY, 420);
    g.addColorStop(0, '#232430');
    g.addColorStop(1, '#101018');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawGrid(){
    for (let r=0;r<GRID_ROWS;r++){
      for (let c=0;c<GRID_COLS;c++){
        const x = GRID_X0 + c*TILE, y = GRID_Y0 + r*TILE;
        ctx.fillStyle = ((r+c)%2===0) ? '#3a3a46' : '#33333e';
        ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.strokeRect(x,y,TILE,TILE);
      }
    }
    ctx.strokeStyle = '#ffbb55';
    ctx.lineWidth = 2;
    ctx.strokeRect(GRID_X0-2, GRID_Y0-2, GRID_PX_W+4, GRID_PX_H+4);
    ctx.lineWidth = 1;

    if (selectedTowerIdx !== null && towers[selectedTowerIdx]){
      const rect = tileRect(selectedTowerIdx);
      ctx.strokeStyle = '#fff77a';
      ctx.lineWidth = 3;
      ctx.strokeRect(rect.x+1.5, rect.y+1.5, rect.w-3, rect.h-3);
      ctx.lineWidth = 1;
    }
  }

  function drawTowers(){
    towers.forEach((t, idx) => {
      if (!t) return;
      const g = GRADE_BY_KEY[t.grade];
      const pos = tileCenter(idx);
      const size = TILE*0.82;
      if (t.flash > 0){
        ctx.save();
        ctx.globalAlpha = Math.min(0.5, t.flash);
        ctx.fillStyle = t.flash > 0.3 ? g.color : ELEMENT_COLOR[t.element];
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, TILE*0.46, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      // grade-colored ring under the sprite
      ctx.save();
      if (g.rainbow){
        const hue = (performance.now()/8) % 360;
        ctx.strokeStyle = `hsl(${hue}, 90%, 65%)`;
      } else {
        ctx.strokeStyle = g.color;
      }
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size*0.52, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
      const img = ASSET_IMAGES['tower_'+t.element];
      if (img && img.complete){
        ctx.drawImage(img, pos.x-size/2, pos.y-size/2, size, size);
      }
      // grade badge (colored circle + first character of grade name)
      ctx.fillStyle = g.color;
      ctx.beginPath();
      ctx.arc(pos.x+size*0.34, pos.y-size*0.34, 11, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#0d0d12';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(S.gradeBadge[g.key], pos.x+size*0.34, pos.y-size*0.34+1);
    });
  }

  function drawMonsters(){
    for (const m of monsters){
      if (m.slow){
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = ELEMENT_COLOR.water;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.size/2+3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      const img = ASSET_IMAGES['monster_'+m.sprite];
      if (img && img.complete){
        ctx.drawImage(img, m.x-m.size/2, m.y-m.size/2, m.size, m.size);
      } else {
        ctx.fillStyle = '#c44';
        ctx.beginPath(); ctx.arc(m.x, m.y, m.size/2, 0, Math.PI*2); ctx.fill();
      }
      // hp bar
      const barW = m.size;
      const pct = Math.max(0, m.hp/m.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(m.x-barW/2, m.y-m.size/2-8, barW, 4);
      ctx.fillStyle = pct > 0.4 ? '#5bd45b' : '#e04c4c';
      ctx.fillRect(m.x-barW/2, m.y-m.size/2-8, barW*pct, 4);
      if (m.dot){
        ctx.fillStyle = 'rgba(125,217,87,0.9)';
        ctx.beginPath(); ctx.arc(m.x+m.size/2-4, m.y-m.size/2+2, 3, 0, Math.PI*2); ctx.fill();
      }
      if (m.slow){
        ctx.fillStyle = 'rgba(78,195,255,0.9)';
        ctx.beginPath(); ctx.arc(m.x-m.size/2+4, m.y-m.size/2+2, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  function drawEffects(){
    for (const e of effects){
      if (e.type === 'rareFlash'){
        ctx.save();
        ctx.globalAlpha = Math.max(0, (e.life/e.maxLife)) * 0.35;
        const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
        grad.addColorStop(0, e.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,W,H);
        ctx.restore();
        continue;
      }
      if (e.type === 'fireball'){
        const p = 1 - (e.life / e.maxLife); // 0 -> 1
        const cx = e.x1 + (e.x2-e.x1)*p;
        const cy = e.y1 + (e.y2-e.y1)*p;
        // trail
        for (let k=1;k<=3;k++){
          const tp = Math.max(0, p - k*0.09);
          const tx = e.x1 + (e.x2-e.x1)*tp;
          const ty = e.y1 + (e.y2-e.y1)*tp;
          ctx.save();
          ctx.globalAlpha = 0.25 * (1-k/4);
          ctx.fillStyle = '#ff8a3d';
          ctx.beginPath();
          ctx.arc(tx, ty, 5 - k, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
        // glowing orb
        ctx.save();
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 9);
        grad.addColorStop(0, '#fff6d0');
        grad.addColorStop(0.4, '#ffb84d');
        grad.addColorStop(1, 'rgba(255,91,61,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      } else if (e.type === 'lightning'){
        ctx.save();
        ctx.globalAlpha = Math.max(0, e.life/e.maxLife);
        // outer glow pass
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 5;
        ctx.globalAlpha *= 0.25;
        ctx.beginPath();
        e.points.forEach((pt,i)=> i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
        ctx.stroke();
        // core bright pass
        ctx.globalAlpha = Math.max(0, e.life/e.maxLife);
        ctx.strokeStyle = '#fffbe0';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        e.points.forEach((pt,i)=> i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'wave'){
        const p = 1 - (e.life / e.maxLife);
        const dx = e.x2-e.x1, dy = e.y2-e.y1;
        const dist = Math.hypot(dx,dy) || 1;
        const dirx = dx/dist, diry = dy/dist;
        const nx = -diry, ny = dirx;
        const cx = e.x1 + dx*p, cy = e.y1 + dy*p;
        const halfW = TILE*0.42;
        ctx.save();
        ctx.globalAlpha = Math.max(0, e.life/e.maxLife) * 0.85;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        // curved wave crest perpendicular to travel direction
        const bow = 6;
        ctx.moveTo(cx - nx*halfW - dirx*bow, cy - ny*halfW - diry*bow);
        ctx.quadraticCurveTo(cx + dirx*bow*1.5, cy + diry*bow*1.5, cx + nx*halfW - dirx*bow, cy + ny*halfW - diry*bow);
        ctx.stroke();
        // trailing foam line
        ctx.globalAlpha *= 0.4;
        ctx.lineWidth = 2;
        const tp = Math.max(0, p-0.18);
        const tcx = e.x1 + dx*tp, tcy = e.y1 + dy*tp;
        ctx.beginPath();
        ctx.moveTo(tcx - nx*halfW*0.8, tcy - ny*halfW*0.8);
        ctx.lineTo(tcx + nx*halfW*0.8, tcy + ny*halfW*0.8);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'poisoncloud'){
        ctx.save();
        const fadeIn = Math.min(1, (e.maxLife - e.life) / 0.2);
        ctx.globalAlpha = 0.20 * fadeIn;
        ctx.fillStyle = ELEMENT_COLOR.poison;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        if (e.bubbles){
          for (const b of e.bubbles){
            const rise = ((Math.sin(b.phase) + 1) / 2); // 0..1
            const by = e.y + b.oy - rise*10;
            const bx = e.x + b.ox;
            const alpha = 0.35 + rise*0.35;
            ctx.save();
            ctx.globalAlpha = alpha * fadeIn;
            ctx.fillStyle = '#a8f27a';
            ctx.beginPath();
            ctx.arc(bx, by, b.size * (0.7 + rise*0.5), 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
          }
        }
      }
    }
  }

  function drawSelectedRange(){
    if (selectedTowerIdx === null) return;
    const tower = towers[selectedTowerIdx];
    if (!tower) return;
    const g = GRADE_BY_KEY[tower.grade];
    const range = rangeForGrade(g.mult, tower.grade);
    const pos = tileCenter(selectedTowerIdx);
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, range, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ffffff';
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, range, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function render(){
    drawBackground();
    drawGrid();
    drawSelectedRange();
    drawEffects();
    drawTowers();
    drawMonsters();
  }

  function loop(now){
    const rawDt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;
    const dt = Math.min(0.15, rawDt * gameSpeed);
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  placeBtn.addEventListener('click', placeTower);
  tpCloseEl.addEventListener('click', closeTowerPanel);
  probBtnEl.addEventListener('click', toggleProbPanel);
  probCloseEl.addEventListener('click', toggleProbPanel);
  probPanelEl.addEventListener('click', (ev) => {
    if (ev.target === probPanelEl) toggleProbPanel();
  });
  document.querySelectorAll('.speedBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      gameSpeed = parseInt(btn.dataset.speed, 10);
      document.querySelectorAll('.speedBtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  saveLoadBtnEl.addEventListener('click', toggleSaveLoadPanel);
  slCloseEl.addEventListener('click', toggleSaveLoadPanel);
  saveLoadPanelEl.addEventListener('click', (ev) => {
    if (ev.target === saveLoadPanelEl) toggleSaveLoadPanel();
  });
  slGenBtnEl.addEventListener('click', () => {
    const code = encodeSaveCode();
    if (!code){
      slStatusEl.textContent = S.slGenFail;
      return;
    }
    slCodeOutputEl.value = code;
    slCodeRowEl.style.display = 'flex';
    slStatusEl.textContent = S.slSaveHint;
  });
  slCopyBtnEl.addEventListener('click', () => {
    slCodeOutputEl.select();
    slCodeOutputEl.setSelectionRange(0, 99999);
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(slCodeOutputEl.value);
        copied = true;
      } else {
        copied = document.execCommand('copy');
      }
    } catch (e){ copied = false; }
    slStatusEl.textContent = copied ? S.slCopied : S.slCopyFail;
  });
  slLoadBtnEl.addEventListener('click', () => {
    const code = slCodeInputEl.value;
    if (!code || !code.trim()){
      slStatusEl.textContent = S.slEnterCode;
      return;
    }
    const state = decodeSaveCode(code);
    if (!state){
      slStatusEl.textContent = S.slInvalidCode;
      return;
    }
    applyLoadedState(state);
    slStatusEl.textContent = S.slLoadDone;
    setTimeout(() => { toggleSaveLoadPanel(); }, 700);
  });
  tpSellBtnEl.addEventListener('click', sellSelectedTower);
  BULK_SELL_GRADES.forEach(key => {
    const btn = document.getElementById('bulk_' + key);
    if (btn) btn.addEventListener('click', () => sellAllOfGrade(key));
  });

  canvas.addEventListener('click', (ev) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (ev.clientX - rect.left) * scaleX;
    const py = (ev.clientY - rect.top) * scaleY;
    const idx = tileIndexAtPoint(px, py);
    if (idx >= 0 && towers[idx]){
      openTowerPanel(idx);
    } else {
      closeTowerPanel();
    }
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    gold = 100; hillHP = 100; round = 0;
    towers = new Array(GRID_COLS*GRID_ROWS).fill(null);
    monsters = []; effects = []; spawnQueue = [];
    gameOver = false;
    closeTowerPanel();
    overlayEl.style.display = 'none';
    startRound();
    updateHUD();
    refreshBulkSellUI();
  });

  // ---------- Init ----------
  applyStaticTexts();
  startRound();
  updateHUD();
  refreshBulkSellUI();
  requestAnimationFrame(loop);
})();
</script>
