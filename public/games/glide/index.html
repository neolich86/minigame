<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/play/glide">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>윈드 러너 - 미니게임천국</title>
<meta name="description" content="점프대에서 뛰어내려 글라이더로 하늘을 날아요. 링을 통과해 다시 솟구치고, 코인으로 날개를 강화해 10km 너머 하늘 섬까지!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2364b5f0'/%3E%3Cpath d='M6 30q26-22 52 0q-26-8-52 0z' fill='%23f3dca8' stroke='%237a4a22' stroke-width='3'/%3E%3Ccircle cx='32' cy='42' r='6' fill='%237a4a22'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1477ee;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.sh{text-shadow:0 2px 0 #3a1a00,0 0 6px rgba(0,0,0,.45)}
.hud{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;pointer-events:none;z-index:3}
.pill{background:rgba(40,20,8,.55);border:2px solid rgba(255,220,150,.7);border-radius:14px;padding:5px 11px;font-weight:900;text-align:center;min-width:64px}
.pill small{display:block;font-size:11px;font-weight:700;opacity:.85}
#dist{font-size:26px;padding:6px 14px}
#prog{position:fixed;left:16px;right:16px;top:calc(70px + env(safe-area-inset-top));height:8px;border-radius:5px;background:rgba(0,0,0,.35);pointer-events:none;z-index:3}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#ffd34a,#fff3a0)}
#prog b{position:absolute;top:-3px;width:3px;height:14px;background:#fff;border-radius:2px}
#prog em{position:absolute;top:10px;transform:translateX(-50%);font-size:11px;font-style:normal;font-weight:800;white-space:nowrap}
#prog u{position:absolute;top:-6px;width:12px;height:20px;margin-left:-6px;text-decoration:none;font-size:14px;line-height:20px}
.bar{position:fixed;left:12px;right:96px;bottom:calc(18px + env(safe-area-inset-bottom));pointer-events:none;z-index:3}
.bar .t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px}
.bar .b{height:12px;border-radius:7px;background:rgba(0,0,0,.4);border:2px solid #ffe6a6;overflow:hidden}
.bar .b i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#4fd1ff,#9cf3ff)}
.bar .b.boost i{background:linear-gradient(90deg,#ffd34a,#fff3a0)}
#rocket{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:3px solid #6b3a06;background:radial-gradient(#ffb347,#e2582a);box-shadow:0 4px 0 #6b3a06;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:4;touch-action:none}
#rocket[hidden]{display:none}
#rocket i{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#ffe066 var(--f,100%),rgba(0,0,0,.35) 0);-webkit-mask:radial-gradient(transparent 38px,#000 39px);mask:radial-gradient(transparent 38px,#000 39px)}
#rocket.on{transform:scale(.94);filter:brightness(1.2)}
#rocket.empty{filter:grayscale(1) brightness(.7)}
#hint{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:14px;pointer-events:none;white-space:nowrap;transition:opacity .5s;text-align:center;line-height:1.6;z-index:3}
#stall{position:fixed;left:50%;top:27%;transform:translateX(-50%);color:#ff6a4a;font-weight:900;font-size:20px;opacity:0;z-index:3;pointer-events:none}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,0);font-weight:900;font-size:26px;opacity:0;transition:opacity .6s;pointer-events:none;z-index:3;text-align:center}
#banner small{display:block;font-size:13px}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(0,0,0,.12);pointer-events:none;display:none;z-index:3}
#joy b{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.75)}
#ringAim{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #ffd34a;border-radius:50%;pointer-events:none;display:none;box-shadow:0 0 10px #ffd34a;z-index:3}
#pop{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:900;font-size:22px;color:#ffe066;pointer-events:none;opacity:0;z-index:3}
#pop.go{animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
/* 화면들 */
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));background:rgba(15,10,30,.45);z-index:10}
.scr.on{display:flex}
#sTitle{justify-content:space-between;background:linear-gradient(rgba(10,30,70,.2),rgba(10,30,70,0) 30%,rgba(20,10,4,0) 55%,rgba(20,10,4,.75)),url(assets/title.webp) center/cover #1477ee}
#sTitle h1{font-size:44px;font-weight:900;color:#fff7d6;text-shadow:0 4px 0 #7a3a10,0 0 18px rgba(0,0,0,.4);margin-top:30px;text-align:center;line-height:1.1}
#sTitle h1 small{display:block;font-size:15px;color:#fff;font-weight:800;margin-top:8px}
.tBot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.coinTag{font-weight:900;font-size:18px;background:rgba(40,20,8,.6);border:2px solid #ffd34a;border-radius:14px;padding:4px 14px}
.btn{min-width:200px;min-height:48px;padding:12px 22px;border-radius:16px;border:3px solid #6b3a06;background:linear-gradient(#ffe07a,#f59e1b);color:#4a2400;font-weight:900;font-size:18px;box-shadow:0 5px 0 #6b3a06;font-family:inherit;cursor:pointer}
.btn.g{background:linear-gradient(#fff6e0,#e9d5a8);color:#4a2a10;border-color:#6b4423;box-shadow:0 4px 0 #6b4423;font-size:16px}
.btn.ad{background:linear-gradient(#a8f0b0,#3fbf5a);color:#0d3a14;border-color:#1e6a2c;box-shadow:0 4px 0 #1e6a2c;font-size:16px}
.btn:disabled{filter:grayscale(.8);opacity:.7}
.btn small{display:block;font-size:12px;font-weight:700}
.card{background:linear-gradient(#fff8e6,#f3dfb4);color:#3a220e;border:3px solid #6b3a06;border-radius:20px;padding:18px 16px;width:min(360px,100%);text-align:center;box-shadow:0 6px 0 #6b3a06}
.card h2{font-size:22px;margin-bottom:6px}
.card .big{font-size:42px;font-weight:900;color:#d2651c}
.card table{width:100%;margin:10px 0;font-size:14px;border-collapse:collapse}
.card td{padding:4px 2px;border-bottom:1px dashed #d8c08c}
.card td:last-child{text-align:right;font-weight:800}
.card .rec{color:#e2382a;font-weight:900}
.card .row{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px}
/* 격납고 */
#sHangar{justify-content:flex-start;background:linear-gradient(#2a5d9a,#173a68);gap:10px}
.hTop{display:flex;justify-content:space-between;align-items:center;width:min(420px,100%)}
.hTop h2{font-size:22px}
.tabs{display:flex;gap:6px;width:min(420px,100%)}
.tabs button{flex:1;min-height:44px;border-radius:12px;border:2px solid #ffe6a6;background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:15px;font-family:inherit}
.tabs button.on{background:#ffd34a;color:#4a2400}
.list{width:min(420px,100%);flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.item{display:flex;align-items:center;gap:10px;background:linear-gradient(#fff8e6,#f3dfb4);color:#3a220e;border:2px solid #6b3a06;border-radius:14px;padding:8px 10px;min-height:64px}
.item .ic{width:52px;height:52px;flex:none;border-radius:12px;background:#fff2d0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.item .ic img{width:100%;height:100%;object-fit:contain}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px}
.item .tx small{font-size:12px;color:#6a5236}
.item .lvdots{font-size:11px;color:#b07a2a;letter-spacing:1px}
.item button{min-width:86px;min-height:44px;border-radius:12px;border:2px solid #6b3a06;background:linear-gradient(#ffe07a,#f59e1b);color:#4a2400;font-weight:900;font-size:13px;font-family:inherit;box-shadow:0 3px 0 #6b3a06}
.item button:disabled{filter:grayscale(.9);opacity:.6}
.item button.own{background:linear-gradient(#cfe9ff,#7fb8f0);border-color:#24507a;box-shadow:0 3px 0 #24507a;color:#0c2a48}
.item.sel{outline:3px solid #ffd34a}
.gl .ic{width:84px;height:60px}
.hBot{display:flex;gap:8px;width:min(420px,100%)}
.hBot .btn{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,10,4,.85);border:2px solid #ffd34a;border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"/games/wizard/vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud sh"><div class="pill"><small>고도</small><span id="alt">0</span>m</div><div class="pill" id="dist">0 m</div><div class="pill"><small>링 · 코인</small>⭕<span id="rings">0</span> 🪙<span id="cn">0</span></div></div>
<div id="prog"><i id="progI"></i><u id="progMe">🪂</u></div>
<div id="hint" class="sh">👆 화면을 끌어서 조종<br>위로 = 기수 올리기 · 아래로 = 급강하 · 좌우 = 회전<br>⭕ 링을 통과하면 다시 솟아올라요!</div>
<div id="stall" class="sh">⚠ 너무 느려요! 아래로 끌어 속도를 올리세요</div>
<div id="banner" class="sh"></div>
<div id="pop" class="sh"></div>
<div id="joy"><b id="joyK"></b></div><div id="ringAim"></div>
<div class="bar sh"><div class="t"><span>속도</span><span id="spd">0 km/h</span></div><div class="b" id="vb"><i id="vbar"></i></div></div>
<div id="rocket" hidden>🚀<i></i></div>

<div class="scr on" id="sTitle">
  <h1>윈드 러너<small>점프대에서 뛰어내려 하늘 섬까지!</small></h1>
  <div class="tBot">
    <div class="coinTag" id="tCoins">🪙 0 · 최고 0m</div>
    <button class="btn" id="bFly">🪂 날기</button>
    <button class="btn ad" id="bFlyAd" hidden>📺 로켓 연료 +3초 달고 날기</button>
    <button class="btn g" id="bHangar">🛠 격납고 (강화 · 글라이더)</button>
  </div>
</div>
<div class="scr" id="sResult"><div class="card" id="resCard"></div></div>
<div class="scr" id="sRevive"><div class="card"><h2>쿵! 부딪혔어요</h2><p style="font-size:14px;margin:6px 0 10px">광고를 보면 그 자리에서 다시 날아올라요 (1번)</p><div class="row"><button class="btn ad" id="bRevive">📺 한 번 더 띄우기</button><button class="btn g" id="bNoRevive">괜찮아요</button></div></div></div>
<div class="scr" id="sHangar">
  <div class="hTop"><h2 class="sh">🛠 격납고</h2><div class="coinTag" id="hCoins">🪙 0</div></div>
  <div class="tabs"><button class="on" data-t="up">강화</button><button data-t="gl">글라이더</button></div>
  <div class="list" id="hList"></div>
  <div class="hBot"><button class="btn g" id="hBack">← 처음으로</button><button class="btn" id="hFly">🪂 날기</button></div>
</div>
<div id="toast"></div>
<script type="module" src="game.js"></script>
</body>
</html>
