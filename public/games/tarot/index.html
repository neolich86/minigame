<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/apps/tarot">
<script src="/mgh/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>타로 운세 - 미니게임천국</title>
<meta name="description" content="고민을 고르고 섞인 타로 카드를 직접 뽑아 보세요. 올해 운세·애정·재회·금전·사업·직장·학업·인간관계 타로 해석.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151033'/%3E%3Cpath d='M32 8l5 17 17 7-17 7-5 17-5-17-17-7 17-7z' fill='%23e6c47a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b1e;--bg2:#161236;--card:#1b1640;--ink:#f4efe4;--dim:#a8a2c6;--gold:#e6c47a;--gold2:#b8954a;
  --line:rgba(230,196,122,.22);--accent:#e6c47a;
  --serif:"Gowun Batang",Georgia,serif;--sans:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{
  background:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1px 1px at 72% 12%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1.5px 1.5px at 85% 42%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 30% 62%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(1px 1px at 55% 80%,rgba(255,255,255,.3),transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 88%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(ellipse at 50% -10%,#2b2163 0%,transparent 55%),
    radial-gradient(ellipse at 50% 120%,#1f1850 0%,transparent 55%),
    var(--bg);
  background-attachment:fixed;
  overflow:hidden;user-select:none;-webkit-user-select:none
}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .35s}
.screen.on{opacity:1;pointer-events:auto}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;min-height:52px}
.top h1,.top h2{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:.02em}
.top h1{font-size:22px}
.top h2{font-size:17px;flex:1;text-align:center}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:17px;flex:none}
.ibtn:active{transform:scale(.95)}
.spacer{flex:1}

/* 홈 */
#home .scroll{flex:1;overflow:auto;padding:4px 16px 24px;display:flex;flex-direction:column;align-items:center}
.hero{text-align:center;margin:10px 0 18px}
.hero .mark{font-size:30px;color:var(--gold);line-height:1;text-shadow:0 0 18px rgba(230,196,122,.5)}
.hero h1{font-family:var(--serif);font-size:30px;margin:8px 0 6px;letter-spacing:.04em}
.hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
.seg{display:flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:18px}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-size:14px;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--gold);color:#1a1433;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:460px}
.cat{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border-radius:16px;padding:16px 14px;text-align:left;display:flex;align-items:center;gap:12px;min-height:72px;transition:transform .15s,border-color .15s}
.cat:hover{border-color:var(--c)}
.cat:active{transform:scale(.97)}
.cat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.cat b{display:block;font-family:var(--serif);font-size:16px}
.cat small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.note{color:var(--dim);font-size:12px;text-align:center;margin-top:22px;line-height:1.6;opacity:.8}

/* 뽑기 */
#draw .slots{display:flex;justify-content:center;gap:12px;padding:10px 12px 0}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .box{width:var(--sw);height:calc(var(--sw)*1.72);border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--line);font-size:20px;position:relative}
.slot .box.filled{border:0}
.slot .lbl{font-size:12.5px;color:var(--dim);font-family:var(--serif)}
.hint{text-align:center;color:var(--dim);font-size:13.5px;margin:12px 16px 0;min-height:20px;line-height:1.5}
.fanwrap{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0;padding-bottom:4px}
#fan{position:relative;width:100%;max-width:980px;margin:0 auto;touch-action:none;flex:none}
.fcard{position:absolute;left:50%;border-radius:8px;transform-origin:50% calc(100% + var(--R));transform:translateX(-50%) rotate(var(--rot)) translateY(0);transition:transform .22s ease,opacity .25s,filter .2s;will-change:transform}
.fcard.hot{transform:translateX(-50%) rotate(var(--rot)) translateY(calc(var(--lift) * -1));filter:brightness(1.18) drop-shadow(0 0 10px rgba(230,196,122,.55))}
.fcard.taken{opacity:0;pointer-events:none}
.fcard.deal{transform:translateX(-50%) rotate(0deg) translateY(-30px);opacity:0}
.back{background-color:#221a55;background-image:var(--backimg);background-size:100% 100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.fcard,.mini,.fly{width:var(--cw);height:calc(var(--cw)*1.72)}
.mini{width:var(--sw);height:calc(var(--sw)*1.72);border-radius:9px;cursor:pointer;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.fly{position:fixed;z-index:50;border-radius:8px;transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s,height .45s,transform .45s;pointer-events:none}
.listtoggle{display:block;margin:6px auto 0;border:0;background:none;color:var(--dim);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;opacity:.85}
.bottom{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.cta{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(180deg,#f0d593,#d3ac5c);color:#1a1433;font-weight:700;font-size:16px;min-width:200px;box-shadow:0 6px 20px rgba(230,196,122,.25)}
.cta:disabled{background:rgba(255,255,255,.08);color:var(--dim);box-shadow:none;cursor:default}
.cta.ready{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 30px rgba(230,196,122,.6)}}
/* 목록으로 고르기 */
#fan.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;padding:6px 14px 4px;max-height:100%;overflow:auto;touch-action:auto}
#fan.grid .fcard{position:relative;left:auto;transform:none;width:100%;height:auto;aspect-ratio:1/1.72}
#fan.grid .fcard.hot{transform:translateY(-4px)}
#fan.grid .fcard.taken{opacity:.15}

/* 셔플 */
#shuffle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(13,11,30,.55);z-index:20;transition:opacity .35s}
#shuffle.hide{opacity:0;pointer-events:none}
.deck{position:relative;width:92px;height:158px}
.deck .back{position:absolute;inset:0}
.deck .l{animation:shufL .55s ease-in-out 3}
.deck .r{animation:shufR .55s ease-in-out 3}
@keyframes shufL{0%,100%{transform:translateX(0) rotate(0)}40%{transform:translateX(-58px) rotate(-8deg)}70%{transform:translateX(-10px) rotate(-2deg) translateY(-4px)}}
@keyframes shufR{0%,100%{transform:translateX(0) rotate(0)}40%{transform:translateX(58px) rotate(8deg)}70%{transform:translateX(10px) rotate(2deg) translateY(4px)}}
.shtext{text-align:center;padding:0 24px}
.shtext b{display:block;font-family:var(--serif);font-size:18px;margin-bottom:8px}
.shtext span{color:var(--dim);font-size:14px;line-height:1.6}

/* 결과 */
#result .scroll{flex:1;overflow:auto;padding:4px 16px 30px}
.wrap{max-width:620px;margin:0 auto}
.rtitle{text-align:center;margin:6px 0 16px}
.rtitle small{display:block;color:var(--gold);font-size:12.5px;letter-spacing:.12em}
.rtitle h2{font-family:var(--serif);font-size:23px;margin:6px 0 0}
.rcards{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.rc{display:flex;flex-direction:column;align-items:center;gap:8px;width:var(--rw)}
.flip{width:var(--rw);height:calc(var(--rw)*1.72);perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
.flip .front{transform:rotateY(180deg);background:#e9dfc9;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.flip .front img{width:100%;height:100%;display:block;object-fit:cover}
.flip .front.rev img{transform:rotate(180deg)}
.rc .pos{font-size:12.5px;color:var(--dim);font-family:var(--serif)}
.rc .nm{font-size:13.5px;font-weight:700;text-align:center;opacity:0;transition:opacity .4s}
.rc.shown .nm{opacity:1}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(230,196,122,.16);color:var(--gold);margin-left:4px;vertical-align:1px}
.badge.rev{background:rgba(160,150,255,.18);color:#c6bfff}
.sec{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.sec.shown{opacity:1;transform:none}
.reading{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.reading .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.reading .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--gold);font-family:var(--serif)}
.reading h3{margin:0;font-family:var(--serif);font-size:17px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.kws span{font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);padding:3px 8px;border-radius:8px}
.reading p{margin:0;line-height:1.75;font-size:15px}
.summary{border-color:rgba(230,196,122,.45);background:linear-gradient(160deg,rgba(230,196,122,.12),rgba(230,196,122,.03))}
.summary h3{color:var(--gold)}
.summary p+p{margin-top:8px}
.advice{text-align:center;margin:18px 0 6px;font-family:var(--serif)}
.advice small{display:block;color:var(--dim);font-size:12.5px;margin-bottom:6px;font-family:var(--sans)}
.advice q{font-size:19px;line-height:1.5;quotes:"“" "”"}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 10px}
.actions .cta{min-width:0;flex:1;max-width:240px}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:14px 18px;font-size:15px;flex:1;max-width:240px}
.disc{color:var(--dim);font-size:12px;text-align:center;line-height:1.6;opacity:.8;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#2a2260;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 받은 사람 */
.recv{display:none;text-align:center;background:linear-gradient(160deg,rgba(230,196,122,.16),rgba(230,196,122,.04));border:1px solid rgba(230,196,122,.4);border-radius:14px;padding:12px 14px;margin:2px 0 14px;font-size:14.5px;line-height:1.5}
.recv b{color:var(--gold);font-family:var(--serif)}
body.received .recv{display:block}
.recvbar{display:none;position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(13,11,30,0),rgba(13,11,30,.92) 35%);justify-content:center;z-index:5}
.recvbar .cta{width:100%;max-width:420px;font-size:17px;padding:16px}
body.received .recvbar{display:flex}
body.received #shareBtn{display:none}
body.received #result .scroll{padding-bottom:100px}
/* 공유 팝업 */
#shareModal{position:fixed;inset:0;z-index:60;background:rgba(6,5,18,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px;opacity:0;pointer-events:none;transition:opacity .25s}
#shareModal.on{opacity:1;pointer-events:auto}
#shareModal .sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:#17123a;border:1px solid var(--line);border-radius:22px;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 60px rgba(0,0,0,.55);transform:translateY(20px);transition:transform .25s}
#shareModal.on .sheet{transform:none}
@media (min-height:640px) and (min-width:500px){#shareModal{align-items:center}}
.sheet h3{margin:0 0 12px;font-family:var(--serif);font-size:18px;text-align:center}
.sheet .prev{width:100%;aspect-ratio:1200/630;border-radius:12px;background:#0d0b1e;display:block;object-fit:cover;border:1px solid var(--line)}
.sheet label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 6px}
.sheet input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#0d0b1e;color:var(--ink);padding:0 14px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.sheet input:focus{outline:none;border-color:var(--gold)}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sbtn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:13px 10px;font-size:14.5px;font-weight:500}
.sbtn.kakao{background:#fee500;color:#191600;border-color:#fee500;font-weight:700;grid-column:1/-1}
.sbtn:active{transform:scale(.98)}
.sheet .cta{width:100%;margin-top:12px}
.sheet .x{position:absolute;right:12px;top:12px}
.sheet{position:relative}
@media (min-width:700px){
  .cats{grid-template-columns:repeat(4,minmax(0,1fr));max-width:820px}
  .cat{flex-direction:column;text-align:center;padding:20px 12px}
  .hero h1{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<section class="screen on" id="home">
  <div class="top"><div class="spacer"></div><button class="ibtn" id="sndBtn" aria-label="sound">🔊</button></div>
  <div class="scroll">
    <div class="hero">
      <div class="mark">✦</div>
      <h1 data-t="title"></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="seg" id="spreadSeg">
      <button data-s="one"></button>
      <button data-s="three"></button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="note" data-t="disclaimer"></div>
  </div>
</section>

<section class="screen" id="draw">
  <div class="top">
    <button class="ibtn" id="drawBack" aria-label="back">←</button>
    <h2 id="drawTitle"></h2>
    <button class="ibtn" id="sndBtn2" aria-label="sound">🔊</button>
  </div>
  <div class="slots" id="slots"></div>
  <div class="hint" id="hint"></div>
  <div class="fanwrap" id="fanwrap"><div id="fan"></div></div>
  <button class="listtoggle" id="listToggle"></button>
  <div class="bottom"><button class="cta" id="goBtn" disabled></button></div>
  <div id="shuffle" class="hide">
    <div class="deck" id="deck"></div>
    <div class="shtext"><b data-t="shuffling"></b><span id="shPrompt"></span></div>
  </div>
</section>

<section class="screen" id="result">
  <div class="top">
    <button class="ibtn" id="resBack" aria-label="home">←</button>
    <h2 data-t="title"></h2>
    <button class="ibtn" id="sndBtn3" aria-label="sound">🔊</button>
  </div>
  <div class="scroll" id="resScroll"><div class="wrap">
    <div class="recv" id="recv"></div>
    <div class="rtitle"><small id="rSub"></small><h2 id="rTitle"></h2></div>
    <div class="rcards" id="rcards"></div>
    <div id="readings"></div>
    <div class="actions sec" id="actions">
      <button class="ghost" id="againBtn"></button>
      <button class="cta" id="shareBtn"></button>
    </div>
    <div class="disc" data-t="disclaimer"></div>
  </div></div>
  <div class="recvbar"><button class="cta" id="recvCta"></button></div>
</section>

<div id="shareModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="ibtn x" id="shClose" aria-label="close">✕</button>
    <h3 data-t="shareTitle"></h3>
    <img class="prev" id="shImg" alt="">
    <label for="shName" data-t="nameLbl"></label>
    <input id="shName" maxlength="12" autocomplete="nickname">
    <div class="sbtns">
      <button class="sbtn kakao" id="shKakao" hidden></button>
      <button class="sbtn" id="shNative" hidden></button>
      <button class="sbtn" id="shCopy"></button>
      <button class="sbtn" id="shSave"></button>
    </div>
    <button class="cta" id="shMore"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const LANG = document.documentElement.lang === "en" ? "en" : "ko";
const $ = (id) => document.getElementById(id);
const VER = new URLSearchParams(location.search).get("v") || "";

/* ───── 문구 ───── */
const T = {
  title: ["타로 운세", "Tarot Reading"],
  tagline: ["고민을 고르고, 마음을 모아 카드를 직접 뽑아 보세요", "Pick what's on your mind, then draw the cards yourself"],
  one: ["오늘의 한 장", "One card"],
  three: ["과거·현재·미래", "Past · Present · Future"],
  disclaimer: ["타로는 재미로 보는 참고용이에요. 중요한 결정은 스스로 판단하세요.", "Tarot is for fun and reflection. Make important decisions with your own judgment."],
  shuffling: ["카드를 섞는 중…", "Shuffling the cards…"],
  hintPick: ["카드를 {n}장 골라 주세요", "Choose {n} card(s)"],
  hintPickTouch: ["부채 위를 손가락으로 훑다가, 마음이 가는 카드에서 손을 떼세요", "Slide your finger across the fan and lift it on the card that calls to you"],
  hintLeft: ["{n}장 더 골라 주세요 · 고른 카드를 누르면 취소돼요", "{n} more to go · tap a chosen card to undo"],
  hintDone: ["모두 골랐어요. 카드를 뒤집어 볼까요?", "All chosen. Ready to turn them over?"],
  go: ["결과 보기", "Reveal"],
  pickMore: ["카드를 골라 주세요", "Choose your cards"],
  listView: ["카드 목록으로 고르기", "Pick from a list"],
  fanView: ["부채꼴로 고르기", "Pick from the fan"],
  upright: ["정방향", "Upright"],
  reversed: ["역방향", "Reversed"],
  summary: ["종합 메시지", "Overall message"],
  advice: ["오늘의 조언", "Today's advice"],
  again: ["다른 고민 보기", "Ask something else"],
  share: ["결과 공유하기", "Share result"],
  copied: ["링크를 복사했어요", "Link copied"],
  copyFail: ["아래 링크를 복사하세요", "Copy this link"],
  yearN: ["{y}년 운세", "{y} Fortune"],
  yearNew: ["{y} 신년운세", "{y} New Year Reading"],
  yearSub: ["올해의 흐름", "The year ahead"],
  shareTitle: ["결과 공유하기", "Share your reading"],
  nameLbl: ["공유할 이름 (선택)", "Your name (optional)"],

function layout() {
  const fan = $("fan"), wrap = $("fanwrap");
  const W = Math.min(fan.clientWidth || window.innerWidth, 980);
  // 슬롯 크기를 먼저 정해야 힌트 위치(=부채가 쓸 수 있는 높이)가 맞는다
  const sw = Math.round(Math.min(W < 600 ? 74 : 92, (window.innerWidth - 60) / 3));
  document.documentElement.style.setProperty("--sw", sw + "px");
  fan.style.height = "0px";
  const availH = Math.max(150, $("listToggle").getBoundingClientRect().top - $("hint").getBoundingClientRect().bottom - 14);
  const mobile = W < 600;
  const S_DEG = mobile ? 84 : 104;
  const half = (S_DEG / 2) * Math.PI / 180;
  // 양 끝 카드의 네 모서리(회전 후)가 화면 안에 들어오도록 반지름을 정한다
  function fit(cw, rMax) {
    const ch = cw * 1.72, s = Math.sin(half), c = Math.cos(half);
    const outer = (R) => cw / 2 * c + (R + ch) * s; // 끝 카드 위쪽 바깥 모서리의 가로 위치
    let R = (W / 2 - 6 - cw / 2 * c) / s - ch;
    R = Math.min(R, rMax || (mobile ? 340 : 420));
    const minY = Math.min(R * c - cw / 2 * s, R); // 끝 카드 아래쪽 바깥 모서리의 높이
    const B = R - minY + 8;
    return { cw, ch, R, B, H: B + ch + Math.round(cw * 0.32) + 10, ok: outer(R) <= W / 2 && R > cw * 1.2 };
  }
  let g = fit(Math.max(46, Math.min(96, W * (mobile ? 0.17 : 0.13))));
  while (!g.ok && g.cw > 40) g = fit(g.cw - 2);
  // 세로가 모자라면 카드·반지름을 함께 줄인다
  for (let k = 0; k < 40 && g.H > availH && g.cw > 36; k++) g = fit(g.cw * 0.95, g.R * 0.95);
  let { cw, ch, R, B, H } = g;
  const lift = Math.round(cw * 0.32);
  return { W, cw, R, B, H, S_DEG, step: S_DEG / 21, lift, ch };
}

// 포인터 위치 → 부채의 카드 번호 (각도로 판정)
function hitFan(ev) {
  const fan = $("fan");
  if (S.listMode) {
    const el = ev.target.closest && ev.target.closest(".fcard");
    return el && !el.classList.contains("taken") ? +el.dataset.i : null;
  }
  const r = fan.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top;
  const cx = r.width / 2;
  const pivotY = geo.H + (geo.R - geo.B);
  const dx = x - cx, dy = pivotY - y;
  const d = Math.hypot(dx, dy);
  if (d < geo.R - 16 || d > geo.R + geo.ch + geo.lift + 24) return null;
  const ang = Math.atan2(dx, dy) * 180 / Math.PI;
  if (Math.abs(ang) > geo.S_DEG / 2 + geo.step * 1.2) return null;
  let best = null, bd = 1e9;
  for (let i = 0; i < 22; i++) {
    if (S.slots.includes(i)) continue;
    const diff = Math.abs(-geo.S_DEG / 2 + i * geo.step - ang);
    if (diff < bd) { bd = diff; best = i; }
  }
  return bd <= geo.step * 1.6 ? best : null;
}

  if (hot !== null) fan.children[hot] && fan.children[hot].classList.remove("hot");
  hot = i;
  if (hot !== null) { fan.children[hot].classList.add("hot"); SFX.hover(); }
}
const full = () => S.slots.every((x) => x !== null);
const fanEl = $("fan");
fanEl.addEventListener("pointerdown", (e) => {
  if (full()) return;
  pressed = true;
  if (!S.listMode) { try { fanEl.setPointerCapture(e.pointerId); } catch (x) {} }
  setHot(hitFan(e));
});
fanEl.addEventListener("pointermove", (e) => {
  if (full()) return;
  if (e.pointerType === "mouse" || pressed) setHot(hitFan(e));
});
fanEl.addEventListener("pointerup", (e) => {
  if (!pressed) return;
  pressed = false;
  const i = hot !== null ? hot : hitFan(e);
  if (e.pointerType !== "mouse") setHot(null);
  if (i !== null && !full()) pickCard(i);
});
fanEl.addEventListener("pointercancel", () => { pressed = false; setHot(null); });
fanEl.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") setHot(null); });

function renderSlots() {
  const box = $("slots"); box.innerHTML = "";
  const names = posNames(S.cat, S.spread);
  S.slots.forEach((v, k) => {
    const s = document.createElement("div"); s.className = "slot";
    s.innerHTML = `<div class="box${v !== null ? " filled" : ""}">${v === null ? "✦" : ""}</div><div class="lbl"></div>`;
    s.querySelector(".lbl").textContent = names[k];
    if (v !== null) {
      const m = document.createElement("div"); m.className = "mini back";
      m.title = LANG === "en" ? "Undo" : "취소";
      m.onclick = () => unpick(k);
      s.querySelector(".box").appendChild(m);
    }
    box.appendChild(s);
  });
}

function pickCard(i) {
  const k = S.slots.indexOf(null);
  if (k < 0) return;
  const card = $("fan").children[i];
  const from = card.getBoundingClientRect();
  const slotBox = $("slots").children[k].querySelector(".box");
  const to = slotBox.getBoundingClientRect();
  S.slots[k] = i;
  card.classList.remove("hot"); hot = null;
  card.classList.add("taken");
  SFX.pick();
  // 날아가는 카드
  const fly = document.createElement("div");
  fly.className = "fly back";
  const w0 = S.listMode ? from.width : geo.cw, h0 = w0 * 1.72;
  fly.style.width = w0 + "px"; fly.style.height = h0 + "px";
  fly.style.left = (from.left + from.width / 2 - w0 / 2) + "px";
  fly.style.top = (from.top + from.height / 2 - h0 / 2) + "px";
  fly.style.transform = S.listMode ? "none" : `rotate(${card.style.getPropertyValue("--rot")})`;
  document.body.appendChild(fly);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fly.style.left = to.left + "px"; fly.style.top = to.top + "px";
    fly.style.width = to.width + "px"; fly.style.height = to.height + "px";
    fly.style.transform = "rotate(0deg)";
  }));
  setTimeout(() => { fly.remove(); renderSlots(); updateHint(); }, 470);
  updateHint(true);
}

function unpick(k) {
  const i = S.slots[k];
  if (i === null) return;
  S.slots[k] = null;
  const c = $("fan").children[i];
  if (c) c.classList.remove("taken");
  SFX.deal();
  renderSlots(); updateHint();
}

function updateHint(pending) {
  const left = S.slots.filter((x) => x === null).length;
  let msg;
  if (left === 0) msg = t("hintDone");
  else if (left === need()) msg = isTouch && !S.listMode ? t("hintPickTouch") : t("hintPick", { n: need() });
  else msg = t("hintLeft", { n: left });
  $("hint").textContent = msg;
  const go = $("goBtn");
  go.disabled = left > 0 || !!pending;
  go.textContent = left > 0 ? t("pickMore") : t("go");
  go.classList.toggle("ready", left === 0);
}

$("listToggle").onclick = () => { S.listMode = !S.listMode; setHot(null); buildFan(false); updateHint(); };
$("drawBack").onclick = () => { show("home"); };
$("goBtn").onclick = () => {
  if (!full()) return;
  const cards = S.slots.map((i) => S.deck[i]);
  showResult(S.cat, S.spread, cards, false);
};
let rsT;
window.addEventListener("resize", () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => { if ($("draw").classList.contains("on") && $("shuffle").classList.contains("hide")) { setHot(null); buildFan(false); } }, 150);
});

/* ───── 결과 ───── */
let current = null;
async function showResult(cat, spread, cards, instant) {
  await dataP;
  current = { cat, spread, cards, year: cat === "year" ? (S.year || yearInfo().y) : null };
  const names = posNames(cat, spread);
  $("rSub").textContent = spreadLabel(cat, spread);
  $("rTitle").textContent = catName(cat, S.year);
  const rw = Math.round(Math.min(spread === "one" ? 170 : (window.innerWidth >= 700 ? 150 : 108), (Math.min(window.innerWidth, 620) - 32 - 24) / cards.length));
  const box = $("rcards"); box.innerHTML = ""; box.style.setProperty("--rw", rw + "px");
  cards.forEach((c, k) => {
    const d = DATA[c.n];
    const el = document.createElement("div"); el.className = "rc";
    el.innerHTML = `<div class="pos"></div><div class="flip"><div class="in"><div class="face back"></div><div class="face front${c.rev ? " rev" : ""}"><img alt=""></div></div></div><div class="nm"></div>`;
    el.querySelector(".pos").textContent = names[k];
    const img = el.querySelector("img"); img.src = imgUrl(c.n, 600); img.alt = L2(d.name);
    el.querySelector(".nm").innerHTML = `<span></span><span class="badge${c.rev ? " rev" : ""}"></span>`;
    el.querySelector(".nm span").textContent = L2(d.name);
    el.querySelector(".nm .badge").textContent = c.rev ? t("reversed") : t("upright");
    box.appendChild(el);
  });
  // 해석
  const rd = $("readings"); rd.innerHTML = "";
  cards.forEach((c, k) => {
    const d = DATA[c.n], dir = c.rev ? "rev" : "up";
    const sec = document.createElement("div"); sec.className = "reading sec";
    sec.innerHTML = `<div class="head"><span class="chip"></span><h3></h3><span class="badge${c.rev ? " rev" : ""}"></span></div><div class="kws"></div><p></p>`;
    sec.querySelector(".chip").textContent = names[k];
    sec.querySelector("h3").textContent = L2(d.name);
    sec.querySelector(".badge").textContent = c.rev ? t("reversed") : t("upright");
    L2(d.keywords[dir]).forEach((w) => { const s = document.createElement("span"); s.textContent = w; sec.querySelector(".kws").appendChild(s); });
    sec.querySelector("p").textContent = L2(d.readings[cat][dir]);
    rd.appendChild(sec);
  });
  const lastC = cards[cards.length - 1], lastD = DATA[lastC.n];
  if (cards.length === 3) {
    const sec = document.createElement("div"); sec.className = "reading summary sec";
    sec.innerHTML = `<div class="head"><h3></h3></div>`;
    sec.querySelector("h3").textContent = t("summary");
    summaryLines(cards, DATA).forEach((l) => { const p = document.createElement("p"); p.textContent = l; sec.appendChild(p); });
    rd.appendChild(sec);
  }
  const adv = document.createElement("div"); adv.className = "advice sec";
  adv.innerHTML = `<small></small><q></q>`;
  adv.querySelector("small").textContent = t("advice");
  adv.querySelector("q").textContent = L2(lastD.advice[lastC.rev ? "rev" : "up"]);
  rd.appendChild(adv);
  const recv = document.body.classList.contains("received");
  $("againBtn").textContent = recv ? t("myToo") : t("again");
  $("recvCta").textContent = t("myToo");
  $("shareBtn").textContent = t("share");
  $("actions").classList.remove("shown");

  show("result");
  $("resScroll").scrollTop = 0;
  const flips = [...box.querySelectorAll(".rc")];
  const secs = [...document.querySelectorAll("#readings .sec"), $("actions")];
  if (instant) {
    flips.forEach((f) => { f.querySelector(".flip").classList.add("open"); f.classList.add("shown"); });
    secs.forEach((s) => s.classList.add("shown"));
    return;
  }
  flips.forEach((f, k) => {
    setTimeout(() => { f.querySelector(".flip").classList.add("open"); SFX.flip(); setTimeout(() => f.classList.add("shown"), 450); }, 450 + k * 750);
  });
  const after = 450 + flips.length * 750 + 300;
  setTimeout(SFX.reveal, after - 200);
  secs.forEach((s, k) => setTimeout(() => s.classList.add("shown"), after + k * 160));
}

// 결과 링크: ?c=love&s=three&d=06r.02.10 (&y=2026)
function encodeCards(cards) { return cards.map((c) => String(c.n).padStart(2, "0") + (c.rev ? "r" : "")).join("."); }
function resultQuery(name) {
  const q = new URLSearchParams({ c: current.cat, s: current.spread, d: encodeCards(current.cards) });
  if (current.year) q.set("y", current.year);
  if (name) q.set("n", name);
  return q.toString();
}
function resultUrl(name) { return `${location.origin}/apps/tarot?${resultQuery(name)}&ref=1`; }
const ogUrl = (name) => `${location.origin}/api/tarot/og?${resultQuery(name)}`;
function parseLink() {
  let qs = "";
  try { qs = window.parent !== window ? window.parent.location.search : location.search; } catch (e) { qs = location.search; }
  const q = new URLSearchParams(qs);
  const c = q.get("c"), s = q.get("s"), d = q.get("d"), y = q.get("y");
  if (!c || !catById(c) || (s !== "one" && s !== "three") || !d) return null;
  const parts = d.split(".");
  if (parts.length !== (s === "one" ? 1 : 3)) return null;
  const cards = [];
  for (const p of parts) {
    const m = /^(\d{2})(r?)$/.exec(p);
    if (!m || +m[1] > 21) return null;
    cards.push({ n: +m[1], rev: m[2] === "r" });
  }
  if (new Set(cards.map((x) => x.n)).size !== cards.length) return null;
  const yy = y && /^\d{4}$/.test(y) ? +y : null;
  const n = (q.get("n") || "").replace(/[<>\r\n\t]/g, "").trim().slice(0, 12);
  return { c, s, cards, y: c === "year" ? yy : null, n, ref: q.get("ref") === "1" };
}

function goHome(fromReceived) {
  if (document.body.classList.contains("received")) {
    if (fromReceived) track("tarot_ref_cta");
    document.body.classList.remove("received");
    // 주소의 친구 결과를 지워 새로고침해도 처음 화면이 나오게
    try { const w = window.parent !== window ? window.parent : window; w.history.replaceState(null, "", "/apps/tarot"); } catch (e) {}
  }
  renderHome(); show("home");
}
$("resBack").onclick = () => goHome(false);
$("againBtn").onclick = () => goHome(true);
$("recvCta").onclick = () => goHome(true);
/* ───── 공유 ───── */
function track(event, extra) {
  try { const w = window.parent !== window ? window.parent : window; (w.dataLayer = w.dataLayer || []).push(Object.assign({ event, tarot_cat: current && current.cat }, extra || {})); } catch (e) {}
}
const KAKAO_SDK = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js";
let kakaoP = null;
function loadKakao() {
  if (kakaoP) return kakaoP;
  kakaoP = fetch("/api/public-config").then((r) => r.json()).then((cfg) => new Promise((res) => {
    if (!cfg || !cfg.kakaoJsKey) return res(false);
    const init = () => { try { if (!window.Kakao.isInitialized()) window.Kakao.init(cfg.kakaoJsKey); res(true); } catch (e) { res(false); } };
    if (window.Kakao) return init();
    const sc = document.createElement("script");
    sc.src = KAKAO_SDK; sc.crossOrigin = "anonymous"; sc.onload = init; sc.onerror = () => res(false);
    document.head.appendChild(sc);
  })).catch(() => false);
  return kakaoP;
}
let shareName = "";
try { shareName = (localStorage.getItem("tarot:name") || "").slice(0, 12); } catch (e) {}
const cleanName = (v) => (v || "").replace(/[<>\r\n\t]/g, "").trim().slice(0, 12);
function shareTexts() {
  const c = catName(current.cat, current.year), n = cleanName(shareName);
  return { title: n ? t("shareText", { n, c }) : t("shareTextAnon", { c }) };
}
let prevT;
function refreshPreview() { clearTimeout(prevT); prevT = setTimeout(() => { $("shImg").src = ogUrl(cleanName(shareName)); }, 400); }
function openShare() {
  if (!current) return;
  $("shName").value = shareName;
  $("shName").placeholder = t("namePh");
  $("shImg").src = ogUrl(cleanName(shareName));
  $("shKakao").textContent = t("kakao");
  $("shCopy").textContent = t("copy");
  $("shSave").textContent = t("save");
  $("shNative").hidden = typeof navigator.share !== "function";
  $("shNative").textContent = t("native");
  $("shNative").classList.remove("kakao");
  $("shMore").textContent = document.body.classList.contains("received") ? t("myToo") : t("otherQ");
  $("shareModal").classList.add("on");
  track("tarot_share_open");
  loadKakao().then((ok) => {
    $("shKakao").hidden = !ok;
    // 카카오를 못 쓰면 공유 시트 버튼을 노란 버튼으로
    if (!ok && !$("shNative").hidden) { $("shNative").classList.add("kakao"); $("shNative").textContent = t("nativeK"); }
  });
}
function closeShare() { $("shareModal").classList.remove("on"); }
$("shareBtn").onclick = openShare;
$("shClose").onclick = closeShare;
$("shareModal").onclick = (e) => { if (e.target.id === "shareModal") closeShare(); };
$("shName").oninput = () => {
  shareName = $("shName").value;
  try { localStorage.setItem("tarot:name", cleanName(shareName)); } catch (e) {}
  refreshPreview();
};
$("shKakao").onclick = () => {
  const n = cleanName(shareName), url = resultUrl(n), home = `${location.origin}/apps/tarot?ref=1`;
  const desc = current.cards.map((c) => `${L2(DATA[c.n].name)}${c.rev ? (LANG === "en" ? " (rev.)" : "(역)") : ""}`).join(" · ");
  try {
    window.Kakao.Share.sendDefault({
      objectType: "feed",
      content: { title: shareTexts().title, description: desc, imageUrl: ogUrl(n), imageWidth: 1200, imageHeight: 630, link: { mobileWebUrl: url, webUrl: url } },
      buttons: [
        { title: t("kBtnView"), link: { mobileWebUrl: url, webUrl: url } },
        { title: t("kBtnMine"), link: { mobileWebUrl: home, webUrl: home } },

    });
    track("tarot_share", { method: "kakao" });
  } catch (e) { toast(t("kakaoFail")); }
};
$("shNative").onclick = async () => {
  const n = cleanName(shareName);
  try { await navigator.share({ title: shareTexts().title, text: shareTexts().title, url: resultUrl(n) }); track("tarot_share", { method: "native" }); } catch (e) {}
};
$("shCopy").onclick = async () => {
  const n = cleanName(shareName), text = `${shareTexts().title}\n${resultUrl(n)}`;
  try { await navigator.clipboard.writeText(text); toast(t("copied")); track("tarot_share", { method: "copy" }); }
  catch (e) { window.prompt(t("copyFail"), resultUrl(n)); }
};
$("shSave").onclick = saveStory;
$("shMore").onclick = () => { closeShare(); goHome(true); };

/* ───── 스토리 이미지 (1080×1920) ───── */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function wrapText(ctx, text, maxW) {
  const out = []; let line = "";
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch.trim() ? ch : ""; } else line += ch;
  }
  if (line) out.push(line);
  return out;
}
async function storyBlob() {
  const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  try { await document.fonts.load('700 60px "Gowun Batang"'); } catch (e) {}
  const serif = '"Gowun Batang", Georgia, serif', sans = '"Noto Sans KR", system-ui, sans-serif';
  const g = x.createRadialGradient(W / 2, 520, 50, W / 2, 900, 1300);
  g.addColorStop(0, "#33287a"); g.addColorStop(1, "#0d0b1e");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 120; i++) { x.globalAlpha = 0.25 + Math.random() * 0.6; x.fillStyle = "#fff"; const r = Math.random() * 2.4 + 0.6; x.beginPath(); x.arc(Math.random() * W, Math.random() * H, r, 0, 7); x.fill(); }
  x.globalAlpha = 1; x.textAlign = "center";
  x.fillStyle = "#e6c47a"; x.font = `500 34px ${sans}`; x.fillText("✦  TAROT READING  ✦", W / 2, 190);
  const n = cleanName(shareName);
  x.fillStyle = "#a8a2c6"; x.font = `400 52px ${serif}`;
  x.fillText(n ? (LANG === "en" ? `${n}'s` : `${n}님의`) : (LANG === "en" ? "My" : "나의"), W / 2, 300);
  x.fillStyle = "#f4efe4"; x.font = `700 92px ${serif}`;
  x.fillText(catName(current.cat, current.year), W / 2, 410);
  // 카드
  const k = current.cards.length, cw = k === 1 ? 460 : 300, ch = cw * 1.72, gap = 36;
  const imgs = await Promise.all(current.cards.map((c) => loadImg(imgUrl(c.n, 600)).catch(() => null)));
  const total = k * cw + (k - 1) * gap, top = 560, names = posNames(current.cat, current.spread);
  current.cards.forEach((c, i) => {
    const cx = (W - total) / 2 + i * (cw + gap);
    x.fillStyle = "#a8a2c6"; x.font = `500 32px ${sans}`; x.fillText(names[i], cx + cw / 2, top - 22);
    x.save(); x.shadowColor = "rgba(0,0,0,.55)"; x.shadowBlur = 30; x.shadowOffsetY = 14;
    x.fillStyle = "#e9dfc9"; roundRect(x, cx, top, cw, ch, 18); x.fill(); x.restore();
    if (imgs[i]) {
      x.save(); roundRect(x, cx, top, cw, ch, 18); x.clip();
      if (c.rev) { x.translate(cx + cw / 2, top + ch / 2); x.rotate(Math.PI); x.drawImage(imgs[i], -cw / 2, -ch / 2, cw, ch); }
      else x.drawImage(imgs[i], cx, top, cw, ch);
      x.restore();
    }
    x.strokeStyle = "#e6c47a"; x.lineWidth = 4; roundRect(x, cx, top, cw, ch, 18); x.stroke();
    x.fillStyle = c.rev ? "#c6bfff" : "#e6c47a"; x.font = `700 ${k === 1 ? 48 : 36}px ${serif}`;
    x.fillText(L2(DATA[c.n].name), cx + cw / 2, top + ch + 60);
    x.fillStyle = "#a8a2c6"; x.font = `500 28px ${sans}`;
    x.fillText(c.rev ? t("reversed") : t("upright"), cx + cw / 2, top + ch + 104);
  });
  // 오늘의 조언
  const last = current.cards[k - 1];
  const adv = L2(DATA[last.n].advice[last.rev ? "rev" : "up"]);
  let y = top + ch + 220;
  x.fillStyle = "#a8a2c6"; x.font = `500 32px ${sans}`; x.fillText(t("advice"), W / 2, y);
  x.fillStyle = "#f4efe4"; x.font = `700 50px ${serif}`;
  wrapText(x, `“${adv}”`, W - 180).forEach((l, i) => x.fillText(l, W / 2, y + 86 + i * 70));
  // 아래
  x.fillStyle = "#e6c47a"; roundRect(x, W / 2 - 300, H - 250, 600, 104, 52); x.fill();
  x.fillStyle = "#1a1433"; x.font = `700 40px ${sans}`; x.fillText(t("kBtnMine"), W / 2, H - 184);
  x.fillStyle = "#a8a2c6"; x.font = `500 30px ${sans}`; x.fillText(`${location.host}/apps/tarot`, W / 2, H - 92);
  return new Promise((res) => cv.toBlob(res, "image/png"));
}
function roundRect(x, l, tp, w, h, r) { x.beginPath(); x.moveTo(l + r, tp); x.arcTo(l + w, tp, l + w, tp + h, r); x.arcTo(l + w, tp + h, l, tp + h, r); x.arcTo(l, tp + h, l, tp, r); x.arcTo(l, tp, l + w, tp, r); x.closePath(); }
async function saveStory() {
  const b = $("shSave"), old = b.textContent; b.textContent = t("saving"); b.disabled = true;
  try {
    const blob = await storyBlob();
    const file = new File([blob], `tarot-${current.cat}.png`, { type: "image/png" });
    if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: shareTexts().title }); track("tarot_share", { method: "story" }); } catch (e) {}
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast(t("saved")); track("tarot_share", { method: "image" });
    }
  } catch (e) { toast("⚠️"); }
  b.textContent = old; b.disabled = false;
}

/* ───── 시작 ───── */
renderHome();
const link = parseLink();
if (link) {
  S.year = link.y; S.cat = link.c; S.spread = link.s;
  document.body.classList.add("received");
  const c = catName(link.c, link.y);
  $("recv").innerHTML = link.n
    ? t("recvNamed", { n: link.n.replace(/&/g, "&amp;").replace(/"/g, "&quot;"), c })
    : t("recvAnon", { c });
  dataP.then(() => { showResult(link.c, link.s, link.cards, true); if (link.ref) track("tarot_ref_open"); });
}
