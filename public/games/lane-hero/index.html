<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>외길 용사 (샘플)</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2b3350;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none;-webkit-user-select:none;color:#fff}
#app{position:relative;height:100%;width:min(100%,calc(100dvh*.5625));margin:0 auto;display:flex;flex-direction:column;background:#2b3350}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
#panel{background:#2f3756;border-top:3px solid #1c2238;padding:8px 10px max(10px,env(safe-area-inset-bottom))}
.exp{position:relative;height:22px;background:#111;border-radius:11px;overflow:hidden;border:2px solid #0b0e18}
.exp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#6fdc8c,#3fae5c);width:0}
.exp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000}
.exp span{position:absolute;left:6px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;font-weight:900;color:#bff3c9}
#perks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:40px;margin:8px 0}
.pk{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;border:2px solid #0b0e18}
.pk small{position:absolute;right:-4px;bottom:-5px;font-size:10px;font-weight:900;background:#0b0e18;border-radius:6px;padding:0 4px}
#ups{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.up{display:flex;align-items:center;gap:8px;background:#394268;border:2px solid #1c2238;border-radius:10px;padding:7px 8px;cursor:pointer;min-height:48px}
.up:active{transform:scale(.97)}.up.no{opacity:.5}
.up .ic{font-size:20px;width:24px;text-align:center}.up .t{flex:1;min-width:0}.up .t b{display:block;font-size:12.5px}.up .t span{font-size:11px;color:#b8c2e8}
.up .c{font-size:12px;font-weight:900;color:#ffd84a;white-space:nowrap}
.ov{position:absolute;inset:0;background:rgba(12,10,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:5;text-align:center}
.ov h1{font-size:34px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 #000}
.ban{background:linear-gradient(#8d93ad,#5d6380);border:3px solid #1b1f33;padding:6px 26px;border-radius:8px;font-size:28px;font-weight:900;text-shadow:0 2px 0 #000}
.ov p{font-size:15px;color:#e7d9b0;font-weight:800}
.card{width:100%;display:flex;align-items:center;gap:12px;background:#364068;border:3px solid #141a2e;border-radius:12px;padding:12px;cursor:pointer;text-align:left;position:relative}
.card:active{transform:scale(.98)}
.card .ic{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;border:3px solid #141a2e}
.card .r{position:absolute;left:84px;top:-12px;font-size:12px;font-weight:900;padding:2px 12px;border-radius:6px 6px 6px 0;color:#1a1a1a}
.card .d{font-size:15px;font-weight:800;line-height:1.35}.card .d em{font-style:normal;color:#ff8f6b}.card .d u{text-decoration:none;color:#7df09a}
.btn{border:0;border-radius:14px;padding:13px 30px;font:inherit;font-size:17px;font-weight:900;color:#2a1a00;background:linear-gradient(#ffe07a,#f0a92e);box-shadow:0 4px 0 #8a5a10;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body><div id="app">
<div id="stage"><canvas id="cv"></canvas></div>
<div id="panel">
  <div class="exp"><i id="expBar"></i><span>Lv.<b id="lvTxt" style="position:static;display:inline;margin-left:2px">1</b></span><b id="expTxt">0/6</b></div>
  <div id="perks"></div>
  <div id="ups"></div>
</div>
<div class="ov" id="lvUp" hidden><div class="ban">레벨 업!</div><p>새로운 능력을 하나 고르세요</p><div id="cards" style="width:100%;display:flex;flex-direction:column;gap:18px;margin-top:10px"></div></div>
<div class="ov" id="dead" hidden><h1>용사가 쓰러졌어요</h1><p id="deadTxt"></p><p style="color:#b8c2e8;font-weight:600;font-size:13px">골드로 올린 능력치는 그대로 남아요</p><button class="btn" id="again">다시 도전</button></div>
<div class="ov" id="title"><h1>외길 용사</h1><p style="color:#fff;font-weight:600;line-height:1.6">용사가 몰려오는 적을 자동으로 베어요.<br>골드로 능력치를 올리고,<br>레벨 업마다 특별한 능력을 고르세요!</p><button class="btn" id="go">시작</button></div>
</div>
<script>
'use strict';
const R = Math.random, $ = (id) => document.getElementById(id), pick = (a) => a[Math.floor(R() * a.length)];
const HERO = new Image(); HERO.src = '/games/lane-hero/hero.webp';
const MONS = new Image(); MONS.src = '/games/lane-hero/mons.webp';
// ---------- 능력(퍼크) ----------
const RAR = { 일반: { c: '#9fd3a8', w: 50 }, 희귀: { c: '#7cc0ff', w: 30 }, 영웅: { c: '#c79bff', w: 15 }, 신화: { c: '#ff6f61', w: 6 } };
const PERKS = [
  { id: 'bolt', r: '신화', ic: '⚡', bg: '#3c5bd6', d: '공격할 때마다 <em>낙뢰</em>가 무작위 적을 내리침 (공격력 60%)' },
  { id: 'rage', r: '신화', ic: '💥', bg: '#e0a028', d: '상시: 공격력 <u>+200%</u>, 대신 받는 피해 <u>+100%</u>' },
  { id: 'axe', r: '신화', ic: '🪓', bg: '#c83a32', d: '처치 시: <em>도끼</em>를 던져 무작위 적 2명에게 공격력 50% 피해' },
  { id: 'cleave', r: '영웅', ic: '🌀', bg: '#7a4fd0', d: '3번째 공격마다 <em>회전 베기</em>로 앞의 적 3명 동시 공격' },
  { id: 'burn', r: '영웅', ic: '🔥', bg: '#e0602a', d: '공격 시 <em>화상</em>: 3초 동안 초당 공격력 20% 피해' },
  { id: 'leech', r: '영웅', ic: '🩸', bg: '#a8283c', d: '입힌 피해의 <u>8%</u>만큼 체력 회복' },
  { id: 'shield', r: '영웅', ic: '🔰', bg: '#2a9a8c', d: '8초마다 <em>보호막</em>: 다음 피해 1번을 막음' },
  { id: 'crit', r: '희귀', ic: '🎯', bg: '#d04a6a', d: '치명타 확률 <u>+12%</u> (치명타는 2배 피해)' },
  { id: 'aspd', r: '희귀', ic: '💨', bg: '#3a9ad0', d: '공격 속도 <u>+25%</u>' },
  { id: 'counter', r: '희귀', ic: '🤺', bg: '#5a6ad0', d: '맞을 때 <u>20%</u> 확률로 반격 (공격력 100%)' },
  { id: 'dodge', r: '희귀', ic: '💫', bg: '#3aa070', d: '적 공격 회피 확률 <u>+10%</u>' },
  { id: 'hp', r: '일반', ic: '❤️', bg: '#c84a5a', d: '최대 체력 <u>+30%</u>, 체력 모두 회복' },
  { id: 'def', r: '일반', ic: '🛡️', bg: '#6a7a9a', d: '받는 피해 <u>-10%</u>' },
  { id: 'gold', r: '일반', ic: '💰', bg: '#c8a028', d: '처치 골드 <u>+40%</u>' },
];
// ---------- 골드 강화 (죽어도 유지) ----------
const UPS = [
  { k: 'atk', ic: '⚔️', n: '공격력', v: (l) => 12 + (l - 1) * 3, f: (v) => v, base: 8 },
  { k: 'spd', ic: '⚡', n: '공격 속도', v: (l) => 1.3 + (l - 1) * 0.08, f: (v) => v.toFixed(2) + '/초', base: 12 },
  { k: 'hp', ic: '❤️', n: '체력', v: (l) => 120 + (l - 1) * 20, f: (v) => v, base: 8 },
  { k: 'def', ic: '🛡️', n: '방어력', v: (l) => Math.min(60, (l - 1) * 3), f: (v) => v + '%', base: 14 },
  { k: 'crit', ic: '🎯', n: '치명타', v: (l) => 5 + (l - 1) * 2, f: (v) => v + '%', base: 14 },
  { k: 'ctr', ic: '🤺', n: '반격', v: (l) => (l - 1) * 3, f: (v) => v + '%', base: 16 },
];
const upCost = (u, l) => Math.round(u.base * Math.pow(1.28, l - 1));
let SAVE = JSON.parse(localStorage.getItem('lanehero') || 'null') || { gold: 0, lv: { atk: 1, spd: 1, hp: 1, def: 1, crit: 1, ctr: 1 }, best: 0 };
const save = () => localStorage.setItem('lanehero', JSON.stringify(SAVE));
const stat = (k) => UPS.find((u) => u.k === k).v(SAVE.lv[k]);

// ---------- 상태 ----------
let S, state = 'title';
function newRun() {
  S = { kills: 0, level: 1, exp: 0, perks: {}, hero: { hp: 0, max: 0, cd: 0.6, anim: 0, hitN: 0, shieldT: 0, shield: false, x: 0 }, foes: [], spawnK: 0, texts: [], fx: [], parts: [] };
  recalc(); S.hero.hp = S.hero.max; for (let i = 0; i < 6; i++) spawn(); renderPanel();
}
const P = (id) => S.perks[id] || 0;
function recalc() { const h = S.hero; const old = h.max || 1; h.max = Math.round(stat('hp') * (1 + 0.3 * P('hp'))); if (h.hp) h.hp = Math.min(h.max, h.hp * (h.max / old)); }
const ATK = () => stat('atk') * (1 + 2 * P('rage'));
const ASPD = () => stat('spd') * (1 + 0.25 * P('aspd'));
const CRIT = () => (stat('crit') + 12 * P('crit')) / 100;
const DEF = () => Math.min(0.8, stat('def') / 100 + 0.1 * P('def'));
const CTR = () => Math.min(0.8, stat('ctr') / 100 + 0.2 * P('counter'));
const DODGE = () => Math.min(0.6, 0.1 * P('dodge'));
const expNeed = () => 3 + S.level * 2;
function spawn() {
  const k = S.spawnK++, boss = k > 0 && k % 20 === 19, tier = Math.floor(k / 20);
  const hp = Math.round((14 + k * 2.2) * Math.pow(1.035, k) * (boss ? 6 : 1)), atk = (2 + k * 0.22) * Math.pow(1.015, k) * (boss ? 1.6 : 1);
  const last = S.foes[S.foes.length - 1];
  S.foes.push({ hp, max: hp, atk, cd: 1.2, x: Math.max(W + 40, last ? last.x + 74 : 0), img: boss ? 15 + (tier % 5) : (tier * 3 + Math.floor(R() * 4)) % 15, boss, burn: 0, hurt: 0, k });
}

// ---------- 화면 ----------
const cv = $('cv'), ctx = cv.getContext('2d'); let W, H, DPR, LANE;
function resize() { const r = $('stage').getBoundingClientRect(); W = r.width; H = r.height; DPR = Math.min(2, devicePixelRatio || 1); cv.width = W * DPR; cv.height = H * DPR; LANE = H * 0.6; }
addEventListener('resize', resize); resize();
function txt(x, y, s, col, big) { S.texts.push({ x, y, s, col, t: 0, big }); }
function dmgFoe(f, d, col, crit) { if (f.hp <= 0) return; f.hp -= d; f.hurt = 0.12; txt(f.x + (R() - 0.5) * 16, LANE - 70, crit ? Math.round(d) + '!' : Math.round(d), col || '#fff', crit);
  if (P('leech')) heal(d * 0.08 * P('leech'));
  if (f.hp <= 0) kill(f); }
function heal(v) { S.hero.hp = Math.min(S.hero.max, S.hero.hp + v); }
function kill(f) {
  S.kills++; SAVE.best = Math.max(SAVE.best, S.kills);
  const g = Math.round((2 + f.k * 0.25) * (f.boss ? 6 : 1) * (1 + 0.4 * P('gold')));
  for (let i = 0; i < Math.min(6, 2 + g / 6); i++) S.parts.push({ x: f.x, y: LANE - 30, vx: (R() - 0.3) * 160, vy: -200 - R() * 120, t: 0, kind: 'coin', tx: W / 2 + 60, ty: 36 });
  for (let i = 0; i < (f.boss ? 5 : 1); i++) S.parts.push({ x: f.x, y: LANE - 30, vx: (R() - 0.5) * 120, vy: -160, t: 0, kind: 'gem', tx: W * 0.5, ty: H + 20 });
  SAVE.gold += g; S.exp += f.boss ? 5 : 1; save();
  for (let i = 0; i < 14; i++) S.fx.push({ k: 'puff', x: f.x + (R() - 0.5) * 30, y: LANE - 30 + (R() - 0.5) * 30, t: 0, life: 0.5, r: 6 + R() * 10 });
  if (P('axe')) for (let j = 0; j < 2 * P('axe'); j++) { const tg = pick(S.foes.filter((o) => o.hp > 0 && o !== f)); if (tg) S.fx.push({ k: 'axe', x: S.hero.x, y: LANE - 60, tg, t: 0, life: 0.45 }); }
  if (S.exp >= expNeed()) { S.exp -= expNeed(); S.level++; setTimeout(levelUp, 350); }
  renderPanel();
}
function heroHit(f) {
  const h = S.hero; if (R() < DODGE()) { txt(h.x, LANE - 95, 'MISS', '#fff', true); return; }
  if (h.shield) { h.shield = false; txt(h.x, LANE - 95, '막음!', '#7ff0e0', true); return; }
  const d = f.atk * (1 - DEF()) * (1 + P('rage')); h.hp -= d; h.hurt = 0.15; txt(h.x + 10, LANE - 90, Math.round(d), '#ff6b6b');
  if (R() < CTR()) { S.fx.push({ k: 'slash', x: f.x, y: LANE - 30, t: 0, life: 0.25, col: '#9fb4ff' }); txt(h.x, LANE - 118, '반격!', '#9fb4ff'); dmgFoe(f, ATK(), '#9fb4ff'); }
  if (h.hp <= 0) die();
}
function die() { state = 'dead'; $('deadTxt').textContent = `처치 ${S.kills} · 레벨 ${S.level} · 최고 기록 ${SAVE.best}`; $('dead').hidden = false; }

// ---------- 진행 ----------
function update(dt) {
  if (state !== 'play') return;
  const h = S.hero; h.x = W * 0.2; h.anim = Math.max(0, h.anim - dt); h.hurt = Math.max(0, (h.hurt || 0) - dt);
  heal(h.max * 0.02 * dt);
  if (P('shield') && !h.shield) { h.shieldT += dt; if (h.shieldT > 8) { h.shieldT = 0; h.shield = true; } }
  // 적 이동: 앞 적은 용사 앞에서 멈추고, 뒤 적은 줄을 선다
  const alive = S.foes.filter((f) => f.hp > 0);
  alive.forEach((f, i) => { const stopX = i === 0 ? h.x + 82 : alive[i - 1].x + 70; if (f.x > stopX) f.x = Math.max(stopX, f.x - 90 * dt); f.hurt = Math.max(0, f.hurt - dt);
    if (f.burn > 0) { f.burn -= dt; dmgFoeQuiet(f, ATK() * 0.2 * P('burn') * dt); }
    if (i === 0 && f.x <= stopX + 1) { f.cd -= dt; if (f.cd <= 0) { f.cd = f.boss ? 1.4 : 1.2; f.lunge = 0.2; heroHit(f); } } f.lunge = Math.max(0, (f.lunge || 0) - dt); });
  S.foes = S.foes.filter((f) => f.hp > 0 || f.x > -100); S.foes = S.foes.filter((f) => f.hp > 0);
  while (S.foes.length < 6) spawn();
  // 용사 공격
  const front = S.foes[0];
  h.cd -= dt;
  if (front && front.x <= h.x + 84 && h.cd <= 0) { h.cd = 1 / ASPD(); h.anim = 0.25; h.hitN++;
    const targets = P('cleave') && h.hitN % 3 === 0 ? S.foes.slice(0, 3) : [front];
    for (const f of targets) { if (R() < 0.05) { txt(f.x, LANE - 70, 'MISS', '#fff', true); continue; } const cr = R() < CRIT(); dmgFoe(f, ATK() * (cr ? 2 : 1), cr ? '#ffd84a' : '#fff', cr); if (P('burn')) f.burn = 3; }
    S.fx.push({ k: 'slash', x: front.x - 10, y: LANE - 30, t: 0, life: 0.22, col: targets.length > 1 ? '#c79bff' : '#fff', big: targets.length > 1 });
    if (P('bolt')) for (let j = 0; j < P('bolt'); j++) { const tg = pick(S.foes.filter((o) => o.hp > 0)); if (tg) { S.fx.push({ k: 'bolt', x: tg.x, t: 0, life: 0.25 }); dmgFoe(tg, ATK() * 0.6, '#9fd0ff'); } } }
  for (const f of S.fx) { f.t += dt; if (f.k === 'axe' && f.t >= f.life && !f.done) { f.done = true; dmgFoe(f.tg, ATK() * 0.5, '#ffb07a'); } } S.fx = S.fx.filter((f) => f.t < f.life);
  for (const t of S.texts) t.t += dt; S.texts = S.texts.filter((t) => t.t < 0.8);
  for (const p of S.parts) { p.t += dt; if (p.t < 0.35) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; } else { p.x += (p.tx - p.x) * Math.min(1, dt * 7); p.y += (p.ty - p.y) * Math.min(1, dt * 7); } } S.parts = S.parts.filter((p) => p.t < 1.1);
}
function dmgFoeQuiet(f, d) { if (f.hp <= 0) return; f.hp -= d; if (f.hp <= 0) kill(f); }

// ---------- 그리기 ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const TREES = Array.from({ length: 9 }, (_, i) => ({ x: i * 0.13 + R() * 0.05, s: 0.7 + R() * 0.5, y: R() * 0.25 }));
function drawBg(t) {
  ctx.fillStyle = '#6e9a6a'; ctx.fillRect(0, 0, W, H);
  for (const tr of TREES) { const x = ((tr.x * W - t * 6) % (W + 120) + W + 120) % (W + 120) - 60, y = H * (0.08 + tr.y), s = 46 * tr.s;
    ctx.fillStyle = '#6b4f36'; ctx.fillRect(x - 5, y, 10, s * 1.6); ctx.fillStyle = '#4f8a4a'; for (const [dx, dy, r] of [[0, -s * 0.2, s * 0.75], [-s * 0.55, s * 0.2, s * 0.55], [s * 0.55, s * 0.2, s * 0.55]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, 6.28); ctx.fill(); }
    ctx.fillStyle = '#5ea458'; ctx.beginPath(); ctx.arc(x - s * 0.15, y - s * 0.35, s * 0.4, 0, 6.28); ctx.fill(); }
  const top = LANE - 70, bot = LANE + 70; ctx.fillStyle = '#d6a888'; ctx.fillRect(0, top, W, bot - top);
  ctx.fillStyle = '#5f8f5a'; for (let x = -10; x < W + 10; x += 16) { ctx.beginPath(); ctx.arc(x, top, 9, 0, Math.PI); ctx.fill(); ctx.beginPath(); ctx.arc(x + 8, bot, 9, Math.PI, 6.28); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,.05)'; for (let i = 0; i < 18; i++) ctx.fillRect((i * 97) % W, top + 20 + ((i * 53) % 100), 14, 4);
}
function bar(x, y, w, v, max, col, label) { ctx.fillStyle = '#0d1020'; rr(x - w / 2 - 2, y - 2, w + 4, 16, 4); ctx.fill(); ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * Math.max(0, v / max), 12);
  ctx.fillStyle = '#fff'; ctx.font = '900 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(label, x, y + 6); ctx.fillText(label, x, y + 6); }
function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawBg(t); if (!S) return;
  const h = S.hero;
  // 적 (뒤에서부터)
  for (let i = S.foes.length - 1; i >= 0; i--) { const f = S.foes[i]; if (f.x > W + 60) continue; const s = f.boss ? 120 : 82, lx = f.x - (f.lunge ? Math.sin(f.lunge / 0.2 * Math.PI) * 14 : 0), bob = Math.abs(Math.sin(t * 6 + i)) * 3;
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(lx, LANE + 6, s * 0.36, 8, 0, 0, 6.28); ctx.fill();
    if (MONS.complete) { ctx.save(); ctx.translate(lx, LANE - bob); ctx.scale(-1, 1); if (f.hurt > 0) ctx.filter = 'brightness(2.2)'; ctx.drawImage(MONS, f.img * 128, 0, 128, 128, -s / 2, -s + 8, s, s); ctx.restore(); }
    if (f.burn > 0) { ctx.fillStyle = 'rgba(255,120,40,.6)'; ctx.beginPath(); ctx.arc(lx, LANE - s * 0.5, 6 + Math.sin(t * 20) * 2, 0, 6.28); ctx.fill(); }
    bar(lx, LANE + 18, f.boss ? 70 : 48, f.hp, f.max, '#d23a3a', Math.max(0, Math.ceil(f.hp))); }
  // 용사
  const fr = h.anim > 0.15 ? 1 : h.anim > 0 ? 2 : 0, push = h.anim > 0 ? 10 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(h.x, LANE + 6, 26, 8, 0, 0, 6.28); ctx.fill();
  if (HERO.complete) { ctx.save(); if (h.hurt > 0) ctx.filter = 'brightness(1.8) sepia(1) hue-rotate(-40deg)'; ctx.drawImage(HERO, fr * 192, 0, 192, 160, h.x - 84 + push, LANE - 150, 168, 140); ctx.restore(); }
  if (h.shield) { ctx.strokeStyle = 'rgba(127,240,224,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, LANE - 42, 46, 0, 6.28); ctx.stroke(); }
  bar(h.x, LANE + 18, 56, h.hp, h.max, '#3fcf5a', Math.max(0, Math.ceil(h.hp)));
  // 효과
  for (const f of S.fx) { const k = f.t / f.life; ctx.globalAlpha = 1 - k;
    if (f.k === 'slash') { ctx.strokeStyle = f.col; ctx.lineWidth = f.big ? 8 : 5; ctx.beginPath(); ctx.arc(f.x - 20, f.y, f.big ? 70 : 40, -1.1 + k, 0.9 + k); ctx.stroke(); }
    else if (f.k === 'bolt') { ctx.strokeStyle = '#d8ecff'; ctx.lineWidth = 4; ctx.shadowColor = '#7cc0ff'; ctx.shadowBlur = 14; ctx.beginPath(); let x = f.x + (R() - 0.5) * 20, y = 0; ctx.moveTo(x, y); while (y < LANE - 30) { y += 26; x = f.x + (R() - 0.5) * 30; ctx.lineTo(x, y); } ctx.stroke(); ctx.shadowBlur = 0; }
    else if (f.k === 'axe') { const x = f.x + (f.tg.x - f.x) * k, y = f.y - Math.sin(k * Math.PI) * 120 + (LANE - 40 - f.y) * k; ctx.globalAlpha = 1; ctx.save(); ctx.translate(x, y); ctx.rotate(k * 14); ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🪓', 0, 0); ctx.restore(); }
    else if (f.k === 'puff') { ctx.fillStyle = '#5a4a40'; ctx.beginPath(); ctx.arc(f.x, f.y - k * 20, f.r * (1 + k), 0, 6.28); ctx.fill(); }
    ctx.globalAlpha = 1; }
  for (const p of S.parts) { if (p.kind === 'coin') { ctx.fillStyle = '#ffcf3a'; ctx.strokeStyle = '#b07a10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, 6.28); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = '#5ef08a'; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(0.78); ctx.fillRect(-6, -6, 12, 12); ctx.restore(); } }
  for (const tx of S.texts) { const k = tx.t / 0.8; ctx.globalAlpha = 1 - k * k; ctx.font = `900 ${tx.big ? 22 : 17}px system-ui`; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.strokeText(tx.s, tx.x, tx.y - k * 30); ctx.fillStyle = tx.col; ctx.fillText(tx.s, tx.x, tx.y - k * 30); } ctx.globalAlpha = 1;
  // 상단: 처치 수 · 골드
  const by = 22; for (const [i, ic, v] of [[0, '💀', S.kills], [1, '🪙', SAVE.gold]]) { const x = W / 2 - 112 + i * 120; ctx.fillStyle = 'rgba(20,24,40,.75)'; rr(x, by, 104, 34, 9); ctx.fill(); ctx.font = '18px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(ic, x + 8, by + 18); ctx.fillStyle = '#fff'; ctx.font = '900 18px system-ui'; ctx.textAlign = 'right'; ctx.fillText(v, x + 96, by + 18); }
  const nb = 20 - (S.kills % 20); ctx.font = '800 12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(nb === 20 ? '' : `보스까지 ${nb}마리`, W / 2, by + 50);
}
// ---------- 아래 패널 ----------
function renderPanel() {
  $('lvTxt').textContent = S.level; $('expTxt').textContent = `${S.exp}/${expNeed()}`; $('expBar').style.width = (S.exp / expNeed()) * 100 + '%';
  $('perks').innerHTML = Object.entries(S.perks).map(([id, n]) => { const p = PERKS.find((x) => x.id === id); return `<div class="pk" style="background:${p.bg}">${p.ic}${n > 1 ? `<small>×${n}</small>` : ''}</div>`; }).join('') || '<span style="font-size:12px;color:#8d97c0;align-self:center">레벨 업으로 얻은 능력이 여기에 모여요</span>';
  $('ups').innerHTML = ''; for (const u of UPS) { const l = SAVE.lv[u.k], c = upCost(u, l), d = document.createElement('div'); d.className = 'up' + (SAVE.gold < c ? ' no' : '');
    d.innerHTML = `<div class="ic">${u.ic}</div><div class="t"><b>${u.n}</b><span>${u.f(u.v(l))} → ${u.f(u.v(l + 1))}</span></div><div class="c">🪙${c}</div>`;
    d.onclick = () => { if (SAVE.gold < c) return; SAVE.gold -= c; SAVE.lv[u.k]++; save(); if (u.k === 'hp') { recalc(); S.hero.hp = Math.min(S.hero.max, S.hero.hp + 20); } renderPanel(); }; $('ups').append(d); }
}
let panelT = 0;
function levelUp() {
  if (state !== 'play') return; state = 'pause'; const box = $('cards'); box.innerHTML = ''; const pool = [...PERKS], picks = [];
  while (picks.length < 3) { const tot = pool.reduce((s, p) => s + RAR[p.r].w, 0); let r = R() * tot; const i = pool.findIndex((p) => (r -= RAR[p.r].w) < 0); picks.push(pool.splice(i, 1)[0]); }
  for (const p of picks) { const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="r" style="background:${RAR[p.r].c}">${p.r}${P(p.id) ? ` · 보유 ${P(p.id)}` : ''}</div><div class="ic" style="background:${p.bg}">${p.ic}</div><div class="d">${p.d}</div>`;
    c.onclick = () => { S.perks[p.id] = P(p.id) + 1; if (p.id === 'hp') { recalc(); S.hero.hp = S.hero.max; } $('lvUp').hidden = true; state = 'play'; renderPanel(); }; box.append(c); }
  $('lvUp').hidden = false; renderPanel();
}
$('go').onclick = () => { $('title').hidden = true; newRun(); state = 'play'; };
$('again').onclick = () => { $('dead').hidden = true; newRun(); state = 'play'; };
let last = performance.now();
function loop(t) { requestAnimationFrame(loop); const dt = Math.min(0.05, (t - last) / 1000) * SPEED; last = t; update(dt); draw(t / 1000); if ((panelT += dt) > 0.5) { panelT = 0; if (S && state === 'play') renderPanel(); } }
const SPEED = Number((location.search.match(/speed=(\d+)/) || [])[1] || 1);
newRun(); requestAnimationFrame(loop);
if (/test/.test(location.search)) window.__lh = { get S() { return S; }, get state() { return state; }, SAVE, start() { $('title').hidden = true; state = 'play'; } };
</script>
