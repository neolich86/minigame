const FLASH=new Map();
let loaded=0,total=0,ready=false;
function flashOf(img){
  if(FLASH.has(img))return FLASH.get(img);
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  x.globalCompositeOperation='source-atop';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  FLASH.set(img,c);return c;
}

let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC;}
function beep(f,d,t,v,sl){if(muted)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),gn=a.createGain();o.type=t||'square';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),a.currentTime+d);
  gn.gain.setValueAtTime(v||.06,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
  o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){if(muted)return;const a=ac();if(!a)return;
  const n=Math.floor(a.sampleRate*d),bf=a.createBuffer(1,n,a.sampleRate),ch=bf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),gn=a.createGain(),fl=a.createBiquadFilter();
  fl.type='lowpass';fl.frequency.setValueAtTime(1800,a.currentTime);
  fl.frequency.exponentialRampToValueAtTime(180,a.currentTime+d);
  gn.gain.setValueAtTime(v||.18,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  s.buffer=bf;s.connect(fl);fl.connect(gn);gn.connect(a.destination);s.start();}
const SFX={

  laser:()=>beep(1500,.09,'sawtooth',.028,700),
  hit:()=>beep(240,.04,'square',.03,140),
  boom:()=>noise(.35,.22), small:()=>noise(.16,.11),
  item:()=>{beep(700,.07,'triangle',.08,1200);setTimeout(()=>beep(1200,.09,'triangle',.07,1800),60)},
  bomb:()=>{noise(.8,.3);beep(120,.7,'sawtooth',.12,40)},
  dead:()=>{beep(400,.6,'sawtooth',.12,60);noise(.6,.2)},
  warn:()=>beep(300,.15,'square',.07,600),
  sel:()=>beep(660,.06,'square',.05,990),
};

const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  keys[k]=true;
  if(state==='select'){
    if(k==='arrowleft'||k==='a'){sel=(sel+SHIPS.length-1)%SHIPS.length;SFX.sel();}
    if(k==='arrowright'||k==='d'){sel=(sel+1)%SHIPS.length;SFX.sel();}
    if(k==='arrowup'||k==='w'){sel=(sel+3)%SHIPS.length;SFX.sel();}
    if(k==='arrowdown'||k==='s'){sel=(sel+3)%SHIPS.length;SFX.sel();}
  }
  if(k==='enter'||k===' ')act(null);
  if(k==='x'||k==='b')useBomb();
  if(k==='p')togglePause();
},{passive:false});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

let touch={on:false,px:0,py:0};
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
cv.addEventListener('touchstart',e=>{e.preventDefault();ac();const p=pos(e);
  touch.on=true;touch.px=p.x;touch.py=p.y;act(p);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=pos(e);
  if(touch.on&&state==='play'&&!P.dead){P.x+=(p.x-touch.px)*1.25;P.y+=(p.y-touch.py)*1.25;clampP();}
  touch.px=p.x;touch.py=p.y;},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();touch.on=false},{passive:false});
cv.addEventListener('mousedown',e=>{ac();const p=pos(e);touch.on=true;touch.px=p.x;touch.py=p.y;act(p)});
addEventListener('mouseup',()=>touch.on=false);

const CELL={x:36,y:268,w:136,h:150,gap:0};
function cellRect(i){const cx=i%3,cy=(i/3)|0;
  return{x:CELL.x+cx*136,y:CELL.y+cy*150,w:128,h:142};}
function hitCell(p){
  for(let i=0;i<SHIPS.length;i++){const r=cellRect(i);
    if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)return i;}
  return -1;
}

/* ---------- 무기 ---------- */
const COL={red:'#ff5a4a',blue:'#5ad2ff',purple:'#c46bff'};
const BASE={red:1.0,blue:1.5,purple:1.25},RATE={red:120,blue:105,purple:170};
const dmgOf=t=>BASE[t]*(1+0.35*(WP.dmg[t]-1));
function shoot(){
  const t=WP.type,lv=WP.lv[t],d=dmgOf(t);
  if(t==='red'){
    const n=lv+1,sp=Math.min(26+lv*10,104)*Math.PI/180;
    for(let i=0;i<n;i++){const a=-Math.PI/2+(n===1?0:-sp/2+sp*i/(n-1));
      pBul.push({x:P.x,y:P.y-14,vx:Math.cos(a)*480,vy:Math.sin(a)*480,r:4,d,t:'red',ang:a});}
    SFX.shot();
  }else if(t==='blue'){
    const n=lv+1,wd=Math.min(9*lv,46);
    for(let i=0;i<n;i++){const off=n===1?0:-wd+2*wd*i/(n-1),a=-Math.PI/2+off*0.0016;
      pBul.push({x:P.x+off*.55,y:P.y-16,vx:Math.cos(a)*640,vy:Math.sin(a)*640,r:4,d,t:'blue',ang:a});}
    SFX.shot();
  }else{
    const n=Math.min(2+Math.floor((lv-1)/2),6);
    for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*0.42;
      pBul.push({x:P.x,y:P.y-10,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:5,d:d*1.1,t:'purple',ang:a,home:true,trail:[]});}
    SFX.laser();
  }
}
function getPower(col){
  if(WP.type!==col){WP.type=col;WP.lv[col]=Math.min(WP.lv[col]+1,MAXLV);
    msg(col==='red'?'RED — 부채꼴 확산탄':col==='blue'?'BLUE — 전방 확산탄':'PURPLE — 유도 레이저',COL[col]);
  }else{WP.lv[col]=Math.min(WP.lv[col]+1,MAXLV);WP.dmg[col]=Math.min(WP.dmg[col]+1,MAXDMG);
    msg('POWER '+WP.lv[col]+'  ·  DAMAGE Lv'+WP.dmg[col],COL[col]);}
  powerGot++;SFX.item();ring(P.x,P.y,COL[col],70);
}

/* ---------- 적 ---------- */
function spawnEnemy(kind,x,y,opt){
  const D=1+(stage_-1)*0.35;
  const E=Object.assign({x,y,vx:0,vy:60,hp:3,r:12,kind,t:0,score:100,fire:rnd(600,1400),hit:0,sway:rnd(0,6.28)},opt||{});
  if(kind==='fighter'){E.hp=3*D;E.r=13;E.vy=140;E.score=100;E.img=pick(IMG.enemyA);}
  if(kind==='zig'){E.hp=5*D;E.r=15;E.vy=95;E.score=180;E.img=pick(IMG.enemyB);}
  if(kind==='dive'){E.hp=2*D;E.r=12;E.vy=250;E.score=150;E.img=pick(IMG.enemyA);}
  if(kind==='heavy'){E.hp=22*D;E.r=24;E.vy=45;E.score=600;E.fire=900;E.img=pick(IMG.enemyC);}
  E.maxhp=E.hp;ens.push(E);return E;
}
function wave(){
  const D=Math.min(stage_,5),r=Math.random();
  if(r<.34){const cx=rnd(90,W-90);
    for(let i=0;i<5;i++)spawnEnemy('fighter',cx+(i-2)*38,-40-Math.abs(i-2)*34,{vy:150});}
  else if(r<.6){for(let i=0;i<4+D;i++)spawnEnemy('zig',rnd(50,W-50),-40-i*60);}
  else if(r<.8){for(let i=0;i<3+D;i++)spawnEnemy('dive',rnd(40,W-40),-30-i*45);}
  else{spawnEnemy('heavy',rnd(100,W-100),-70);
    for(let i=0;i<3;i++)spawnEnemy('fighter',rnd(50,W-50),-100-i*50);}
  waveT=Math.max(1100,2200-stage_*120);
}

/* ---------- 아이템 ---------- */
function dropItem(x,y,forced){
  const r=Math.random();let type=null;
  if(forced==='power'||r<.20)type=pick(['red','blue','purple']);
  else if(forced==='bomb'||r<.28)type='bomb';
  if(!type)return;
  items.push({x,y,vy:55,type,t:rnd(0,6.28)});noDrop=0;
}
function pickItem(it){
  if(it.type==='bomb'){bombGot++;P.bombs=Math.min(P.bombs+1,9);SFX.item();
    ring(P.x,P.y,'#ffd45a',70);msg('BOMB +1','#ffd45a');}
  else getPower(it.type);
  score+=300;
  if(!bossOn&&!boss&&powerGot>=needP&&bombGot>=needB&&warn<=0){warn=150;SFX.warn();}
}

/* ---------- 보스 ---------- */
function spawnBoss(){
  const img=IMG.boss[(stage_-1)%IMG.boss.length];
  const hp=520+(stage_-1)*420;
  boss={img,x:W/2,y:-((img.height||200)),hp,max:hp,t:0,phase:0,mode:0,mt:0,enter:true,hit:0,dying:0,
        w:img.width||220,h:img.height||200};
  boss.hy=60+boss.h*0.42;
  bossOn=true;ens.length=0;eBul.length=0;
}
function bossUpdate(dt){
  const b=boss;b.t+=dt;b.hit=Math.max(0,b.hit-1);
  if(b.dying>0){
    b.dying-=dt;b.y+=10*dt;
    if(Math.random()<.4){burst(b.x+rnd(-b.w/2,b.w/2),b.y+rnd(-b.h/3,b.h/3),8,'#ffb14a',5,4);SFX.small();}
    if(b.dying<=0){burst(b.x,b.y,90,'#fff0a0',9,6);ring(b.x,b.y,'#ffd45a',300);SFX.boom();
      shake=26;flash=18;score+=8000*stage_;boss=null;bossOn=false;state='clear';clearT=190;if(window.MGH)MGH.submitScore('raiden',score,{stage:stage_});}
    return;
  }
  if(b.enter){b.y+=95*dt;if(b.y>=b.hy){b.y=b.hy;b.enter=false;}return;}
  const amp=Math.max(20,(W-b.w)/2+30);
  b.x=W/2+Math.sin(b.t*.5)*amp;
  const pct=b.hp/b.max;b.phase=pct<.35?2:pct<.7?1:0;
  b.mt-=dt*1000;
  if(b.mt<=0){b.mode=(b.mode+1)%(b.phase>=1?4:3);
    b.mt=b.phase===2?900:b.phase===1?1150:1400;fireBoss(b);}
}
function fireBoss(b){
  const sp=140+stage_*12,aim=Math.atan2(P.y-b.y,P.x-b.x),gy=b.h*0.3;
  if(b.mode===0){
    const n=14+b.phase*6;
    for(let i=0;i<n;i++){const a=aim+i*6.283/n;
      eBul.push({x:b.x,y:b.y+gy*.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,c:'#ff8ad0'});}
    burst(b.x,b.y+gy*.4,10,'#ff8ad0',3,3);SFX.hit();
  }else if(b.mode===1){
    let k=0;const iv=setInterval(()=>{
      if(!boss||state!=='play'){clearInterval(iv);return;}
      const a2=Math.atan2(P.y-boss.y,P.x-boss.x);
      for(let i=-2;i<=2;i++){const a=a2+i*.13;
        eBul.push({x:boss.x,y:boss.y+gy*.4,vx:Math.cos(a)*sp*1.5,vy:Math.sin(a)*sp*1.5,r:4,c:'#ffd45a'});}
      if(++k>=3)clearInterval(iv);},140);
  }else if(b.mode===2){
    [-b.w*0.3,b.w*0.3].forEach(ox=>{
      burst(b.x+ox,b.y+gy,8,'#8affd0',3,3);
      for(let i=0;i<7;i++){const a=Math.PI/2+(i-3)*.19;
        eBul.push({x:b.x+ox,y:b.y+gy,vx:Math.cos(a)*sp*1.1,vy:Math.sin(a)*sp*1.1,r:5,c:'#8affd0'});}});
  }else{for(let i=0;i<3;i++)spawnEnemy('dive',b.x+(i-1)*70,b.y+gy,{vy:210});}
}

/* ---------- 흐름 ---------- */
function reset(full){
  if(full){score=0;stage_=1;const s=SHIPS[sel];
    P.ship=sel;P.spd=s.spd;P.rate=s.rate;P.r=s.hit;P.lives=3;P.bombs=s.bomb;
    WP.type=s.w;WP.lv={red:1,blue:1,purple:1};WP.dmg={red:1,blue:1,purple:1};WP.lv[s.w]=2;}
  P.x=W/2;P.y=H-110;P.dead=false;P.inv=120;
  eBul=[];pBul=[];ens=[];items=[];parts=[];rings=[];msgs=[];
  powerGot=0;bombGot=0;bossOn=false;boss=null;warn=0;waveT=800;noDrop=0;
}
function act(p){
  ac();
  if(!ready)return;
  if(state==='title'){state='select';SFX.sel();return;}
  if(state==='select'){
    if(p){const i=hitCell(p);
      if(i>=0){ if(i===sel){reset(true);state='play';SFX.item();} else {sel=i;SFX.sel();} return; }
      reset(true);state='play';SFX.item();return;}
    reset(true);state='play';SFX.item();return;
  }
  if(state==='over'){state='select';}
}
function togglePause(){if(state==='play')state='pause';else if(state==='pause')state='play';}
function useBomb(){
  if(state!=='play'||P.dead||P.bombs<=0)return;
  P.bombs--;SFX.bomb();shake=22;flash=26;eBul=[];
  ring(P.x,P.y,'#ffffff',420);ring(P.x,P.y,'#ffd45a',330);
  ens.forEach(e=>{e.hp-=40+stage_*10;e.hit=8;});
  if(boss&&!boss.enter&&boss.dying<=0){boss.hp-=140+stage_*30;boss.hit=10;
    if(boss.hp<=0){boss.hp=0;boss.dying=1.6;}}
  burst(P.x,P.y,60,'#fff2b0',7,5);
}
function killPlayer(){
  if(P.inv>0||P.dead)return;
  P.dead=true;P.resp=110;P.lives--;SFX.dead();shake=20;
  burst(P.x,P.y,60,'#ff9a5a',7,5);ring(P.x,P.y,'#ff6a4a',180);
  const t=WP.type;WP.lv[t]=Math.max(1,WP.lv[t]-2);WP.dmg[t]=Math.max(1,WP.dmg[t]-1);
  if(P.lives<0){state='over';high=Math.max(high,score);saveHigh();if(window.MGH)MGH.submitScore('raiden',score,{stage:stage_});openVs();}
}

/* ---------- 업데이트 ---------- */
function update(dt){
  T+=dt;scrollY+=dt*60;
  stars.forEach(s=>{s.y+=dt*(40+s.z*160);if(s.y>H){s.y=-2;s.x=Math.random()*W}});
  if(shake>0)shake-=dt*40; if(flash>0)flash-=dt*40;
  msgs.forEach(m=>m.life--);msgs=msgs.filter(m=>m.life>0);
  rings.forEach(r=>r.r+=dt*260);rings=rings.filter(r=>r.r<r.max);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life--});
  parts=parts.filter(p=>p.life>0);
  if(state!=='play'){if(state==='clear'){clearT-=dt*60;if(clearT<=0){stage_++;reset(false);state='play';}}return;}

  if(P.dead){P.resp-=dt*60;
    if(P.resp<=0&&P.lives>=0){P.dead=false;P.x=W/2;P.y=H-100;P.inv=140;}}
  else{
    const sp=290*P.spd*dt;let mx=0,my=0;
    if(keys['arrowleft']||keys['a'])mx--; if(keys['arrowright']||keys['d'])mx++;
    if(keys['arrowup']||keys['w'])my--; if(keys['arrowdown']||keys['s'])my++;
    if(mx||my){const l=Math.hypot(mx,my);P.x+=mx/l*sp;P.y+=my/l*sp;clampP();}
    P.tilt+=(mx*0.5-P.tilt)*0.2;P.eng+=dt*20;
    if(P.inv>0)P.inv-=dt*60;
    WP.cool-=dt*1000;
    if(WP.cool<=0){shoot();WP.cool=RATE[WP.type]*P.rate;}
  }

  if(!bossOn&&warn<=0){waveT-=dt*1000;if(waveT<=0)wave();}
  if(warn>0){warn-=dt*60;if(warn<=0)spawnBoss();}

  ens.forEach(e=>{
    e.t+=dt;e.hit=Math.max(0,e.hit-1);
    if(e.kind==='fighter')e.y+=e.vy*dt;
    else if(e.kind==='zig'){e.y+=e.vy*dt;e.x+=Math.sin(e.t*2.2+e.sway)*110*dt;}
    else if(e.kind==='dive'){
      if(e.t<0.5){const a=Math.atan2(P.y-e.y,P.x-e.x);e.vx=Math.cos(a)*220;e.vy=Math.sin(a)*260;}
      e.x+=e.vx*dt;e.y+=e.vy*dt;}
    else{e.y+=e.vy*dt;e.x+=Math.sin(e.t*.9)*60*dt;}
    e.fire-=dt*1000;
    if(e.fire<=0&&e.y>10&&e.y<H-140&&!P.dead){
      const a=Math.atan2(P.y-e.y,P.x-e.x),s=150+stage_*10;
      if(e.kind==='heavy'){for(let i=-1;i<=1;i++)
        eBul.push({x:e.x,y:e.y+10,vx:Math.cos(a+i*.22)*s,vy:Math.sin(a+i*.22)*s,r:5,c:'#ffd45a'});}
      else if(e.kind!=='dive')
        eBul.push({x:e.x,y:e.y+10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:4,c:'#ff8ad0'});
      e.fire=rnd(1100,2200)-stage_*60;}
    if(e.y>H+70||e.x<-80||e.x>W+80)e.dead=true;
  });

  if(boss)bossUpdate(dt);

  pBul.forEach(b=>{
    if(b.t==='purple'&&b.home){
      let tg=null,best=1e9;
      const list=boss&&!boss.enter&&boss.dying<=0?[boss]:ens;
      list.forEach(e=>{if(e.dead)return;const d=Math.hypot(e.x-b.x,e.y-b.y);
        if(e.y<b.y+120&&d<best){best=d;tg=e;}});
      let cur=Math.atan2(b.vy,b.vx);
      if(tg){const a=Math.atan2(tg.y-b.y,tg.x-b.x);
        let diff=((a-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        cur+=Math.max(-4.5*dt,Math.min(4.5*dt,diff));}
      const sp=Math.min(560,Math.hypot(b.vx,b.vy)+520*dt);
      b.vx=Math.cos(cur)*sp;b.vy=Math.sin(cur)*sp;b.ang=cur;
      b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-30||b.y>H+30||b.x<-30||b.x>W+30)b.dead=true;
  });

  pBul.forEach(b=>{
    if(b.dead)return;
    for(const e of ens){
      if(e.dead)continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        e.hp-=b.d;e.hit=6;b.dead=true;burst(b.x,b.y,3,COL[b.t],2.4,2);
        if(e.hp<=0){e.dead=true;score+=e.score*stage_;
          burst(e.x,e.y,e.kind==='heavy'?34:16,'#ffb14a',e.kind==='heavy'?6:4,e.kind==='heavy'?4:3);
          ring(e.x,e.y,'#ffd45a',e.kind==='heavy'?110:60);
          e.kind==='heavy'?SFX.boom():SFX.small();
          if(e.kind==='heavy')dropItem(e.x,e.y,'power');
          else{noDrop++;dropItem(e.x,e.y,noDrop>14?'power':null);}}
        break;}
    }
    if(!b.dead&&boss&&!boss.enter&&boss.dying<=0){
      if(Math.abs(boss.x-b.x)<boss.w*0.36&&Math.abs(boss.y-b.y)<boss.h*0.34){
        boss.hp-=b.d;boss.hit=5;b.dead=true;burst(b.x,b.y,3,COL[b.t],2.4,2);
        if(boss.hp<=0){boss.hp=0;boss.dying=1.6;}}}
  });
  pBul=pBul.filter(b=>!b.dead);

  eBul.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.dead=true;
    if(!P.dead&&P.inv<=0&&Math.hypot(P.x-b.x,P.y-b.y)<P.r+b.r-1){b.dead=true;killPlayer();}});
  eBul=eBul.filter(b=>!b.dead);

  if(!P.dead&&P.inv<=0){
    for(const e of ens)if(!e.dead&&Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r-2){killPlayer();break;}
    if(boss&&!boss.enter&&Math.abs(P.x-boss.x)<boss.w*0.32&&Math.abs(P.y-boss.y)<boss.h*0.3)killPlayer();
  }
  ens=ens.filter(e=>!e.dead);

  items.forEach(it=>{
    it.t+=dt;it.y+=it.vy*dt;it.x+=Math.sin(it.t*2)*22*dt;
    const d=Math.hypot(P.x-it.x,P.y-it.y);
    if(!P.dead&&d<74){const a=Math.atan2(P.y-it.y,P.x-it.x);
      it.x+=Math.cos(a)*190*dt;it.y+=Math.sin(a)*190*dt;}
    if(!P.dead&&d<20){it.dead=true;pickItem(it);}
    if(it.y>H+20)it.dead=true;});
  items=items.filter(i=>!i.dead);
}

/* ---------- 렌더 ---------- */
function sprite(img,x,y,rot,fl,sc){
  if(!img||!img.width)return;
  g.save();g.translate(x,y);if(rot)g.rotate(rot);if(sc)g.scale(sc,sc);
  g.drawImage(img,-img.width/2,-img.height/2);
  if(fl){g.globalAlpha=.85;g.drawImage(flashOf(img),-img.width/2,-img.height/2);g.globalAlpha=1;}
  g.restore();
}
function drawPlayer(){
  const img=IMG.player[P.ship];
  if(P.inv>0&&Math.floor(T*20)%2)g.globalAlpha=.35;
  const f=7+Math.sin(P.eng)*4,hh=(img&&img.height||46)/2;
  g.save();g.translate(P.x,P.y);
  const lg=g.createLinearGradient(0,hh-6,0,hh+f+12);
  lg.addColorStop(0,'rgba(200,245,255,.95)');lg.addColorStop(.45,'rgba(80,180,255,.7)');
  lg.addColorStop(1,'rgba(60,160,255,0)');
  g.fillStyle=lg;
  [-7,0,7].forEach((ox,i)=>{const s=i===1?1:.65;
    g.beginPath();g.moveTo(ox-3.5*s,hh-6);g.lineTo(ox+3.5*s,hh-6);g.lineTo(ox,hh+(f+10)*s);g.closePath();g.fill();});
  g.restore();
  sprite(img,P.x,P.y,P.tilt*.16,false);
  g.globalAlpha=1;
}
function drawEnemy(e){
  let rot=Math.PI;
  if(e.kind==='dive')rot=Math.atan2(e.vy,e.vx)+Math.PI/2;
  sprite(e.img,e.x,e.y,rot,e.hit>0);
  if(e.kind==='heavy'){
    const p=Math.max(0,e.hp/e.maxhp);
    g.fillStyle='rgba(0,0,0,.65)';g.fillRect(e.x-24,e.y-e.img.height/2-8,48,4);
    g.fillStyle=p<.35?'#ff5a4a':'#ffb14a';g.fillRect(e.x-24,e.y-e.img.height/2-8,48*p,4);
  }
}
function drawBoss(b){
  sprite(b.img,b.x,b.y,0,b.hit>0);
  if(!b.enter&&b.dying<=0){
    const p=b.hp/b.max;
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(40,28,W-80,10);
    g.fillStyle=p<.35?'#ff5a4a':p<.7?'#ffb14a':'#7fe8ff';g.fillRect(42,30,(W-84)*p,6);
    g.strokeStyle='#9ff5c8';g.lineWidth=1;g.strokeRect(40.5,28.5,W-81,9);
    g.fillStyle='#9ff5c8';g.font='9px monospace';g.fillText('BOSS',12,37);
  }
}
function drawItem(it){
  const c=it.type==='bomb'?'#ffd45a':COL[it.type],s=9+Math.sin(it.t*5)*1.6;
  g.save();g.translate(it.x,it.y);g.shadowBlur=14;g.shadowColor=c;
  g.fillStyle='#08120f';g.strokeStyle=c;g.lineWidth=2.5;
  if(it.type==='bomb'){g.beginPath();g.arc(0,0,s+1,0,6.28);g.fill();g.stroke();}
  else{g.fillRect(-s,-s,s*2,s*2);g.strokeRect(-s,-s,s*2,s*2);}
  g.shadowBlur=0;g.fillStyle=c;g.font='bold 12px monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText(it.type==='bomb'?'B':it.type==='red'?'R':it.type==='blue'?'S':'L',0,1);
  g.textAlign='left';g.textBaseline='alphabetic';g.restore();
}
function drawBul(b){
  if(b.t==='purple'){
    g.strokeStyle='rgba(196,107,255,.5)';g.lineWidth=6;g.beginPath();
    b.trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.lineTo(b.x,b.y);g.stroke();
    g.strokeStyle='#f2d9ff';g.lineWidth=2.5;g.beginPath();
    b.trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.lineTo(b.x,b.y);g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,3.4,0,6.28);g.fill();
  }else{
    g.save();g.translate(b.x,b.y);g.rotate(b.ang+Math.PI/2);
    g.fillStyle=b.t==='red'?'rgba(255,90,74,.45)':'rgba(90,210,255,.45)';g.fillRect(-4,-11,8,22);
    g.fillStyle=b.t==='red'?'#ffd0b0':'#d6f4ff';g.fillRect(-1.7,-9,3.4,18);g.restore();
  }
}
function bg(){
  g.fillStyle='#0a1410';g.fillRect(0,0,W,H);
  g.fillStyle='#0e1c16';
  for(let i=-1;i<9;i++){const y=((i*100+scrollY*0.5)%(H+200))-100;g.fillRect(0,y,W,50);}
  g.fillStyle='rgba(60,110,80,.10)';
  g.fillRect(40,0,3,H);g.fillRect(W-46,0,3,H);
  const rx=(scrollY*.35)%160;
  for(let i=-1;i<7;i++)g.fillRect(40,((i*160+rx)%(H+160))-80,W-86,4);
  stars.forEach(s=>{g.fillStyle='rgba(180,255,220,'+(s.z*.5)+')';g.fillRect(s.x,s.y,1.6,1.6+s.z*3);});
}
function drawHUD(){
  g.font='11px monospace';g.textBaseline='alphabetic';g.fillStyle='#9ff5c8';
  g.fillText('SCORE '+String(score).padStart(8,'0'),8,16);
  g.fillText('HI '+String(high).padStart(8,'0'),W/2-46,16);
  g.fillText('STAGE '+stage_,W-72,16);
  const pi=IMG.player[P.ship];
  for(let i=0;i<Math.max(0,P.lives);i++)
    if(pi&&pi.width){g.save();g.translate(18+i*18,H-16);g.scale(.42,.42);
      g.drawImage(pi,-pi.width/2,-pi.height/2);g.restore();}
  const t=WP.type;
  g.fillStyle=COL[t];g.fillRect(8,H-46,10,10);
  g.fillStyle='#cfe6d8';
  g.fillText((t==='red'?'SPREAD':t==='blue'?'STRAIGHT':'LASER')+'  P'+WP.lv[t]+'  DMG'+WP.dmg[t],24,H-37);

    g.fillStyle='#5c7a6c';g.fillText('BOSS',W-118,H-37);
    for(let i=0;i<needP;i++){g.fillStyle=i<powerGot?'#9ff5c8':'#26382f';
      g.beginPath();g.arc(W-84+i*15,H-41,5,0,6.28);g.fill();}
    g.fillStyle=bombGot>=needB?'#ffd45a':'#3a3524';g.fillText('B',W-30,H-37);
  }
  document.getElementById('bombN').textContent=P.bombs;
}
function center(lines){
  g.textAlign='center';
  lines.forEach((L,i)=>{g.font=L.f||'bold 26px monospace';g.fillStyle=L.c||'#9ff5c8';
    g.fillText(L.t,W/2,H/2-40+i*(L.h||34));});
  g.textAlign='left';
}
function drawSelect(){
  g.fillStyle='rgba(4,10,8,.82)';g.fillRect(0,0,W,H);
  g.textAlign='center';
  g.font='bold 26px monospace';g.fillStyle='#9ff5c8';g.fillText('SELECT YOUR SHIP',W/2,80);
  g.font='11px monospace';g.fillStyle='#5c7a6c';g.fillText('기체를 고르고 한 번 더 누르면 출격',W/2,102);
  const s=SHIPS[sel],img=IMG.player[sel];
  if(img&&img.width){g.save();g.translate(W/2,178);g.scale(1.9,1.9);
    g.drawImage(img,-img.width/2,-img.height/2);g.restore();}
  g.font='bold 18px monospace';g.fillStyle='#ffd45a';g.fillText(s.n,W/2,232);
  g.font='11px monospace';g.fillStyle='#cfe6d8';g.fillText(s.d,W/2,250);
  SHIPS.forEach((sh,i)=>{
    const r=cellRect(i),on=i===sel;
    g.fillStyle=on?'rgba(30,80,60,.55)':'rgba(10,24,18,.6)';g.fillRect(r.x,r.y,r.w,r.h);
    g.strokeStyle=on?'#9ff5c8':'#26382f';g.lineWidth=on?2:1;g.strokeRect(r.x+.5,r.y+.5,r.w,r.h);
    const im=IMG.player[i];
    if(im&&im.width){g.save();g.translate(r.x+r.w/2,r.y+50);g.scale(1.05,1.05);
      if(!on)g.globalAlpha=.75;g.drawImage(im,-im.width/2,-im.height/2);g.restore();}
    g.font='bold 11px monospace';g.fillStyle=on?'#9ff5c8':'#6d8b7c';g.fillText(sh.n,r.x+r.w/2,r.y+92);
    g.fillStyle=COL[sh.w];g.fillRect(r.x+r.w/2-24,r.y+100,48,3);
    g.font='9px monospace';g.fillStyle='#7ea592';
    g.fillText('SPD '+sh.spd.toFixed(2),r.x+r.w/2,r.y+117);
    g.fillText('RATE '+(1/sh.rate).toFixed(2)+'  💣'+sh.bomb,r.x+r.w/2,r.y+130);
  });
  g.font='11px monospace';g.fillStyle='#5c7a6c';
  g.fillText('방향키로 선택 · ENTER 출격   |   탭으로 선택 · 다시 탭 출격',W/2,600);
  g.textAlign='left';
}
function render(){
  bg();
  g.save();
  if(shake>0)g.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
  items.forEach(drawItem);
  ens.forEach(drawEnemy);
  if(boss)drawBoss(boss);
  pBul.forEach(drawBul);
  parts.forEach(p=>{g.globalAlpha=Math.max(0,p.life/p.max);g.fillStyle=p.c;
    g.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);});
  g.globalAlpha=1;
  rings.forEach(r=>{g.globalAlpha=Math.max(0,1-r.r/r.max);g.strokeStyle=r.c;g.lineWidth=3;
    g.beginPath();g.arc(r.x,r.y,r.r,0,6.28);g.stroke();});
  g.globalAlpha=1;
  eBul.forEach(b=>{g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,b.r,0,6.28);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,b.r*.42,0,6.28);g.fill();});
  if(state==='play'&&!P.dead)drawPlayer();
  g.restore();
  if(flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.6,flash/40)+')';g.fillRect(0,0,W,H);}
  if(state==='play'||state==='pause'||state==='clear')drawHUD();

  msgs.forEach(m=>{g.globalAlpha=Math.min(1,m.life/25);g.textAlign='center';
    g.font='bold 15px monospace';g.fillStyle=m.c;g.fillText(m.t,W/2,m.y);
    g.textAlign='left';g.globalAlpha=1;});

  if(warn>0&&Math.floor(warn/8)%2){
    g.fillStyle='rgba(255,60,60,.14)';g.fillRect(0,H/2-60,W,120);
    g.textAlign='center';g.font='bold 30px monospace';g.fillStyle='#ff6a4a';
    g.fillText('W A R N I N G',W/2,H/2-6);
    g.font='13px monospace';g.fillStyle='#ffd45a';g.fillText('보스 접근 중',W/2,H/2+22);
    g.textAlign='left';}

  if(state==='title'){
    g.fillStyle='rgba(4,10,8,.74)';g.fillRect(0,0,W,H);
    g.textAlign='center';
    g.font='bold 46px monospace';g.fillStyle='#9ff5c8';g.fillText('SKY STRIKE',W/2,180);
    g.font='12px monospace';g.fillStyle='#5c7a6c';g.fillText('VERTICAL SHOOTER  ·  ARCADE 1993',W/2,204);
    const box=(y,c,ttl,d)=>{g.fillStyle=c;g.fillRect(W/2-136,y-11,10,10);
      g.textAlign='left';g.fillStyle='#cfe6d8';g.font='bold 13px monospace';g.fillText(ttl,W/2-116,y-1);
      g.fillStyle='#7ea592';g.font='11px monospace';g.fillText(d,W/2-116,y+15);g.textAlign='center';};
    box(300,COL.red,'RED — 부채꼴 확산','탄 수 증가 · 넓게 퍼짐');
    box(348,COL.blue,'BLUE — 전방 확산','탄 수 증가 · 앞으로 관통형');
    box(396,COL.purple,'PURPLE — 유도 레이저','적을 추적하는 레이저');
    g.fillStyle='#ffd45a';g.font='12px monospace';
    g.fillText('같은 색을 계속 먹으면 데미지 상승',W/2,440);
    g.fillText('파워업 3개 + 💣 1개 → 보스 출현',W/2,462);
    g.fillStyle='#5c7a6c';g.font='11px monospace';
    g.fillText('이동: 방향키 / WASD · 드래그    폭탄: X · 💣    일시정지: P',W/2,530);
    g.font='bold 16px monospace';
    if(ready){g.fillStyle=Math.floor(T*2)%2?'#9ff5c8':'#3d6053';
      g.fillText('화면을 탭하거나 SPACE를 누르세요',W/2,580);}
    else{g.fillStyle='#5c7a6c';g.fillText('LOADING  '+Math.round(loaded/total*100)+'%',W/2,580);}
    g.textAlign='left';
  }
  if(state==='select')drawSelect();
  if(state==='pause'){g.fillStyle='rgba(4,10,8,.6)';g.fillRect(0,0,W,H);
    center([{t:'PAUSED',f:'bold 32px monospace'},{t:'P 키로 계속',f:'12px monospace',c:'#7ea592'}]);}
  if(state==='over'){g.fillStyle='rgba(20,4,4,.75)';g.fillRect(0,0,W,H);
    center([{t:'GAME OVER',f:'bold 36px monospace',c:'#ff6a4a'},
      {t:'SCORE '+score,f:'16px monospace',c:'#cfe6d8'},
      {t:'STAGE '+stage_+' 도달 · '+SHIPS[P.ship].n,f:'12px monospace',c:'#7ea592'},
      {t:Math.floor(T*2)%2?'탭 / SPACE 로 기체 선택':' ',f:'bold 14px monospace',c:'#9ff5c8'}]);}
  if(state==='clear'){g.fillStyle='rgba(4,14,10,.6)';g.fillRect(0,0,W,H);
    center([{t:'STAGE '+stage_+' CLEAR',f:'bold 30px monospace',c:'#ffd45a'},
      {t:'BONUS  '+(8000*stage_),f:'14px monospace',c:'#cfe6d8'},
      {t:'다음 스테이지 준비…',f:'12px monospace',c:'#7ea592'}]);}
}

/* ---------- 결과 · 친구에게 도전하기 ---------- */
function openVs(){
  if(!(window.MGH && MGH.result) || score<=0) return;
  const L2=(ko,en)=> MGH.L ? MGH.L(ko,en) : ko;
  const s=score, st=stage_, ship=SHIPS[P.ship].n;
  setTimeout(()=>MGH.result.open({
    board:'raiden', score:s, fmt:v=>v.toLocaleString(),
    game:'SKY STRIKE', icon:'✈️', accent:'#5ff0a8',
    label:L2('내 점수','MY SCORE'), friend:L2('친구','Friend'), question:L2('점수 대결','Score battle'),
    sub:`STAGE ${st} · ${ship}`, meta:{stage:st},
    shareText:L2(`✈️ 스카이 스트라이크 ${s.toLocaleString()}점! 점수 대결하자`, `✈️ ${s.toLocaleString()} pts in Sky Strike. Score battle?`)
  }), 900);
}

/* ---------- 하이스코어 ---------- */
async function loadHigh(){try{if(window.storage){const r=await window.storage.get('skystrike:high');
  if(r&&r.value)high=+r.value;}}catch(e){}}
async function saveHigh(){try{if(window.storage)await window.storage.set('skystrike:high',String(high));}catch(e){}}
loadHigh();

let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  update(dt);high=Math.max(high,score);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
