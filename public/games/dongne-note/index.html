<!doctype html>
<html lang="ko">
<head>
<script src="/mgh/bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>동네쪽지</title>
<meta name="description" content="동네쪽지 — 지도에서 장소를 골라 동물 아이콘과 함께 쪽지를 남기면 다른 사람들이 보고 좋아요·댓글을 다는 동네 지도. 쪽지는 7일 뒤 사라져요.">
<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<link rel="stylesheet" href="fonts/gaegu.css">
<script src="vendor/leaflet-1.9.4.js"></script>
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1.css">
<script src="vendor/maplibre-gl-4.7.1.js"></script>
<script src="vendor/leaflet-maplibre-gl-0.1.4.js"></script>
<script src="mapstyle.js"></script>
<style>
:root{--paper:#fbf6ea;--paper2:#f2e9d5;--card:#fffdf7;--ink:#3a2e24;--sub:#8b7b69;--line:#e3d6bd;--acc:#ff6b4a;--acc2:#e5553a;--mus:#f2b632;--mint:#4dbf9c;--hand:'Gaegu','Nanum Pen Script','Pretendard',cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
#map{position:fixed;inset:0;background:#efe7d6}
.leaflet-container{font:inherit;background:#efe7d6}
body.raster .leaflet-tile-pane{filter:grayscale(.55) sepia(.32) saturate(1.15) brightness(1.04) contrast(.9)}
body.raster.night .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(.5) sepia(.35) brightness(.72) contrast(1.05)}
body.night #map,body.night .leaflet-container{background:#2b2620}
.leaflet-control-attribution{background:rgba(251,246,234,.8)!important;color:#8b7b69!important;font-size:10px;margin-bottom:calc(74px + env(safe-area-inset-bottom))!important}
.leaflet-control-attribution a{color:#6b5a48!important}
.leaflet-control-zoom{display:none}

/* 머리글: 로고 + 검색창 + 기간 칩 */
.hd{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.hd>*{pointer-events:auto}
.logo{font-family:var(--hand);font-weight:700;font-size:23px;background:var(--mus);color:var(--ink);padding:5px 12px 3px;border-radius:6px;transform:rotate(-2deg);box-shadow:2px 3px 0 var(--ink);white-space:nowrap;line-height:1.1}
.sbar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:14px;color:var(--sub);box-shadow:2px 3px 0 rgba(58,46,36,.25);text-align:left;white-space:nowrap;overflow:hidden}
.chips{position:fixed;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top));z-index:500;display:flex;gap:6px;align-items:center;pointer-events:none}
.chips>*{pointer-events:auto}
.chips button{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;box-shadow:1px 2px 0 rgba(58,46,36,.25)}
.chips button.on{background:var(--ink);color:var(--paper)}
.chips .cnt2{margin-left:auto;background:rgba(255,253,247,.9);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--sub);border:1px solid var(--line)}

/* 아래 탭바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--paper);border-top:2px dashed var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--sub);padding:2px 0}
.tabbar button .ic{font-size:21px;height:26px;display:flex;align-items:center}
.tabbar button .ic img{width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.tabbar button.on{color:var(--ink)}
.tabbar .write .ic{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--acc);border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);justify-content:center;font-size:26px}
.tabbar .write{color:var(--acc2)}

/* 지도 표시: 동물 도장 + 포스트잇 쪽지 */
.mk{position:relative;width:0;height:0}
.mk .ani{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink);box-shadow:2px 3px 0 rgba(58,46,36,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mk .ani img{width:31px;height:31px}
.mk.mine .ani{border-color:var(--acc);box-shadow:2px 3px 0 var(--acc2)}
.mk .bub{position:absolute;left:14px;bottom:14px;width:max-content;max-width:180px;min-width:96px;background:var(--nc,#fff3a8);border-radius:3px;padding:12px 11px 8px;box-shadow:1px 4px 10px rgba(58,46,36,.28);cursor:pointer;transform:rotate(var(--rot,-2deg));transform-origin:0 100%}
.mk .bub:before{content:'';position:absolute;left:50%;top:-7px;width:46px;height:15px;margin-left:-23px;background:rgba(255,255,255,.6);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08);transform:rotate(-4deg)}
.mk .bub .h{font-size:11px;font-weight:800;color:rgba(58,46,36,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .bub .b{font-family:var(--hand);font-size:18px;line-height:1.15;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.mk .bub .f{display:flex;gap:8px;font-size:10.5px;color:rgba(58,46,36,.6);margin-top:5px;font-weight:700}
.mk.pop .bub:before{background:rgba(255,107,74,.75)}
.mk .hot{position:absolute;right:-8px;top:-10px;background:var(--acc);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:2px 6px;border:2px solid var(--ink);transform:rotate(8deg)}
.mk.l .bub{left:auto;right:14px;transform-origin:100% 100%}
@media (max-width:419px){.mk .bub{max-width:150px}}
.cl{width:46px;height:42px;margin:-21px 0 0 -23px;border-radius:3px;background:#fff3a8;color:var(--ink);font-family:var(--hand);font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 #ffd6e0,8px 8px 0 #c9f1df,8px 8px 0 1.5px rgba(58,46,36,.25);transform:rotate(-4deg);border:1.5px solid rgba(58,46,36,.25)}
.ghost .ani{animation:bob 1s ease-in-out infinite;border-color:var(--acc)}
@keyframes bob{50%{transform:translateY(-6px)}}
.drop .ani{animation:drop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes drop{from{transform:translateY(-60px) rotate(-30deg);opacity:0}}

/* 시트 */
.dim{position:fixed;inset:0;background:rgba(58,46,36,.35);z-index:900;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:910;background:var(--paper);border-radius:18px 18px 0 0;border-top:2.5px solid var(--ink);max-height:86vh;overflow:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-width:640px;margin:0 auto;box-shadow:0 -6px 24px rgba(58,46,36,.25)}
.sheet.open{transform:none}
.sheet .grab{width:58px;height:16px;background:rgba(242,182,50,.55);margin:-2px auto 10px;transform:rotate(-2deg)}
.sheet h3{margin:4px 0 12px;font-size:19px}
.x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--ink);font-size:15px;font-weight:900}
.inp{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--acc)}
.row{display:flex;gap:8px}
.btn{background:var(--acc);color:#fff;font-weight:800;border-radius:12px;padding:11px 16px;white-space:nowrap;border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:none}
.btn.g{background:var(--acc)}
.btn.s{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;box-shadow:none}
.res{margin-top:10px;display:flex;flex-direction:column}
.res button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:11px 4px;border-bottom:1.5px dashed var(--line)}
.res b{font-size:15px}
.res span{font-size:12px;color:var(--sub);margin-top:2px}
.hint{font-size:12px;color:var(--sub);margin:10px 2px;line-height:1.5}
.loc{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px dashed var(--sub);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.loc .t{flex:1;min-width:0}
.loc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc span{font-size:12px;color:var(--sub)}
.loc .btn{padding:7px 12px;font-size:13px}
textarea.inp{height:120px;resize:none;font-family:var(--hand);font-size:21px;line-height:30px;background:#fff3a8 repeating-linear-gradient(transparent,transparent 29px,rgba(58,46,36,.12) 29px,rgba(58,46,36,.12) 30px);background-attachment:local;padding-top:6px}
.cnt{text-align:right;font-size:12px;color:var(--sub);margin:4px 2px 10px}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 14px}
.animals button{aspect-ratio:1;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.animals button.on{border:3px solid var(--acc);background:#ffe7df;box-shadow:2px 3px 0 var(--acc2)}
.animals img{width:68%;height:68%}

/* 상세 */
.who{display:flex;align-items:center;gap:10px;margin:2px 40px 10px 0}
.who .av{width:46px;height:46px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.who .av img{width:34px;height:34px}
.who b{display:block}
.who span{font-size:12px;color:var(--sub)}
.notecard{background:var(--nc,#fff3a8);border-radius:4px;padding:16px 16px 12px;margin:4px 2px 10px;box-shadow:1px 4px 12px rgba(58,46,36,.2);position:relative;transform:rotate(-.6deg)}
.notecard:before{content:'';position:absolute;left:50%;top:-8px;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.6);transform:rotate(-3deg)}
.place{font-size:12px;font-weight:800;color:rgba(58,46,36,.65);margin-bottom:4px}
.body{font-family:var(--hand);font-size:24px;line-height:1.3;white-space:pre-wrap;word-break:break-all}
.life{font-size:12px;color:var(--sub);border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding:8px 2px;margin:8px 0 12px;display:flex;justify-content:space-between;gap:8px}
.life b{color:var(--acc2)}
.acts{display:flex;gap:8px;margin-bottom:12px}
.acts button{flex:1;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 0;font-weight:800;box-shadow:2px 3px 0 rgba(58,46,36,.3)}
.acts .liked{background:#ffe0e6;color:#d6334f;border-color:#d6334f}
.cms{padding-top:2px}
.cm{display:flex;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.cm .av{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cm .av img{width:22px;height:22px}
.cm .t{flex:1;min-width:0;font-size:14px;line-height:1.45;word-break:break-all}
.cm .t i{font-style:normal;font-size:11px;color:var(--sub);margin-left:6px}
.cm .del{font-size:11px;color:var(--sub)}
.tos{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--sub);line-height:1.45;margin:0 2px 12px}
.tos input{margin-top:2px;width:18px;height:18px;accent-color:var(--acc);flex:none}
.tos a{color:var(--acc2)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px;text-align:left;font-weight:700}
.list .it{display:flex;gap:10px;padding:10px 2px;border-bottom:1.5px dashed var(--line);text-align:left;width:100%;align-items:center}
.list .it .av{width:40px;height:40px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.list .it .av img{width:30px;height:30px}
.list .it .t{flex:1;min-width:0;background:var(--nc,#fff3a8);padding:7px 10px;border-radius:3px;box-shadow:1px 2px 5px rgba(58,46,36,.15)}
.list .it b{font-size:11px;color:rgba(58,46,36,.65)}
.list .it p{margin:1px 0;font-family:var(--hand);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it span{font-size:11px;color:rgba(58,46,36,.6)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{padding:6px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);font-weight:800;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--paper)}
.empty{color:var(--sub);text-align:center;padding:26px 0;font-size:14px;line-height:1.6}

/* 지도에서 고르기 */
.pick{position:fixed;inset:0;z-index:600;pointer-events:none;display:none}
.pick .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none}
.pick .cross .ani{width:48px;height:48px;border-radius:50%;background:var(--card);border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:3px 4px 0 var(--ink);animation:bob 1s ease-in-out infinite}
.pick .cross .ani img{width:36px;height:36px}
.pick .cross:after{content:'';display:block;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--ink);margin:5px auto 0}
.pick .bar{position:absolute;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));pointer-events:auto;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:14px;box-shadow:3px 4px 0 var(--ink);max-width:560px;margin:0 auto}
.pick .bar p{margin:0 0 10px;font-size:14px}
.pick .bar p b{color:var(--acc2)}
body.picking .hd,body.picking .chips,body.picking .tabbar{display:none}

.toast{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%) rotate(-1deg);z-index:1000;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.intro{position:fixed;inset:0;z-index:950;background:rgba(58,46,36,.45);display:none;align-items:center;justify-content:center;padding:20px}
.intro .box{background:#fff3a8;border-radius:4px;padding:26px 22px 20px;max-width:370px;width:100%;box-shadow:2px 8px 24px rgba(58,46,36,.35);transform:rotate(-1.2deg);position:relative}
.intro .box:before{content:'';position:absolute;left:50%;top:-10px;width:90px;height:22px;margin-left:-45px;background:rgba(255,107,74,.6);transform:rotate(-3deg)}
.intro h2{margin:0 0 8px;font-family:var(--hand);font-size:32px}
.intro ul{padding-left:0;list-style:none;margin:12px 0 18px;line-height:1.8;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>

<header class="hd"><div class="logo" id="logo">동네쪽지</div><button class="sbar" id="bSearch"><span>🔍</span><span id="sbarTxt">장소·동네 찾기</span></button></header>
<div class="chips" id="chips"><button data-p="0">전체</button><button data-p="1">오늘</button><button data-p="3">3일</button><span class="cnt2" id="storyN"></span></div>
<nav class="tabbar">
  <button id="bTheme"><span class="ic">🌙</span><span class="lb">밤 지도</span></button>
  <button id="bStory"><span class="ic">📜</span><span class="lb">이야기</span></button>
  <button class="write" id="bWrite"><span class="ic">✏️</span><span class="lb">쪽지 쓰기</span></button>
  <button id="bMe"><span class="ic">🙂</span><span class="lb">내 쪽지</span></button>
  <button id="bHelp"><span class="ic">💡</span><span class="lb">도움말</span></button>
</nav>

<div class="pick" id="pick">
  <div class="cross"><div class="ani"><img id="pickImg" alt=""></div></div>
  <div class="bar">
    <p id="pickTxt"></p>
    <div class="row"><button class="btn s" id="pickCancel" style="flex:1"></button><button class="btn g" id="pickOk" style="flex:2"></button></div>
  </div>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><button class="x" id="sheetX">✕</button><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div class="intro" id="intro"><div class="box">
  <h2 id="inTitle"></h2><div id="inDesc" style="color:var(--sub);font-size:14px;line-height:1.5"></div>
  <ul id="inList"></ul>
  <button class="btn g" id="inGo" style="width:100%"></button>
  <p style="margin:12px 0 0;font-size:10px;color:#6f6990;line-height:1.5">동물 아이콘: Noto Emoji (Google, Apache License 2.0) · 지도: OpenFreeMap · © OpenMapTiles · 장소 검색: © OpenStreetMap 기여자 (ODbL) · 글씨: Gaegu (OFL)</p>
</div></div>

<script>
'use strict';
const L_ = (ko, en) => (window.MGH && MGH.L ? MGH.L(ko, en) : ko);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LS = 'dongne-note';
const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS + ':' + k, JSON.stringify(v)); } catch (e) {} };

const ANIMALS = ['dog','cat','fox','bear','panda','rabbit','hamster','koala','tiger','lion','cow','pig','frog','monkey','penguin','chicken','unicorn','octopus','owl','wolf'];
const ANAME = { dog:['강아지','Dog'], cat:['고양이','Cat'], fox:['여우','Fox'], bear:['곰','Bear'], panda:['판다','Panda'], rabbit:['토끼','Rabbit'], hamster:['햄스터','Hamster'], koala:['코알라','Koala'], tiger:['호랑이','Tiger'], lion:['사자','Lion'], cow:['소','Cow'], pig:['돼지','Pig'], frog:['개구리','Frog'], monkey:['원숭이','Monkey'], penguin:['펭귄','Penguin'], chicken:['닭','Chicken'], unicorn:['유니콘','Unicorn'], octopus:['문어','Octopus'], owl:['부엉이','Owl'], wolf:['늑대','Wolf'] };
const aImg = (a) => `img/animals/${ANIMALS.includes(a) ? a : 'dog'}.webp`;
const DAY = 864e5, LIFE = 7 * DAY;
// 이용약관 링크 (토스 빌드는 외부 이동 금지라 prepare 단계에서 빈 문자열로 바꾼다)
const TERMS_LINK = `<a href="/terms" target="_blank" rel="noopener">${L_('이용약관', 'Terms')}</a>`;

/* ---------- 상태 ---------- */
let user;                 // undefined: 모름, null: 비로그인, {id,name}
let me = null;            // dn_me 결과 {animal, nickname, memos}
let myAnimal = lsGet('animal', null);
const memos = new Map();  // id → memo
let period = lsGet('period', 0); // 0 전체, 3 = 3일, 1 = 오늘
let openId = null;

/* ---------- 서버 ---------- */
// 토스 미니앱 빌드는 DN_BACKEND(Supabase 직접 연결 + 익명 계정)·DN_API(사이트 주소)를 먼저 넣는다
const BACKEND = window.DN_BACKEND || null;
const API = window.DN_API || '';
function rpc(name, params) {
  if (BACKEND) return BACKEND.rpc(name, params || {});
  if (!window.MGH || !MGH.rpc || !MGH.embedded) return Promise.reject(new Error('standalone'));
  return MGH.rpc(name, params);
}
const ERR = {
  not_authenticated: ['로그인이 필요해요', 'Please log in'],
  daily_limit: ['오늘은 더 남길 수 없어요 (하루 10개)', 'Daily limit reached'],
  blocked_text: ['전화번호·계좌번호 같은 숫자는 남길 수 없어요', 'Phone or account numbers are not allowed'],
  gone: ['이미 사라진 쪽지예요', 'This note is gone'],
  out_of_area: ['국내 장소만 고를 수 있어요', 'Only places in Korea'],
  standalone: ['미니게임천국에서 열어 주세요', 'Open on the portal'],
};
const errMsg = (e) => { const m = String((e && e.message) || e); for (const k in ERR) if (m.includes(k)) return L_(ERR[k][0], ERR[k][1]); return L_('잠시 후 다시 시도해 주세요', 'Please try again shortly'); };

/* ---------- 시간 ---------- */
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return L_('방금', 'just now');
  if (s < 3600) return L_(`${Math.floor(s / 60)}분 전`, `${Math.floor(s / 60)}m ago`);
  if (s < 86400) return L_(`${Math.floor(s / 3600)}시간 전`, `${Math.floor(s / 3600)}h ago`);
  return L_(`${Math.floor(s / 86400)}일 전`, `${Math.floor(s / 86400)}d ago`);
}
function left(t) {
  const ms = new Date(t) - Date.now();
  if (ms <= 0) return L_('곧 사라져요', 'Disappearing soon');
  const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / 36e5);
  if (d > 0) return L_(`${d}일 ${h}시간 뒤 사라져요`, `Gone in ${d}d ${h}h`);
  if (h > 0) return L_(`${h}시간 뒤 사라져요`, `Gone in ${h}h`);
  return L_(`${Math.max(1, Math.floor(ms / 6e4))}분 뒤 사라져요`, `Gone in ${Math.max(1, Math.floor(ms / 6e4))}m`);
}
const bonusH = (m) => Math.max(0, Math.round((new Date(m.expires_at) - new Date(m.created_at) - LIFE) / 36e5));
const score = (m) => m.likes + m.comments * 2;

/* ---------- 지도 ---------- */
const start = lsGet('view', null);
const map = L.map('map', { zoomControl: false, attributionControl: true, minZoom: 7, maxZoom: 19, maxBounds: [[32, 123], [40, 133]], tap: true })
  .setView(start ? [start.lat, start.lng] : [37.5759, 126.9768], start ? start.z : 15);
/* 바탕 지도: OpenFreeMap 벡터 타일을 종이 테마로 단순하게 (mapstyle.js). WebGL 이 없거나 못 불러오면 OSM 기본 지도 */
let gl = null, raster = null, glNight = lsGet('night', false);
function useRaster() {
  if (raster) return;
  if (gl) { try { map.removeLayer(gl); } catch (e) {} gl = null; }
  document.body.classList.add('raster');
  raster = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
  }).addTo(map);
}
function hasWebGL() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } }
if (window.maplibregl && L.maplibreGL && window.DN_MAP_STYLE && hasWebGL()) {
  try {
    gl = L.maplibreGL({
      style: DN_MAP_STYLE(lsGet('night', false)),
      localIdeographFontFamily: "'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif",
      attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
    }).addTo(map);
    const mm = gl.getMaplibreMap();
    let ready = false;
    mm.on('load', () => { ready = true; });
    mm.on('error', (e) => {
      const er = (e && e.error) || {};
      console.warn('[dongne-note map]', er.message);
      // 스타일·타일 정보를 못 받은 경우만 기본 지도로 (타일 몇 장 실패는 무시)
      if (!ready && (er.status || /fetch|network|load/i.test(er.message || ''))) useRaster();
    });
    setTimeout(() => { if (!ready) useRaster(); }, 9000);
  } catch (e) { useRaster(); }
} else useRaster();
map.attributionControl.setPrefix(false);
const layer = L.layerGroup().addTo(map);
let draftMarker = null;

function setTheme(night) {
  document.body.classList.toggle('night', night);
  $('bTheme').querySelector('.ic').textContent = night ? '☀️' : '🌙';
  $('bTheme').querySelector('.lb').textContent = night ? L_('낮 지도', 'Day map') : L_('밤 지도', 'Night map');
  lsSet('night', night);
  if (gl && glNight !== night) try { glNight = night; gl.getMaplibreMap().setStyle(DN_MAP_STYLE(night)); } catch (e) {}
}
setTheme(lsGet('night', false));
$('bTheme').onclick = () => setTheme(!document.body.classList.contains('night'));

/* 쪽지마다 포스트잇 색·기울기 (id 로 고정) */
const NC = ['#fff3a8', '#ffd6e0', '#c9f1df', '#cfe6ff', '#e6dbff', '#ffe0c2'];
const hashId = (id) => { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0; return Math.abs(h); };
const nc = (m) => NC[hashId(m.id) % NC.length];
const rot = (m) => ((hashId(m.id) >> 4) % 7) - 3;

function visible() {
  const now = Date.now();
  return [...memos.values()].filter((m) => new Date(m.expires_at) > now && (!period || now - new Date(m.created_at) < period * DAY));
}

function markerHtml(m, bubble, pop, leftSide) {
  const lifeLeft = Math.max(0, Math.min(1, (new Date(m.expires_at) - Date.now()) / LIFE));
  const op = (0.5 + 0.5 * lifeLeft).toFixed(2);
  return `<div class="mk${m.mine ? ' mine' : ''}${pop ? ' pop' : ''}${leftSide ? ' l' : ''}">` +
    `<div class="ani" style="opacity:${op}"><img src="${aImg(m.animal)}" alt=""></div>` +
    (bubble ? `<div class="bub" style="--nc:${nc(m)};--rot:${rot(m)}deg">${pop ? `<span class="hot">🔥 ${L_('인기', 'Hot')}</span>` : ''}<div class="h">${esc(m.place || m.area || L_('이 근처', 'Nearby'))}</div>` +
      `<div class="b">${esc(m.body)}</div><div class="f"><span>${ago(m.created_at)}</span>` +
      (m.likes ? `<span>❤️ ${m.likes}</span>` : '') + (m.comments ? `<span>💬 ${m.comments}</span>` : '') + `</div></div>` : '') +
    `</div>`;
}

function render() {
  layer.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(0.15);
  const list = visible().filter((m) => b.contains([m.lat, m.lng])).sort((a, c) => score(c) - score(a) || new Date(c.created_at) - new Date(a.created_at));
  $('storyN').textContent = L_(`이 화면 쪽지 ${list.length}장`, `${list.length} notes here`);
  if (z < 13) {
    // 멀리서: 화면 칸(70px)마다 묶어서 숫자로
    const cells = new Map();
    for (const m of list) {
      const p = map.project([m.lat, m.lng], z), k = Math.floor(p.x / 70) + ':' + Math.floor(p.y / 70);
      const c = cells.get(k); if (c) { c.n++; c.lat += m.lat; c.lng += m.lng; } else cells.set(k, { n: 1, lat: m.lat, lng: m.lng, top: m });
    }
    for (const c of cells.values()) {
      if (c.n === 1) { addMarker(c.top, false, false); continue; }
      const mk = L.marker([c.lat / c.n, c.lng / c.n], { icon: L.divIcon({ className: '', html: `<div class="cl">${c.n > 99 ? '99+' : c.n}</div>`, iconSize: [0, 0] }) });
      mk.on('click', () => map.setView(mk.getLatLng(), Math.min(15, z + 2)));
      layer.addLayer(mk);
    }
    return;
  }
  // 가까이: 말풍선은 반응 많은·최신 순으로 화면에 겹치지 않게 최대 25개
  const taken = [], maxB = z >= 16 ? 25 : 10, W = map.getSize().x, H = map.getSize().y;
  const topSafe = ($('chips').getBoundingClientRect().bottom || 90) + 4;
  let nb = 0;
  const plan = list.map((m) => {
    const p = map.latLngToContainerPoint([m.lat, m.lng]);
    let bubble = false;
    const bw = W < 420 ? 165 : 200, leftSide = p.x > W * 0.55; // 화면 오른쪽 절반이면 말풍선을 왼쪽으로
    if (nb < maxB) {
      const box = leftSide ? { x1: p.x - bw, y1: p.y - 135, x2: p.x + 24, y2: p.y + 22 } : { x1: p.x - 24, y1: p.y - 135, x2: p.x + bw, y2: p.y + 22 };
      const free = box.y1 > topSafe && box.y2 < H - 80;
      if (free && !taken.some((t) => box.x1 < t.x2 && box.x2 > t.x1 && box.y1 < t.y2 && box.y2 > t.y1)) { taken.push(box); bubble = true; nb++; }
    }
    return { m, bubble, leftSide };
  });
  for (let i = plan.length - 1; i >= 0; i--) addMarker(plan[i].m, plan[i].bubble, score(plan[i].m) >= 3, plan.length - i, plan[i].leftSide);
}
function addMarker(m, bubble, pop, zi, leftSide) {
  const mk = L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', html: markerHtml(m, bubble, pop, leftSide), iconSize: [0, 0] }), zIndexOffset: (zi || 0) * 10 + (bubble ? 1000 : 0), riseOnHover: true });
  mk.on('click', () => openMemo(m.id));
  layer.addLayer(mk);
}

/* ---------- 불러오기 ---------- */
let loadT = 0, loading = false, loadedOnce = false;
async function load() {
  if (loading) return;
  const b = map.getBounds().pad(0.5);
  loading = true;
  try {
    const rows = await rpc('dn_memos_in_view', { p_s: b.getSouth(), p_w: b.getWest(), p_n: b.getNorth(), p_e: b.getEast() });
    for (const r of rows || []) memos.set(r.id, r);
    loadedOnce = true;
    render();
  } catch (e) {
    if (!loadedOnce) toast(errMsg(e));
  } finally { loading = false; }
}
map.on('moveend', () => {
  const c = map.getCenter(); lsSet('view', { lat: c.lat, lng: c.lng, z: map.getZoom() });
  render();
  clearTimeout(loadT); loadT = setTimeout(load, 350);
});
setInterval(() => { if (!document.hidden) load(); }, 30000);

/* 아래 시트에 가리지 않게 화면 위쪽 1/4 지점에 오도록 */
function focusAbove(lat, lng, z) {
  map.setView([lat, lng], Math.max(map.getZoom(), z || 16), { animate: false });
  map.panBy([0, Math.round(map.getSize().y * 0.25)], { animate: false });
}

/* ---------- 시트 ---------- */
function openSheet(html, onClose) {
  $('sheetBody').innerHTML = html;
  $('sheet').classList.add('open'); $('dim').style.display = 'block';
  $('sheet').scrollTop = 0;
  sheetClose = onClose || null;
}
let sheetClose = null;
function closeSheet() {
  $('sheet').classList.remove('open'); $('dim').style.display = 'none';
  openId = null;
  if (sheetClose) { const f = sheetClose; sheetClose = null; f(); }
}
$('sheetX').onclick = closeSheet; $('dim').onclick = closeSheet;

let toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- 로그인 ---------- */
function onAuthChange(u) {
  user = u || null;
  if (user) rpc('dn_me').then((r) => { me = r; if (r && r.animal) { myAnimal = r.animal; lsSet('animal', myAnimal); } updateMe(); }).catch(() => {});
  else { me = null; updateMe(); }
  load();
}
if (BACKEND) BACKEND.onAuth(onAuthChange);
else if (window.MGH && MGH.save) MGH.save.onAuth(onAuthChange);
/** 쓰기·좋아요 전에: 로그인돼 있으면 true. 토스 빌드는 익명 계정을 바로 만든다 */
async function ensureUser(why) {
  if (user) return true;
  if (BACKEND) {
    try { await BACKEND.login(); } catch (e) { toast(errMsg(e)); }
    return !!user;
  }
  needLogin(why);
  return false;
}
function updateMe() {
  $('bMe').querySelector('.ic').innerHTML = user && myAnimal ? `<img src="${aImg(myAnimal)}" alt="">` : '🙂';
}
function needLogin(why) {
  openSheet(`<h3>${L_('로그인하고 쪽지를 남겨요', 'Log in to leave notes')}</h3>
    <p class="hint" style="font-size:14px">${esc(why || L_('쪽지 남기기·좋아요·댓글은 로그인한 이웃만 할 수 있어요. 구경은 로그인 없이도 돼요.', 'Writing, likes and comments need an account. Browsing is free.'))}</p>
    <div class="menu"><button id="lgK" style="background:#fee500;color:#191600">💬 ${L_('카카오로 시작하기', 'Continue with Kakao')}</button>
    <button id="lgE">✉️ ${L_('이메일로 로그인', 'Log in with email')}</button>
    <button id="lgN">${L_('나중에 할게요', 'Maybe later')}</button></div>`);
  $('lgK').onclick = () => MGH.save.login('kakao');
  $('lgE').onclick = () => MGH.save.login('page');
  $('lgN').onclick = closeSheet;
}

/* ---------- 동물 고르기 ---------- */
function animalGrid(sel) {
  return `<div class="animals">${ANIMALS.map((a) => `<button data-a="${a}" class="${a === sel ? 'on' : ''}" title="${esc(L_(ANAME[a][0], ANAME[a][1]))}"><img src="${aImg(a)}" alt="${esc(L_(ANAME[a][0], ANAME[a][1]))}"></button>`).join('')}</div>`;
}
function bindGrid(root, onPick) {

/* ---------- 쓰기: 1) 장소 고르기 ---------- */
let draft = null; // {lat,lng,place,area,exact}
async function startWrite() {
  if (user === undefined && !BACKEND) return toast(L_('잠시만요, 불러오는 중이에요', 'Loading…'));
  if (!user && !(await ensureUser())) return;
  openSheet(`<h3>${L_('어디에 쪽지를 남길까요?', 'Where do you want to leave it?')}</h3>
    <div class="row"><input class="inp" id="q" placeholder="${L_('장소 이름 (예: 경복궁, 망원한강공원)', 'Place name (e.g. Gyeongbokgung)')}" enterkeyhint="search"><button class="btn" id="qGo">${L_('검색', 'Search')}</button></div>
    <div class="res" id="qRes"></div>
    <button class="btn s" id="qMap" style="width:100%;margin-top:12px">🗺️ ${L_('지도에서 직접 고르기', 'Pick on the map')}</button>
    <p class="hint">${L_('쪽지는 고른 장소에 남아요. 내 위치(GPS)는 사용하지 않아요.', 'Notes stay at the place you choose. Your GPS location is never used.')}</p>`);
  const q = $('q');
  q.onkeydown = (e) => { if (e.key === 'Enter') search(); };
  $('qGo').onclick = search;
  $('qMap').onclick = () => { closeSheet(); startPick(); };
  setTimeout(() => q.focus(), 250);
}
let searching = false;
async function search() {
  const q = $('q').value.trim();
  if (!q || searching) return;
  searching = true;
  const box = $('qRes'); box.innerHTML = `<p class="hint">${L_('찾는 중…', 'Searching…')}</p>`;
  try {
    const c = map.getCenter();
    const r = await fetch(`${API}/api/dongne-note/places?q=${encodeURIComponent(q)}&lat=${c.lat.toFixed(1)}&lng=${c.lng.toFixed(1)}`);
    const list = r.ok ? await r.json() : [];
    if (!Array.isArray(list) || !list.length) { box.innerHTML = `<p class="hint">${L_('찾지 못했어요. 다른 이름으로 검색하거나 지도에서 직접 골라 주세요.', 'Nothing found. Try another name or pick on the map.')}</p>`; return; }
    box.innerHTML = list.map((p, i) => `<button data-i="${i}"><b>${esc(p.name)}</b><span>${esc(p.area || p.addr)}</span></button>`).join('');
    box.querySelectorAll('button').forEach((b) => b.onclick = () => {
      const p = list[+b.dataset.i];
      const home = /building:(apartments|house|residential|detached|terrace)|place:house|landuse:residential/.test(p.kind || '');
      setDraft({ lat: p.lat, lng: p.lng, place: home ? '' : p.name, area: p.area, exact: !home });
    });
  } catch (e) {
    box.innerHTML = `<p class="hint">${L_('검색이 잠시 안 돼요. 지도에서 직접 골라 주세요.', 'Search is unavailable. Please pick on the map.')}</p>`;
  } finally { searching = false; }
}

/* 지도에서 직접 고르기 — 화면 가운데 동물 위치 */
function startPick() {

$('pickCancel').onclick = endPick;
$('pickOk').onclick = async () => {

};

/* ---------- 쓰기: 2) 내용 ---------- */
function setDraft(d) {
  if (d.lat < 33 || d.lat > 39 || d.lng < 124 || d.lng > 132) return toast(errMsg('out_of_area'));

  focusAbove(d.lat, d.lng);

    <textarea class="inp" id="wBody" maxlength="140" placeholder="${L_('이 동네에 남기고 싶은 한마디 (140자)', 'Say something about this place (140 chars)')}"></textarea>
    <div class="cnt"><span id="wCnt">0</span>/140</div>
    ${myAnimal ? '' : `<div style="font-weight:800;margin-top:4px">${L_('나를 나타낼 동물을 골라 주세요', 'Pick your animal')}</div><p class="hint" style="margin-top:2px">${L_('지도에서 내 쪽지는 이 동물로 보여요. 나중에 [내 쪽지]에서 바꿀 수 있어요.', 'Your notes show this animal. Change it later in My notes.')}</p>${animalGrid(null)}`}
    <p class="hint">${L_('쪽지는 7일 뒤 사라져요. 다른 사람이 좋아요(+6시간)·댓글(+12시간)을 남기면 최대 30일까지 더 오래 남아요.', 'Notes vanish after 7 days — likes (+6h) and comments (+12h) keep them up to 30 days.')}</p>
    ${lsGet('tos', false) ? '' : `<label class="tos"><input type="checkbox" id="wTos"> <span>${L_('욕설·광고·음란물·개인정보(연락처·주소) 노출을 하지 않을게요. 어기면 쪽지가 삭제되고 이용이 제한될 수 있어요.', 'No abuse, ads, sexual content or personal info. Violations are removed and may lead to a ban.')} ${TERMS_LINK}</span></label>`}
    <button class="btn g" id="wGo" style="width:100%" disabled>${L_('남기기', 'Post')}</button>`, () => { if (draftMarker) { map.removeLayer(draftMarker); draftMarker = null; } });
  const body = $('wBody'), go = $('wGo');
  const tos = $('wTos');
  const upd = () => { $('wCnt').textContent = body.value.length; go.disabled = !body.value.trim() || !pickA || (tos && !tos.checked); };
  if (tos) tos.onchange = upd;
  body.oninput = upd;
  bindGrid($('sheetBody'), (a) => { pickA = a; showDraftMarker(a); upd(); });
  $('wLoc').onclick = () => { closeSheet(); startWrite(); };
  go.onclick = async () => {
    go.disabled = true;
    try {
      if (tos) lsSet('tos', true);
      if (!myAnimal) await rpc('dn_set_animal', { p_animal: pickA });
      myAnimal = pickA; lsSet('animal', myAnimal); updateMe();
      const id = await rpc('dn_post_memo', { p_lat: d.lat, p_lng: d.lng, p_place: d.place || '', p_area: d.area || '', p_body: body.value.trim(), p_animal: pickA });
      const rows = await rpc('dn_memo', { p_id: id });
      const m = rows && rows[0];
      if (m) memos.set(m.id, m);
      sheetClose = null; closeSheet();
      if (draftMarker) { map.removeLayer(draftMarker); draftMarker = null; }
      if (m) map.setView([m.lat, m.lng], map.getZoom(), { animate: false }); // 시트가 닫혔으니 쪽지를 화면 가운데로 (말풍선이 보이게)
      render();
      dropAnim(m);
      toast(L_('쪽지를 남겼어요! 7일 동안 이 자리에 있어요', 'Posted! It stays here for 7 days'));
    } catch (e) { toast(errMsg(e)); go.disabled = false; }
  };
  setTimeout(() => body.focus(), 250);
}
function showDraftMarker(a) {
  if (!draft) return;
  if (draftMarker) map.removeLayer(draftMarker);
  draftMarker = L.marker([draft.lat, draft.lng], { icon: L.divIcon({ className: '', html: `<div class="mk ghost"><div class="ani"><img src="${aImg(a || myAnimal || 'fox')}" alt=""></div></div>`, iconSize: [0, 0] }), zIndexOffset: 5000 }).addTo(map);
}
function dropAnim(m) {
  if (!m) return;
  const mk = L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', html: `<div class="mk drop"><div class="ani"><img src="${aImg(m.animal)}" alt=""></div></div>`, iconSize: [0, 0] }), zIndexOffset: 6000 }).addTo(map);
  setTimeout(() => map.removeLayer(mk), 700);
}

/* ---------- 쪽지 보기 ---------- */
async function openMemo(id) {
  let m = memos.get(id);
  if (!m) {
    try { const r = await rpc('dn_memo', { p_id: id }); m = r && r[0]; if (m) memos.set(m.id, m); } catch (e) {}
    if (!m) return toast(errMsg('gone'));
    focusAbove(m.lat, m.lng);
  }
  openId = id;
  { // 시트에 가리지 않게 쪽지를 화면 위쪽으로
    const pt = map.latLngToContainerPoint([m.lat, m.lng]), Hh = map.getSize().y;
    if (pt.y > Hh * 0.4) map.panBy([0, Math.round(pt.y - Hh * 0.3)], { animate: true });
  }
  const b = bonusH(m);
  openSheet(`<div class="who"><div class="av"><img src="${aImg(m.animal)}" alt=""></div><div><b>${esc(m.nickname)}</b><span>${esc(L_(ANAME[m.animal] ? ANAME[m.animal][0] : '', ANAME[m.animal] ? ANAME[m.animal][1] : ''))} · ${ago(m.created_at)}</span></div></div>
    <div class="notecard" style="--nc:${nc(m)}"><div class="place">📍 ${esc([m.place, m.area].filter(Boolean).join(' · ') || L_('이 근처', 'Nearby'))}</div>
    <div class="body">${esc(m.body)}</div></div>
    <div class="life"><span>⏳ ${left(m.expires_at)}</span>${b ? `<b>❤️💬 ${L_('덕분에', 'bonus')} +${b}${L_('시간', 'h')}</b>` : ''}</div>
    <div class="acts"><button id="mLike" class="${m.liked ? 'liked' : ''}">${m.liked ? '❤️' : '🤍'} ${m.likes}</button><button id="mShare">🔗 ${L_('공유', 'Share')}</button><button id="mMore">⋯</button></div>
    <div class="cms"><div style="font-weight:800;margin-bottom:4px">💬 ${L_('댓글', 'Comments')} <span id="cN">${m.comments}</span></div>
      <div id="cList"><p class="hint">${L_('불러오는 중…', 'Loading…')}</p></div>
      <div class="row" style="margin-top:10px"><input class="inp" id="cIn" maxlength="100" placeholder="${L_('댓글 달기 (100자)', 'Add a comment (100 chars)')}" enterkeyhint="send"><button class="btn" id="cGo">${L_('등록', 'Post')}</button></div>
    </div>`);
  $('mLike').onclick = () => like(m);
  $('mShare').onclick = () => share(m);
  $('mMore').onclick = () => more(m);
  $('cGo').onclick = () => addComment(m);
  $('cIn').onkeydown = (e) => { if (e.key === 'Enter') addComment(m); };
  loadComments(m);
}
async function loadComments(m) {
  try {
    const list = await rpc('dn_comments', { p_id: m.id });
    if (openId !== m.id) return;
    $('cList').innerHTML = list && list.length ? list.map((c) => `<div class="cm"><div class="av"><img src="${aImg(c.animal)}" alt=""></div><div class="t"><b>${esc(c.nickname)}</b><i>${ago(c.created_at)}</i><br>${esc(c.body)}</div>${c.mine ? `<button class="del" data-c="${c.id}">${L_('삭제', 'Delete')}</button>` : `<button class="del blk" data-c="${c.id}" data-n="${esc(c.nickname)}">${L_('차단', 'Block')}</button>`}</div>`).join('')
      : `<p class="hint">${L_('첫 댓글을 남겨 보세요. 댓글이 달리면 쪽지가 12시간 더 남아요.', 'Be the first — each new commenter adds 12 hours.')}</p>`;
    $('cList').querySelectorAll('.blk').forEach((b) => b.onclick = () => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = L_('정말 차단?', 'Sure?'); return; }
      blockUser({ p_comment: b.dataset.c }, m.id);
    });
    $('cList').querySelectorAll('.del:not(.blk)').forEach((b) => b.onclick = async () => {
      try { await rpc('dn_delete_comment', { p_comment: b.dataset.c }); await refreshMemo(m.id); loadComments(memos.get(m.id) || m); } catch (e) { toast(errMsg(e)); }
    });
  } catch (e) { if (openId === m.id) $('cList').innerHTML = `<p class="hint">${errMsg(e)}</p>`; }
}
async function refreshMemo(id) {
  try { const r = await rpc('dn_memo', { p_id: id }); if (r && r[0]) memos.set(id, r[0]); else memos.delete(id); } catch (e) {}
  render();
}
async function like(m) {
  if (!user && !(await ensureUser())) return;
  try {
    const r = await rpc('dn_toggle_like', { p_id: m.id });
    Object.assign(m, { liked: r.liked, likes: r.likes, expires_at: r.expires_at });
    render();
    if (openId === m.id) {
      const b = $('mLike'); b.className = m.liked ? 'liked' : ''; b.textContent = `${m.liked ? '❤️' : '🤍'} ${m.likes}`;
      const bh = bonusH(m);
      document.querySelector('.life').innerHTML = `<span>⏳ ${left(m.expires_at)}</span>${bh ? `<b>❤️💬 ${L_('덕분에', 'bonus')} +${bh}${L_('시간', 'h')}</b>` : ''}`;
    }
  } catch (e) { toast(errMsg(e)); }
}
async function addComment(m) {
  if (!user && !(await ensureUser())) return;
  const inp = $('cIn'), v = inp.value.trim();
  if (!v) return;
  $('cGo').disabled = true;
  try {
    const r = await rpc('dn_add_comment', { p_id: m.id, p_body: v });
    inp.value = '';
    Object.assign(m, { comments: r.comments, expires_at: r.expires_at });
    $('cN').textContent = m.comments;
    const bh = bonusH(m);
    document.querySelector('.life').innerHTML = `<span>⏳ ${left(m.expires_at)}</span>${bh ? `<b>❤️💬 ${L_('덕분에', 'bonus')} +${bh}${L_('시간', 'h')}</b>` : ''}`;
    render(); loadComments(m);
  } catch (e) { toast(errMsg(e)); }
  $('cGo').disabled = false;
}
function shareUrl(m) {
  let base = location.origin + '/apps/dongne-note';
  try { if (MGH.embedded) base = window.parent.location.origin + '/apps/dongne-note'; } catch (e) {}
  return `${base}?memo=${m.id}`;
}
async function share(m) {
  const url = shareUrl(m), text = `📝 ${m.place || m.area || L_('동네', 'Town')}${L_('에 남긴 쪽지', ' note')}: ${m.body.slice(0, 40)}`;
  if (navigator.share) {
    try { await navigator.share({ title: L_('동네쪽지', 'Neighborhood Notes'), text, url }); window.MGH?.shared?.('native'); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); window.MGH?.shared?.('copy'); toast(L_('링크를 복사했어요', 'Link copied')); }
  catch (e) { window.prompt(L_('아래 링크를 복사하세요', 'Copy this link'), url); }
}
function more(m) {
  openSheet(`<h3>${L_('쪽지 메뉴', 'Note menu')}</h3><div class="menu">
    ${m.mine ? `<button id="oDel" style="color:var(--red)">🗑️ ${L_('내 쪽지 삭제', 'Delete my note')}</button>` : `
    <div style="font-weight:800;margin:4px 0">🚨 ${L_('신고하기', 'Report')}</div>
    ${[['child', '🧒 아동 안전 (아동 대상 성적 콘텐츠·그루밍)', 'Child safety (child sexual abuse, grooming)'], ['spam', '스팸·광고', 'Spam'], ['sexual', '음란·선정적', 'Sexual'], ['hate', '욕설·혐오', 'Abuse / hate'], ['privacy', '개인정보 노출', 'Personal info'], ['etc', '기타', 'Other']].map(([k, ko, en]) => `<button data-r="${k}">${L_(ko, en)}</button>`).join('')}
    <div style="font-weight:800;margin:10px 0 4px">🙈 ${L_('차단하기', 'Block')}</div>
    <button id="oBlock">${L_(`${esc(m.nickname)} 님의 쪽지·댓글 안 보기`, `Hide all from ${esc(m.nickname)}`)}</button>`}
    <button id="oBack">${L_('돌아가기', 'Back')}</button></div>`);
  $('oBack').onclick = () => openMemo(m.id);
  if ($('oBlock')) $('oBlock').onclick = () => blockUser({ p_memo: m.id });
  if ($('oDel')) $('oDel').onclick = async () => {
    if ($('oDel').dataset.armed !== '1') { $('oDel').dataset.armed = '1'; $('oDel').textContent = L_('한 번 더 누르면 삭제돼요', 'Tap again to delete'); return; }
    try { await rpc('dn_delete_memo', { p_id: m.id }); memos.delete(m.id); closeSheet(); render(); toast(L_('삭제했어요', 'Deleted')); } catch (e) { toast(errMsg(e)); }
  };
  $('sheetBody').querySelectorAll('[data-r]').forEach((b) => b.onclick = async () => {
    if (!user && !(await ensureUser())) return;
    try { await rpc('dn_report', { p_id: m.id, p_reason: b.dataset.r }); if (b.dataset.r === 'child') { memos.delete(m.id); render(); } closeSheet(); toast(b.dataset.r === 'child' ? L_('신고했어요. 이 쪽지는 바로 숨겼어요', 'Reported and hidden right away') : L_('신고했어요. 확인 후 처리할게요', 'Reported. Thank you')); } catch (e) { toast(errMsg(e)); }
  });
}

async function blockUser(target, reopen) {
  if (!user && !(await ensureUser())) return;
  try {
    await rpc('dn_block', Object.assign({ p_memo: null, p_comment: null }, target));
    memos.clear(); closeSheet();
    toast(L_('차단했어요. 이제 그 이웃의 쪽지·댓글은 안 보여요', 'Blocked. You will no longer see their notes'));
    await load();
    if (reopen && memos.has(reopen)) openMemo(reopen);
  } catch (e) { toast(errMsg(e)); }
}

/* ---------- 지금의 이야기 ---------- */
let storyTab = 'new';
function openStory() {
  const b = map.getBounds();
  const all = visible().filter((m) => b.contains([m.lat, m.lng]));
  const list = all.sort(storyTab === 'new' ? (a, c) => new Date(c.created_at) - new Date(a.created_at) : (a, c) => score(c) - score(a) || new Date(c.created_at) - new Date(a.created_at)).slice(0, 100);
  openSheet(`<h3>💬 ${L_('지금의 이야기', 'Stories here')} <span style="color:var(--sub);font-size:14px">${all.length}</span></h3>
    <div class="tabs"><button data-t="new" class="${storyTab === 'new' ? 'on' : ''}">${L_('최신순', 'Newest')}</button><button data-t="hot" class="${storyTab === 'hot' ? 'on' : ''}">${L_('인기순', 'Popular')}</button></div>
    <div class="list">${list.length ? list.map((m) => `<button class="it" data-id="${m.id}"><div class="av"><img src="${aImg(m.animal)}" alt=""></div><div class="t" style="--nc:${nc(m)}"><b>${esc(m.place || m.area || L_('이 근처', 'Nearby'))}</b><p>${esc(m.body)}</p><span>${esc(m.nickname)} · ${ago(m.created_at)}${m.likes ? ` · ❤️ ${m.likes}` : ''}${m.comments ? ` · 💬 ${m.comments}` : ''}</span></div></button>`).join('')
      : `<div class="empty">${L_('이 화면에는 아직 쪽지가 없어요.<br>이 동네 첫 쪽지를 남겨 보세요! ✍️', 'No notes here yet.<br>Be the first! ✍️')}</div>`}</div>`);
  $('sheetBody').querySelectorAll('[data-t]').forEach((x) => x.onclick = () => { storyTab = x.dataset.t; openStory(); });
  $('sheetBody').querySelectorAll('.it').forEach((x) => x.onclick = () => { const m = memos.get(x.dataset.id); if (m) focusAbove(m.lat, m.lng); openMemo(x.dataset.id); });
}
$('bStory').onclick = openStory;

/* ---------- 기간 ---------- */
const PERIOD_LBL = { 0: ['전체', 'All'], 3: ['3일', '3 days'], 1: ['오늘', 'Today'] };
function setPeriod(p) {
  period = p; lsSet('period', p);
  document.querySelectorAll('#chips [data-p]').forEach((b) => b.classList.toggle('on', +b.dataset.p === p));
  render();
}
document.querySelectorAll('#chips [data-p]').forEach((b) => {
  b.textContent = L_(PERIOD_LBL[b.dataset.p][0], PERIOD_LBL[b.dataset.p][1]);
  b.onclick = () => setPeriod(+b.dataset.p);
});

/* ---------- 검색(지도 이동) ---------- */
$('bSearch').onclick = () => {
  openSheet(`<h3>🔍 ${L_('장소 찾기', 'Find a place')}</h3>
    <div class="row"><input class="inp" id="q" placeholder="${L_('장소·동네 이름', 'Place or area')}" enterkeyhint="search"><button class="btn" id="qGo">${L_('검색', 'Search')}</button></div>
    <div class="res" id="qRes"></div>`);
  const go = async () => {
    const q = $('q').value.trim(); if (!q) return;
    const box = $('qRes'); box.innerHTML = `<p class="hint">${L_('찾는 중…', 'Searching…')}</p>`;
    try {
      const c = map.getCenter();
      const r = await fetch(`${API}/api/dongne-note/places?q=${encodeURIComponent(q)}&lat=${c.lat.toFixed(1)}&lng=${c.lng.toFixed(1)}`);
      const list = r.ok ? await r.json() : [];
      if (!Array.isArray(list) || !list.length) { box.innerHTML = `<p class="hint">${L_('찾지 못했어요', 'Nothing found')}</p>`; return; }
      box.innerHTML = list.map((p, i) => `<button data-i="${i}"><b>${esc(p.name)}</b><span>${esc(p.area || p.addr)}</span></button>`).join('');
      box.querySelectorAll('button').forEach((b) => b.onclick = () => { const p = list[+b.dataset.i]; closeSheet(); map.setView([p.lat, p.lng], 16); });
    } catch (e) { box.innerHTML = `<p class="hint">${L_('검색이 잠시 안 돼요', 'Search unavailable')}</p>`; }
  };
  $('qGo').onclick = go; $('q').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('q').focus(), 250);
};

/* ---------- 내 쪽지 ---------- */
$('bMe').onclick = async () => {
  if (user === undefined && !BACKEND) return;
  if (!user && !(await ensureUser(L_('로그인하면 내 동물을 고르고 내가 남긴 쪽지를 모아 볼 수 있어요.', 'Log in to pick your animal and see your notes.')))) return;
  try { me = await rpc('dn_me'); } catch (e) {}
  const list = (me && me.memos) || [];
  const alive = list.filter((m) => m.alive), likes = list.reduce((a, m) => a + m.likes, 0), cms = list.reduce((a, m) => a + m.comments, 0);
  openSheet(`<div class="who"><div class="av"><img src="${aImg(myAnimal || 'fox')}" alt=""></div><div><b>${esc((me && me.nickname) || user.name)}</b><span>${L_(`살아 있는 쪽지 ${alive.length}개 · 받은 ❤️ ${likes} · 💬 ${cms}`, `${alive.length} live notes · ❤️ ${likes} · 💬 ${cms}`)}</span></div></div>
    <div style="font-weight:800">${L_('내 동물', 'My animal')}</div>${animalGrid(myAnimal)}
    <div style="font-weight:800;margin-bottom:4px">${L_('내가 남긴 쪽지', 'My notes')}</div>
    <div class="list">${list.length ? list.map((m) => `<button class="it" data-id="${m.id}" ${m.alive ? '' : 'disabled style="opacity:.5"'}><div class="t" style="--nc:${nc(m)}"><b>${esc(m.place || m.area || '')}</b><p>${esc(m.body)}</p><span>${ago(m.created_at)} · ${m.alive ? left(m.expires_at) : L_('사라진 쪽지', 'Gone')}${m.likes ? ` · ❤️ ${m.likes}` : ''}${m.comments ? ` · 💬 ${m.comments}` : ''}</span></div></button>`).join('')
      : `<div class="empty">${L_('아직 남긴 쪽지가 없어요', 'No notes yet')}</div>`}</div>
    <button class="btn s" id="unblk" style="width:100%;margin-top:14px">🙈 ${L_('차단한 이웃 모두 풀기', 'Unblock everyone')}</button>`);
  $('unblk').onclick = async () => { try { const n = await rpc('dn_unblock_all'); toast(L_(`차단 ${n || 0}명을 풀었어요`, `Unblocked ${n || 0}`)); memos.clear(); load(); } catch (e) { toast(errMsg(e)); } };
  bindGrid($('sheetBody'), async (a) => {
    try { await rpc('dn_set_animal', { p_animal: a }); myAnimal = a; lsSet('animal', a); updateMe(); toast(L_(`이제 ${ANAME[a][0]}(으)로 보여요 (새 쪽지부터)`, `You are now a ${ANAME[a][1]} (new notes)`)); } catch (e) { toast(errMsg(e)); }
  });
  $('sheetBody').querySelectorAll('.it:not([disabled])').forEach((x) => x.onclick = () => { const m = list.find((y) => y.id === x.dataset.id); if (m) focusAbove(m.lat, m.lng); openMemo(x.dataset.id); });
};

$('bWrite').onclick = startWrite;

/* ---------- 시작 ---------- */
$('logo').textContent = L_('동네쪽지', 'Neighborhood Notes');
$('sbarTxt').textContent = L_('장소·동네 찾기', 'Find a place or area');
const TAB = { bStory: ['이야기', 'Stories'], bWrite: ['쪽지 쓰기', 'Write'], bMe: ['내 쪽지', 'My notes'], bHelp: ['도움말', 'Help'] };
for (const k in TAB) $(k).querySelector('.lb').textContent = L_(TAB[k][0], TAB[k][1]);
document.title = L_('동네쪽지', 'Neighborhood Notes');
setPeriod(period);
updateMe();

function showIntro() {
  $('inTitle').textContent = L_('동네쪽지', 'Neighborhood Notes') + ' 📮';
  $('inDesc').textContent = L_('지도 위 장소에 동물 친구와 함께 쪽지를 남기고, 이웃들의 이야기를 구경해요.', 'Leave notes on places with your animal and read what your neighbors left.');
  $('inList').innerHTML = [
    L_('📍 장소를 검색하거나 지도에서 골라 쪽지를 남겨요', '📍 Search or pick a place to leave a note'),
    L_('🦊 내 쪽지는 내가 고른 동물로 보여요', '🦊 Your notes show your animal'),
    L_('⏳ 쪽지는 7일 뒤 사라져요', '⏳ Notes vanish after 7 days'),
    L_('❤️ 좋아요·💬 댓글이 달리면 최대 30일까지 남아요', '❤️ Likes and 💬 comments keep them up to 30 days'),
    L_('🔒 내 위치(GPS)는 사용하지 않아요', '🔒 Your GPS location is never used'),
  ].map((s) => `<li>${s}</li>`).join('');
  $('inGo').textContent = L_('둘러보기', 'Start');
  $('intro').style.display = 'flex';
  $('inGo').onclick = () => { $('intro').style.display = 'none'; lsSet('intro', true); };
}
$('bHelp').onclick = showIntro;
if (!lsGet('intro', false)) showIntro();

// 공유 링크(?memo=)로 들어온 경우
(function () {
  let q = location.search;
  try { if (window.MGH && MGH.embedded) q = window.parent.location.search; } catch (e) {}
  const id = new URLSearchParams(q).get('memo');
  if (id && /^[0-9a-f-]{36}$/.test(id)) {
    lsSet('intro', true); $('intro').style.display = 'none';
    setTimeout(() => openMemo(id), 600);
  }
})();
if (!window.MGH || !MGH.embedded) load();
</script>
</body>
