<style>
  :root {
    --felt: #16302a;
    --felt-dark: #0c1e19;
    --felt-line: rgba(201,161,90,0.18);
    --ivory: #efe7d6;
    --ivory-dim: #ddd2ba;
    --ink: #241c14;
    --gold: #c9a15a;
    --gold-bright: #e6c584;
    --red: #c0392b;
    --yellow: #b8860b;
    --tgreen: #3f7350;
    --tblue: #2e5c8a;
    --muted: #8aa69c;
    --danger: #e05a4a;
    --panel: rgba(12,30,25,0.92);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--felt-dark);
    font-family: 'Noto Sans KR', sans-serif; color: var(--ivory);
    overflow: hidden;
  }
  h1, h2, h3, .display { font-family: 'Noto Serif KR', serif; }
  button {
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    border: 1px solid var(--gold); background: transparent; color: var(--ivory);
    border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 500;
    transition: all .15s ease;
  }
  button:hover:not(:disabled) { background: var(--gold); color: var(--ink); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--gold); color: var(--ink); }
  button.primary:hover:not(:disabled) { background: var(--gold-bright); }

  #app { position: relative; width: 100%; height: 100%; }

  .screen {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ---------- 설정 화면 ---------- */
  #screen-setup {
    background:
      radial-gradient(ellipse at 50% 20%, #1d3b33 0%, var(--felt) 45%, var(--felt-dark) 100%);
  }
  .setup-card {
    background: var(--panel); border: 1px solid var(--felt-line);
    border-radius: 14px; padding: 40px 48px; width: min(520px, 90vw);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .setup-title { font-size: 40px; letter-spacing: 4px; text-align: center; margin: 0 0 4px; color: var(--gold-bright); }
  .setup-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 32px; letter-spacing: 1px;}
  .setup-row { margin-bottom: 24px; }
  .setup-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .option-group { display: flex; gap: 8px; }
  .option-btn {
    flex: 1; padding: 12px 8px; border-radius: 8px; border: 1px solid var(--felt-line);
    background: rgba(255,255,255,0.03); text-align: center; font-size: 14px;
  }
  .option-btn.selected { border-color: var(--gold); background: rgba(201,161,90,0.16); color: var(--gold-bright); }
  .stepper { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .stepper button { width: 36px; height: 36px; padding: 0; border-radius: 50%; }
  .stepper .value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; min-width: 40px; text-align: center; }
  #btn-start { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; letter-spacing: 2px; }

  /* ---------- 셔플 화면 ---------- */
  #screen-shuffle { background: var(--felt-dark); }
  .shuffle-stack { display: flex; gap: 6px; }
  .shuffle-tile {
    width: 46px; height: 64px; background: var(--ivory); border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    animation: shuffleMove 1.1s ease-in-out infinite;
  }
  .shuffle-tile:nth-child(2){ animation-delay: .08s; }
  .shuffle-tile:nth-child(3){ animation-delay: .16s; }
  .shuffle-tile:nth-child(4){ animation-delay: .24s; }
  .shuffle-tile:nth-child(5){ animation-delay: .32s; }
  @keyframes shuffleMove {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-22px) rotate(6deg); }
  }
  .shuffle-label { margin-top: 28px; color: var(--muted); letter-spacing: 3px; font-size: 13px; }

  /* ---------- 게임 화면 ---------- */
  #screen-game {
    background: radial-gradient(ellipse at center, #1c3a32 0%, var(--felt) 55%, var(--felt-dark) 100%);
    justify-content: flex-start; padding: 0;
  }
  .topbar {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 1px solid var(--felt-line); font-size: 13px;
    background: rgba(0,0,0,.15);
  }
  .topbar .brand { font-family: 'Noto Serif KR', serif; font-size: 18px; letter-spacing: 3px; color: var(--gold-bright); }
  .topbar .meta { display: flex; gap: 22px; color: var(--muted); align-items: center; }
  .topbar .meta b { color: var(--ivory); font-family: 'IBM Plex Mono', monospace; }
  #btn-toggle-log { padding: 6px 12px; font-size: 12px; }

  .table {
    flex: 1; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; position: relative;
    padding: 10px 20px;
  }

  .opponents { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .opp-box {
    border: 1px solid var(--felt-line); border-radius: 10px; padding: 10px 18px;
    text-align: center; min-width: 96px; background: rgba(0,0,0,.18); position: relative;
  }
  .opp-box.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,161,90,.35), 0 0 18px rgba(201,161,90,.25); }
  .opp-box .name { font-size: 13px; color: var(--ivory-dim); margin-bottom: 6px; }
  .opp-box .thinking { position:absolute; top:-10px; right:-6px; font-size: 10px; background: var(--gold); color: var(--ink); padding: 2px 6px; border-radius: 10px; }
  .tile-back-pile { display: flex; flex-wrap: wrap; gap: 2px; max-width: 96px; justify-content: center; }
  .tile-back {
    width: 11px; height: 15px; border-radius: 2px; flex-shrink: 0;
    background:
      repeating-linear-gradient(135deg, var(--gold) 0px, var(--gold) 1px, transparent 1px, transparent 4px),
      linear-gradient(180deg, #3a2a1a, #241b12);
    border: 1px solid rgba(0,0,0,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
  }

  .center-field {
    min-height: 130px; width: min(560px, 90vw); border: 1px dashed var(--felt-line);
    border-radius: 14px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 14px; background: rgba(0,0,0,.12);
  }
  .center-field .field-tiles { display: flex; gap: 6px; }
  .center-field .field-note { font-size: 12px; color: var(--muted); }
  .center-field .field-empty { color: var(--muted); font-size: 13px; letter-spacing: .5px; }

  .hand-area { width: 100%; padding: 14px 20px 20px; border-top: 1px solid var(--felt-line); background: rgba(0,0,0,.2); }

  /* ---------- 족보 안내 패널 (열고 닫기 가능) ---------- */
  #rank-guide {
    position: fixed; top: 66px; right: 14px; width: 128px; z-index: 25;
    background: var(--panel); border: 1px solid var(--felt-line); border-radius: 10px;
    padding: 12px; font-size: 11px; color: var(--ivory-dim);
    transform: translateX(160%); opacity: 0; pointer-events: none;
    transition: transform .2s ease, opacity .2s ease;
  }
  #rank-guide.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .rg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #rank-guide h4 { margin: 0; font-family: 'Noto Serif KR', serif; font-size: 13px; color: var(--gold-bright); letter-spacing: 1px; }
  .rg-body { display: flex; flex-direction: column; }
  .rg-col { flex: 1; min-width: 0; }
  .rg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .rg-list li { display: flex; align-items: center; gap: 6px; }
  .rg-count {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink); background: var(--gold);
    padding: 1px 5px; border-radius: 8px; flex-shrink: 0;
  }
  .rg-divider { margin: 10px 0 6px; font-size: 9.5px; color: var(--muted); text-align: center; border-top: 1px dashed var(--felt-line); padding-top: 6px; }
  .rg-five li { position: relative; padding-left: 4px; }
  .rg-rank {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; width: 14px; height: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid var(--gold); color: var(--gold-bright);
  }
  .rg-five li:last-child .rg-rank { background: var(--gold); color: var(--ink); }
  .rg-five li:last-child { font-weight: 600; color: var(--gold-bright); }
  .rg-five { position: relative; }
  .rg-five::before {
    content: ''; position: absolute; left: 7px; top: 7px; bottom: 7px; width: 1px; background: var(--felt-line); z-index: -1;
  }
  .hand-status { text-align: center; font-size: 13px; color: var(--gold-bright); min-height: 18px; margin-bottom: 8px; letter-spacing: .5px; }
  .hand { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 96px; }
  .actions { display: flex; justify-content: center; gap: 14px; margin-top: 14px; }

  /* 타일 (원작의 '음각+색' 손맛을 참조) */
  .tile {
    width: 54px; height: 76px; background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    border-radius: 7px; border: 1px solid rgba(0,0,0,.25);
    box-shadow: 0 3px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.55);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 22px;
    cursor: pointer; user-select: none; transition: transform .12s ease, box-shadow .12s ease;
    flex-shrink: 0;
  }
  .tile:nth-child(odd) { transform: rotate(-1.4deg); }
  .tile:nth-child(even) { transform: rotate(1.4deg); }
  .tile:hover { transform: translateY(-6px) rotate(0deg); }
  .tile.selected { transform: translateY(-16px) rotate(0deg); box-shadow: 0 12px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.6); border-color: var(--gold); }
  .tile.mini { width: 34px; height: 48px; font-size: 15px; cursor: default; }
  .tile.mini:hover { transform: none; }
  .tile-red { color: var(--red); text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 -1px 1px rgba(0,0,0,.2); }
  .tile-yellow { color: var(--yellow); text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 -1px 1px rgba(0,0,0,.2); }
  .tile-green { color: var(--tgreen); text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 -1px 1px rgba(0,0,0,.2); }
  .tile-blue { color: var(--tblue); text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 -1px 1px rgba(0,0,0,.2); }

  /* 로그 패널 */
  #log-panel {
    position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
    background: var(--panel); border-left: 1px solid var(--felt-line);
    padding: 20px; overflow-y: auto; transition: right .2s ease; z-index: 30;
    font-size: 12.5px; line-height: 1.7; color: var(--ivory-dim);
  }
  #log-panel.open { right: 0; }
  #log-panel h3 { margin: 0; color: var(--gold-bright); font-size: 15px; }
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .log-close {
    width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }

  /* 모달 */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 40;
  }
  .modal-backdrop.show { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--gold); border-radius: 14px;
    padding: 32px 36px; width: min(480px, 90vw); max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal-box h2 { margin-top: 0; color: var(--gold-bright); text-align: center; letter-spacing: 2px; }
  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--felt-line); font-size: 14px;
  }
  .result-row .rank { font-family: 'IBM Plex Mono', monospace; color: var(--gold-bright); width: 28px; }
  .result-row .who { flex: 1; }
  .result-row .delta { font-family: 'IBM Plex Mono', monospace; }
  .delta.pos { color: #7fd99a; }
  .delta.neg { color: var(--danger); }
  .chip-pills { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .chip-pill {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 6px;
    border-radius: 10px; border: 1px solid var(--gold); color: var(--gold-bright);
    animation: chipPop .3s ease backwards;
  }
  .total-score-line { text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
  #btn-modal-continue { width: 100%; margin-top: 18px; }

  /* ---------- topbar 보조 버튼 / 정렬 토글 ---------- */
  .topbar-actions { display: flex; gap: 8px; }
  #btn-toggle-sound, #btn-toggle-ranks, #btn-toggle-log { padding: 6px 12px; font-size: 12px; }
  .hand-status-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; position: relative; }
  .ghost-btn { padding: 4px 10px; font-size: 11px; border-color: var(--felt-line); color: var(--muted); position: absolute; right: 0; }
  .ghost-btn:hover { border-color: var(--gold); color: var(--gold-bright); background: transparent; }

  /* ---------- 애니메이션 ---------- */
  @keyframes tilePopIn {
    from { transform: scale(0.5) translateY(24px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .field-tiles .tile { animation: tilePopIn .28s cubic-bezier(.2,.9,.3,1.2); }
  .field-tiles .tile:nth-child(1){ animation-delay: 0s; }
  .field-tiles .tile:nth-child(2){ animation-delay: .04s; }
  .field-tiles .tile:nth-child(3){ animation-delay: .08s; }
  .field-tiles .tile:nth-child(4){ animation-delay: .12s; }
  .field-tiles .tile:nth-child(5){ animation-delay: .16s; }

  @keyframes tileDeal {
    from { transform: translateY(-30px) rotate(0deg); opacity: 0; }
  }
  .hand .tile { animation: tileDeal .25s ease backwards; }

  @keyframes thinkPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .opp-box .thinking { animation: thinkPulse 1.1s ease-in-out infinite; }

  @keyframes chipPop {
    from { transform: scale(0) translateY(6px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .chip-pill:nth-child(1){ animation-delay: .05s; }
  .chip-pill:nth-child(2){ animation-delay: .12s; }
  .chip-pill:nth-child(3){ animation-delay: .19s; }
  .chip-pill:nth-child(4){ animation-delay: .26s; }
  .chip-pill:nth-child(5){ animation-delay: .33s; }

  @keyframes modalIn {
    from { transform: translateY(14px) scale(.96); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .modal-backdrop.show .modal-box { animation: modalIn .22s ease; }

  @keyframes resultRowIn {
    from { transform: translateX(-8px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .result-row { animation: resultRowIn .25s ease backwards; }
  .result-row:nth-child(1){ animation-delay: 0s; }
  .result-row:nth-child(2){ animation-delay: .08s; }
  .result-row:nth-child(3){ animation-delay: .16s; }
  .result-row:nth-child(4){ animation-delay: .24s; }
  .result-row:nth-child(5){ animation-delay: .32s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

  /* ---------- 반응형 (모바일) ---------- */
  @media (max-width: 720px) {
    .topbar { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
    .topbar .brand { font-size: 15px; letter-spacing: 1.5px; }
    .topbar .meta { gap: 12px; font-size: 11px; flex-wrap: wrap; }
    .opponents { gap: 16px; }
    .opp-box { min-width: 74px; padding: 8px 10px; }
    .tile-back-pile { max-width: 70px; }
    .tile-back { width: 8px; height: 11px; }
    .center-field { width: 94vw; min-height: 100px; padding: 10px; }
    .tile { width: 42px; height: 60px; font-size: 17px; border-radius: 5px; }
    .tile.mini { width: 26px; height: 38px; font-size: 12px; }
    .hand { gap: 4px; min-height: 76px; }
    .hand-area { padding: 10px 8px 14px; }
    .actions button { padding: 10px 14px; font-size: 13px; }
    .ghost-btn { position: static; }
    .hand-status-row { flex-direction: column; gap: 4px; }
    .setup-card { padding: 28px 22px; }
    .modal-box { padding: 22px 20px; width: 94vw; }
    #log-panel { width: 86vw; right: -86vw; }
    #rank-guide { width: 208px; padding: 8px 10px; font-size: 9.5px; top: 58px; bottom: auto; right: 6px; }
    #rank-guide h4 { font-size: 11px; margin-bottom: 6px; }
    .rg-body { flex-direction: row; gap: 10px; }
    .rg-col { flex: 1; }
    .rg-col:first-child { padding-top: 14px; } /* 두번째 컬럼의 divider 라벨과 높이를 맞춤 */
    .rg-divider { margin: 0 0 6px; border-top: none; padding-top: 0; text-align: left; }
    .rg-count { font-size: 8px; padding: 1px 4px; }
    .rg-rank { width: 12px; height: 12px; font-size: 8px; }
  }
</style>

<div id="app">

  <!-- ============ 설정 화면 ============ -->
  <section id="screen-setup" class="screen active">
    <div class="setup-card">
      <h1 class="setup-title">LEXIO</h1>
      <div class="setup-sub">LEXIO · WEB EDITION</div>

      <div class="setup-row">
        <div class="setup-label"><span data-i18n="setupPlayers">인원 수</span></div>
        <div class="option-group" id="opt-playercount">
          <div class="option-btn" data-value="3" data-i18n="opt3">3명</div>
          <div class="option-btn selected" data-value="4" data-i18n="opt4">4명</div>
          <div class="option-btn" data-value="5" data-i18n="opt5">5명</div>
        </div>

const COLOR_ORDER = ['blue', 'green', 'yellow', 'red'];
const RANK_ORDER = [2, 1, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3];
const PLAYER_CONFIG = { 3: { maxNumber: 9 }, 4: { maxNumber: 13 }, 5: { maxNumber: 15 } };

  }

      const quadNumber = groups[0][0].number;

  if (playerId !== game.currentPlayerIndex) throw new Error(T('errNotYourTurn', game.currentPlayerIndex));
  const player = game.players[playerId];
  const tiles = tileIds.map((id) => {
    const t = player.hand.find((h) => h.id === id);
    if (!t) throw new Error(T('errTileNotInHand', id));
    return t;
  });
  const combo = analyzeCombo(tiles, game.maxNumber);
  if (!combo.valid) throw new Error(T('errInvalidCombo', combo.reason));
  const isLead = game.requiredSize === null;
  if (!isLead) {
    if (combo.size !== game.requiredSize) throw new Error(T('errWrongSize', game.requiredSize, combo.size));
    if (compareCombo(combo, game.lastPlay.combo) <= 0) throw new Error(T('errMustBeHigher'));
  }
  const idSet = new Set(tileIds);
  player.hand = player.hand.filter((t) => !idSet.has(t.id));
  game.lastPlay = { playerIndex: playerId, combo, tiles };
  game.requiredSize = combo.size; game.leadPlayerIndex = playerId; game.passStreak = 0;
  game.playedTiles.push(...tiles);
  game.log.push(T('logSubmit', playerId, combo.subType, combo.size, player.hand.length));
  if (player.hand.length === 0) { endRoundImmediately(game, playerId); return game; }
  advanceTurn(game);
  return game;
}
function passTurn(game, playerId) {
  if (game.roundOver) throw new Error(T('errRoundOver'));
  if (playerId !== game.currentPlayerIndex) throw new Error(T('errNotYourTurn', game.currentPlayerIndex));
  if (game.requiredSize === null) throw new Error(T('errLeadCannotPass'));
  game.passStreak += 1;
  game.log.push(T('logPass', playerId));
  if (game.passStreak >= game.players.length - 1) {
    game.currentPlayerIndex = game.leadPlayerIndex;
    game.requiredSize = null; game.lastPlay = null; game.passStreak = 0;
    game.log.push(T('logAllPass', game.leadPlayerIndex));
    return game;
  }
  advanceTurn(game);
  return game;
}
function endRoundImmediately(game, finisherId) {
  const results = game.players.map((p) => ({ playerId: p.id, remaining: p.hand.length }));
  const scores = calculateRoundScores(results);
  game.players.forEach((p) => { p.totalScore += scores[p.id]; });
  const ranking = [...results].sort((a, b) => a.remaining - b.remaining);
  game.roundOver = true;
  game.roundResults = { finisherId, results, scores, ranking };
  game.log.push(T('logFinish', finisherId, game.round));
  return game;
}
function isGameOver(game) { return game.round >= game.totalRounds && game.roundOver; }
function combinations(arr, k) {
  const results = [];
  function helper(start, combo) {
    if (combo.length === k) { results.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); helper(i + 1, combo); combo.pop(); }
  }
  helper(0, []);
  return results;
}
function findValidCombosOfSize(hand, size, maxNumber) {
  if (size > hand.length) return [];
  const valid = [];
  for (const tiles of combinations(hand, size)) {
    const combo = analyzeCombo(tiles, maxNumber);
    if (combo.valid) valid.push({ tiles, combo });
  }
  return valid;
}
const Core = {
  COLOR_ORDER, RANK_ORDER, PLAYER_CONFIG, colorRank, numberStrength, tileValue, getMaxNumber,
  generateDeck, shuffle, deal, findStartingPlayer, isValidStraight, analyzeCombo, compareCombo,
  calculateRoundScores, createGame, startRound, submitPlay, passTurn, isGameOver, combinations, findValidCombosOfSize,
};

/* =======================================================================
 * AI (lexio-ai.js 이식)
 * ======================================================================= */
(function () {
  const core = Core;
  const NEAR_FINISH_THRESHOLD = 2;
  const MY_ENDGAME_THRESHOLD = 4;
  const HOLD_BASE_THRESHOLD = 0.35;

  function activeRankOrder(maxNumber) { return core.RANK_ORDER.filter((n) => n <= maxNumber); }
  function activeStrength(number, maxNumber) {
    const order = activeRankOrder(maxNumber);
    return order.length - order.indexOf(number);
  }
  function weaknessScore(tiles, maxNumber) {
    const avg = tiles.reduce((sum, t) => sum + activeStrength(t.number, maxNumber), 0) / tiles.length;
    if (maxNumber === 1) return 1;
    return 1 - (avg - 1) / (maxNumber - 1);
  }
  function unseenStrongerRatio(tiles, game, playerId) {
    const maxNumber = game.maxNumber;
    const bestStrength = Math.max(...tiles.map((t) => activeStrength(t.number, maxNumber)));
    const strongerNumbers = [];
    for (let n = 1; n <= maxNumber; n++) if (activeStrength(n, maxNumber) > bestStrength) strongerNumbers.push(n);
    const totalSlots = strongerNumbers.length * core.COLOR_ORDER.length;
    if (totalSlots === 0) return 0;
    const seenIds = new Set([...game.playedTiles.map((t) => t.id), ...game.players[playerId].hand.map((t) => t.id)]);
    let unseen = 0;
    for (const n of strongerNumbers) for (const color of core.COLOR_ORDER) if (!seenIds.has(`${color}-${n}`)) unseen++;
    return unseen / totalSlots;
  }
  function anyOpponentNearFinish(game, playerId) {
    return game.players.some((p) => p.id !== playerId && p.hand.length <= NEAR_FINISH_THRESHOLD);
  }
  function getCandidates(game, playerId) {
    const player = game.players[playerId];
    const isLead = game.requiredSize === null;
    const sizes = isLead ? [1, 2, 3, 5] : [game.requiredSize];
    let candidates = [];
    for (const size of sizes) candidates.push(...core.findValidCombosOfSize(player.hand, size, game.maxNumber));
    if (!isLead) candidates = candidates.filter((c) => core.compareCombo(c.combo, game.lastPlay.combo) > 0);
    return candidates;
  }
  function pickMinimalWinner(candidates) {
    const sortKey = (c) => (c.combo.size === 5 ? [c.combo.subTypeOrder, c.combo.rankValue] : [0, c.combo.rankValue]);
    const sorted = [...candidates].sort((a, b) => {
      const ka = sortKey(a), kb = sortKey(b);
      if (ka[0] !== kb[0]) return ka[0] - kb[0];
      return ka[1] - kb[1];
    });
    return sorted[0];
  }
  function chooseLeadPlay(game, playerId, candidates) {
    const myHandSize = game.players[playerId].hand.length;
    const forceAggressive = myHandSize <= MY_ENDGAME_THRESHOLD || anyOpponentNearFinish(game, playerId);
    if (forceAggressive) {
      const sorted = [...candidates].sort((a, b) => {
        if (b.tiles.length !== a.tiles.length) return b.tiles.length - a.tiles.length;
        return weaknessScore(b.tiles, game.maxNumber) - weaknessScore(a.tiles, game.maxNumber);
      });
      return sorted[0];
    }
    const stuckMultiTile = candidates.filter((c) => c.tiles.length > 1)
      .filter((c) => weaknessScore(c.tiles, game.maxNumber) > 0.55)
      .sort((a, b) => {
        const wa = weaknessScore(a.tiles, game.maxNumber), wb = weaknessScore(b.tiles, game.maxNumber);
        if (wb !== wa) return wb - wa;
        return b.tiles.length - a.tiles.length;
      });
    if (stuckMultiTile.length > 0) return stuckMultiTile[0];
    const singles = candidates.filter((c) => c.tiles.length === 1)
      .sort((a, b) => weaknessScore(b.tiles, game.maxNumber) - weaknessScore(a.tiles, game.maxNumber));
    if (singles.length > 0) return singles[0];
    const fallback = [...candidates].sort((a, b) => weaknessScore(b.tiles, game.maxNumber) - weaknessScore(a.tiles, game.maxNumber));
    return fallback[0];
  }
  function shouldHoldInsteadOfPlay(minimal, game, playerId) {
    const myHandSize = game.players[playerId].hand.length;
    if (anyOpponentNearFinish(game, playerId)) return false;
    if (myHandSize <= MY_ENDGAME_THRESHOLD) return false;
    if (minimal.tiles.length === 1) return false;
    const w = weaknessScore(minimal.tiles, game.maxNumber);
    const ratio = unseenStrongerRatio(minimal.tiles, game, playerId);
    return w < HOLD_BASE_THRESHOLD * ratio;
  }
  function chooseMove(game, playerId) {
    const isLead = game.requiredSize === null;
    const candidates = getCandidates(game, playerId);
    if (isLead) {
      if (candidates.length === 0) throw new Error(`AI(${playerId}): 선인데 낼 수 있는 조합이 없습니다.`);
      const chosen = chooseLeadPlay(game, playerId, candidates);
      return { action: 'play', tileIds: chosen.tiles.map((t) => t.id) };
    }
    if (candidates.length === 0) return { action: 'pass' };
    const minimal = pickMinimalWinner(candidates);
    if (shouldHoldInsteadOfPlay(minimal, game, playerId)) return { action: 'pass' };
    return { action: 'play', tileIds: minimal.tiles.map((t) => t.id) };
  }
  function playAITurn(game) {
    const playerId = game.currentPlayerIndex;
    const decision = chooseMove(game, playerId);
    if (decision.action === 'pass') core.passTurn(game, playerId);
    else core.submitPlay(game, playerId, decision.tileIds);
    return decision;
  }
  window.Ai = { chooseMove, playAITurn };
})();

/* =======================================================================
 * CHIPS (lexio-chips.js 이식)
 * ======================================================================= */
const Chips = (function () {
  const CHIP_DENOMINATIONS = [100, 50, 10, 5, 1];
  function getChipBreakdown(amount) {
    const sign = amount > 0 ? 1 : amount < 0 ? -1 : 0;
    let remaining = Math.abs(Math.round(amount));
    const chips = [];
    for (const denom of CHIP_DENOMINATIONS) {
      const count = Math.floor(remaining / denom);
      if (count > 0) { chips.push({ denom, count }); remaining -= count * denom; }
    }
    return { sign, total: Math.abs(Math.round(amount)), chips };
  }
  return { CHIP_DENOMINATIONS, getChipBreakdown };
})();

/* =======================================================================
 * SOUND (Web Audio API 기반 간단한 효과음, 외부 파일 없이 합성)
 * ======================================================================= */
const Sfx = (function () {
  let ctx = null;
  let enabled = true;
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, duration, type, gainVal, delay) {
    if (!enabled) return;
    try {
      ensure();
      if (!ctx) return;
      const t0 = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(gainVal || 0.05, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    } catch (e) { /* 사운드는 실패해도 게임 진행에 영향 없음 */ }
  }
  return {
    setEnabled(v) { enabled = v; },
    isEnabled() { return enabled; },
    select() { tone(720, 0.05, 'triangle', 0.025); },
    play() { tone(430, 0.1, 'sine', 0.05); },
    pass() { tone(220, 0.14, 'sine', 0.035); },
    error() { tone(130, 0.18, 'sawtooth', 0.04); },
    roundWin() { tone(660, 0.14, 'sine', 0.05, 0); tone(880, 0.2, 'sine', 0.05, 0.12); },
    roundLose() { tone(320, 0.22, 'sine', 0.04, 0); tone(240, 0.24, 'sine', 0.04, 0.1); },
    gameStart() { tone(500, 0.08, 'triangle', 0.04, 0); tone(700, 0.12, 'triangle', 0.04, 0.08); },
  };
})();

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

function tileColorClass(color) { return `tile-${color}`; }

function makeTileEl(tile, opts = {}) {
  const t = el('div', `tile ${tileColorClass(tile.color)}${opts.mini ? ' mini' : ''}${selected.has(tile.id) ? ' selected' : ''}`, String(tile.number));
  t.dataset.id = tile.id;
  return t;
}

function sortedHand(hand) {
  return [...hand].sort((a, b) => {
    if (handSortMode === 'color') {
      const ca = colorRank(a.color), cb = colorRank(b.color);
      if (ca !== cb) return ca - cb;
      return numberStrength(a.number) - numberStrength(b.number);
    }
    const sa = numberStrength(a.number), sb = numberStrength(b.number);
    if (sa !== sb) return sa - sb;
    return colorRank(a.color) - colorRank(b.color);
  });
}

function renderTopBar() {
  $('#meta-round').textContent = G.round;
  $('#meta-total-round').textContent = G.totalRounds;
  $('#meta-difficulty').textContent = T({ easy: 'diffEasy', normal: 'diffNormal', hard: 'diffHard' }[difficultyKey]);
  $('#meta-score').textContent = G.players[0].totalScore;
}

function renderOpponents() {
  const box = $('#opponents');
  box.innerHTML = '';
  for (let i = 1; i < G.players.length; i++) {
    const p = G.players[i];
    const b = el('div', 'opp-box' + (G.currentPlayerIndex === i ? ' active' : ''));
    if (aiThinkingPlayerId === i) b.appendChild(el('div', 'thinking', T('thinking')));
    b.appendChild(el('div', 'name', `AI ${i}`));
    const pile = el('div', 'tile-back-pile');
    for (let k = 0; k < p.hand.length; k++) pile.appendChild(el('div', 'tile-back'));
    b.appendChild(pile);
    box.appendChild(b);
  }
}

function displaySortTiles(tiles, combo) {
  const arr = [...tiles].sort((a, b) => a.number - b.number);
  if (combo.subType === 'straight' || combo.subType === 'straightflush') {
    const numbers = arr.map((t) => t.number);
    const isConsecutive = numbers.every((v, i) => i === 0 || v === numbers[i - 1] + 1);
    if (!isConsecutive && numbers.includes(1)) {
      // wrap 스트레이트(예: 10-11-12-13-1): 1이 가장 높은 카드 역할이므로 맨 뒤로 표시
      const oneIdx = arr.findIndex((t) => t.number === 1);
      const [oneTile] = arr.splice(oneIdx, 1);
      arr.push(oneTile);
    }
  }
  return arr;
}

function renderField() {
  const field = $('#center-field');
  field.innerHTML = '';
  if (!G.lastPlay) {
    field.appendChild(el('div', 'field-empty', T('fieldLeadFree')));
    return;
  }
  const tilesRow = el('div', 'field-tiles');
  for (const t of displaySortTiles(G.lastPlay.tiles, G.lastPlay.combo)) tilesRow.appendChild(makeTileEl(t, { mini: true }));
  field.appendChild(tilesRow);
  const who = G.lastPlay.playerIndex === 0 ? T('you') : `AI ${G.lastPlay.playerIndex}`;
  field.appendChild(el('div', 'field-note', T('fieldNote', who, comboLabel(G.lastPlay.combo), G.requiredSize)));
}

function comboLabel(combo) {
  const map = {
    single: 'rankSingle', pair: 'rankPair', triple: 'rankTriple',
    straight: 'rankStraight', flush: 'rankFlush', fullhouse: 'rankFullhouse',
    fourcard: 'rankFourcard', straightflush: 'rankStraightflush',
  };
  return map[combo.subType] ? T(map[combo.subType]).replace('\n', ' ') : combo.subType;
}

function renderHand() {
  const hand = $('#hand');
  hand.innerHTML = '';
  const myTurn = G.currentPlayerIndex === 0 && !uiLocked && !G.roundOver;
  for (const tile of sortedHand(G.players[0].hand)) {
    const t = makeTileEl(tile);
    if (!myTurn) t.style.cursor = 'default';
    t.addEventListener('click', () => {
      if (!myTurn) return;
      if (selected.has(tile.id)) selected.delete(tile.id); else selected.add(tile.id);
      Sfx.select();
      renderHand();
      renderButtons();
    });
    hand.appendChild(t);
  }
  const status = $('#hand-status');
  if (G.roundOver) status.textContent = '';
  else if (G.currentPlayerIndex !== 0) status.textContent = T('handStatusAITurn', G.currentPlayerIndex);
  else status.textContent = G.requiredSize === null ? T('handStatusLeadFree') : T('handStatusFollow', G.requiredSize);
}

function renderButtons() {
  const myTurn = G.currentPlayerIndex === 0 && !uiLocked && !G.roundOver;
  $('#btn-play').disabled = !myTurn || selected.size === 0;
  $('#btn-pass').disabled = !myTurn || G.requiredSize === null;
}

function renderLog() {
  const content = $('#log-content');
  content.innerHTML = G.log.slice().reverse().map((line) => `<div>${line}</div>`).join('');
}

function renderAll() {
  renderTopBar();

  renderField();
  renderHand();

}

function showToast(msg) {
  const status = $('#hand-status');
  const prev = status.textContent;
  status.textContent = `⚠ ${msg}`;
  status.style.color = 'var(--danger)';
  setTimeout(() => { status.style.color = ''; renderHand(); }, 1600);
}

function afterAction() {
  selected.clear();
  renderAll();
  if (G.roundOver) { showRoundModal(); return; }
  scheduleNextTurn();
}

function scheduleNextTurn() {
  if (G.roundOver) return;
  if (G.currentPlayerIndex === 0) { uiLocked = false; renderAll(); return; }
  uiLocked = true;
  aiThinkingPlayerId = G.currentPlayerIndex;
  renderAll();
  setTimeout(() => {
    try { Ai.playAITurn(G); } catch (e) { console.error(e); }
    aiThinkingPlayerId = null;
    renderAll();
    if (G.roundOver) { uiLocked = false; showRoundModal(); }
    else scheduleNextTurn();
  }, difficultyDelayMs);
}

});

$('#btn-start').addEventListener('click', () => {
  Sfx.gameStart();
  $('#screen-setup').classList.remove('active');
  $('#screen-shuffle').classList.add('active');
  setTimeout(() => {
    G = createGame(selectedPlayerCount, selectedRounds);
    startRound(G);
    selected.clear();
    $('#screen-shuffle').classList.remove('active');
    $('#screen-game').classList.add('active');
    renderAll();
    scheduleNextTurn();
  }, 1200);
});

// 브라우저 언어 설정에 따라 최초 1회 자동으로 화면 언어를 적용
applyLanguage(detectLanguage());
</script>
