const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

  scene.add(g.scene); CATH_ONLY.push(g.scene); if (space === 'temple') g.scene.visible = false;

const beamTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const gx = g.createLinearGradient(0, 0, 64, 0); gx.addColorStop(0, '#000'); gx.addColorStop(.5, 'rgba(0,0,0,0)'); gx.addColorStop(1, '#000'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = gx; g.fillRect(0, 0, 64, 256); const t = new THREE.CanvasTexture(c); return t; })();

const CATH_ONLY = []; // 성당일 때만 보이는 것들
const pewSeat = new THREE.BoxGeometry(4.4, .1, .5), pewBack = new THREE.BoxGeometry(4.4, .5, .08), pewEnd = new THREE.BoxGeometry(.09, .95, .62);

/* ───────── 나무 출입문 (뾰족 아치) ───────── */
const doorM = new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xd09060, emissive: 0x2a160a, roughness: .75, side: THREE.DoubleSide });

  { x: 2.1, z: 13.15, w: 5.0, ax: 'z' }, { x: 8.9, z: 13.15, w: 5.0, ax: 'z' },   // 정문 둘

// 문 앞을 비추는 등불

/* ───────── 파이프오르간 (직접 합성한 느린 화음 · 저작권 없는 자작 진행) ───────── */

const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);
// 라단조 느린 진행: Dm – B♭ – F – C – Gm – Dm/F – A – Dm  (각 9초)
const PROG = [[50, 57, 62, 65, 69], [46, 58, 62, 65, 70], [41, 57, 60, 65, 69], [48, 55, 60, 64, 67], [43, 55, 58, 62, 67], [41, 57, 62, 65, 69], [45, 57, 61, 64, 69], [38, 57, 62, 65, 69]];

// 실제 접속자 — Supabase Realtime: presence 로 누가 있는지·접속자 수, broadcast 로 움직임을 주고받는다
let net = null; const remotes = new Map();
function myState() {
  if (!player) return null;

let lastSent = 0, lastTrack = 0, sentKey = '';
function netState(force = false) {

}

  }

let sbClient = null;
async function leavePresence() {

  for (const k of [...remotes.keys()]) dropRemote(k);
  document.getElementById('ppl').textContent = 1;
}
async function joinPresence() {
  const el = document.getElementById('ppl');
  try {
    const cfg = await (await fetch('/api/public-config')).json();
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return;
    if (!window.supabase) await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'vendor/supabase.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    sbClient = sbClient || window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const sb = sbClient;
    const key = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
    const ch = sb.channel(space === 'temple' ? 'temple:visitors' : 'cathedral:visitors', { config: { presence: { key }, broadcast: { self: false } } }); // 성당·절은 따로
    net = { ch, key, ready: false };

// 성당 ↔ 절
function setSpace(m) {
  if (m === space || (m === 'temple' && !TEMPLE)) return;
  if (mode === 'sit') standUp();
  space = m;
  const T = m === 'temple';
  CATH_ONLY.forEach((o) => { o.visible = !T; });
  TEMPLE.group.visible = T;
  activeSlots = T ? TEMPLE.slots : pewSlots;
  if (navC) { nav = T ? navT : navC; if (player && !nav.ok(player.pos.x, player.pos.z)) { const p = nearestWalkable(player.pos.x, player.pos.z); player.place(p.x, FLOOR, p.z); } }
  if (ac) { const now = ac.currentTime; organBus.gain.cancelScheduledValues(now); temple.bus.gain.cancelScheduledValues(now); organBus.gain.setTargetAtTime(T ? 0 : 1, now, .6); temple.bus.gain.setTargetAtTime(T ? 1 : 0, now, .6); temple.schedule(T); }

  document.getElementById('bMusicLbl').textContent = T ? '목탁·염불' : '오르간';
  document.getElementById('bMusicIco').textContent = T ? '🪘' : '🎹';
  document.getElementById('bCandleLbl').textContent = T ? '촛불 공양' : '촛불 켜기';
  setSun(sunSide);
  if (player) { leavePresence().then(joinPresence); }

document.querySelectorAll('#spaceSw button').forEach((b) => { b.onclick = () => setSpace(b.dataset.m); });
// 버튼 없이 바로 입장 (오르간은 브라우저 정책상 첫 터치·키 입력 때 시작)
Promise.all([ready, peopleReady]).then(async () => {
  await spawnPeople();
  t0 = performance.now();
  const it = document.getElementById('intro'); it.style.opacity = 0; setTimeout(() => it.remove(), 1200);
  document.body.classList.add('in'); window.__ready = true;
  if (new URLSearchParams(location.search).get('space') === 'temple') setSpace('temple'); else joinPresence();
  const T = space === 'temple', snd = T ? '염불 소리가' : '오르간이', seatW = T ? '방석' : '의자';
  hint(matchMedia('(pointer: coarse)').matches ? `화면을 누르면 ${snd} 울려요 · 조이스틱으로 걷기 · ${seatW} 근처에서 🪑 앉기` : `클릭하면 ${snd} 울려요 · WASD로 걷기 · 끌어서 시점 돌리기 · ${seatW} 근처에서 E로 앉기`);
});
const firstTouch = () => { if (musicOn) startMusic(); removeEventListener('pointerdown', firstTouch, true); removeEventListener('keydown', firstTouch, true); };
addEventListener('pointerdown', firstTouch, true); addEventListener('keydown', firstTouch, true);

/* ───────── 그리기 ───────── */
const clock = new THREE.Clock();
const dirV = new THREE.Vector3(), tgt = new THREE.Vector3(), camPos = new THREE.Vector3();
let camInit = false;
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  dirV.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  let moving = false;

    if (keys.d || keys.arrowright) r += 1; if (keys.a || keys.arrowleft) r -= 1;

      if (nav.ok(p.x, p.z + vz)) p.z += vz;

    let dist = 3.4;
    for (let d = .4; d <= 3.4; d += .2) { if (!nav.free(tgt.x - dirV.x * d, tgt.z - dirV.z * d)) { dist = Math.max(.6, d - .35); break; } }

    // 입장 전: 성당 안을 천천히 도는 장면
