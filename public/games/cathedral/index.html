<!doctype html>
<html lang="ko">
<head>

<title>빛의 성당 (샘플)</title>
<style>
html,body{margin:0;height:100%;background:#07060a;overflow:hidden;font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:#f3e9d6}
canvas{display:block;touch-action:none}
.top{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{pointer-events:auto;background:rgba(20,14,10,.55);backdrop-filter:blur(8px);border:1px solid rgba(243,233,214,.18);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center}
.pill small{color:#c9b897;font-weight:600}
.bottom{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,14,10,.55);backdrop-filter:blur(8px);border:1px solid rgba(243,233,214,.18);border-radius:22px;padding:6px}
.bottom button{background:none;border:0;color:#f3e9d6;font:inherit;font-size:12px;font-weight:700;padding:8px 14px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:64px}
.bottom button span{font-size:20px}
.bottom button.on{background:rgba(243,233,214,.14)}
.hint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:#d8c8a6;opacity:.85;transition:opacity 1.5s;text-shadow:0 1px 4px #000;white-space:nowrap}
.intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(40,25,15,.55),rgba(5,4,8,.92));transition:opacity 1.2s}
.intro .box{text-align:center;max-width:340px;padding:24px}
.intro h1{font-family:'Gowun Batang',serif;font-size:32px;margin:0 0 10px;letter-spacing:.05em}
.intro p{color:#cdbb98;line-height:1.7;font-size:14px;margin:0 0 22px}
.intro button{background:#e8d3a2;color:#2a1c0e;border:0;border-radius:999px;padding:14px 30px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 0 30px rgba(232,211,162,.35)}
.intro button:disabled{opacity:.5;cursor:default}
.loading{margin-top:12px;font-size:12px;color:#bba98a;min-height:16px}
.credit{position:fixed;right:10px;bottom:6px;font-size:9px;color:rgba(243,233,214,.35);pointer-events:none}
.timer{font-variant-numeric:tabular-nums}
</style>

</head>
<body>
<div class="top">
  <div class="pill">⛪ 빛의 성당 <small>샘플</small></div>
  <div class="pill">👥 <span id="ppl">12</span> · <span class="timer" id="timer">00:00</span></div>
</div>
<div class="hint" id="hint">화면을 끌어서 스테인드글라스를 둘러보세요</div>
<div class="bottom">

  <button id="bLook"><span>🌀</span>천천히 둘러보기</button>
  <button id="bCandle"><span>🕯️</span>촛불 켜기</button>
</div>
<div class="credit">성당 모델: Gothic Like Structures by Loafbrr (CC0)</div>
<div class="intro" id="intro"><div class="box">
  <h1>빛의 성당</h1>
  <p>오래된 성당 의자에 앉아<br>스테인드글라스 사이로 들어오는 빛을 바라보며<br>잠시 아무 생각 없이 쉬어 가세요.</p>
  <button id="enter" disabled>불러오는 중…</button>
  <div class="loading" id="loading">성당을 짓는 중…</div>
</div></div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/jsm/libs/meshopt_decoder.module.js';
import { EffectComposer } from './vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './vendor/jsm/postprocessing/OutputPass.js';
import { makeGlassMaterials, remapGlass } from './glass.js';

/* ───────── 기본 ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7d8794); // 열린 문 너머 바깥 하늘
scene.fog = new THREE.FogExp2(0x2a2220, 0.012);
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 300);
// 빛나는 유리만 번지도록 블룸 (실내는 어둡게 두고 유리를 밝게)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .55, .5, .55);
composer.addPass(bloom); composer.addPass(new OutputPass());
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth / 2, innerHeight / 2); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const rnd = (a, b) => a + Math.random() * (b - a);

// 에셋 성당(Church_B) 기준 좌표: 바닥 y=2, 신랑(중앙 통로) 중심 x=5.5, 입구 z≈+12, 교차부 z≈-10, 제단 쪽 -z
const FLOOR = 2, CX = 5.5;

/* ───────── 텍스처·재질 ───────── */
const tl = new THREE.TextureLoader();
function tex(f, srgb = true, rep = 1) {
  const t = tl.load('assets/' + f);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8;
  return t;
}
const MATS = {
  Wall: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), normalMap: tex('wall_n.webp', false), color: 0xe6d6bd, roughness: .92 }),
  WallTrim: new THREE.MeshStandardMaterial({ map: tex('trim.webp'), normalMap: tex('trim_n.webp', false), color: 0xf0e2c8, roughness: .85 }),
  Floor: new THREE.MeshStandardMaterial({ map: tex('floor.webp'), normalMap: tex('floor_n.webp', false), color: 0xd8ccb8, roughness: .55 }),
  ChurchCeiling: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0x9fa8c8, roughness: .95 }),
  Ceiling: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0xb8ac98, roughness: .95 }),
  Roof: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0x8a7c6a, emissive: 0x3a3028, emissiveMap: tex('wall.webp'), roughness: 1 }),
  WoodPlanks: new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xc08a60, roughness: .7 }),
};
for (const m of Object.values(MATS)) m.side = THREE.DoubleSide;
const GLASS = makeGlassMaterials(1.25);
const woodM = new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xd09a6a, roughness: .55 });

/* ───────── 로딩 ───────── */
const loadEl = document.getElementById('loading'), enterBtn = document.getElementById('enter');
const glassWorld = []; // 창 위치 계산용
const ready = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('assets/church.glb', (e) => {
  if (e.total) loadEl.textContent = `성당을 짓는 중… ${Math.round(e.loaded / e.total * 100)}%`;
}).then((g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.material && o.material.name;
    o.frustumCulled = true;
    if (n === 'StainedGlass') glassWorld.push(o); else o.material = MATS[n] || MATS.Wall;
  });
  scene.add(g.scene);
  g.scene.updateMatrixWorld(true);
  for (const m of glassWorld) remapGlass(m, GLASS);
  findWindows();
  loadEl.textContent = ''; enterBtn.disabled = false; enterBtn.textContent = '자리에 앉기';
}).catch((e) => { loadEl.textContent = '성당을 불러오지 못했어요. 새로고침해 주세요.'; console.error(e); });

/* ───────── 창 위치 찾기 → 빛줄기 ───────── */
const beamTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const gx = g.createLinearGradient(0, 0, 64, 0); gx.addColorStop(0, '#000'); gx.addColorStop(.5, 'rgba(0,0,0,0)'); gx.addColorStop(1, '#000'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = gx; g.fillRect(0, 0, 64, 256); const t = new THREE.CanvasTexture(c); return t; })();
const spotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const beams = [];
const BEAM_COLS = [0x9db8ff, 0xffb0a0, 0xffe2a0, 0xa8f0c0, 0xd8b0ff];
function findWindows() {
  // 스테인드글라스 정점들을 2m 칸으로 묶어 창 중심을 구한다 → 해가 드는 쪽(+x) 측랑 창에 빛줄기
  const cells = new Map(), v = new THREE.Vector3();
  for (const m of glassWorld) {
    const p = m.geometry.attributes.position;
    for (let i = 0; i < p.count; i += 3) {
      v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld);
      const k = `${Math.round(v.x / 2)}|${Math.round(v.y / 3)}|${Math.round(v.z / 2)}`;
      const c = cells.get(k) || { x: 0, y: 0, z: 0, n: 0 }; c.x += v.x; c.y += v.y; c.z += v.z; c.n++; cells.set(k, c);
    }
  }
  const wins = [...cells.values()].filter((c) => c.n > 6).map((c) => ({ x: c.x / c.n, y: c.y / c.n, z: c.z / c.n }))
    .filter((w) => w.x > CX + 9 && w.y < FLOOR + 12 && w.z > -9 && w.z < 12);
  // 같은 창(z 가 가까운 것) 하나로
  wins.sort((a, b) => a.z - b.z);
  const uniq = []; for (const w of wins) if (!uniq.length || Math.abs(uniq[uniq.length - 1].z - w.z) > 2.5) uniq.push(w);
  uniq.forEach((w, i) => {
    const col = new THREE.Color(BEAM_COLS[i % BEAM_COLS.length]);
    const from = new THREE.Vector3(w.x - .3, w.y + 1.5, w.z), to = new THREE.Vector3(CX + 1.5, FLOOR + .02, w.z + 2.2);
    for (const rot of [0, Math.PI / 2]) {
      const m = new THREE.MeshBasicMaterial({ map: beamTex, color: col, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false, fog: false });
      const beam = new THREE.Mesh(new THREE.PlaneGeometry(2.4, from.distanceTo(to)), m);
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), from.clone().sub(to).normalize()); beam.rotateY(rot);
      beam.position.copy(from).lerp(to, .5); scene.add(beam); beams.push({ m, base: .2, ph: i });
    }
    const spot = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.4), new THREE.MeshBasicMaterial({ map: spotTex, color: col, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    spot.rotation.x = -Math.PI / 2; spot.position.copy(to); scene.add(spot); beams.push({ m: spot.material, base: .7, ph: i + .5 });
  });
}

/* ───────── 장의자 ───────── */
const pewSeat = new THREE.BoxGeometry(4.4, .1, .5), pewBack = new THREE.BoxGeometry(4.4, .5, .08), pewEnd = new THREE.BoxGeometry(.09, .95, .62);
const pews = [];
for (let z = 9.5; z > -5.5; z -= 1.2) for (const s of [-1, 1]) {
  const gp = new THREE.Group();
  const seat = new THREE.Mesh(pewSeat, woodM); seat.position.y = .46; gp.add(seat);
  const back = new THREE.Mesh(pewBack, woodM); back.position.set(0, .76, .25); back.rotation.x = .12; gp.add(back);
  for (const ex of [-2.2, 2.2]) { const e = new THREE.Mesh(pewEnd, woodM); e.position.set(ex, .48, .03); gp.add(e); }
  gp.position.set(CX + s * 3.1, FLOOR, z); scene.add(gp); pews.push(gp.position.clone());
}

/* ───────── 제단과 촛불 ───────── */
const ALTAR_Z = -22;
const step = new THREE.Mesh(new THREE.BoxGeometry(8, .4, 5), MATS.WallTrim); step.position.set(CX, FLOOR + .2, ALTAR_Z); scene.add(step);
const altar = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.05, 1.3), MATS.WallTrim); altar.position.set(CX, FLOOR + .4 + .52, ALTAR_Z); scene.add(altar);
const cloth = new THREE.Mesh(new THREE.BoxGeometry(3.7, .05, 1.4), new THREE.MeshStandardMaterial({ color: 0x7a1020, roughness: .9 })); cloth.position.set(CX, FLOOR + 1.47, ALTAR_Z); scene.add(cloth);
const candles = [];
const flameTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 80, 2, 32, 70, 32); gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(.35, 'rgba(255,190,80,.9)'); gr.addColorStop(1, 'rgba(255,120,20,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(32, 74, 26, 54, 0, 0, 7); g.fill(); return new THREE.CanvasTexture(c); })();
function addCandle(x, y, z, h) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, h, 10), new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: .5 }));
  c.position.set(x, y + h / 2, z); scene.add(c);
  const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  f.scale.set(.12, .24, 1); f.position.set(x, y + h + .1, z); scene.add(f); candles.push({ f, ph: Math.random() * 10 });
}
[-1.4, -.9, .9, 1.4].forEach((dx) => addCandle(CX + dx, FLOOR + 1.5, ALTAR_Z, Math.abs(dx) > 1 ? .5 : .7));
const candleLight = new THREE.PointLight(0xffb060, 14, 18, 2); candleLight.position.set(CX, FLOOR + 2.6, ALTAR_Z + .4); scene.add(candleLight);
// 봉헌 촛대 (사람들이 켜는 초) — 오른쪽 통로 앞
const RACK = new THREE.Vector3(CX + 4.9, FLOOR, -7.4);
const rack = new THREE.Mesh(new THREE.BoxGeometry(.5, .9, 2.2), new THREE.MeshStandardMaterial({ color: 0x2b2018, roughness: .7, metalness: .3 }));
rack.position.set(RACK.x, RACK.y + .45, RACK.z); scene.add(rack);
const rackLight = new THREE.PointLight(0xffa850, 0, 7, 2); rackLight.position.set(RACK.x - .3, RACK.y + 1.5, RACK.z); scene.add(rackLight);
let rackN = 0;
function lightRackCandle() {
  if (rackN >= 14) return;
  const i = rackN++, col = i % 7, row = Math.floor(i / 7);
  addCandle(RACK.x + (row ? .12 : -.12), RACK.y + .9, RACK.z - .9 + col * .3, .18 + Math.random() * .08);
  rackLight.intensity = Math.min(6, 1.2 + rackN * .4);
}
for (let i = 0; i < 6; i++) lightRackCandle();

/* ───────── 다른 방문객 (실루엣) ───────── */
const visitorM = new THREE.MeshStandardMaterial({ color: 0x2a201c, roughness: 1 });
const others = [];
for (let i = 0; i < 11; i++) {
  const free = pews.filter((q) => !(q.x > CX && Math.abs(q.z - 2.3) < 1.3));
  const p = free[Math.floor(Math.random() * free.length)];
  const v = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2, .45, 4, 8), visitorM); body.position.y = .9; v.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.13, 12, 10), visitorM); head.position.y = 1.42; v.add(head);
  v.position.set(p.x + rnd(-1.7, 1.7), p.y, p.z + .02); scene.add(v); others.push({ v, ph: Math.random() * 6 });
}

/* ───────── 조명 ───────── */
scene.add(new THREE.HemisphereLight(0xd8ccb8, 0x6a5848, .3));
for (const x of [CX - 9, CX + 9]) for (const z of [6, -4]) { const l = new THREE.PointLight(0xffd8b0, 5, 22, 1.6); l.position.set(x, FLOOR + 9, z); scene.add(l); }
const sun = new THREE.DirectionalLight(0xffe2b8, .5); sun.position.set(40, 30, 5); scene.add(sun);
for (const z of [8, -2, -12, -22]) { const l = new THREE.PointLight(0xffe0bc, 9, 30, 1.6); l.position.set(CX, FLOOR + 12, z); scene.add(l); }

/* ───────── 먼지 ───────── */
const DUST = 900, dg = new THREE.BufferGeometry(), dp = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { dp[i * 3] = CX + rnd(-10, 10); dp[i * 3 + 1] = FLOOR + rnd(.3, 10); dp[i * 3 + 2] = rnd(-12, 12); }
dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({ size: .035, map: spotTex, color: 0xfff0d0, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

/* ───────── 카메라: 장의자에 앉은 시선 ───────── */
const SEAT_PEW = pews.filter((p) => p.x > CX)[6];
const seat = new THREE.Vector3(SEAT_PEW.x - 1.0, FLOOR + 1.32, SEAT_PEW.z + .05);
camera.position.copy(seat);
let yaw = 0, pitch = .18, tYaw = 0, tPitch = .18, auto = false, lastInput = performance.now();
const el = renderer.domElement; let drag = null;
el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: tYaw, pitch: tPitch }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', (e) => {
  if (!drag) return;
  tYaw = drag.yaw + (e.clientX - drag.x) * .004; tPitch = Math.max(-.35, Math.min(1.2, drag.pitch + (e.clientY - drag.y) * .003));
  lastInput = performance.now(); document.getElementById('hint').style.opacity = 0;
});
addEventListener('pointerup', () => { drag = null; });
const bLook = document.getElementById('bLook');
bLook.onclick = () => { auto = !auto; bLook.classList.toggle('on', auto); };
window.__look = (y, p) => { tYaw = yaw = y; tPitch = pitch = p; lastInput = performance.now(); };

/* ───────── 파이프오르간 (직접 합성한 느린 화음 · 저작권 없는 자작 진행) ───────── */
let ac = null, master = null, musicOn = true;
const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);
// 라단조 느린 진행: Dm – B♭ – F – C – Gm – Dm/F – A – Dm  (각 9초)
const PROG = [[50, 57, 62, 65, 69], [46, 58, 62, 65, 70], [41, 57, 60, 65, 69], [48, 55, 60, 64, 67], [43, 55, 58, 62, 67], [41, 57, 62, 65, 69], [45, 57, 61, 64, 69], [38, 57, 62, 65, 69]];
const MELODY = [[74, 72], [70, 74], [72, 69], [67, 64], [67, 70], [69, 65], [64, 61], [62, 62]];
function organWave(ctx) {
  // 8' · 4' · 2⅔' · 2' 스톱을 섞은 듯한 배음
  const real = new Float32Array(17), imag = new Float32Array(17);
  [[1, 1], [2, .55], [3, .32], [4, .28], [6, .12], [8, .1], [16, .04]].forEach(([h, a]) => { imag[h] = a; });
  return ctx.createPeriodicWave(real, imag);
}
function reverbIR(ctx, sec) {
  const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  return b;
}
function startMusic() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const wave = organWave(ac);
  master = ac.createGain(); master.gain.value = 0;
  const comp = ac.createDynamicsCompressor();
  const verb = ac.createConvolver(); verb.buffer = reverbIR(ac, 7);
  const wet = ac.createGain(); wet.gain.value = .75; const dry = ac.createGain(); dry.gain.value = .35;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  master.connect(lp); lp.connect(dry); lp.connect(verb); verb.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(ac.destination);
  master.gain.linearRampToValueAtTime(.22, ac.currentTime + 4);
  const vib = ac.createOscillator(); vib.frequency.value = 4.6; const vibG = ac.createGain(); vibG.gain.value = 1.2; vib.connect(vibG); vib.start();
  function voice(n, t0, dur, vol) {
    const o = ac.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = NOTE(n); o.detune.value = rnd(-3, 3);
    if (n > 66) vibG.connect(o.detune);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 1.4); g.gain.setValueAtTime(vol, t0 + dur - .2); g.gain.linearRampToValueAtTime(0, t0 + dur + 2.5);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 3);
  }
  const CH = 9; let bar = 0, next = ac.currentTime + .3;
  function schedule() {
    while (next < ac.currentTime + 12) {
      const ch = PROG[bar % PROG.length];
      ch.forEach((n, i) => voice(n, next, CH, i === 0 ? .1 : .055));
      voice(ch[0] - 12, next, CH, .07); // 페달 16'
      const mel = MELODY[bar % MELODY.length];
      voice(mel[0], next + .5, CH / 2 - .4, .045); voice(mel[1], next + CH / 2, CH / 2 - .2, .045);
      bar++; next += CH;
    }
  }
  schedule(); setInterval(schedule, 3000);
}
const bMusic = document.getElementById('bMusic');
bMusic.onclick = () => {
  if (!ac) { startMusic(); musicOn = true; }
  else { musicOn = !musicOn; master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(musicOn ? .22 : 0, ac.currentTime + 1.5); }
  bMusic.classList.toggle('on', musicOn);
};


document.getElementById('bCandle').onclick = () => { lightRackCandle(); tYaw = -.3; tPitch = -.08; lastInput = performance.now(); };

/* ───────── 시작·시간 ───────── */
let t0 = null;
enterBtn.onclick = () => {
  if (enterBtn.disabled) return;
  startMusic(); t0 = performance.now();
  const it = document.getElementById('intro'); it.style.opacity = 0; setTimeout(() => it.remove(), 1200);
};
document.getElementById('ppl').textContent = 1 + others.length;

/* ───────── 그리기 ───────── */
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  if (auto || performance.now() - lastInput > 25000) { tYaw = Math.sin(t * .05) * 1.2; tPitch = .45 + Math.sin(t * .037) * .4; }
  yaw += (tYaw - yaw) * .04; pitch += (tPitch - pitch) * .04;
  camera.position.set(seat.x, seat.y + Math.sin(t * .6) * .006, seat.z);
  const dir = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(dir));
  const cloud = .7 + .3 * Math.sin(t * .11) * Math.sin(t * .047 + 1);
  beams.forEach((b) => { b.m.opacity = b.base * (cloud + .08 * Math.sin(t * .5 + b.ph)); });
  sun.intensity = .5 * cloud;
  candles.forEach((c) => { const k = 1 + .12 * Math.sin(t * 9 + c.ph) + .06 * Math.sin(t * 23 + c.ph * 2); c.f.scale.set(.12 * k, .24 * k, 1); });
  candleLight.intensity = 14 * (1 + .08 * Math.sin(t * 7.3));
  const a = dust.geometry.attributes.position;
  for (let i = 0; i < DUST; i++) { let y = a.getY(i) + .0025 + Math.sin(t + i) * .001; if (y > FLOOR + 10) y = FLOOR + .3; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(t * .3 + i) * .0015); }
  a.needsUpdate = true;
  others.forEach((o) => { o.v.rotation.z = Math.sin(t * .4 + o.ph) * .015; });
  if (t0) { const s = Math.floor((performance.now() - t0) / 1000); document.getElementById('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
  composer.render();
  requestAnimationFrame(frame);
}
frame();
ready.then(() => { window.__ready = true; });

</script>
