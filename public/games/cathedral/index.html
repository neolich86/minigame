<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/jsm/libs/meshopt_decoder.module.js';
import { EffectComposer } from './vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './vendor/jsm/postprocessing/OutputPass.js';
import { makeGlassMaterials, remapGlass } from './glass.js';
import { NavGrid } from './navgrid.js';
import { Actor, loadCharMeta, thumb } from './chars.js';

/* ───────── 기본 ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7d8794); // 열린 문 너머 바깥 하늘
scene.fog = new THREE.FogExp2(0x2a2220, 0.012);
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 300);
// 빛나는 유리만 번지도록 블룸 (실내는 어둡게 두고 유리를 밝게)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .55, .5, .55);
composer.addPass(bloom); composer.addPass(new OutputPass());
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth / 2, innerHeight / 2); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const rnd = (a, b) => a + Math.random() * (b - a);

// 에셋 성당(Church_B) 기준 좌표: 바닥 y=2, 신랑(중앙 통로) 중심 x=5.5, 입구 z≈+12, 교차부 z≈-10, 제단 쪽 -z
const FLOOR = 2, CX = 5.5;

/* ───────── 텍스처·재질 ───────── */
const tl = new THREE.TextureLoader();
function tex(f, srgb = true, rep = 1) {
  const t = tl.load('assets/' + f);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8;
  return t;
}
const MATS = {
  Wall: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), normalMap: tex('wall_n.webp', false), color: 0xe6d6bd, roughness: .92 }),
  WallTrim: new THREE.MeshStandardMaterial({ map: tex('trim.webp'), normalMap: tex('trim_n.webp', false), color: 0xf0e2c8, roughness: .85 }),
  Floor: new THREE.MeshStandardMaterial({ map: tex('floor.webp'), normalMap: tex('floor_n.webp', false), color: 0xd8ccb8, roughness: .55 }),
  ChurchCeiling: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0x9fa8c8, roughness: .95 }),
  Ceiling: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0xb8ac98, roughness: .95 }),
  Roof: new THREE.MeshStandardMaterial({ map: tex('wall.webp'), color: 0x8a7c6a, emissive: 0x3a3028, emissiveMap: tex('wall.webp'), roughness: 1 }),
  WoodPlanks: new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xc08a60, roughness: .7 }),
};
for (const m of Object.values(MATS)) m.side = THREE.DoubleSide;
const GLASS = makeGlassMaterials(1.25);
const woodM = new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xd09a6a, roughness: .55 });

/* ───────── 로딩 ───────── */
const loadEl = document.getElementById('loading'), enterBtn = document.getElementById('enter');
const glassWorld = [], churchMeshes = []; // 창 위치 계산용 · 걷기 격자용
const ready = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('assets/church.glb', (e) => {
  if (e.total) loadEl.textContent = `성당을 짓는 중… ${Math.round(e.loaded / e.total * 100)}%`;
}).then((g) => {
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.material && o.material.name;
    o.frustumCulled = true;
    if (n === 'StainedGlass') glassWorld.push(o); else o.material = MATS[n] || MATS.Wall;
    if (n !== 'Floor') churchMeshes.push(o);
  });
  scene.add(g.scene);
  g.scene.updateMatrixWorld(true);
  for (const m of glassWorld) remapGlass(m, GLASS);
  findWindows(); setSun(sunSide);
  buildNav(churchMeshes);
}).catch((e) => { loadEl.textContent = '성당을 불러오지 못했어요. 새로고침해 주세요.'; console.error(e); });

/* ───────── 창 위치 찾기 → 빛줄기 ───────── */
const beamTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const gx = g.createLinearGradient(0, 0, 64, 0); gx.addColorStop(0, '#000'); gx.addColorStop(.5, 'rgba(0,0,0,0)'); gx.addColorStop(1, '#000'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = gx; g.fillRect(0, 0, 64, 256); const t = new THREE.CanvasTexture(c); return t; })();
const spotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const beams = [];
const BEAM_COLS = [0x9db8ff, 0xffb0a0, 0xffe2a0, 0xa8f0c0, 0xd8b0ff];
function findWindows() {
  // 스테인드글라스 정점들을 2m 칸으로 묶어 창 중심을 구한다 (햇빛 방향별 빛줄기에 사용)
  const cells = new Map(), v = new THREE.Vector3();
  for (const m of glassWorld) {
    const p = m.geometry.attributes.position;
    for (let i = 0; i < p.count; i += 3) {
      v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld);
      const k = `${Math.round(v.x / 2)}|${Math.round(v.y / 3)}|${Math.round(v.z / 2)}`;
      const c = cells.get(k) || { x: 0, y: 0, z: 0, n: 0 }; c.x += v.x; c.y += v.y; c.z += v.z; c.n++; cells.set(k, c);
    }
  }
  allWins = [...cells.values()].filter((c) => c.n > 6).map((c) => ({ x: c.x / c.n, y: c.y / c.n, z: c.z / c.n }));
}
/* ───────── 장의자 ───────── */
const pewSeat = new THREE.BoxGeometry(4.4, .1, .5), pewBack = new THREE.BoxGeometry(4.4, .5, .08), pewEnd = new THREE.BoxGeometry(.09, .95, .62);
const pews = [], slots = [];
for (let z = 9.5; z > -5.5; z -= 1.2) for (const s of [-1, 1]) {
  const gp = new THREE.Group();
  const seatM = new THREE.Mesh(pewSeat, woodM); seatM.position.y = .46; gp.add(seatM);
  const back = new THREE.Mesh(pewBack, woodM); back.position.set(0, .76, .25); back.rotation.x = .12; gp.add(back);
  for (const ex of [-2.2, 2.2]) { const e = new THREE.Mesh(pewEnd, woodM); e.position.set(ex, .48, .03); gp.add(e); }
  gp.position.set(CX + s * 3.1, FLOOR, z); scene.add(gp); pews.push(gp.position.clone());
  for (let dx = -1.8; dx <= 1.81; dx += .6) slots.push({ x: CX + s * 3.1 + dx, z, taken: null });
}

/* ───────── 나무 출입문 (뾰족 아치) ───────── */
const doorM = new THREE.MeshStandardMaterial({ map: tex('wood.webp'), color: 0xd09060, emissive: 0x2a160a, roughness: .75, side: THREE.DoubleSide });
const ironM = new THREE.MeshStandardMaterial({ color: 0x1c1814, roughness: .5, metalness: .6, side: THREE.DoubleSide });
const DOORS = [
  { x: 2.1, z: 13.15, w: 5.0, ax: 'z' }, { x: 8.9, z: 13.15, w: 5.0, ax: 'z' },   // 정문 둘
  { x: -9.65, z: -11.0, w: 4.6, ax: 'x' }, { x: 20.65, z: -11.0, w: 4.6, ax: 'x' }, // 양쪽 날개 끝
];
function makeDoor(d) {
  const w = d.w, H = 5.6, rise = Math.min(w * .866, H * .55), spring = H - rise, r = (w * w / 4 + rise * rise) / w;
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(w / 2, spring);
  sh.absarc(w / 2 - r, spring, r, 0, Math.asin(rise / r), false);
  sh.absarc(-w / 2 + r, spring, r, Math.PI - Math.asin(rise / r), Math.PI, false); sh.lineTo(-w / 2, 0);
  const geo = new THREE.ShapeGeometry(sh, 24);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getY(i) / 2.4, uv.getX(i) / 1.2); // 판자를 세로로
  const gp = new THREE.Group(); gp.add(new THREE.Mesh(geo, doorM));
  // 쇠 띠 · 가운데 이음매 · 문고리
  for (const side of [-1, 1]) { // 안팎 양쪽에
    for (const y of [.7, 2.2, 3.6]) { const b = new THREE.Mesh(new THREE.BoxGeometry(w - .1, .12, .05), ironM); b.position.set(0, y, side * .04); gp.add(b); }
    const seam = new THREE.Mesh(new THREE.BoxGeometry(.07, H - .2, .05), ironM); seam.position.set(0, (H - .2) / 2, side * .045); gp.add(seam);
    for (const s of [-1, 1]) { const ring = new THREE.Mesh(new THREE.TorusGeometry(.13, .025, 8, 20), ironM); ring.position.set(s * .32, 1.25, side * .1); gp.add(ring); }
  }
  gp.position.set(d.x, FLOOR, d.z);
  if (d.ax === 'x') gp.rotation.y = Math.PI / 2;
  scene.add(gp);
}
DOORS.forEach(makeDoor);
// 문 앞을 비추는 등불
for (const d of DOORS) { const l = new THREE.PointLight(0xffc488, 5, 9, 1.6); l.position.set(d.x + (d.ax === 'x' ? Math.sign(CX - d.x) * 2 : 0), FLOOR + 4.5, d.z + (d.ax === 'z' ? -2 : 0)); scene.add(l); }

/* ───────── 제단과 촛불 ───────── */
const ALTAR_Z = -22;
const step = new THREE.Mesh(new THREE.BoxGeometry(8, .4, 5), MATS.WallTrim); step.position.set(CX, FLOOR + .2, ALTAR_Z); scene.add(step);
const altar = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.05, 1.3), MATS.WallTrim); altar.position.set(CX, FLOOR + .4 + .52, ALTAR_Z); scene.add(altar);
const cloth = new THREE.Mesh(new THREE.BoxGeometry(3.7, .05, 1.4), new THREE.MeshStandardMaterial({ color: 0x7a1020, roughness: .9 })); cloth.position.set(CX, FLOOR + 1.47, ALTAR_Z); scene.add(cloth);
const candles = [];
const flameTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 80, 2, 32, 70, 32); gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(.35, 'rgba(255,190,80,.9)'); gr.addColorStop(1, 'rgba(255,120,20,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(32, 74, 26, 54, 0, 0, 7); g.fill(); return new THREE.CanvasTexture(c); })();
const waxM = new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: .5, emissive: 0x3a2a10 });
function addCandle(x, y, z, h, s = 1) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(.045 * s, .045 * s, h, 10), waxM);
  c.position.set(x, y + h / 2, z); scene.add(c);
  const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, blending: THREE.AdditiveBlending, depthWrite: false }));
  f.position.set(x, y + h + .1 * s, z); scene.add(f);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: spotTex, color: 0xffa040, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .45 }));
  glow.scale.set(.6 * s, .6 * s, 1); glow.position.copy(f.position); scene.add(glow);
  const o = { f, glow, body: c, s, ph: Math.random() * 10, born: performance.now() }; candles.push(o); return o;
}
[-1.4, -.9, .9, 1.4].forEach((dx) => addCandle(CX + dx, FLOOR + 1.5, ALTAR_Z, Math.abs(dx) > 1 ? .5 : .7, 1.3));
const candleLight = new THREE.PointLight(0xffb060, 14, 18, 2); candleLight.position.set(CX, FLOOR + 2.6, ALTAR_Z + .4); scene.add(candleLight);

// 봉헌 촛대: 장의자 앞 오른쪽, 3단 쇠 받침 (걸어가서 볼 수 있음)
const RACK = new THREE.Vector3(CX + 3.6, FLOOR, -8.2);
const rackGrp = new THREE.Group(); rackGrp.position.copy(RACK); scene.add(rackGrp);
const RACK_ROWS = [{ y: .78, z: .32 }, { y: .98, z: 0 }, { y: 1.18, z: -.32 }], RACK_W = 2.4, PER_ROW = 9;
RACK_ROWS.forEach((r) => { const shelf = new THREE.Mesh(new THREE.BoxGeometry(RACK_W, .05, .26), ironM); shelf.position.set(0, r.y, r.z); rackGrp.add(shelf); });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 1.2, 6), ironM); leg.position.set(sx * RACK_W / 2, .6, sz * .4); rackGrp.add(leg); }
const sandTray = new THREE.Mesh(new THREE.BoxGeometry(RACK_W + .1, .08, 1.0), new THREE.MeshStandardMaterial({ color: 0x3a2c22, roughness: .9 })); sandTray.position.set(0, .5, 0); rackGrp.add(sandTray);
const rackLight = new THREE.PointLight(0xffa850, 0, 9, 1.8); rackLight.position.set(RACK.x, RACK.y + 2, RACK.z + .6); scene.add(rackLight);
const rackCandles = []; let rackNext = 0;
function lightRackCandle() {
  const MAX = RACK_ROWS.length * PER_ROW, i = rackNext++ % MAX;
  if (rackCandles[i]) { const o = rackCandles[i]; [o.f, o.glow, o.body].forEach((m) => scene.remove(m)); candles.splice(candles.indexOf(o), 1); }
  const r = RACK_ROWS[i % 3], col = Math.floor(i / 3);
  const x = RACK.x - RACK_W / 2 + .14 + col * (RACK_W - .28) / (PER_ROW - 1) + (Math.random() - .5) * .06;

    const near = nearestSlot(); bSit.classList.toggle('ready', !!near);
    // 3인칭 카메라: 벽에 막히면 당겨 온다
    tgt.set(player.pos.x, FLOOR + 1.45, player.pos.z);
    let dist = 3.4;
    for (let d = .4; d <= 3.4; d += .2) { if (!nav.free(tgt.x - dirV.x * d, tgt.z - dirV.z * d)) { dist = Math.max(.6, d - .35); break; } }
    camPos.copy(tgt).addScaledVector(dirV, -dist); camPos.y = Math.max(FLOOR + .35, camPos.y + .35);
    if (!camInit) { camera.position.copy(camPos); camInit = true; } else camera.position.lerp(camPos, Math.min(1, dt * 8));
    camera.lookAt(tgt.x + dirV.x * 2, tgt.y + .1 + dirV.y * 2, tgt.z + dirV.z * 2);
  } else if (mode === 'sit') {
    camera.position.set(seatEye.x, seatEye.y + Math.sin(t * .6) * .006, seatEye.z);
    camera.lookAt(camera.position.x + dirV.x, camera.position.y + dirV.y, camera.position.z + dirV.z);
  } else {
    // 입장 전: 성당 안을 천천히 도는 장면
    camera.position.set(CX + Math.sin(t * .05) * 2, FLOOR + 3, 6);
    camera.lookAt(CX, FLOOR + 8 + Math.sin(t * .07) * 3, -20);
  }
  if (player) player.update(dt, camera, moving);
  for (const n of npcs) {
    let mv = false;
    if (n.kind === 'walk') {
      if (n.wait > 0) n.wait -= dt;
      else {
        const [tx, tz] = n.route[n.leg], p = n.a.pos, dx = tx - p.x, dz = tz - p.z, L = Math.hypot(dx, dz);
        if (L < .1) { n.leg = 1 - n.leg; n.wait = 3 + Math.random() * 5; }
        else { const s = Math.min(L, .9 * dt); p.x += dx / L * s; p.z += dz / L * s; n.a.face = Math.atan2(dx, dz); mv = true; }
      }
    }
    n.a.update(dt, camera, mv);
  }
  const cloud = .7 + .3 * Math.sin(t * .11) * Math.sin(t * .047 + 1);
  beams.forEach((b) => { b.m.opacity = b.base * (cloud + .08 * Math.sin(t * .5 + b.ph)); });
  sun.intensity = .5 * cloud;
  const now = performance.now();
  candles.forEach((c) => {
    const k = 1 + .12 * Math.sin(t * 9 + c.ph) + .06 * Math.sin(t * 23 + c.ph * 2);
    const grow = c.fresh ? Math.min(1, (now - c.born) / 900) : 1;
    c.f.scale.set(.13 * c.s * k * grow, .26 * c.s * k * grow, 1);
    c.glow.material.opacity = .4 * grow * (1 + .1 * Math.sin(t * 5 + c.ph)) + (c.fresh && now - c.born < 1500 ? (1 - (now - c.born) / 1500) * .8 : 0);
  });
  candleLight.intensity = 14 * (1 + .08 * Math.sin(t * 7.3));
  const a = dust.geometry.attributes.position;
  for (let i = 0; i < DUST; i++) { let y = a.getY(i) + .0025 + Math.sin(t + i) * .001; if (y > FLOOR + 10) y = FLOOR + .3; a.setY(i, y); a.setX(i, a.getX(i) + Math.sin(t * .3 + i) * .0015); }
  a.needsUpdate = true;
  if (t0) { const s = Math.floor((performance.now() - t0) / 1000); document.getElementById('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
