<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/apps/my-room">
<script src="/mgh/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>마이룸 - 미니게임천국</title>
<meta name="description" content="도트 감성 미니룸 꾸미기. 벽지·바닥을 고르고 침대·책상·피아노 같은 가구를 배치하고, 머리·옷·액세서리를 바꿔 내 캐릭터를 방에 세워 보세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd6e4'/%3E%3Cpath d='M12 30 32 14 52 30v22H12z' fill='%23fff' stroke='%23d9668c' stroke-width='4'/%3E%3Crect x='27' y='38' width='10' height='14' fill='%23d9668c'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff4f7;--ink:#3b2a33;--dim:#8d7280;--pink:#ff7fa8;--pink2:#ffd6e4;--line:#f1d3de;--card:#fff;--sel:#4fa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}
.wrap{max-width:980px;margin:0 auto;padding:10px 10px 30px;display:grid;gap:10px}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.stage{position:relative;background:linear-gradient(#ffeef4,#fff);border:2px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 6px 18px rgba(217,102,140,.12)}
.stage-top{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.stage-top b{font-size:15px;letter-spacing:.5px}
.stage-top .sp{flex:1}
.save{font-size:11.5px;color:var(--dim)}
.sbtn{height:30px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700}
canvas#room{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;touch-action:none;background:#fdf6f9}
.toolbar{display:flex;justify-content:center;gap:6px;margin:8px auto 0;background:rgba(59,42,51,.9);padding:6px;border-radius:14px;width:max-content;max-width:100%;flex-wrap:wrap}
.toolbar button{height:34px;padding:0 12px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);white-space:nowrap}
.toolbar button.del{background:#e25579}
.hint{font-size:12px;color:var(--dim);margin:6px 4px 0;line-height:1.5}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tab{flex:1;height:42px;font-size:13.5px;font-weight:800;color:var(--dim)}
.tab.on{color:var(--ink);background:var(--pink2)}
.pbody{padding:10px;max-height:62vh;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim);background:#fff}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;text-align:center;background:#fffafc}
.item canvas{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto}
.item b{display:block;font-size:12px;margin-top:2px}
.item .add{margin-top:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--pink);color:#fff;font-size:11.5px;font-weight:800}
h4{font-size:12.5px;color:var(--dim);margin:12px 2px 6px}
h4:first-child{margin-top:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
.opt.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink2)}
.opt canvas{image-rendering:pixelated}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ch-prev{display:flex;justify-content:center;background:linear-gradient(#fff,#ffeef4);border-radius:12px;padding:6px;margin-bottom:6px}
.ch-prev canvas{image-rendering:pixelated;width:168px;height:auto}
.msg{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font:inherit;font-size:14px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="stage">
      <div class="stage-top">
        <b id="ttl">🏠 마이룸</b>

        <span class="save" id="save"></span>
        <button class="sbtn" id="loginBtn" hidden></button>
        <button class="sbtn" id="dlBtn">📷</button>

        <button id="tColor">🎨</button>
        <button id="tFront">⬆</button>
        <button id="tDel" class="del">🗑</button>

    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-t="furn"></button>
      <button class="tab" data-t="room"></button>
      <button class="tab" data-t="char"></button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const MG = window.MGH || null;
const L_ = (ko, en) => (MG && MG.L ? MG.L(ko, en) : ko);
const $ = (id) => document.getElementById(id);

/* ───────── 좌표 (아이소메트릭: 한 칸 32×16) ───────── */
const N = 8, TW = 16, TH = 8, WALL_H = 112;
const cv = $('room'), ctx = cv.getContext('2d');
const W = 360, H = 250, OX = W / 2, OY = 122, SCALE = 2; // 논리 좌표 360×250, 실제 캔버스 2배
const iso = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z];

/* ───────── 색 도우미 ───────── */
function hex2rgb(h) { if (h[0] !== '#') { const m = h.match(/\d+/g) || [0, 0, 0]; return m.slice(0, 3).map(Number); } const n = parseInt(h.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, k) { const [r, g, b] = hex2rgb(h); const f = (v) => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }

/* 그리기 도구 (item 로컬 좌표: 원점 = 차지하는 칸의 뒤쪽 꼭짓점) */
function tools(g, o) {
  const P = (x, y, z) => { const [sx, sy] = iso(x, y, z); return [o[0] + sx, o[1] + sy]; };
  const poly = (pts, fill, stroke) => {
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
  };
  // 상자: (x,y,z) 위치, w×d 칸, h 높이(px)
  const box = (x, y, z, w, d, h, c, opt = {}) => {
    const top = opt.top || shade(c, 0.12), left = opt.left || shade(c, -0.18), right = opt.right || c;
    const ol = opt.ol === false ? null : (opt.ol || shade(c, -0.45));
    poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], left, ol);
    poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], right, ol);
    poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], top, ol);
  };
  // 앞면(왼쪽 면, y = y+d 평면)에 사각형 장식
  const faceL = (x, y, z, w, h, fill, stroke) => poly([P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)], fill, stroke);
  // 오른쪽 면(x 평면)에 장식
  const faceR = (x, y, z, d, h, fill, stroke) => poly([P(x, y, z), P(x, y + d, z), P(x, y + d, z + h), P(x, y, z + h)], fill, stroke);
  const circ = (x, y, z, r, fill, stroke) => { const [cx, cy] = P(x, y, z); g.beginPath(); g.ellipse(cx, cy, r, r, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.stroke(); } };
  const oval = (x, y, z, rx, ry, fill, stroke) => { const [cx, cy] = P(x, y, z); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.stroke(); } };
  const px = (x, y, z, w, h, fill) => { const [cx, cy] = P(x, y, z); g.fillStyle = fill; g.fillRect(Math.round(cx), Math.round(cy), w, h); };
  // 벽면(오른쪽 벽 = y=0 평면) 위 사각형: a=벽을 따라 위치, z=높이
  const wallQ = (a, z, w, h, fill, stroke) => poly([P(a, 0, z), P(a + w, 0, z), P(a + w, 0, z + h), P(a, 0, z + h)], fill, stroke);
  return { P, poly, box, faceL, faceR, circ, oval, px, wallQ, g };
}

  saving = true; setSave(L_('저장 중…', 'Saving…'));
  try {
    let r = await MG.save.store({ ...state, owner }, cloudAt || undefined);
    if (r && r.conflict) { cloudAt = r.updatedAt; r = await MG.save.store({ ...state, owner }, cloudAt); }
    if (r && r.updatedAt) cloudAt = r.updatedAt;
    setSave(L_('☁️ 저장됨', '☁️ Saved'));
  } catch (e) { setSave(L_('저장 실패', 'Save failed')); }
  saving = false;
  if (again) { again = false; cloudStore(); }
}
function sanitize(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const out = { v: 1, wall: WALLS.some((w) => w.id === s.wall) ? s.wall : d.wall, floor: FLOORS.some((f) => f.id === s.floor) ? s.floor : d.floor,
    items: Array.isArray(s.items) ? s.items.filter((i) => i && ITEM[i.t]).slice(0, 80) : d.items,
    ch: { ...DEF_CHAR, ...(s.ch || {}) }, cp: { ...d.cp, ...(s.cp || {}) }, msg: typeof s.msg === 'string' ? s.msg.slice(0, 20) : '' };
  return out;
}
function setupAuth() {
  const btn = $('loginBtn');
  if (!MG || !MG.save || !MG.embedded) return;
  btn.textContent = L_('로그인하고 저장', 'Log in to save');
  btn.onclick = () => MG.save.login();
  MG.save.onAuth(async (u) => {
    owner = u ? u.id : null;
    btn.hidden = !!u;
    if (!u) { setSave(''); return; }
    setSave(L_('불러오는 중…', 'Loading…'));
    try {
      const r = await MG.save.load();
      if (r && r.data && r.data.items) { state = sanitize(r.data); cloudAt = r.updatedAt || null; charCache = null; sel = null; showTools(); redraw(); renderPanel(); try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} setSave(L_('☁️ 불러옴', '☁️ Loaded')); }
      else await cloudStore();
    } catch (e) { setSave(L_('불러오기 실패', 'Load failed')); }
  });
}

/* 사진 저장 (방 그림 PNG) */
$('dlBtn').title = L_('방 사진 저장', 'Save room picture');
$('dlBtn').onclick = () => {
  const c = document.createElement('canvas'); c.width = W * 3; c.height = H * 3;
  const g = c.getContext('2d'); g.fillStyle = '#fdf6f9'; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(3, 0, 0, 3, 0, 0); g.imageSmoothingEnabled = false; drawAll(g, false);
  c.toBlob(async (blob) => {
    const file = new File([blob], 'my-room.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: L_('마이룸', 'My Room') }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-room.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
};

let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2000); }

  'Tap and drag furniture or your character. Use ↔ to turn, 🎨 to recolor and 🗑 to remove. Small items sit on desks and tables.');
$('tFlip').textContent = L_('↔ 돌리기', '↔ Turn');
$('tColor').textContent = L_('🎨 색', '🎨 Color');
$('tFront').textContent = L_('⬆ 앞으로', '⬆ Front');
$('tDel').textContent = L_('🗑 삭제', '🗑 Delete');
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) state = sanitize(s); } catch (e) {}
ctx.imageSmoothingEnabled = false;
renderPanel(); redraw(); setupAuth();
