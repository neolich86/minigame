<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/apps/my-room">
<script src="/mgh/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>마이룸 - 미니게임천국</title>
<meta name="description" content="도트 감성 미니룸 꾸미기. 벽지·바닥을 고르고 침대·책상·피아노 같은 가구를 배치하고, 머리·옷·액세서리를 바꿔 내 캐릭터를 방에 세워 보세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d4ecff'/%3E%3Cpath d='M12 30 32 14 52 30v22H12z' fill='%23fff' stroke='%233f8fd2' stroke-width='4'/%3E%3Crect x='27' y='38' width='10' height='14' fill='%233f8fd2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f1f8ff;--ink:#24364a;--dim:#6c8199;--acc:#3fa9f5;--acc2:#d4ecff;--line:#cfe3f5;--card:#fff;--sel:#4fa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}
.wrap{max-width:980px;margin:0 auto;padding:10px 10px 30px;display:grid;gap:10px}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.stage{position:relative;background:linear-gradient(#e6f4ff,#fff);border:2px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 6px 18px rgba(63,140,210,.14)}
.stage-top{display:flex;align-items:center;gap:8px;margin:0 2px 6px}
.stage-top b{font-size:15px;letter-spacing:.5px}
.stage-top .sp{flex:1}
.save{font-size:11.5px;color:var(--dim)}
.sbtn{height:30px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700}
canvas#room{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;touch-action:none;background:#f3f9ff}
.toolbar{display:flex;justify-content:center;gap:6px;margin:8px auto 0;background:rgba(36,54,74,.9);padding:6px;border-radius:14px;width:max-content;max-width:100%;flex-wrap:wrap}
.toolbar button{height:34px;padding:0 12px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);white-space:nowrap}
.toolbar button.del{background:#e2556a}
.hint{font-size:12px;color:var(--dim);margin:6px 4px 0;line-height:1.5}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tab{flex:1;height:42px;font-size:13px;white-space:nowrap;font-weight:800;color:var(--dim)}
.tab.on{color:var(--ink);background:var(--acc2)}
.pbody{padding:10px;max-height:62vh;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim);background:#fff}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;text-align:center;background:#f7fbff}
.item canvas{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto}
.item b{display:block;font-size:12px;margin-top:2px}
.item .add{margin-top:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:800}
h4{font-size:12.5px;color:var(--dim);margin:12px 2px 6px}
h4:first-child{margin-top:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.opt canvas{image-rendering:pixelated}
.opts.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.opt.pic{height:auto;flex-direction:column;gap:2px;padding:4px 2px 5px;font-size:11px;line-height:1.2;text-align:center}
.opt.pic canvas{width:48px;height:auto}
.note{font-size:12px;color:var(--dim);margin:4px 2px 0}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ch-prev{display:flex;justify-content:center;background:linear-gradient(#fff,#e6f4ff);border-radius:12px;padding:6px;margin-bottom:6px}
.ch-prev canvas{image-rendering:pixelated;width:168px;height:auto}
.msg{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font:inherit;font-size:14px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="stage">
      <div class="stage-top">
        <b id="ttl">🏠 마이룸</b>
        <span class="sp"></span>
        <span class="save" id="save"></span>
        <button class="sbtn" id="loginBtn" hidden></button>
        <button class="sbtn" id="dlBtn">📷</button>
      </div>
      <canvas id="room" width="520" height="500"></canvas>
      <div class="toolbar" id="tools" hidden>
        <button id="tFlip">↔</button>
        <button id="tColor">🎨</button>
        <button id="tFront">⬆</button>
        <button id="tDel" class="del">🗑</button>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-t="furn"></button>
      <button class="tab" data-t="room"></button>
      <button class="tab" data-t="char"></button>
      <button class="tab" data-t="look"></button>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const MG = window.MGH || null;
const L_ = (ko, en) => (MG && MG.L ? MG.L(ko, en) : ko);
const $ = (id) => document.getElementById(id);

/* ───────── 좌표 (아이소메트릭: 한 칸 32×16) ───────── */
const N = 8, TW = 16, TH = 8, WALL_H = 112;
const cv = $('room'), ctx = cv.getContext('2d');
const W = 2 * N * TW + 4, H = 250, OX = W / 2, OY = 122, SCALE = 2; // 방 폭에 딱 맞춘 논리 좌표 260×250, 실제 캔버스 2배
const iso = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z];

/* ───────── 색 도우미 ───────── */
function hex2rgb(h) { if (h[0] !== '#') { const m = h.match(/\d+/g) || [0, 0, 0]; return m.slice(0, 3).map(Number); } const n = parseInt(h.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, k) { const [r, g, b] = hex2rgb(h); const f = (v) => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }

/* 그리기 도구 (item 로컬 좌표: 원점 = 차지하는 칸의 뒤쪽 꼭짓점) */
function tools(g, o) {
  const P = (x, y, z) => { const [sx, sy] = iso(x, y, z); return [o[0] + sx, o[1] + sy]; };
  const poly = (pts, fill, stroke) => {
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
  };
  // 상자: (x,y,z) 위치, w×d 칸, h 높이(px)
  const box = (x, y, z, w, d, h, c, opt = {}) => {
    const top = opt.top || shade(c, 0.12), left = opt.left || shade(c, -0.18), right = opt.right || c;
    const ol = opt.ol === false ? null : (opt.ol || shade(c, -0.45));
    poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], left, ol);
    poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], right, ol);
    poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], top, ol);
  };
  // 앞면(왼쪽 면, y = y+d 평면)에 사각형 장식
  const faceL = (x, y, z, w, h, fill, stroke) => poly([P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)], fill, stroke);
  // 오른쪽 면(x 평면)에 장식
  const faceR = (x, y, z, d, h, fill, stroke) => poly([P(x, y, z), P(x, y + d, z), P(x, y + d, z + h), P(x, y, z + h)], fill, stroke);
  const circ = (x, y, z, r, fill, stroke) => { const [cx, cy] = P(x, y, z); g.beginPath(); g.ellipse(cx, cy, r, r, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.stroke(); } };
  const oval = (x, y, z, rx, ry, fill, stroke) => { const [cx, cy] = P(x, y, z); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.stroke(); } };
  const px = (x, y, z, w, h, fill) => { const [cx, cy] = P(x, y, z); g.fillStyle = fill; g.fillRect(Math.round(cx), Math.round(cy), w, h); };
  // 벽면(오른쪽 벽 = y=0 평면) 위 사각형: a=벽을 따라 위치, z=높이
  const wallQ = (a, z, w, h, fill, stroke) => poly([P(a, 0, z), P(a + w, 0, z), P(a + w, 0, z + h), P(a, 0, z + h)], fill, stroke);
  return { P, poly, box, faceL, faceR, circ, oval, px, wallQ, g };
}

   w,d = 차지하는 칸, h = 대략 높이(그림 크기용), wall = 벽걸이, surface = 위에 소품을 올릴 수 있는 높이, small = 다른 가구 위에 올릴 수 있음 */

    draw: (t, c) => { const l = '#666a76'; t.box(0.45, 0.45, 0, 0.1, 0.1, 9, l); t.box(0.2, 0.2, 0, 0.6, 0.6, 1, l); t.box(0.15, 0.15, 9, 0.7, 0.7, 3, c); t.box(0.15, 0.1, 12, 0.7, 0.12, 13, c); } },

    draw: (t, c) => { t.box(0, 0, 0, 1.5, 1.5, 9, c); for (let i = 0; i < 3; i++) t.faceL(i * 0.5, 1.5, 0, 0.5, 9, i % 2 ? shade(c, -0.25) : shade(c, 0.2), shade(c, -0.45)); t.box(-0.05, -0.05, 9, 1.6, 1.6, 4, '#c9925b'); } },

function charGrid(ch, frame) {
  const GW = CHW, GH = CHH, g = new Array(GW * GH).fill(null);
  const put = (x, y, k) => { y += YOFF; x += XOFF; if (x >= 0 && x < GW && y >= 0 && y < GH) g[y * GW + x] = k; };
  const at = (x, y) => { y += YOFF; x += XOFF; return x >= 0 && x < GW && y >= 0 && y < GH ? g[y * GW + x] : null; };
  const stamp = (rows, y0 = 0, map) => rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const k = r[i]; if (k !== '.') put(i, y0 + j, map ? map(k, i, y0 + j) : k); } });
  const fill = (x, y, w, h, k) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, typeof k === 'function' ? k(x + i, y + j) : k); };
  // [y, 시작 x, 끝 x] 줄 목록으로 모양 채우기 (mirror = 좌우 대칭 복사)
  const rows = (spec, k, mirror) => spec.forEach(([y, a, b]) => { for (let x = a; x <= b; x++) { const v = typeof k === 'function' ? k(x, y, a, b) : k; put(x, y, v); if (mirror) put(23 - x, y, typeof k === 'function' ? k(23 - x, y, 23 - b, 23 - a, true) : k); } });
  const cid = COS[ch.costume] ? ch.costume : 'none', cos = COS[cid] || null;
  const hooded = !!(cos && cos.hood);
  const dress = !cos && ch.top === 'dress';

  /* 등 뒤: 뒷머리·날개·꼬리·갈기 */
  if (!hooded) {
    if (ch.hair === 'long') fill(2, 8, 20, 24, (x, y) => (x >= 19 ? 'h' : (x + y) % 7 === 0 ? 'L' : 'H'));
    if (ch.hair === 'bob') fill(2, 8, 20, 12, (x) => (x >= 19 ? 'h' : 'H'));
    if (ch.hair === 'twin') {
      const tail = [[1, 2], [0, 3], [-1, 4], [-1, 4], [-2, 4], [-2, 4], [-2, 4], [-1, 3], [-1, 3], [0, 2], [0, 2], [1, 1]];
      tail.forEach(([x, w], j) => { fill(x, 13 + j, w, 1, (xx) => (xx === x ? 'L' : 'H')); fill(23 - x - w + 1, 13 + j, w, 1, (xx) => (xx === 23 - x ? 'h' : 'H')); });
      fill(1, 11, 2, 2, 'R'); fill(21, 11, 2, 2, 'R');
    }
  }
  if (cid === 'fairy') {
    rows([[17, 1, 3], [18, 0, 4], [19, -1, 4], [20, -1, 4], [21, -1, 4], [22, 0, 4], [23, 1, 4], [24, 0, 4], [25, -1, 4], [26, -1, 4], [27, 0, 3], [28, 1, 2]], (x, y) => ((x === 1 || x === 22) && y % 3 === 0 ? '#ffffff' : '#d4efffd9'), true);
  }
  if (cid === 'fox') rows([[22, 20, 21], [23, 20, 22], [24, 19, 23], [25, 19, 24], [26, 19, 24], [27, 19, 24], [28, 19, 23], [29, 19, 23], [30, 19, 22], [31, 19, 21]], (x, y) => (y <= 23 ? '#fff4e6' : x >= 23 ? '#c96a24' : '#f08a3c'));
  if (cid === 'lion') {
    for (let y = -2; y <= 23; y++) for (let x = -2; x <= 25; x++) { const d = ((x - 11.5) / 12.6) ** 2 + ((y - 10.5) / 12.4) ** 2; if (d <= 1) put(x, y, d > 0.78 ? '#a85f22' : '#c9782f'); }
    fill(20, 28, 1, 4, '#f2c14e'); fill(21, 26, 1, 3, '#f2c14e'); fill(21, 24, 2, 2, '#c9782f'); put(22, 23, '#a85f22');
  }
  if (cid === 'dino') {
    rows([[27, 18, 19], [28, 18, 20], [29, 18, 21], [30, 18, 22], [31, 19, 23], [32, 20, 24], [33, 22, 25]], (x) => (x >= 22 ? '#4f9a35' : '#6cc04a'));
    put(20, 26, '#ffd23d'); put(22, 28, '#ffd23d'); put(24, 30, '#ffd23d');
  }
  if (cid === 'rabbit') fill(19, 30, 3, 3, (x, y) => (x === 21 || y === 32 ? '#dfe3ea' : '#ffffff'));

  /* 몸 */
  stamp(SPR_BASE);
  if (!cos) {
    if (ch.bottom === 'pants' && !dress) fill(7, 33, 10, 4, (x) => (x === 10 || x === 15 ? 'b' : x === 11 || x === 12 ? null : 'B'));
    if (ch.bottom === 'shorts' && !dress) fill(7, 33, 10, 1, (x) => (x === 11 || x === 12 ? null : 'B'));
    if (ch.bottom === 'skirt' && !dress) { fill(5, 31, 14, 1, (x) => (x > 15 ? 'b' : 'B')); fill(4, 32, 16, 2, (x, y) => (x > 16 ? 'b' : (x + y) % 3 === 0 ? 'b' : 'B')); }
    if (ch.top === 'stripe') [24, 26, 28].forEach((y) => fill(4, y, 16, 1, (x) => (at(x, y) === 'T' || at(x, y) === 't' ? 'W' : at(x, y))));
    if (ch.top === 'hood') { fill(7, 22, 10, 1, 't'); put(10, 23, 'W'); put(10, 24, 'W'); put(13, 23, 'W'); put(13, 24, 'W'); fill(9, 26, 6, 2, 't'); }
    if (ch.top === 'sailor') { fill(6, 22, 12, 1, 'C'); fill(6, 23, 3, 1, 'C'); fill(15, 23, 3, 1, 'C'); put(7, 24, 'C'); put(16, 24, 'C'); fill(11, 23, 2, 2, 'R'); put(10, 25, 'R'); put(13, 25, 'R'); }
    if (ch.top === 'overall') { put(8, 22, 'B'); put(8, 23, 'B'); put(15, 22, 'B'); put(15, 23, 'B'); fill(8, 24, 8, 6, (x) => (x === 15 ? 'b' : 'B')); put(9, 24, 'Y'); put(14, 24, 'Y'); fill(10, 26, 4, 2, 'b'); }
    if (ch.top === 'dress') {
      fill(6, 30, 12, 1, 'T'); fill(5, 31, 14, 1, (x) => (x > 15 ? 't' : 'T')); fill(4, 32, 16, 2, (x) => (x > 16 ? 't' : 'T')); fill(3, 34, 18, 1, (x) => (x % 2 ? 'W' : 'w'));
      fill(10, 22, 4, 1, 'W'); put(11, 23, 'W'); put(12, 23, 'W');
      fill(7, 33, 10, 1, (x) => (x === 11 || x === 12 ? null : 'S'));
    }
  } else {
    if (cos.legs) for (let y = 33; y <= 36; y++) for (let x = 7; x <= 16; x++) { const k = at(x, y); if (k === 'S' || k === 's') put(x, y, x === 10 || x === 16 ? shade(cos.legs, -0.18) : cos.legs); }
    if (cos.belly) { fill(9, 24, 6, 5, cos.belly); put(9, 24, 'T'); put(14, 24, 'T'); put(9, 28, 'T'); put(14, 28, 'T'); }
    const skirt = (spec) => spec.forEach(([y, a, b]) => fill(a, y, b - a + 1, 1, (x) => (x >= b - 1 ? 't' : 'T')));
    switch (cid) {
      case 'knight':
        fill(4, 22, 3, 2, '#eef2f7'); fill(17, 22, 3, 2, '#eef2f7');
        fill(11, 23, 2, 6, '#e0453f'); fill(9, 25, 6, 1, '#e0453f');
        fill(6, 30, 12, 1, '#6b4a2a'); put(11, 30, 'Y'); put(12, 30, 'Y');
        break;
      case 'princess':
        fill(9, 22, 6, 1, 'S'); fill(3, 22, 4, 3, (x, y) => (y === 24 ? 'w' : 'W')); fill(17, 22, 4, 3, (x, y) => (y === 24 || x === 20 ? 'w' : 'W'));
        fill(6, 29, 12, 1, 'W'); put(11, 29, '#7cbdf0');
        skirt([[30, 6, 17], [31, 5, 18], [32, 4, 19], [33, 4, 19], [34, 3, 20], [35, 3, 20], [36, 2, 21]]);
        fill(2, 37, 20, 1, (x) => (x % 2 ? 'W' : 'w'));
        [[7, 33], [14, 35], [10, 31], [17, 33], [5, 35]].forEach(([x, y]) => put(x, y, 'W'));
        break;
      case 'pirate':
        fill(11, 22, 2, 4, 'W'); put(10, 22, 'W'); put(13, 22, 'W');
        [24, 27].forEach((y) => { put(9, y, 'Y'); put(14, y, 'Y'); });
        fill(4, 27, 2, 1, 'Y'); fill(18, 27, 2, 1, 'Y');
        fill(6, 29, 12, 1, '#3b2a20'); fill(11, 29, 2, 1, 'Y');
        fill(5, 30, 2, 3, 'T'); fill(17, 30, 2, 3, 't');
        break;
      case 'wizard':
        fill(3, 26, 3, 3, 'T'); fill(18, 26, 3, 3, 't');
        fill(6, 29, 12, 1, 'Y');
        skirt([[30, 5, 18], [31, 5, 18], [32, 5, 18], [33, 4, 19], [34, 4, 19], [35, 4, 19]]);
        fill(3, 36, 18, 1, 'Y');
        [[8, 25], [15, 27], [10, 33], [16, 34], [7, 31]].forEach(([x, y]) => put(x, y, 'Y'));
        break;
      case 'fairy':
        put(11, 22, '#ff9ebd'); put(12, 22, '#ff9ebd');
        fill(6, 29, 12, 1, '#7ccf6a');
        fill(5, 30, 14, 2, (x) => (x > 15 ? 't' : 'T'));
        for (let x = 4; x <= 19; x++) { if (x % 3 !== 0) put(x, 32, x % 3 === 1 ? 'T' : 't'); if (x % 3 === 1) put(x, 33, 't'); }
        break;
      case 'suit':
        fill(9, 22, 6, 1, 'W'); fill(10, 23, 4, 2, 'W'); fill(11, 25, 2, 1, 'W');
        fill(11, 23, 2, 1, '#d63c5c'); fill(11, 24, 2, 4, (x) => (x === 11 ? '#d63c5c' : '#b02a48'));
        put(15, 24, 'W'); put(16, 24, 'W');
        break;
      case 'ninja':
        fill(6, 29, 12, 1, '#e0453f');
        break;
      case 'pilot':
        fill(5, 22, 14, 1, '#f1e3c8'); fill(5, 23, 2, 1, '#f1e3c8'); fill(17, 23, 2, 1, '#f1e3c8');
        fill(8, 22, 8, 1, 'W'); fill(14, 23, 2, 4, (x) => (x === 15 ? 'w' : 'W'));
        fill(11, 23, 1, 7, '#c9a27a'); fill(7, 26, 3, 2, 't');
        fill(6, 30, 12, 1, '#3b2a20');
        for (let y = 34; y <= 36; y++) for (const x of [7, 8, 9, 10, 13, 14, 15, 16]) put(x, y, '#3b2a20');
        break;
      case 'explorer':
        fill(9, 22, 6, 1, 't'); fill(7, 24, 3, 2, 't'); fill(14, 24, 3, 2, 't'); [24, 26, 28].forEach((y) => put(11, y, '#6b5d36'));
        fill(6, 30, 12, 1, '#6b4226'); put(11, 30, 'Y');
        for (const x of [7, 8, 9, 10, 13, 14, 15, 16]) put(x, 36, 'W');
        break;
      case 'chef':
        fill(10, 22, 4, 1, '#e0453f'); put(11, 23, '#e0453f'); put(12, 23, '#e0453f');
        [24, 27].forEach((y) => { put(9, y, '#9aa3b2'); put(14, y, '#9aa3b2'); });
        for (let y = 30; y <= 36; y++) for (let x = 6; x <= 17; x++) { const k = at(x, y); if (k && k !== 'K' && (x + y) % 2 === 0) put(x, y, '#8e99a8'); }

        fill(9, 24, 6, 3, '#5d9bff'); put(10, 25, '#e0453f'); put(12, 25, '#ffd23d'); put(13, 25, '#7ed99a');

        break;
      case 'sheep':
        for (let y = 22; y <= 32; y++) for (let x = 4; x <= 19; x++) { const k = at(x, y); if ((k === 'T' || k === 'B') && (x * 3 + y) % 5 === 0) put(x, y, 't'); }

        fill(9, 25, 6, 1, '#c9dd8a'); fill(9, 27, 6, 1, '#c9dd8a');

  state.items.push(it); sel = it; showTools(); changed();
  toast(L_(`${def.ko} 배치! 끌어서 옮겨 보세요`, `${def.en} placed — drag to move`));
}
function renderPanel() {
  const b = $('pbody');
  b.innerHTML = '';
  if (tab === 'furn') {
    const chips = document.createElement('div'); chips.className = 'chips';
    CATS.filter(([id]) => !(outdoor() && id === 'wall')).forEach(([id, ko, en]) => { const c = document.createElement('button'); c.className = 'chip' + (cat === id ? ' on' : ''); c.textContent = L_(ko, en); c.onclick = () => { cat = id; renderPanel(); }; chips.appendChild(c); });
    b.appendChild(chips);
    const grid = document.createElement('div'); grid.className = 'grid';
    ITEMS.filter((i) => (cat === 'all' || i.cat === cat) && !(outdoor() && i.wall)).forEach((def) => {
      const el = document.createElement('div'); el.className = 'item';
      el.appendChild(thumb(def, def.colors[0]));
      const t = document.createElement('b'); t.textContent = nm(def); el.appendChild(t);
      const a = document.createElement('button'); a.className = 'add'; a.textContent = L_('배치하기', 'Place'); a.onclick = () => addItem(def); el.appendChild(a);
      grid.appendChild(el);
    });
    b.appendChild(grid);
  } else if (tab === 'room') {
    b.appendChild(h4(L_('테마', 'Theme')));
    b.appendChild(txtRow(THEMES.map((t) => [t.id, t.ko, t.en]), state.theme || 'room', (v) => { state.theme = v; if (outdoor() && cat === 'wall') cat = 'all'; if (sel && sel !== 'char' && outdoor() && ITEM[sel.t].wall) { sel = null; showTools(); } changed(); renderPanel(); }));
    if (outdoor()) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = L_('야외 테마에서는 벽과 벽걸이가 숨겨져요. 가구 탭의 ‘야외’에서 야자나무·텐트·모닥불을 놓아 보세요.', 'Walls and wall items are hidden outdoors. Try palm trees, tents and campfires under Furniture › Outdoor.'); b.appendChild(p); }
    if (!outdoor()) {
    b.appendChild(h4(L_('벽지', 'Wallpaper')));
    b.appendChild(optRow(WALLS, state.wall, (w) => { state.wall = w.id; changed(); renderPanel(); }, (w) => { const c = patternCanvas(w); c.style.width = '36px'; c.style.height = '36px'; c.style.borderRadius = '6px'; return c; }));
    b.appendChild(h4(L_('바닥', 'Floor')));
    b.appendChild(optRow(FLOORS, state.floor, (f) => { state.floor = f.id; changed(); renderPanel(); }, (f) => { const c = document.createElement('div'); c.className = 'sw'; c.style.background = f.kind === 'check' ? `repeating-conic-gradient(${f.a} 0 25%, ${f.b} 0 50%) 0 0/12px 12px` : `repeating-linear-gradient(90deg, ${f.a} 0 8px, ${f.b} 8px 10px)`; return c; }));
    }
    b.appendChild(h4(L_('방 비우기', 'Reset')));
    const clr = document.createElement('button'); clr.className = 'chip'; clr.textContent = L_('🧹 가구 모두 치우기', '🧹 Remove all furniture');
    clr.onclick = () => { if (!state.items.length) return; if (confirmClear()) { state.items = []; sel = null; showTools(); changed(); } };
    b.appendChild(clr);
  } else {
    const prev = document.createElement('div'); prev.className = 'ch-prev';
    const pc = document.createElement('canvas'); pc.width = CHW + 8; pc.height = CHH + 6;
    const pg = pc.getContext('2d'); drawChar(pg, state.ch, (CHW + 8) / 2, CHH + 4); prev.appendChild(pc); b.appendChild(prev);
    const sec = (title, el) => { b.appendChild(h4(title)); b.appendChild(el); };
    const setCh = (k, v) => { state.ch[k] = v; charCache = null; changed(); renderPanel(); };
    if (tab === 'char') {
      sec(L_('성별', 'Gender'), txtRow(SEXES, state.ch.sex || 'f', (v) => { if (v === state.ch.sex) return; state.ch = { ...(v === 'm' ? DEF_CHAR_M : DEF_CHAR), skin: state.ch.skin }; charCache = null; changed(); renderPanel(); }));
      sec(L_('피부색', 'Skin'), swRow(SKINS, state.ch.skin, (v) => setCh('skin', v)));
      sec(L_('머리 모양', 'Hair'), txtRow(HAIRS, state.ch.hair, (v) => setCh('hair', v)));
      sec(L_('머리 색', 'Hair color'), swRow(HAIRC, state.ch.hairC, (v) => setCh('hairC', v)));
      sec(L_('눈', 'Eyes'), txtRow(EYES, state.ch.eyes, (v) => setCh('eyes', v)));
      sec(L_('눈동자 색', 'Eye color'), swRow(EYEC, state.ch.eyeC, (v) => setCh('eyeC', v)));
      sec(L_('말풍선 한마디', 'Speech bubble'), msgInput());
    } else {
      const cos = COS[state.ch.costume];
      sec(L_('의상', 'Outfit'), picRow(costumesFor(state.ch.sex), 'costume'));
      if (!cos) {
        sec(L_('상의', 'Top'), picRow(topsFor(state.ch.sex), 'top'));
        sec(L_('상의 색', 'Top color'), swRow(CLOTH, state.ch.topC, (v) => setCh('topC', v)));
        sec(L_('하의', 'Bottom'), picRow(bottomsFor(state.ch.sex), 'bottom'));
        sec(L_('하의 색', 'Bottom color'), swRow(CLOTH, state.ch.bottomC, (v) => setCh('bottomC', v)));
        sec(L_('신발 색', 'Shoes'), swRow(CLOTH, state.ch.shoes, (v) => setCh('shoes', v)));
      }
      b.appendChild(h4(L_('모자·장식', 'Headwear')));
      if (cos && cos.head) { const n = document.createElement('p'); n.className = 'note'; n.textContent = L_('이 의상에는 모자가 포함돼 있어요. 평상복으로 바꾸면 고를 수 있어요.', 'This outfit has its own headgear. Switch to Everyday to pick one.'); b.appendChild(n); }
      else {
        b.appendChild(picRow(ACCS, 'acc'));
        if (ACC_COLORED.includes(state.ch.acc)) sec(L_('장식 색', 'Headwear color'), swRow(HOODC, state.ch.hoodC, (v) => setCh('hoodC', v)));
      }
      sec(L_('손에 들기', 'In hand'), picRow(HANDS, 'hand'));
    }
  }
}
function confirmClear() { try { return window.confirm(L_('가구를 모두 치울까요?', 'Remove all furniture?')); } catch (e) { return true; } }
const h4 = (t) => { const e = document.createElement('h4'); e.textContent = t; return e; };
function optRow(list, cur, on, vis) {
  const r = document.createElement('div'); r.className = 'opts';
  list.forEach((o) => { const b = document.createElement('button'); b.className = 'opt' + (o.id === cur ? ' on' : ''); b.title = nm(o); b.appendChild(vis(o)); b.onclick = () => on(o); r.appendChild(b); });
  return r;
}
function swRow(list, cur, on) {
  const r = document.createElement('div'); r.className = 'opts';
  [...new Set(list)].forEach((c) => { const b = document.createElement('button'); b.className = 'opt' + (c === cur ? ' on' : ''); const s = document.createElement('div'); s.className = 'sw'; s.style.background = c; b.appendChild(s); b.onclick = () => on(c); r.appendChild(b); });
  return r;
}
// 옵션마다 그 옵션을 입힌 캐릭터 미리보기를 붙인 버튼 줄
function picRow(list, key) {
  const r = document.createElement('div'); r.className = 'opts pics';
  list.forEach(([id, ko, en]) => {
    const b = document.createElement('button'); b.className = 'opt pic' + (state.ch[key] === id ? ' on' : '');
    const c = document.createElement('canvas'); c.width = CHW + 8; c.height = CHH + 6;
    drawChar(c.getContext('2d'), { ...state.ch, [key]: id }, (CHW + 8) / 2, CHH + 4);
    const t = document.createElement('span'); t.textContent = L_(ko, en);
    b.append(c, t); b.onclick = () => { state.ch[key] = id; charCache = null; changed(); renderPanel(); };
    r.appendChild(b);
  });
  return r;
}
function txtRow(list, cur, on) {
  const r = document.createElement('div'); r.className = 'opts';
  list.forEach(([id, ko, en]) => { const b = document.createElement('button'); b.className = 'opt' + (id === cur ? ' on' : ''); b.textContent = L_(ko, en); b.onclick = () => on(id); r.appendChild(b); });
  return r;
}
function msgInput() {
  const i = document.createElement('input'); i.className = 'msg'; i.maxLength = 20; i.value = state.msg || '';
  i.placeholder = L_('말풍선에 보일 한마디 (20자)', 'Speech bubble (20 chars)');
  i.oninput = () => { state.msg = i.value.slice(0, 20); changed(); };
  return i;
}
document.querySelectorAll('.tab').forEach((t) => {
  t.textContent = { furn: L_('🛋 가구', '🛋 Items'), room: L_('🎨 테마', '🎨 Theme'), char: L_('🙂 캐릭터', '🙂 Face'), look: L_('👕 외형', '👕 Outfit') }[t.dataset.t];
  t.onclick = () => { tab = t.dataset.t; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t)); renderPanel(); };
});

/* ───────── 저장 ───────── */
const LS = 'mgh:myroom:v1';
let owner = null, cloudAt = null, saveT = null, saving = false, again = false;
const setSave = (t) => { $('save').textContent = t; };
function changed() {
  redraw();
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  if (owner) { clearTimeout(saveT); setSave(L_('저장 대기…', 'Pending…')); saveT = setTimeout(cloudStore, 1200); }
}
async function cloudStore() {
  if (!owner || !MG || !MG.save) return;
  if (saving) { again = true; return; }
  saving = true; setSave(L_('저장 중…', 'Saving…'));
  try {
    let r = await MG.save.store({ ...state, owner }, cloudAt || undefined);
    if (r && r.conflict) { cloudAt = r.updatedAt; r = await MG.save.store({ ...state, owner }, cloudAt); }
    if (r && r.updatedAt) cloudAt = r.updatedAt;
    setSave(L_('☁️ 저장됨', '☁️ Saved'));
  } catch (e) { setSave(L_('저장 실패', 'Save failed')); }
  saving = false;
  if (again) { again = false; cloudStore(); }
}
function fixChar(c) {
  const ok = (list, v, d) => (list.some((o) => o[0] === v) ? v : d);
  c.sex = c.sex === 'm' ? 'm' : 'f';
  const D = c.sex === 'm' ? DEF_CHAR_M : DEF_CHAR;
  c.hair = ok(HAIRS, c.hair, D.hair); c.eyes = ok(EYES, c.eyes, DEF_CHAR.eyes); c.top = ok(topsFor(c.sex), c.top, D.top);
  c.bottom = ok(bottomsFor(c.sex), c.bottom, D.bottom); c.acc = ok(ACCS, c.acc, 'none'); c.costume = ok(costumesFor(c.sex), c.costume, 'none'); c.hand = ok(HANDS, c.hand, 'none');
  if (!HOODC.includes(c.hoodC)) c.hoodC = HOODC[0]; delete c.style;
  return c;
}
function sanitize(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const out = { v: 1, theme: THEMES.some((t) => t.id === s.theme) ? s.theme : 'room', wall: WALLS.some((w) => w.id === s.wall) ? s.wall : d.wall, floor: FLOORS.some((f) => f.id === s.floor) ? s.floor : d.floor,
    items: Array.isArray(s.items) ? s.items.filter((i) => i && ITEM[i.t]).slice(0, 80) : d.items,
    ch: fixChar({ ...DEF_CHAR, ...(s.ch || {}) }), cp: { ...d.cp, ...(s.cp || {}) }, msg: typeof s.msg === 'string' ? s.msg.slice(0, 20) : '' };
  return out;
}
function setupAuth() {
  const btn = $('loginBtn');
  if (!MG || !MG.save || !MG.embedded) return;
  btn.textContent = L_('로그인하고 저장', 'Log in to save');
  btn.onclick = () => MG.save.login();
  MG.save.onAuth(async (u) => {
    owner = u ? u.id : null;
    btn.hidden = !!u;
    if (!u) { setSave(''); return; }
    setSave(L_('불러오는 중…', 'Loading…'));
    try {
      const r = await MG.save.load();
      if (r && r.data && r.data.items) { state = sanitize(r.data); cloudAt = r.updatedAt || null; charCache = null; sel = null; showTools(); redraw(); renderPanel(); try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} setSave(L_('☁️ 불러옴', '☁️ Loaded')); }
      else await cloudStore();
    } catch (e) { setSave(L_('불러오기 실패', 'Load failed')); }
  });
}

/* 사진 저장 (방 그림 PNG) */
$('dlBtn').title = L_('방 사진 저장', 'Save room picture');
$('dlBtn').onclick = () => {
  const c = document.createElement('canvas'); c.width = W * 3; c.height = H * 3;
  const g = c.getContext('2d'); g.fillStyle = '#f3f9ff'; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(3, 0, 0, 3, 0, 0); g.imageSmoothingEnabled = false; drawAll(g, false);
  c.toBlob(async (blob) => {
    const file = new File([blob], 'my-room.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: L_('마이룸', 'My Room') }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'my-room.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
};

let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2000); }

/* ───────── 시작 ───────── */
$('ttl').textContent = L_('🏠 마이룸', '🏠 My Room');
$('hint').textContent = L_('가구와 캐릭터를 눌러 끌어서 옮기고, 아래 버튼으로 돌리기(↔)·색 바꾸기(🎨)·삭제(🗑)할 수 있어요. 컴퓨터·스탠드 같은 소품은 책상이나 탁자 위에 올려져요.',
  'Tap and drag furniture or your character. Use ↔ to turn, 🎨 to recolor and 🗑 to remove. Small items sit on desks and tables.');
$('tFlip').textContent = L_('↔ 돌리기', '↔ Turn');
$('tColor').textContent = L_('🎨 색', '🎨 Color');
$('tFront').textContent = L_('⬆ 앞으로', '⬆ Front');
$('tDel').textContent = L_('🗑 삭제', '🗑 Delete');
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) state = sanitize(s); } catch (e) {}
ctx.imageSmoothingEnabled = false;
renderPanel(); redraw(); setupAuth();
</script>
