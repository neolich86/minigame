<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/play/racing">
<script src="/mgh/bridge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>서킷 메이커 - 미니게임천국</title>
<meta name="description" content="트랙을 직접 만들고 AI 또는 친구와 온라인으로 달리는 3D 레이싱 게임. 맵·랩 수·인원수를 골라 바로 출발하세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23232a3a'/%3E%3Cpath d='M14 46c0-14 8-26 22-26h8a6 6 0 0 1 0 12h-8c-6 0-10 6-10 14z' fill='%23ffd23f'/%3E%3Crect x='12' y='44' width='16' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#1d2333;--panel:#262e42;--panel2:#30394f;--ink:#f3f5fb;--dim:#a6afc4;--acc:#ffd23f;--acc2:#ff6b3d;--ok:#46d39a;--bad:#ff5a6a;--line:#3d4862}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;user-select:text;-webkit-user-select:text}
[hidden]{display:none !important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(18,22,34,.55);backdrop-filter:blur(2px);z-index:20;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:18px;width:min(560px,100%);max-height:100%;overflow:auto}
.card.wide{width:min(860px,100%)}
h1.logo{margin:0 0 4px;font-size:40px;letter-spacing:1px;font-weight:900;text-align:center;line-height:1.05}
h1.logo span{color:var(--acc)}
.sub{color:var(--dim);text-align:center;margin:0 0 18px;font-size:14px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:13px;margin:14px 0 8px;color:var(--dim);font-weight:800;letter-spacing:.3px}
.btn{height:46px;padding:0 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:var(--acc);color:#2a2100;border-color:var(--acc)}
.btn.hot{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.col{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.menu-btns{display:grid;gap:10px;margin-top:8px}
.menu-btns .btn{height:56px;font-size:17px}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mapc{border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2);text-align:left;position:relative}
.mapc canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:8px;background:#20273a}
.mapc b{display:block;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapc small{color:var(--dim);font-size:11px}
.mapc.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,210,63,.25)}
.mapc .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.55);font-size:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:36px;padding:0 12px;font-weight:800;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#2a2100}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:900;font-size:18px}
.step b{min-width:34px;text-align:center;font-size:18px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.carc{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:4px 4px 6px;text-align:center}
.carc img{width:100%;aspect-ratio:16/11;object-fit:contain;display:block}
.carc b{font-size:12px;display:block}
.carc .bars{display:grid;grid-template-columns:auto 1fr;gap:1px 4px;font-size:9px;color:var(--dim);margin:3px 4px 0;text-align:left;align-items:center}
.carc .bar{height:4px;background:#1b2130;border-radius:3px;overflow:hidden}.carc .bar i{display:block;height:100%;background:var(--acc)}
.carc.on{border-color:var(--acc)}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.muted{color:var(--dim);font-size:13px}
.err{color:var(--bad);font-weight:700;font-size:13px}
.okc{color:var(--ok);font-weight:700;font-size:13px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.hbox{position:absolute;background:rgba(18,22,34,.62);border-radius:12px;padding:6px 12px;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#hPos{left:10px;top:10px;font-size:34px;line-height:1}
#hPos small{font-size:15px;color:var(--dim)}
#hLap{left:10px;top:60px;font-size:16px}
#hTime{left:50%;top:10px;transform:translateX(-50%);font-size:20px;font-variant-numeric:tabular-nums;text-align:center}
#hTime small{display:block;font-size:11px;color:var(--dim);font-weight:700}
#hSpeed{right:12px;bottom:12px;font-size:30px;font-variant-numeric:tabular-nums}
#hSpeed small{font-size:12px;color:var(--dim)}
#mini{position:absolute;right:10px;top:10px;width:150px;height:150px;background:rgba(18,22,34,.5);border-radius:12px}
#hList{left:10px;top:96px;font-size:12px;font-weight:700;padding:6px 8px;min-width:120px}
#hList div{display:flex;gap:6px;align-items:center;line-height:1.55;white-space:nowrap}
#hList i{width:9px;height:9px;border-radius:3px;display:inline-block}
#hList .me{color:var(--acc)}
#hMsg{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:84px;font-weight:900;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6),0 0 2px #000;white-space:nowrap;text-align:center}
#hMsg.small{font-size:34px}
#hWrong{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:900;padding:8px 18px;border-radius:12px;font-size:20px}
#hHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:#dfe4f2;background:rgba(18,22,34,.55);padding:5px 12px;border-radius:999px;white-space:nowrap}
.hbtns{position:absolute;top:10px;right:170px;display:flex;gap:6px;pointer-events:auto}
.hbtns button{width:40px;height:40px;border-radius:12px;background:rgba(18,22,34,.62);font-size:18px}
/* touch */
#touch{position:fixed;inset:auto 0 0 0;height:190px;z-index:11;pointer-events:none}
#touch button{pointer-events:auto;position:absolute;bottom:22px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-size:30px;color:#fff;touch-action:none}
#touch button.on{background:rgba(255,210,63,.55)}
#tL{left:16px}#tR{left:104px}#tB{right:110px;width:66px!important;height:66px!important;bottom:28px!important}#tG{right:18px;width:88px!important;height:88px!important}
#tReset{position:absolute;left:16px!important;bottom:112px!important;width:48px!important;height:48px!important;font-size:20px!important}
@media (pointer:fine){#touch{display:none}}
body.touch #hSpeed{bottom:auto;top:200px;right:10px;font-size:22px}
body.touch #hHint{display:none}
/* results */
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.res th{color:var(--dim);font-size:12px}
table.res tr.me td{color:var(--acc);font-weight:800}
table.res td.n{font-variant-numeric:tabular-nums}
/* editor */
#ed{position:fixed;inset:0;z-index:12;pointer-events:none}
#edTop{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:8px;background:rgba(18,22,34,.86);pointer-events:auto;flex-wrap:wrap}
#edTop input{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 10px;width:150px}
#edPal{position:absolute;left:0;right:0;bottom:0;background:rgba(18,22,34,.9);pointer-events:auto;padding:6px 8px 8px}
#edPal .tabs{display:flex;gap:4px;margin-bottom:6px}
#edPal .tabs button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;color:var(--dim);background:var(--panel2)}
#edPal .tabs button.on{background:var(--acc);color:#2a2100}
#edItems{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pi{flex:0 0 auto;width:68px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);padding:3px;text-align:center}
.pi img,.pi canvas{width:56px;height:56px;display:block;margin:0 auto;object-fit:contain}
.pi span{font-size:10.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.on{border-color:var(--acc);background:#3a4360}
#edStatus{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(18,22,34,.9);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:auto;max-width:calc(100% - 120px);text-align:center;line-height:1.4}
#edCam{position:absolute;left:8px;bottom:130px;display:flex;align-items:center;gap:6px;background:rgba(18,22,34,.88);border:1px solid var(--line);border-radius:12px;padding:4px 8px;pointer-events:auto;font-size:12px;font-weight:700}
#edCam button{width:32px;height:32px;border-radius:9px;background:var(--panel2);font-size:16px}
#edCam input{width:130px;accent-color:#ffd23f}
#edSide{position:absolute;right:8px;top:60px;display:grid;gap:6px;pointer-events:auto}
#edSide button{width:44px;height:44px;border-radius:12px;background:rgba(18,22,34,.86);font-size:19px;border:1px solid var(--line)}
#edSide button.on{background:var(--acc);color:#2a2100}
#edSide button:disabled{opacity:.35}
.lvbox{display:grid;gap:3px;justify-items:center;background:rgba(18,22,34,.86);border:1px solid var(--line);border-radius:12px;padding:4px 0;margin-top:6px}
.lvbox button{width:40px!important;height:34px!important;border:0!important;background:var(--panel2)!important;font-size:14px!important}
.lvbox b{font-size:20px;line-height:1;color:var(--acc)}.lvbox small{font-size:10px;color:var(--dim);margin-top:-2px}
textarea.code{width:100%;height:90px;border-radius:10px;border:1px solid var(--line);background:#1b2130;color:var(--ink);padding:8px;font-family:monospace;font-size:12px;user-select:text;-webkit-user-select:text;resize:vertical}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:50;background:var(--bg)}
#loading .bar{width:220px;height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.plist{display:grid;gap:6px}
.plist div{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
.plist i{width:12px;height:12px;border-radius:4px;display:inline-block}
.plist small{margin-left:auto;color:var(--dim);font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f1320;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.4)}
@media (max-width:560px){h1.logo{font-size:32px}#hMsg{font-size:60px}#hMsg.small{font-size:26px}#mini{width:104px;height:104px}.hbtns{right:10px;top:122px;flex-direction:column}.hbtns button{width:36px;height:36px;font-size:16px}#hList{display:none}#hPos{font-size:28px}#hLap{top:52px;font-size:14px}#hTime{font-size:16px;top:10px}
 body.touch #hSpeed{top:208px;font-size:18px}#edTop{gap:5px;padding:6px}#edTop input{width:120px;flex:1}#edTop .btn.sm{padding:0 9px}#edTop .lbl{display:none}.step button{width:30px;height:30px}.step b{min-width:24px;font-size:15px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><b style="font-size:20px">서킷 메이커</b><div class="bar"><i id="ldBar"></i></div><span class="muted" id="ldTxt">Loading…</span></div>

<div id="hud" hidden>
  <div class="hbox" id="hPos">1<small>/8</small></div>
  <div class="hbox" id="hLap">LAP 1/3</div>
  <div class="hbox" id="hList"></div>
  <div class="hbox" id="hTime">0:00.00<small id="hBest"></small></div>
  <canvas id="mini" width="300" height="300"></canvas>
  <div class="hbtns"><button id="bMute" title="sound">🔊</button><button id="bPause" title="pause">⏸</button></div>
  <div class="hbox" id="hSpeed">0<small> km/h</small></div>
  <div id="hMsg"></div>
  <div id="hWrong" hidden></div>
  <div id="hHint"></div>
</div>
<div id="touch" hidden>
  <button id="tL">◀</button><button id="tR">▶</button>
  <button id="tB">⬇</button><button id="tG">⬆</button>
  <button id="tReset">↺</button>
</div>

<div class="screen" id="scMenu" hidden>
  <div class="card" style="width:min(420px,100%)">
    <h1 class="logo">CIRCUIT <span>MAKER</span></h1>
    <p class="sub" id="menuSub"></p>
    <div class="menu-btns">
      <button class="btn pri" id="mRace"></button>
      <button class="btn" id="mEdit"></button>
      <button class="btn" id="mOnline"></button>
    </div>
  </div>
</div>

<div class="screen" id="scSetup" hidden>
  <div class="card wide">
    <div class="row spread"><h2 id="setTitle"></h2><button class="btn sm" id="setBack"></button></div>
    <div id="setPlayers" hidden></div>
    <h3 id="lbMap"></h3>
    <div class="maps" id="mapList"></div>
    <div class="row" style="gap:18px;margin-top:4px">
      <div><h3 id="lbLaps"></h3><div class="step" id="stLaps"><button>−</button><b>3</b><button>+</button></div></div>
      <div id="wRacers"><h3 id="lbRacers"></h3><div class="step" id="stRacers"><button>−</button><b>6</b><button>+</button></div></div>
      <div id="wDiff"><h3 id="lbDiff"></h3><div class="seg" id="segDiff"></div></div>
    </div>
    <h3 id="lbCar"></h3>
    <div class="cars" id="carList"></div>
    <div class="foot"><span class="muted" id="setNote"></span><button class="btn pri" id="setGo" style="min-width:160px"></button></div>
  </div>
</div>

<div class="screen" id="scPause" hidden>
  <div class="card" style="width:min(340px,100%)">
    <h2 id="pTitle"></h2>
    <div class="menu-btns"><button class="btn pri" id="pResume"></button><button class="btn" id="pRestart"></button><button class="btn" id="pQuit"></button></div>
  </div>
</div>

<div class="screen" id="scResult" hidden>
  <div class="card">
    <h2 id="rTitle"></h2>
    <table class="res" id="rTable"></table>
    <div class="foot"><button class="btn" id="rMenu"></button><span class="row"><button class="btn" id="rShare"></button><button class="btn pri" id="rAgain"></button></span></div>
  </div>
</div>

<div class="screen" id="scCode" hidden>
  <div class="card">
    <h2 id="cTitle"></h2>
    <p class="muted" id="cDesc"></p>
    <textarea class="code" id="cText"></textarea>
    <div class="foot"><button class="btn" id="cClose"></button><span class="row"><button class="btn" id="cCopy"></button><button class="btn pri" id="cLoad"></button></span></div>
  </div>
</div>

<div id="ed" hidden>
  <div id="edTop">
    <button class="btn sm" id="eBack">←</button>
    <input id="eName" maxlength="24">
    <span class="step" id="eW"><button>−</button><b>14</b><button>+</button></span><span class="muted">×</span>
    <span class="step" id="eH"><button>−</button><b>10</b><button>+</button></span>
    <span class="seg" id="eTheme"></span>
    <span style="flex:1"></span>
    <button class="btn sm" id="eNew">📄<span class="lbl"></span></button>
    <button class="btn sm" id="eCode">🔗<span class="lbl"></span></button>
    <button class="btn sm" id="eSave">💾<span class="lbl"></span></button>
    <button class="btn sm hot" id="eTest">▶<span class="lbl"></span></button>
  </div>
  <div id="edStatus"></div>
  <div id="edSide">
    <button id="eRot" title="R">⟳</button>
    <button id="eErase" title="E">🧽</button>
    <button id="ePan" title="Space">✋</button>
    <button id="eZin">＋</button>
    <button id="eZout">－</button>
    <button id="eUndo" title="Ctrl+Z">↶</button>
    <div class="lvbox"><button id="eUp" title="PageUp ]">▲</button><b id="eLv">0</b><small id="eLvL">높이</small><button id="eDn" title="PageDown [">▼</button></div>
  </div>
  <div id="edCam">
    <button id="eTop">⊡</button>
    <span id="eTiltL0" class="muted"></span>
    <input type="range" id="eTilt" min="0" max="83" step="1" value="0">
    <span id="eTiltL1" class="muted"></span>
    <button id="eYaw">⟲</button>
  </div>
  <div id="edPal">
    <div class="tabs" id="edTabs"></div>
    <div id="edItems"></div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./main.js?v=4"></script>
</body>
</html>
