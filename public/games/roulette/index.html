<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/play/roulette">
<script src="/mgh/bridge.js"></script><script src="/mgh/result.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>룰렛 - 미니게임천국</title>
<meta name="description" content="싱글 제로 유럽식 룰렛. 100만 원으로 시작해 칩을 걸고 휠을 돌려 잔액을 불리고 최고 잔액 랭킹에 도전하세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23126b3c'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23b3202a'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23d8b45a'/%3E%3Ccircle cx='46' cy='18' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --felt:#0f5a34; --felt2:#0b4528; --feltLine:rgba(255,246,220,.55);
  --wood:#3a1f12; --gold:#d8b45a; --gold2:#f3dc95;
  --red:#b3202a; --black:#16171b; --green:#118048;
  --ink:#f6efdc; --dim:#b9c6b8; --panel:rgba(5,22,14,.72);
  --bad:#ff6b6b; --ok:#7ee2a2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);overflow-x:hidden;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1100px 700px at 50% 0%, #1b7a4b 0%, transparent 65%),
    radial-gradient(900px 600px at 50% 110%, #062a17, transparent 70%),
    #0a3a22;
  background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.2px);background-size:4px 4px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:12px 14px 110px}

/* 헤더 */
.top{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.logo{font-weight:900;font-size:22px;letter-spacing:3px;color:var(--gold2);
  text-shadow:0 2px 0 #4a2a0e,0 0 18px rgba(216,180,90,.35)}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:600;text-shadow:none}
.top .sp{flex:1}
.ibtn{height:34px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(243,220,149,.25);font-size:13px;font-weight:700;color:var(--gold2);white-space:nowrap}
.ibtn:hover{background:rgba(0,0,0,.4)}

/* 잔액 바 */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid rgba(243,220,149,.16);border-radius:12px;padding:8px 12px;min-width:0}
.stat b{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.5px}
.stat span{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hBal{color:var(--gold2)}
.stat.flash-up span{animation:up .9s}
.stat.flash-dn span{animation:dn .9s}
@keyframes up{0%{color:#9fffbf;transform:scale(1.08)}100%{}}
@keyframes dn{0%{color:#ff9a9a}100%{}}

.main{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.left,.right{min-width:0}

/* 휠 */
.wheelBox{position:relative;background:var(--panel);border:1px solid rgba(243,220,149,.16);border-radius:18px;padding:14px}
#wheel{display:block;width:100%;aspect-ratio:1;max-width:370px;margin:0 auto}
.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  width:112px;height:112px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:4px solid var(--gold);box-shadow:0 0 0 6px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.6);transition:.35s cubic-bezier(.2,1.6,.4,1)}
.result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.result .n{font-size:46px;font-weight:900;line-height:1}
.result .c{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.85;margin-top:2px}
.r-red{background:radial-gradient(circle at 35% 30%,#e04a52,var(--red))}
.r-black{background:radial-gradient(circle at 35% 30%,#3a3c44,var(--black))}
.r-green{background:radial-gradient(circle at 35% 30%,#2bb36c,var(--green))}

.msg{margin-top:10px;min-height:46px;text-align:center;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.msg .win{color:var(--ok)} .msg .lose{color:var(--bad)} .msg small{display:block;width:100%;font-size:12px;color:var(--dim);font-weight:600}

.hist{margin-top:10px}
.hist h4,.stats h4{margin:0 0 6px;font-size:12px;color:var(--dim);letter-spacing:.5px;font-weight:700}
.strip{display:flex;gap:4px;overflow:hidden;min-height:28px}
.strip i{flex:0 0 28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.15)}
.strip i:first-child{outline:2px solid var(--gold);outline-offset:1px}
.strip .empty{color:var(--dim);font-size:12px;font-weight:600;align-self:center}
.stats{margin-top:12px}
.bars{display:grid;gap:5px}
.bar{display:flex;height:18px;border-radius:5px;overflow:hidden;font-size:10.5px;font-weight:800}
.bar div{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;transition:flex-basis .4s}

/* 테이블 */
.tableBox{background:linear-gradient(180deg,var(--felt),var(--felt2));border-radius:18px;padding:14px;
  box-shadow:inset 0 0 0 6px var(--wood),inset 0 0 0 8px #6a3d1f,inset 0 0 40px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.35)}
#table{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#table .cell{stroke:var(--feltLine);stroke-width:.03}
#table text{font-weight:800;fill:#fff;pointer-events:none;dominant-baseline:central;text-anchor:middle}
#table .hl{fill:rgba(255,240,170,.22)}
#table .winCell{animation:winGlow 1s ease-in-out 3}
@keyframes winGlow{50%{fill:rgba(255,236,140,.75)}}
.chipG{transition:opacity .4s}
.chipG.lost{opacity:0}
.chipG.won circle.face{animation:chipWin .8s ease-in-out 3}
@keyframes chipWin{50%{stroke:#fff6c0;stroke-width:.09}}
.hover{fill:none;stroke:#fff6c0;stroke-width:.05;pointer-events:none}

.limits{display:flex;justify-content:space-between;gap:10px;margin:8px 4px 0;font-size:12px;color:var(--dim);font-weight:600;flex-wrap:wrap}

/* 칩 · 버튼 */
.dock{margin-top:12px;background:var(--panel);border:1px solid rgba(243,220,149,.16);border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;padding:12px 6px 6px;margin:-8px 0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:52px;height:52px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:transform .15s;
  background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 4px var(--c),inset 0 0 0 7px rgba(255,255,255,.85)}
.chip::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.9) 0 12deg,transparent 12deg 45deg);
  -webkit-mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%);mask:radial-gradient(circle,transparent 61%,#000 62%,#000 100%)}
.chip span{position:relative;z-index:1}
.chip.sel{transform:translateY(-5px) scale(1.06);box-shadow:0 0 0 3px var(--gold2),0 8px 14px rgba(0,0,0,.5),inset 0 0 0 4px var(--c),inset 0 0 0 7px rgba(255,255,255,.85)}
.chip:disabled{opacity:.3;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.dockInfo{display:none}
.btn{height:42px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:800;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.spin{height:50px;padding:0 26px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:2px;color:#2a1a05;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a7822d);box-shadow:0 4px 0 #6d521a,0 8px 18px rgba(0,0,0,.4)}
.spin:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #6d521a}
.spin:disabled{filter:grayscale(.7);opacity:.6;cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:rgba(10,10,10,.9);border:1px solid rgba(243,220,149,.3);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 모달 */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.open{display:flex}
.modal{width:min(440px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#123e28,#0a2618);border:1px solid rgba(243,220,149,.3);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal h3{margin:0 0 10px;color:var(--gold2);font-size:19px}
.modal p{margin:0 0 12px;color:#dfe6dc;line-height:1.55;font-size:14px}
.modal table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:12px}
.modal td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.modal td:last-child{text-align:right;font-weight:800;color:var(--gold2);white-space:nowrap}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.big{font-size:30px;font-weight:900;color:var(--gold2);text-align:center;margin:6px 0 14px}

@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .main{gap:12px}
  .left{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;align-items:stretch}
  #wheelMain{padding:10px;display:flex;align-items:center;justify-content:center}
  #wheel{max-width:228px}
  .result{width:84px;height:84px}.result .n{font-size:34px}
}
@media (max-width:700px){
  .wrap{padding:10px 10px 150px}
  .logo{font-size:18px}
  .hud{grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
  .stat{padding:6px 10px}.stat span{font-size:16px}
  .left{grid-template-columns:1fr;gap:0}
  #wheelMain{position:fixed;inset:0;z-index:55;border:0;border-radius:0;background:rgba(2,12,7,.82);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  body.showWheel #wheelMain{opacity:1;pointer-events:auto}
  #wheelMain #wheel{width:min(86vw,340px);max-width:none}
  #info{padding:8px 12px!important;margin-bottom:10px}
  .msg{margin-top:0;min-height:0;font-size:15px}
  .msg:empty{display:none}
  .hist{margin-top:4px}.hist h4{display:none}
  .strip i{flex-basis:26px;height:26px;font-size:12px}
  .stats{display:none}
  .tableBox{padding:10px;max-width:440px;margin:0 auto}
  .dock{position:fixed;left:8px;right:8px;bottom:8px;z-index:40;margin:0;padding:8px;gap:8px;background:rgba(5,22,14,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .chips{flex-basis:100%}
  .dockInfo{display:flex;flex-basis:100%;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--dim);padding:0 4px}
  .dockInfo b{color:var(--gold2);font-variant-numeric:tabular-nums}
  .dockInfo .sp{flex:1}
  .dockInfo i{font-style:normal;padding:2px 8px;border-radius:6px;color:#fff;font-weight:800}
  .dockInfo .net{font-weight:800}
  .chip{width:46px;height:46px;font-size:11.5px}
  .acts{flex:1;flex-wrap:nowrap}
  .acts .btn{flex:1;padding:0 6px;font-size:13px;height:44px}
  .spin{flex:1.4;height:44px;padding:0 10px;font-size:15px}
  .toast{bottom:150px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">ROULETTE<small id="tSub">싱글 제로 · 유럽식</small></div>
    <div class="sp"></div>
    <button class="ibtn" id="btnVs" style="display:none">🔥 친구에게 도전</button>
    <button class="ibtn" id="btnHelp">📖 배당표</button>
    <button class="ibtn" id="btnSound">🔊</button>
  </div>

  <div class="hud">
    <div class="stat" id="sBal"><b id="lBal">잔액</b><span id="hBal">₩0</span></div>
    <div class="stat"><b id="lBet">베팅</b><span id="hBet">₩0</span></div>
    <div class="stat"><b id="lLast">지난 결과</b><span id="hLast">-</span></div>
    <div class="stat"><b id="lPeak">최고 잔액</b><span id="hPeak">₩0</span></div>
  </div>

  <div class="main">
    <div class="left">
      <div class="wheelBox" id="wheelMain">
        <canvas id="wheel"></canvas>
        <div class="result" id="result"><div class="n" id="rN">0</div><div class="c" id="rC">GREEN</div></div>
      </div>
      <div class="wheelBox" id="info" style="padding:12px 14px">
        <div class="msg" id="msg"></div>
        <div class="hist"><h4 id="lHist">최근 결과</h4><div class="strip" id="strip"></div></div>
        <div class="stats"><h4 id="lStats">최근 100회 통계</h4><div class="bars" id="bars"></div></div>
      </div>
    </div>

    <div class="right">
      <div class="tableBox"><svg id="table" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="limits"><span id="lMin">칩 최소 ₩50,000 · 베팅 상한 없음</span><span id="lHint">칸 사이 선을 누르면 스플릿·코너 베팅</span></div>
      <div class="dock">
        <div class="dockInfo" id="dockInfo"></div>
        <div class="chips" id="chips"></div>
        <div class="acts">
          <button class="btn" id="bUndo">↶ <span id="tUndo">취소</span></button>
          <button class="btn" id="bClear">✕ <span id="tClear">지우기</span></button>
          <button class="btn" id="bRebet">↻ <span id="tRebet">다시</span></button>
          <button class="btn" id="bDouble">×2</button>
          <button class="spin" id="bSpin">SPIN</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="ov" id="ovHelp"><div class="modal">
  <h3 id="hTitle">배당표</h3>
  <p id="hIntro">숫자 0이 하나뿐인 유럽식 룰렛입니다. 0이 나오면 0이 포함되지 않은 베팅은 모두 집니다. 배당은 원금 제외 금액이에요.</p>
  <table id="payTable"></table>
  <p id="hHow" style="font-size:13px;color:var(--dim)"></p>
  <div class="row"><button class="btn" data-close>확인</button></div>
</div></div>

<div class="ov" id="ovBroke"><div class="modal" style="text-align:center">
  <h3 id="bkTitle">칩이 모두 떨어졌어요</h3>
  <p id="bkBody">최소 베팅 5만 원을 걸 수 없어요. 100만 원으로 다시 시작합니다. 최고 잔액 기록은 그대로 남아요.</p>
  <div class="big" id="bkPeak"></div>
  <div class="row" style="justify-content:center"><button class="spin" id="bkOk" style="height:46px">다시 시작</button></div>
</div></div>

<script>
(function(){
"use strict";
/* ================= 규칙 (싱글 제로) ================= */
const START = 1000000, MIN_CHIP = 50000, MAX_SCORE = 1e15;
const WHEEL = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const REDS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const colorOf = n => n === 0 ? "green" : REDS.has(n) ? "red" : "black";
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);
/** 배당(원금 제외) — 37칸 중 n개 숫자를 덮는 베팅은 36/n − 1 배 */
const payoutOf = nums => 36 / nums.length - 1;
const OUTSIDE = {
  red:   range(1,36).filter(n=>REDS.has(n)),
  black: range(1,36).filter(n=>!REDS.has(n)),
  even:  range(1,36).filter(n=>n%2===0),
  odd:   range(1,36).filter(n=>n%2===1),
  low:   range(1,18), high: range(19,36),
  doz1:  range(1,12), doz2: range(13,24), doz3: range(25,36),
  col1:  range(1,36).filter(n=>n%3===1), col2: range(1,36).filter(n=>n%3===2), col3: range(1,36).filter(n=>n%3===0),
};
/** 승패 정산: bets = {key:{nums,amount}} → 돌려받는 총액(원금 포함) */
function settle(bets, n){
  let back = 0;
  for(const k in bets){ const b = bets[k]; if(b.nums.includes(n)) back += b.amount * (payoutOf(b.nums) + 1); }
  return back;
}
function spinNumber(){
  const a = new Uint32Array(1);
  const lim = Math.floor(4294967296 / 37) * 37; // 모듈로 편향 제거
  do { crypto.getRandomValues(a); } while(a[0] >= lim);
  return a[0] % 37;
}

/* ================= 언어 ================= */
const MG = window.MGH || null;
const EN = MG ? MG.lang === "en" : !/^ko/i.test(navigator.language || "");
const L = (ko,en) => EN ? en : ko;
const won = v => EN ? "₩" + Math.round(v).toLocaleString("en-US") : "₩" + Math.round(v).toLocaleString("ko-KR");
function short(v){ // 칩 위 표기
  if(EN){ if(v>=1e9) return (v/1e9)+"B"; if(v>=1e6) return (v/1e6)+"M"; return (v/1e3)+"K"; }
  if(v>=1e12) return (v/1e12)+"조"; if(v>=1e8) return (v/1e8)+"억"; if(v>=1e7) return (v/1e7)+"천만"; return (v/1e4)+"만";
}
function shortAny(v){ // 테이블 위 칩 금액 (임의 금액)
  const f = x => (Math.round(x*10)/10).toString();
  if(EN){ if(v>=1e12) return f(v/1e12)+"T"; if(v>=1e9) return f(v/1e9)+"B"; if(v>=1e6) return f(v/1e6)+"M"; return f(v/1e3)+"K"; }
  if(v>=1e12) return f(v/1e12)+"조"; if(v>=1e8) return f(v/1e8)+"억"; if(v>=1e4) return f(v/1e4)+"만"; return String(v);
}
const COLOR_NAME = {red:L("레드","RED"), black:L("블랙","BLACK"), green:L("제로","ZERO")};

/* ================= 상태 ================= */
const KEY = "mgh:roulette:v1";
let S = { bal: START, peak: START, hist: [], last: null, spins: 0, restarts: 0, sound: true };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && typeof s.bal === "number" && isFinite(s.bal) && s.bal >= 0) S = Object.assign(S, s); } catch(e){}
if(!Array.isArray(S.hist)) S.hist = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let bets = {};       // key → {nums, amount, ax, ay}
let undoStack = [];  // [{key, amount}] (key '*' = 한 번에 여러 개)
let chip = MIN_CHIP;
let spinning = false;
let pending = false; // 스핀 중: S.hist[0] 은 아직 공개 전
const shownHist = () => pending ? S.hist.slice(1) : S.hist;
let hudBal = null, hudBet = null, peakShown = 0; // 스핀 중 HUD 표시값 (결과가 미리 보이지 않게)
const tableTotal = () => Object.values(bets).reduce((s,b)=>s+b.amount,0);

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function tone(freq, dur, type, vol, when){
  if(!S.sound) return; const a = ac(); if(!a) return;
  const t = a.currentTime + (when||0), o = a.createOscillator(), g = a.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol||.08, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx = {
  chip(){ tone(1900,.05,"square",.03); tone(1200,.06,"triangle",.04,.01); },
  tick(){ tone(2400+Math.random()*500,.025,"square",.018); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.07,i*.09)); },
  big(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,"triangle",.08,i*.08)); },
  lose(){ tone(220,.25,"sine",.05); tone(165,.35,"sine",.05,.12); },
  err(){ tone(160,.12,"square",.04); },
};

/* ================= 베팅 테이블 (SVG) ================= */
const SVGNS = "http://www.w3.org/2000/svg";
const svg = $("table");
let V = false; // 세로 배치 (휴대폰)
const HY = .74;  // 세로 배치에서 한 줄 높이
// 숫자 n(1~36)의 위치: 열 c = (n-1)/3, 줄 l = (n-1)%3  (줄 0 = 1·4·7…, 줄 2 = 3·6·9…)
// 격자 좌표 (gc: 0~12 열 방향, gl: 0~3 줄 방향) ↔ 화면 좌표
function g2s(gc, gl){ return V ? [1.5 + gl, (1 + gc)*HY] : [1 + gc, 3 - gl]; }
function s2g(x, y){ return V ? [y/HY - 1, x - 1.5] : [x - 1, 3 - y]; }
const numAt = (c,l) => c*3 + l + 1;
let OUT_RECTS = []; // 바깥 베팅·0 영역 {key,nums,x,y,w,h,label}
function layoutOutside(){
  const R = [];
  if(!V){
    R.push({key:"n:0", nums:[0], x:0, y:0, w:1, h:3, label:"0", fill:"var(--green)"});
    for(let l=0;l<3;l++) R.push({key:"col"+(l+1), nums:OUTSIDE["col"+(l+1)], x:13, y:2-l, w:1, h:1, label:"2:1"});
    for(let d=0;d<3;d++) R.push({key:"doz"+(d+1), nums:OUTSIDE["doz"+(d+1)], x:1+4*d, y:3, w:4, h:.8, label:L(["1st 12","2nd 12","3rd 12"][d],["1st 12","2nd 12","3rd 12"][d])});
    const ev = ["low","even","red","black","odd","high"];
    ev.forEach((k,i)=>R.push({key:k, nums:OUTSIDE[k], x:1+2*i, y:3.8, w:2, h:.8, label:evLabel(k)}));
  } else {
    R.push({key:"n:0", nums:[0], x:1.5, y:0, w:3, h:HY, label:"0", fill:"var(--green)"});
    for(let l=0;l<3;l++) R.push({key:"col"+(l+1), nums:OUTSIDE["col"+(l+1)], x:1.5+l, y:13*HY, w:1, h:.9*HY, label:"2:1"});
    for(let d=0;d<3;d++) R.push({key:"doz"+(d+1), nums:OUTSIDE["doz"+(d+1)], x:.75, y:(1+4*d)*HY, w:.75, h:4*HY, label:["1st 12","2nd 12","3rd 12"][d], rot:true});
    const ev = ["low","even","red","black","odd","high"];
    ev.forEach((k,i)=>R.push({key:k, nums:OUTSIDE[k], x:0, y:(1+2*i)*HY, w:.75, h:2*HY, label:evLabel(k), rot:true}));
  }
  OUT_RECTS = R;
}
function evLabel(k){ return {low:"1-18", high:"19-36", even:L("짝","EVEN"), odd:L("홀","ODD"), red:"◆", black:"◆"}[k]; }
function viewSize(){ return V ? [4.5, 13.9*HY] : [14, 4.6]; }

function el(tag, attrs, parent){ const e=document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
let gCells, gChips, hoverEl;
const cellEls = {}; // 숫자 → rect (당첨 강조용)
function wantV(){ const w = svg.parentElement.clientWidth || window.innerWidth; return w < 520; }
function drawTable(){
  V = wantV();
  layoutOutside();
  const [W,H] = viewSize(), P = .06;
  svg.setAttribute("viewBox", `${-P} ${-P} ${W+2*P} ${H+2*P}`);
  svg.innerHTML = "";
  gCells = el("g", {}, svg);
  for(const k in cellEls) delete cellEls[k];
  // 숫자 칸
  for(let c=0;c<12;c++) for(let l=0;l<3;l++){
    const n = numAt(c,l), x = V ? 1.5+l : 1+c, y = V ? (1+c)*HY : 2-l, h = V ? HY : 1;
    const r = el("rect", {x, y, width:1, height:h, class:"cell", fill:"transparent"}, gCells);
    cellEls[n] = r;
    el("ellipse", {cx:x+.5, cy:y+h/2, rx: V ? .34 : .3, ry:.36*h, fill: REDS.has(n) ? "var(--red)" : "var(--black)"}, gCells);
    el("text", {x:x+.5, y:y+h*.52, "font-size":".38"}, gCells).textContent = n;
  }
  // 바깥 칸
  for(const r of OUT_RECTS){
    const rect = el("rect", {x:r.x, y:r.y, width:r.w, height:r.h, class:"cell", fill: r.fill || "transparent"}, gCells);
    if(r.key === "n:0") cellEls[0] = rect;
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    if(r.key==="red"||r.key==="black"){
      const s = .32, pts = r.rot ? [[cx,cy-s*1.6],[cx+s*.75,cy],[cx,cy+s*1.6],[cx-s*.75,cy]] : [[cx-s*1.6,cy],[cx,cy-s*.75],[cx+s*1.6,cy],[cx,cy+s*.75]];
      el("polygon", {points: pts.map(p=>p.join(",")).join(" "), fill: r.key==="red" ? "var(--red)" : "var(--black)", stroke:"rgba(255,255,255,.5)", "stroke-width":".03"}, gCells);
    } else {
      const t = el("text", {x:cx, y:cy, "font-size": r.key==="n:0" ? ".55" : (r.rot ? ".3" : ".32")}, gCells);
      if(r.rot && r.label.length > 2) t.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
      t.textContent = r.label;

  }
  hoverEl = el("rect", {class:"hover", x:0, y:0, width:0, height:0, rx:.08, style:"display:none"}, svg);
  gChips = el("g", {}, svg);
  // 저장해 둔 격자 좌표로 칩 위치를 다시 계산
  for(const k in bets) bets[k].pos = anchorPos(bets[k]);
  drawChips();
}

/** 화면 좌표 → 베팅 스펙 {key, nums, anchor} */
function hit(x, y){
  const [gc, gl] = s2g(x, y);
  if(gc >= 0 && gc <= 12 && gl >= 0 && gl <= 3){
    const E = .24;
    let c = Math.min(11, Math.floor(gc)), l = Math.min(2, Math.floor(gl));
    const fx = gc - c, fy = gl - l;
    const C = fx < E ? c : fx > 1-E ? c+1 : null;   // 가까운 열 경계 (0~12)
    const Ln = fy < E ? l : fy > 1-E ? l+1 : null;  // 가까운 줄 경계 (0~3)
    const lane = Ln !== null && Ln >= 1 && Ln <= 2, edge0 = Ln === 0;
    if(C !== null && C >= 1 && C <= 11){
      if(lane) return spec("corner", [numAt(C-1,Ln-1), numAt(C-1,Ln), numAt(C,Ln-1), numAt(C,Ln)], C, Ln);
      if(edge0) return spec("six", [0,1,2].flatMap(i=>[numAt(C-1,i), numAt(C,i)]), C, 0);
      return spec("split", [numAt(C-1,l), numAt(C,l)], C, l+.5);
    }
    if(C === 0){
      if(lane) return spec("trio", [0, numAt(0,Ln-1), numAt(0,Ln)], 0, Ln);
      if(edge0) return spec("four", [0,1,2,3], 0, 0);
      return spec("split", [0, numAt(0,l)], 0, l+.5);
    }
    if(lane) return spec("split", [numAt(c,Ln-1), numAt(c,Ln)], c+.5, Ln);
    if(edge0) return spec("street", [numAt(c,0), numAt(c,1), numAt(c,2)], c+.5, 0);
    return spec("n", [numAt(c,l)], c+.5, l+.5);
  }
  for(const r of OUT_RECTS){
    if(x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h)
      return {key:r.key, nums:r.nums, out:true, rect:r};
  }
  return null;
}
function spec(type, nums, ac, al){ nums = nums.slice().sort((a,b)=>a-b); return {key: type+":"+nums.join("-"), nums, ag:[ac, al]}; }
function anchorPos(b){
  if(b.ag) return g2s(b.ag[0], b.ag[1]);
  const r = OUT_RECTS.find(o=>o.key===b.key);
  return r ? [r.x + r.w/2, r.y + r.h/2] : [0,0];
}
function hoverBox(h){
  if(!h){ hoverEl.style.display="none"; return; }
  let xs = [], ys = [];
  if(h.out){ const r=h.rect; xs=[r.x, r.x+r.w]; ys=[r.y, r.y+r.h]; }
  else for(const n of h.nums){
    if(n===0){ const r=OUT_RECTS[0]; xs.push(r.x, r.x+r.w); ys.push(r.y, r.y+r.h); continue; }
    const c=Math.floor((n-1)/3), l=(n-1)%3, x = V?1.5+l:1+c, y = V?(1+c)*HY:2-l; xs.push(x,x+1); ys.push(y,y+(V?HY:1));
  }
  const x0=Math.min(...xs), y0=Math.min(...ys);
  Object.assign(hoverEl.style,{display:""});
  hoverEl.setAttribute("x",x0+.03); hoverEl.setAttribute("y",y0+.03);
  hoverEl.setAttribute("width",Math.max(...xs)-x0-.06); hoverEl.setAttribute("height",Math.max(...ys)-y0-.06);
}
function svgPoint(ev){
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [p.x, p.y];
}

const CHIP_COLORS = [[1e10,"#1d1d1d","#e6c35a"],[1e9,"#0e6f7a"],[1e8,"#c8a038"],[1e7,"#e07a1f"],[5e6,"#7b3fb8"],[1e6,"#202226"],[5e5,"#1f8a4c"],[1e5,"#2557b8"],[5e4,"#c0262f"]];
function chipColor(v){ for(const c of CHIP_COLORS) if(v >= c[0]) return c[1]; return "#c0262f"; }
function drawChips(){
  gChips.innerHTML = "";
  for(const k in bets){
    const b = bets[k], [x,y] = b.pos || anchorPos(b), col = chipColor(b.amount);
    const g = el("g", {class:"chipG", "data-k":k}, gChips);

    t.textContent = shortAny(b.amount);

}

/* ===== 베팅 조작 ===== */
function place(h, amount){
  if(spinning || !h) return;
  if(amount > cash()){ sfx.err(); toast(L("잔액이 부족해요","Not enough balance")); return; }
  const b = bets[h.key] || (bets[h.key] = {key:h.key, nums:h.nums, amount:0, ag:h.ag});
  b.amount += amount; b.pos = anchorPos(b);
  undoStack.push([{key:h.key, amount}]);
  sfx.chip(); drawChips(); refresh();
}
function removeSpot(h){
  if(spinning || !h || !bets[h.key]) return;
  undoStack.push([{key:h.key, amount:-bets[h.key].amount, nums:bets[h.key].nums, ag:bets[h.key].ag}]);
  delete bets[h.key]; drawChips(); refresh();
}
function applyOps(ops, sign){
  for(const o of ops){
    const a = o.amount * sign;
    if(!bets[o.key]){ if(a <= 0) continue; bets[o.key] = {key:o.key, nums:o.nums, amount:0, ag:o.ag}; }
    bets[o.key].amount += a; bets[o.key].pos = anchorPos(bets[o.key]);
    if(bets[o.key].amount <= 0) delete bets[o.key];
  }
}
function undo(){ if(spinning) return; const ops = undoStack.pop(); if(!ops) return; applyOps(ops, -1); drawChips(); refresh(); }
function clearAll(){ if(spinning || !tableTotal()) return; const ops = Object.values(bets).map(b=>({key:b.key, amount:b.amount, nums:b.nums, ag:b.ag})); undoStack.push(ops.map(o=>({...o, amount:-o.amount}))); bets = {}; drawChips(); refresh(); }
function addMany(list){ // list = [{key,nums,ag,amount}]
  const need = list.reduce((s,o)=>s+o.amount,0);
  if(!need) return;
  if(need > cash()){ sfx.err(); toast(L("잔액이 부족해요","Not enough balance")); return; }
  applyOps(list, 1); undoStack.push(list); sfx.chip(); drawChips(); refresh();
}
function rebet(){ if(spinning || !S.last || !S.last.length) return; addMany(S.last.map(o=>({...o}))); }
function double(){ if(spinning || !tableTotal()) return; addMany(Object.values(bets).map(b=>({key:b.key, nums:b.nums, ag:b.ag, amount:b.amount}))); }

let down = null;
svg.addEventListener("pointermove", ev=>{ if(ev.pointerType==="mouse" && !spinning){ const [x,y]=svgPoint(ev); hoverBox(hit(x,y)); } });
svg.addEventListener("pointerleave", ()=>hoverBox(null));
svg.addEventListener("pointerdown", ev=>{ down = {t:Date.now(), x:ev.clientX, y:ev.clientY}; });
svg.addEventListener("pointerup", ev=>{
  if(!down) return; const long = Date.now() - down.t > 550; down = null;
  const [x,y] = svgPoint(ev), h = hit(x,y);
  if(ev.button === 2) return;
  if(long && h && bets[h.key]) { removeSpot(h); return; } // 길게 누르면 그 칸 칩 회수
  place(h, chip);
});
svg.addEventListener("contextmenu", ev=>{ ev.preventDefault(); const [x,y]=svgPoint(ev); removeSpot(hit(x,y)); });

/* ================= 휠 (캔버스) ================= */
const cv = $("wheel"), cx = cv.getContext("2d");
let SZ = 0, wheelImg = null, wAng = 0, ballRel = 0, ballR = 0, ballShow = false;
const SEG = Math.PI*2/37;
function buildWheel(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio||1);
  SZ = Math.round(r.width * dpr) || 600; cv.width = cv.height = SZ;
  const o = document.createElement("canvas"); o.width = o.height = SZ; const g = o.getContext("2d");
  const C = SZ/2, R = SZ*.49;
  g.translate(C, C);
  // 바깥 나무 테
  let gr = g.createRadialGradient(0,0,R*.86,0,0,R); gr.addColorStop(0,"#5a311a"); gr.addColorStop(.5,"#7a4524"); gr.addColorStop(1,"#2a150a");
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,R,0,7); g.fill();
  // 공이 도는 트랙
  gr = g.createRadialGradient(0,0,R*.74,0,0,R*.9); gr.addColorStop(0,"#2b2f2c"); gr.addColorStop(.6,"#4b524c"); gr.addColorStop(1,"#1a1c1a");
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,R*.9,0,7); g.fill();
  g.strokeStyle = "rgba(216,180,90,.8)"; g.lineWidth = SZ*.004; g.beginPath(); g.arc(0,0,R*.9,0,7); g.stroke();
  // 숫자 링 + 포켓
  const r1 = R*.76, r2 = R*.6, r3 = R*.47;
  for(let i=0;i<37;i++){
    const n = WHEEL[i], a0 = -Math.PI/2 + (i-.5)*SEG, a1 = a0 + SEG;
    g.fillStyle = n===0 ? "#118048" : REDS.has(n) ? "#b3202a" : "#141518";
    g.beginPath(); g.arc(0,0,r1,a0,a1); g.arc(0,0,r3,a1,a0,true); g.closePath(); g.fill();
    // 포켓 바닥은 조금 어둡게
    g.fillStyle = "rgba(0,0,0,.28)"; g.beginPath(); g.arc(0,0,r2,a0,a1); g.arc(0,0,r3,a1,a0,true); g.closePath(); g.fill();
    // 숫자
    g.save(); g.rotate(i*SEG); g.fillStyle = "#fff"; g.font = `800 ${Math.round(R*.085)}px system-ui,sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(n), 0, -(r1+r2)/2); g.restore();
  }
  // 칸막이(프렛)
  g.strokeStyle = "#e7cf86"; g.lineWidth = SZ*.0045;
  for(let i=0;i<37;i++){ const a = -Math.PI/2 + (i-.5)*SEG; g.beginPath(); g.moveTo(Math.cos(a)*r3, Math.sin(a)*r3); g.lineTo(Math.cos(a)*r1, Math.sin(a)*r1); g.stroke(); }
  [r1, r2, r3].forEach((rr,i)=>{ g.lineWidth = SZ*(i===1?.003:.006); g.beginPath(); g.arc(0,0,rr,0,7); g.stroke(); });
  // 가운데 콘
  gr = g.createRadialGradient(-r3*.3,-r3*.3,r3*.1,0,0,r3); gr.addColorStop(0,"#8a5a32"); gr.addColorStop(.7,"#4a2a16"); gr.addColorStop(1,"#2a160b");
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,r3*.97,0,7); g.fill();
  // 터릿 (십자 손잡이)
  g.fillStyle = "#e7cf86"; g.strokeStyle = "#8a6a28"; g.lineWidth = SZ*.003;
  for(let k=0;k<4;k++){ g.save(); g.rotate(k*Math.PI/2); g.beginPath(); g.roundRect ? g.roundRect(-R*.022, -r3*.72, R*.044, r3*.72, R*.02) : g.rect(-R*.022,-r3*.72,R*.044,r3*.72); g.fill(); g.stroke();
    g.beginPath(); g.arc(0,-r3*.72,R*.035,0,7); g.fill(); g.stroke(); g.restore(); }
  gr = g.createRadialGradient(-R*.03,-R*.03,0,0,0,R*.1); gr.addColorStop(0,"#fff4c8"); gr.addColorStop(1,"#a8822e");
  g.fillStyle = gr; g.beginPath(); g.arc(0,0,R*.09,0,7); g.fill();
  wheelImg = o;
}
const TRACK = .415, POCKET = .265; // 공 반지름 위치 (SZ 비율)
function drawWheel(){
  if(!wheelImg) return;
  const C = SZ/2; cx.clearRect(0,0,SZ,SZ);
  cx.save(); cx.translate(C,C); cx.rotate(wAng); cx.drawImage(wheelImg, -C, -C); cx.restore();
  // 테 위쪽 하이라이트
  const gl = cx.createLinearGradient(0,0,0,SZ); gl.addColorStop(0,"rgba(255,255,255,.07)"); gl.addColorStop(.5,"rgba(255,255,255,0)");
  cx.fillStyle = gl; cx.beginPath(); cx.arc(C,C,SZ*.49,0,7); cx.fill();
  if(ballShow){
    const a = wAng + ballRel - Math.PI/2, rr = ballR*SZ, x = C + Math.cos(a)*rr, y = C + Math.sin(a)*rr, br = SZ*.019;
    cx.fillStyle = "rgba(0,0,0,.35)"; cx.beginPath(); cx.arc(x+br*.25, y+br*.35, br, 0, 7); cx.fill();
    const g = cx.createRadialGradient(x-br*.35,y-br*.35,br*.1,x,y,br); g.addColorStop(0,"#fff"); g.addColorStop(.6,"#e9ece9"); g.addColorStop(1,"#9aa09c");
    cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,br,0,7); cx.fill();
  }
}
// 쉬는 동안에도 휠은 천천히 돈다
let lastT = performance.now(), anim = null;
function loop(t){
  const dt = Math.min(.05, (t - lastT)/1000); lastT = t;
  if(anim) anim(t); else wAng += dt*.25;
  drawWheel(); requestAnimationFrame(loop);
}
const easeOut = (p,k) => 1 - Math.pow(1-p, k||3);
const mod = (a,m) => ((a % m) + m) % m;

function animateSpin(n, fast){
  return new Promise(res=>{
    const T = fast ? 2600 : 6200, Tl = T*.86, t0 = performance.now();
    const w0 = wAng, wTurn = (fast ? 1.4 : 2.6) * Math.PI*2; // 휠 회전량 (서서히 감속)
    const target = WHEEL.indexOf(n) * SEG;                   // 휠 기준 포켓 각
    const rel0 = ballShow ? ballRel : Math.random()*Math.PI*2;
    const turns = fast ? 4 : 8;
    const B = mod(rel0 - target, Math.PI*2) + turns*Math.PI*2; // 공은 휠 반대 방향으로 B 만큼
    ballShow = true; let lastPocket = -1;
    const jit = (Math.random()-.5)*SEG*.5;
    anim = t => {
      const e = t - t0, p = Math.min(1, e/T);
      wAng = w0 + wTurn*easeOut(p, 2) + e/1000*.25;
      const q = Math.min(1, e/Tl);
      ballRel = rel0 - B*easeOut(q, 3);
      // 반지름: 트랙에서 돌다가 60% 이후 포켓으로 떨어지며 몇 번 튕긴다
      if(q < .55) ballR = TRACK;
      else {
        const d = (q - .55)/.45;
        const bounce = Math.abs(Math.sin(d*Math.PI*3.2)) * (1-d) * .06;
        ballR = TRACK - (TRACK-POCKET)*Math.min(1, d*1.6) + bounce;
        ballRel += Math.sin(d*Math.PI*5) * (1-d) * SEG * .8 + jit*(1-d);
        const pk = Math.floor(mod(ballRel + SEG/2, Math.PI*2)/SEG);
        if(pk !== lastPocket){ if(lastPocket >= 0 && d < .9) sfx.tick(); lastPocket = pk; }
      }
      if(q >= 1){ ballRel = target; ballR = POCKET; }
      if(p >= 1){ anim = null; res(); }
    };
  });
}

let bws = null;
function buildWheelSoon(){ // 오버레이로 처음 보일 때 캔버스 크기를 다시 잡는다
  const r = cv.getBoundingClientRect(); if(r.width > 0 && Math.abs(Math.round(r.width*Math.min(2.5,devicePixelRatio||1)) - SZ) > 4) buildWheel();
}
/* ================= 스핀 ================= */
let fastSpin = false;
async function spin(){
  if(spinning) return;
  const total = tableTotal();
  if(!total){ sfx.err(); toast(L("먼저 칩을 올려주세요","Place a chip first")); return; }
  ac();
  document.body.classList.add("showWheel"); buildWheelSoon();
  spinning = true; hudBal = S.bal - total; hudBet = total; hoverBox(null); refresh();
  $("result").classList.remove("show"); $("msg").innerHTML = `<span style="color:var(--dim)">${L("No more bets — 공이 돌고 있어요","No more bets — ball is spinning")}</span>`;
  const n = spinNumber();
  const snapshot = Object.values(bets).map(b=>({key:b.key, nums:b.nums, ag:b.ag, amount:b.amount}));
  const back = settle(bets, n);
  // 결과는 바로 저장 (도중에 새로고침해도 결과가 바뀌지 않게)
  const before = S.bal;
  S.bal = S.bal - total + back; S.last = snapshot; S.spins++;
  S.hist.unshift(n); if(S.hist.length > 100) S.hist.length = 100;
  peakShown = S.peak;
  const newPeak = S.bal > S.peak; if(newPeak) S.peak = S.bal;
  pending = true; save();
  await animateSpin(n, fastSpin);
  reveal(n, total, back, before, newPeak);
}
function reveal(n, total, back, before, newPeak){
  pending = false;
  const col = colorOf(n);
  $("rN").textContent = n; $("rC").textContent = COLOR_NAME[col];
  $("result").className = "result show r-" + col;
  if(cellEls[n]){ cellEls[n].classList.remove("winCell"); void cellEls[n].getBBox(); cellEls[n].classList.add("winCell"); }
  // 칩 처리: 이긴 칸은 반짝, 진 칸은 사라짐
  for(const g of gChips.querySelectorAll(".chipG")){
    const b = bets[g.dataset.k]; if(!b) continue;
    g.classList.add(b.nums.includes(n) ? "won" : "lost");
  }
  const net = back - total; lastNet = net;
  const m = $("msg");
  if(back > 0){
    m.innerHTML = `<span class="win">${L("당첨","WIN")} ${won(back)}</span><small>${L("순이익","Net")} ${net>=0?"+":""}${won(net)} · ${L("베팅","Bet")} ${won(total)}</small>`;
    (back >= total*10 ? sfx.big : sfx.win)();
  } else {
    m.innerHTML = `<span class="lose">−${won(total)}</span><small>${n} ${COLOR_NAME[col]} · ${L("다음엔 터질 거예요","Next one's yours")}</small>`;
    sfx.lose();
  }
  if(newPeak) setTimeout(()=>toast(L("🏆 최고 잔액 갱신! ","🏆 New peak! ") + won(S.peak)), 700);
  const sb = $("sBal"); sb.classList.remove("flash-up","flash-dn"); void sb.offsetWidth; sb.classList.add(S.bal >= before ? "flash-up" : "flash-dn");
  hudBal = S.bal; hudBet = 0;
  submit();
  setTimeout(()=>{
    bets = {}; undoStack = []; spinning = false; hudBal = hudBet = null;
    document.body.classList.remove("showWheel");
    drawChips(); refresh(); renderHist();
    if(S.bal < MIN_CHIP) openBroke();
  }, V ? 2300 : 1500);
  refreshHud(); renderHist(); dockInfo();
}

/* ================= 랭킹 · 도전 ================= */
function submit(){
  // 잔액이 시작 금액(100만 원) 이상일 때만 등록. 보드는 사용자별 최고 기록만 남는다.
  if(MG && MG.submitScore && S.bal >= START) MG.submitScore("roulette", Math.min(MAX_SCORE, Math.floor(S.bal)), {spins:S.spins}, {debounce:2000});
}
function openVs(){
  if(!(MG && MG.result) || S.peak <= START) return;
  MG.result.open({
    board:"roulette", score:Math.min(MAX_SCORE, Math.floor(S.peak)), fmt:v=>won(v),
    game:"ROULETTE", icon:"🎡", accent:"#d8b45a",
    label:L("내 최고 잔액","MY PEAK BALANCE"), friend:L("친구","Friend"), question:L("누가 더 크게 따나?","Who wins bigger?"),
    sub:L(`싱글 제로 룰렛 · ${S.spins.toLocaleString()}스핀`, `Single-zero roulette · ${S.spins.toLocaleString()} spins`),
    meta:{spins:S.spins},
    shareText:L(`🎡 룰렛 100만 원으로 시작해서 최고 ${won(S.peak)}까지! 누가 더 크게 따나 대결하자`, `🎡 Started roulette with ₩1,000,000 and peaked at ${won(S.peak)}. Who wins bigger?`)
  });
}
function openBroke(){
  $("bkPeak").textContent = L("최고 잔액 ","Peak ") + won(S.peak);
  $("ovBroke").classList.add("open");
}
$("bkOk").onclick = ()=>{
  $("ovBroke").classList.remove("open");
  S.bal = START; S.restarts++; save(); refresh();
  toast(L("100만 원으로 다시 시작!","Back to ₩1,000,000!"));
  if(S.peak > START) openVs();
};
$("btnVs").onclick = openVs;

/* ================= 화면 갱신 ================= */
const CHIP_VALUES = [5e4,1e5,5e5,1e6,5e6,1e7,1e8,1e9,1e10,1e11];
let chipKey = "";
function renderChips(){
  const c = cash();
  let list = CHIP_VALUES.filter(v => v <= Math.max(S.bal, MIN_CHIP));
  if(list.length > 7) list = list.slice(-7);
  const key = list.join(",");
  if(key !== chipKey){
    chipKey = key;
    if(!list.includes(chip)) chip = list.filter(v=>v<=c).pop() || list[0];
    $("chips").innerHTML = list.map(v=>`<button class="chip" data-v="${v}" style="--c:${chipColor(v)}"><span>${short(v)}</span></button>`).join("");
  }
  for(const b of $("chips").children){ const v = +b.dataset.v; b.classList.toggle("sel", v===chip); b.disabled = spinning || v > c; }
}
$("chips").addEventListener("click", ev=>{ const b = ev.target.closest(".chip"); if(!b || b.disabled) return; chip = +b.dataset.v; sfx.chip(); renderChips(); });
function refreshHud(){
  $("hBal").textContent = won(hudBal !== null ? hudBal : cash());
  $("hBet").textContent = won(hudBet !== null ? hudBet : tableTotal());
  $("hPeak").textContent = won(pending ? peakShown : S.peak);
  const n = shownHist()[0];
  $("hLast").innerHTML = n === undefined ? "-" : `<span style="color:${n===0?"#3fd38a":REDS.has(n)?"#ff6b74":"#e8e8e8"}">${n} ${COLOR_NAME[colorOf(n)]}</span>`;
}
let lastNet = null;
function dockInfo(){
  const n = shownHist()[0], bal = hudBal !== null ? hudBal : cash(), bet = hudBet !== null ? hudBet : tableTotal();
  $("dockInfo").innerHTML = `<span>${L("잔액","Bal")} <b>${won(bal)}</b></span><span>${L("베팅","Bet")} <b>${won(bet)}</b></span><span class="sp"></span>`
    + (n === undefined ? "" : `${lastNet !== null && !pending ? `<span class="net" style="color:${lastNet>=0?"var(--ok)":"var(--bad)"}">${lastNet>=0?"+":"−"}${shortAny(Math.abs(lastNet))}</span>` : ""}<i class="r-${colorOf(n)}">${n}</i>`);
}
function refresh(){
  refreshHud(); renderChips(); dockInfo();
  const has = tableTotal() > 0;
  $("bSpin").disabled = spinning || !has;
  $("bUndo").disabled = spinning || !undoStack.length;
  $("bClear").disabled = spinning || !has;
  $("bDouble").disabled = spinning || !has || tableTotal() > cash();
  $("bRebet").disabled = spinning || !S.last || !S.last.length || has;
  $("btnVs").style.display = (MG && MG.result && S.peak > START) ? "" : "none";
}
function renderHist(){
  const h = shownHist();
  $("strip").innerHTML = h.length ? h.slice(0,18).map(n=>`<i class="r-${colorOf(n)}">${n}</i>`).join("") : `<span class="empty">${L("아직 결과가 없어요","No spins yet")}</span>`;
  const cnt = f => h.filter(f).length, tot = h.length || 1;
  const rows = [
    [[cnt(n=>REDS.has(n)),"var(--red)",L("레드","Red")],[cnt(n=>n===0),"var(--green)","0"],[cnt(n=>n&&!REDS.has(n)),"#2a2c32",L("블랙","Black")]],
    [[cnt(n=>n&&n%2),"#3a5a8a",L("홀","Odd")],[cnt(n=>n===0),"var(--green)","0"],[cnt(n=>n&&n%2===0),"#6a4a8a",L("짝","Even")]],
    [[cnt(n=>n>=1&&n<=18),"#4a6a4a","1-18"],[cnt(n=>n===0),"var(--green)","0"],[cnt(n=>n>=19),"#7a5a3a","19-36"]],
  ];
  $("bars").innerHTML = h.length ? rows.map(r=>`<div class="bar">${r.map(([c,bg,lb])=>`<div style="flex:0 0 ${c/tot*100}%;background:${bg}">${c/tot>=.12?lb+" "+Math.round(c/tot*100)+"%":""}</div>`).join("")}</div>`).join("") : "";
}

/* ================= 배당표 ================= */
function fillHelp(){
  const rows = [
    [L("스트레이트 (숫자 1개)","Straight up (1 number)"),"35 : 1"],
    [L("스플릿 (2개, 칸 사이 선)","Split (2, on a line)"),"17 : 1"],
    [L("스트리트 (가로 3개, 줄 끝)","Street (3, row edge)"),"11 : 1"],
    [L("트리오 (0·1·2 / 0·2·3)","Trio (0-1-2 / 0-2-3)"),"11 : 1"],
    [L("코너 (4개, 교차점)","Corner (4, intersection)"),"8 : 1"],
    [L("퍼스트 포 (0·1·2·3)","First four (0-1-2-3)"),"8 : 1"],

    [L("더즌 · 컬럼 (12개)","Dozen · Column (12)"),"2 : 1"],

  $("payTable").innerHTML = rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
}

  document.title = L("룰렛 - 미니게임천국","Roulette - Mini Game Heaven");
  $("tSub").textContent = L("싱글 제로 · 유럽식","SINGLE ZERO · EUROPEAN");
  $("lBal").textContent = L("잔액","Balance"); $("lBet").textContent = L("베팅","On table");
  $("lLast").textContent = L("지난 결과","Last"); $("lPeak").textContent = L("최고 잔액","Peak");
  $("lHist").textContent = L("최근 결과","Recent"); $("lStats").textContent = L("최근 100회 통계","Last 100 spins");
  $("lMin").textContent = L("칩 최소 ₩50,000 · 베팅 상한 없음","Min chip ₩50,000 · no table max");
  $("lHint").textContent = L("선 위를 누르면 스플릿·코너 · 길게 누르거나 우클릭하면 회수","Tap a line for splits/corners · long-press or right-click to remove");
  $("tUndo").textContent = L("취소","Undo"); $("tClear").textContent = L("지우기","Clear"); $("tRebet").textContent = L("다시","Rebet");
  $("btnHelp").textContent = L("📖 배당표","📖 Payouts");
  $("btnVs").textContent = L("🔥 친구에게 도전","🔥 Challenge");
  $("hTitle").textContent = L("배당표","Payouts");
  $("hIntro").textContent = L("숫자 0이 하나뿐인 유럽식 룰렛입니다(37칸). 0이 나오면 0을 포함하지 않은 베팅은 모두 집니다. 배당은 원금을 제외한 금액이에요.","European roulette with a single zero (37 pockets). When 0 hits, every bet that doesn't cover 0 loses. Payouts exclude your stake.");
  $("hHow").textContent = L("칩을 고르고 칸을 누르면 베팅됩니다. 숫자 사이 선은 스플릿, 네 칸이 만나는 점은 코너, 숫자판 아래(세로 화면은 왼쪽) 가장자리는 스트리트·식스 라인이에요. 잔액이 100만 원 이상이면 로그인한 계정의 최고 잔액이 랭킹에 기록됩니다. Space = 스핀, Ctrl+Z = 취소.","Pick a chip and tap a spot. Lines between numbers are splits, intersections are corners, and the outer edge of the number grid gives streets and six lines. While your balance is ₩1,000,000 or more, your peak is recorded on the leaderboard when signed in. Space = spin, Ctrl+Z = undo.");
  document.querySelector("[data-close]").textContent = L("확인","OK");
  $("bkTitle").textContent = L("칩이 모두 떨어졌어요","Out of chips");
  $("bkBody").textContent = L("최소 베팅 5만 원을 걸 수 없어요. 100만 원으로 다시 시작합니다. 최고 잔액 기록은 그대로 남아요.","You can't cover the ₩50,000 minimum. Start again with ₩1,000,000 — your peak record stays.");
  $("bkOk").textContent = L("다시 시작","Start again");
  $("btnSound").textContent = S.sound ? "🔊" : "🔇";
}
$("bSpin").onclick = spin;
$("bUndo").onclick = undo;
$("bClear").onclick = clearAll;
$("bRebet").onclick = rebet;
$("bDouble").onclick = double;
$("btnHelp").onclick = ()=>$("ovHelp").classList.add("open");
for(const o of document.querySelectorAll(".ov")) o.addEventListener("click", ev=>{ if(ev.target===o || ev.target.hasAttribute("data-close")) if(o.id!=="ovBroke") o.classList.remove("open"); });
$("btnSound").onclick = ()=>{ S.sound = !S.sound; save(); texts(); };
$("btnSound").addEventListener("dblclick", ()=>{ fastSpin = !fastSpin; toast(fastSpin ? L("빠른 스핀 켜짐","Fast spin on") : L("빠른 스핀 꺼짐","Fast spin off")); });
document.addEventListener("keydown", ev=>{
  if(ev.target && /input|textarea/i.test(ev.target.tagName)) return;
  if(ev.code === "Space"){ ev.preventDefault(); spin(); }
  else if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="z"){ ev.preventDefault(); undo(); }
  else if(ev.key === "f" || ev.key === "F"){ fastSpin = !fastSpin; toast(fastSpin ? L("빠른 스핀 켜짐 (F)","Fast spin on (F)") : L("빠른 스핀 꺼짐 (F)","Fast spin off (F)")); }
});
let rz; const onResize = ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(wantV() !== V) drawTable(); buildWheelSoon(); }, 80); };
window.addEventListener("resize", onResize);
if(window.ResizeObserver){ new ResizeObserver(onResize).observe(svg.parentElement); new ResizeObserver(onResize).observe(cv); }

/* ================= 시작 ================= */
texts(); fillHelp(); drawTable(); buildWheel(); refresh(); renderHist();
if(S.hist.length){ ballShow = true; ballR = POCKET; ballRel = WHEEL.indexOf(S.hist[0]) * SEG; }
requestAnimationFrame(loop);
if(S.bal < MIN_CHIP) openBroke();
submit(); // 이 브라우저의 지금 잔액이 100만 원 이상이면 로그인 후에도 등록되게

// 테스트용
window.__rl = { settle, payoutOf, OUTSIDE, WHEEL, REDS, hit:(x,y)=>hit(x,y), state:()=>S, bets:()=>bets, setFast:v=>{fastSpin=v;} };
})();
