<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Show Korea — point, show, done</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1d2433;--dim:#6b7383;--line:#e7e1d8;--bg:#f6f3ee;--card:#fff;--red:#d8432f;--blue:#2753c9;--soft:#fbf8f3}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Hiragino Sans','PingFang SC',sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top))}
[hidden]{display:none!important}
.ico{width:48px;height:48px;background:url(/games/korea-kit/icons.webp) 0 0/900% 100% no-repeat;flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.3px}.brand b{color:var(--red)}
.langs{display:flex;background:#ebe5db;border-radius:999px;padding:3px}
.langs button{border:0;background:none;font:inherit;font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px;color:var(--dim);cursor:pointer}
.langs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
h1{font-size:26px;line-height:1.25;font-weight:900;margin:6px 0 6px;letter-spacing:-.4px}
.sub{color:var(--dim);font-size:14.5px;line-height:1.5;margin-bottom:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ico{width:56px;height:56px}
.tile b{font-size:18px}.tile small{color:var(--dim);font-size:12.5px;font-weight:600}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.back{border:0;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--blue);cursor:pointer;padding:6px 0}
.shead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.shead h2{font-size:24px;font-weight:900}
.sec{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;margin:18px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ph:active{background:var(--soft)}
.ph .t{flex:1;min-width:0}.ph .t b{display:block;font-size:16.5px;line-height:1.35}.ph .t span{display:block;color:var(--dim);font-size:14px;margin-top:3px}
.star{border:0;background:none;font-size:20px;color:#d6cfc3;cursor:pointer;padding:4px}.star.on{color:#f2b01e}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer}
.dest b{display:block;font-size:14.5px}.dest span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.own{display:flex;gap:8px;margin-top:8px}
.own textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;font-size:14px;resize:none;height:48px;background:#fff}
.own button,.go{border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-weight:800;padding:0 16px;cursor:pointer}
.note{background:#fff4e8;border:1px solid #f2d6b3;color:#8a4b12;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:6px}
.aff{margin-top:22px;border:1px dashed #cfc6b8;border-radius:16px;padding:13px;font-size:13px;color:var(--dim);display:flex;gap:10px;align-items:center}
.aff .ico{width:36px;height:36px}
/* 보여주기 화면 */
#show{position:fixed;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom))}
#show .bar{display:flex;justify-content:space-between;align-items:center}
#show .bar button{border:0;background:#f1ede6;border-radius:999px;font:inherit;font-weight:800;font-size:14px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding:10px 0}
.to{font-size:15px;font-weight:800;color:var(--red);letter-spacing:.3px}
.ko{font-size:clamp(34px,10vw,60px);font-weight:900;line-height:1.25;word-break:keep-all;letter-spacing:-.5px}
.mine{font-size:16px;color:var(--dim);line-height:1.4}
.speak{align-self:center;display:flex;align-items:center;gap:6px;border:0;background:#eef2fd;color:var(--blue);border-radius:999px;padding:8px 16px 8px 8px;font:inherit;font-weight:800;cursor:pointer}
.speak .ico{width:28px;height:28px}
.reply{border-top:1px solid var(--line);padding-top:12px}
.reply p{font-size:13px;color:var(--dim);font-weight:700;text-align:center;margin-bottom:9px}
.rbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rbtns button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 2px;font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;word-break:keep-all}
.ans{background:var(--ink);color:#fff;border-radius:18px;padding:16px;text-align:center;margin-bottom:12px}
.ans small{display:block;font-size:12px;opacity:.7;margin-bottom:4px}.ans b{font-size:24px}
#show.land .stage{transform:rotate(90deg)}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">Show <b>Korea</b></div><div class="langs" id="langs"></div></div>
  <section id="home">
    <h1 id="hTitle"></h1><p class="sub" id="hSub"></p>
    <div class="tiles" id="tiles"></div>
  </section>
  <section id="sit" hidden>
    <button class="back" id="back"></button>
    <div class="shead"><div class="ico" id="sIco"></div><h2 id="sTitle"></h2></div>
    <div id="sBody"></div>
  </section>
</div>
<div id="show" hidden>
  <div class="bar"><button id="close">✕</button><button id="rot">⟳</button></div>
  <div class="stage"><div class="to" id="to"></div><div class="ko" id="ko"></div><div class="mine" id="mine"></div><button class="speak" id="speak"><span class="ico" style="background-position:62.5% 0"></span><span id="speakT"></span></button></div>
  <div id="ans" class="ans" hidden><small id="ansS"></small><b id="ansB"></b></div>
  <div class="reply"><p id="replyP"></p><div class="rbtns" id="rbtns"></div></div>
</div>
<script>

function show(ko, mine, dest) {
  const u = UI[lang]; $('show').hidden = false; $('show').classList.remove('land'); $('ans').hidden = true;
  $('to').textContent = dest ? '목적지 · ' + u.go.replace('→ ', '') : '안녕하세요 · ' + u.to;
  $('ko').textContent = dest ? ko + ro(ko) + ' 가 주세요' : ko; $('mine').textContent = mine; $('speakT').textContent = u.say; $('replyP').textContent = u.reply;
  const rb = $('rbtns'); rb.innerHTML = '';
  for (const r of REPLY) { const b = document.createElement('button'); b.textContent = r[0]; b.onclick = () => { $('ans').hidden = false; $('ansS').textContent = r[0]; $('ansB').textContent = r[LI[lang]]; }; rb.append(b); }
}
$('speak').onclick = () => { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance($('ko').textContent); m.lang = 'ko-KR'; m.rate = 0.9; speechSynthesis.speak(m); };
$('close').onclick = () => { $('show').hidden = true; speechSynthesis && speechSynthesis.cancel(); };
$('rot').onclick = () => $('show').classList.toggle('land');
$('back').onclick = () => { cur = null; $('sit').hidden = true; $('home').hidden = false; };
render();
</script>
</body>
</html>
