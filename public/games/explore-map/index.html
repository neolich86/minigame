<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>탐험 지도 - 미니게임천국</title>
<meta name="description" content="지하철역·버스정류장에서 체크인하면 안개가 걷히며 실제 지도가 밝혀지는 탐험 게임. 서울·인천·경기 탐험률에 도전하세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a2e'/%3E%3Cpath d='M32 10c-9 0-16 7-16 16 0 12 16 28 16 28s16-16 16-28c0-9-7-16-16-16z' fill='%23f2c14e'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%23101a2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<script src="vendor/leaflet-1.9.4.js"></script>

<style>
:root{--bg:#0d1526;--panel:rgba(13,21,38,.94);--line:rgba(255,255,255,.1);--ink:#eef2fb;--dim:#9aa7c2;--gold:#f2c14e;--teal:#4fd1c5;--sub:#6ea8ff;--bus:#7ee2a2;--bad:#ff7b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none !important}
#map{position:absolute;inset:0;background:#cdd6e3}
.leaflet-container{font:inherit}
#fog{position:absolute;left:0;top:0;pointer-events:none}
.top{position:absolute;left:10px;right:10px;top:10px;z-index:1000;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}
.brand b{display:block;font-size:15px;letter-spacing:.5px}
.brand small{color:var(--dim);font-size:11.5px}
.brand .pct{color:var(--gold);font-weight:800}
.sp{flex:1}
.ibtn{height:38px;min-width:38px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ibtn.gold{background:var(--gold);color:#1d1503;border-color:transparent}
.save{font-size:11px;color:var(--dim);padding:0 10px}
.fab{position:absolute;right:12px;z-index:1000;width:46px;height:46px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab.on{color:var(--teal);border-color:var(--teal)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);max-height:46%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);transition:max-height .2s}
#sheet.min{max-height:118px}
.grab{display:flex;justify-content:center;padding:8px 0 2px;cursor:pointer}
.grab i{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.tabs{display:flex;gap:4px;padding:2px 12px 8px}
.tab{flex:1;height:34px;border-radius:10px;font-size:13px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.04)}
.tab.on{color:var(--ink);background:rgba(255,255,255,.12)}
.body{overflow:auto;padding:0 14px 14px}
.gps{font-size:12.5px;color:var(--dim);padding:2px 2px 8px;display:flex;gap:8px;align-items:center}
.gps .dot{width:8px;height:8px;border-radius:50%;background:#666}
.gps.ok .dot{background:var(--bus);box-shadow:0 0 0 4px rgba(126,226,162,.18)}
.gps.warn .dot{background:var(--gold)}
.gps.bad .dot{background:var(--bad)}
.stop{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.ic.s{background:rgba(110,168,255,.18)}.ic.t{background:rgba(242,193,78,.2)}.ic.b{background:rgba(126,226,162,.16)}
.stop .nm{flex:1;min-width:0}
.stop .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .nm small{color:var(--dim);font-size:12px}
.cbtn{height:34px;padding:0 14px;border-radius:10px;background:var(--gold);color:#1d1503;font-weight:800;font-size:13px;flex:none}
.cbtn[disabled]{background:rgba(255,255,255,.08);color:var(--dim);cursor:default}
.done{color:var(--gold);font-size:12px;font-weight:700;flex:none}
.empty{color:var(--dim);font-size:13px;line-height:1.6;padding:6px 2px 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px}
.stat small{color:var(--dim);font-size:11.5px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
.reg{margin:8px 0 12px}
.reg .row{display:flex;justify-content:space-between;font-size:13px;margin-top:9px}
.reg .row span:last-child{color:var(--gold);font-weight:700}
h4{margin:12px 0 4px;font-size:13px;color:var(--dim);font-weight:700}
.dl .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 6px;text-align:center;opacity:.38}
.bd.on{opacity:1;background:rgba(242,193,78,.12);outline:1px solid rgba(242,193,78,.35)}
.bd .e{font-size:24px}
.bd b{display:block;font-size:12px;margin-top:4px}
.bd small{color:var(--dim);font-size:10.5px}
#intro{position:absolute;inset:0;z-index:2000;background:rgba(8,12,22,.82);display:flex;align-items:center;justify-content:center;padding:20px}
#intro .card{max-width:380px;background:#121c33;border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#intro h1{margin:6px 0 8px;font-size:22px}
#intro p{color:var(--dim);font-size:14px;line-height:1.65;margin:0 0 16px}
#intro ul{text-align:left;color:var(--ink);font-size:13.5px;line-height:1.7;padding-left:18px;margin:0 0 18px}
#intro .big{width:100%;height:48px;border-radius:14px;background:var(--gold);color:#1d1503;font-weight:800;font-size:15px}
#intro .ghost{margin-top:10px;color:var(--dim);font-size:13px;text-decoration:underline}
#toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-20px);z-index:2100;background:#16223d;border:1px solid rgba(242,193,78,.4);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;color:var(--gold);font-weight:700;font-size:12px;margin-top:2px}
.me{width:18px;height:18px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,255,.25)}
.leaflet-popup-content-wrapper{background:#121c33;color:var(--ink);border-radius:14px}
.leaflet-popup-tip{background:#121c33}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
.pop b{font-size:14.5px}
.pop small{color:var(--dim)}
.pop .cbtn{margin-top:8px;width:100%}
.leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
.leaflet-control-attribution{font-size:10px}
#shareModal{position:absolute;inset:0;z-index:2050;background:rgba(6,10,20,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#shareModal[hidden]{display:none}
#shareModal .card{width:100%;max-width:420px;background:#121c33;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:100%;overflow:auto}
#shareModal h3{margin:0 0 10px;font-size:17px}
#shareModal .prev{width:100%;aspect-ratio:1200/630;border-radius:12px;background:#0b1222;object-fit:cover;display:block}
#shareModal label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 6px}
#shareModal input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.sbtn{width:100%;height:46px;border-radius:12px;font-weight:800;font-size:15px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.sbtn.kakao{background:#fee500;color:#191600}
.sbtn.alt{background:rgba(255,255,255,.08)}
.sbtn.close{background:none;color:var(--dim);font-weight:600;font-size:13.5px;height:36px}
.invite{background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;margin:0 0 14px;text-align:left}
@media (min-width:900px){
  #sheet{left:12px;right:auto;bottom:12px;width:380px;border-radius:18px;max-height:calc(100% - 90px);border:1px solid var(--line)}
  #sheet.min{max-height:118px}
  .fab{bottom:24px !important}
}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fog"></canvas>

<div class="top">
  <div class="brand">
    <b id="title">🧭 탐험 지도</b>
    <small><span id="hdCells">0</span> · <span id="hdPct" class="pct">0%</span></small>
  </div>
  <div class="sp"></div>
  <span class="save" id="save"></span>
  <button class="ibtn gold" id="shareBtn">📣</button>
  <button class="ibtn" id="loginBtn" hidden></button>
</div>

<button class="fab" id="locBtn" style="bottom:calc(46% + 12px)" aria-label="내 위치">📍</button>

<div id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="tabs">
    <button class="tab on" data-t="near"></button>
    <button class="tab" data-t="stats"></button>
    <button class="tab" data-t="badges"></button>
  </div>
  <div class="body" id="body"></div>
</div>

<div id="intro">
  <div class="card">
    <div style="font-size:42px">🧭</div>
    <h1 id="inTitle"></h1>
    <p id="inDesc"></p>
    <ul id="inList"></ul>
    <button class="big" id="startBtn"></button>
    <div><button class="ghost" id="browseBtn"></button></div>
  </div>
</div>
<div id="toast"></div>
<div id="shareModal" hidden>
  <div class="card">
    <h3 id="shTitle"></h3>
    <img class="prev" id="shImg" alt="">
    <label for="shName" id="shNameLbl"></label>
    <input id="shName" maxlength="12" autocomplete="nickname">
    <button class="sbtn kakao" id="shKakao" hidden></button>
    <button class="sbtn alt" id="shNative" hidden></button>
    <button class="sbtn alt" id="shCopy"></button>
    <button class="sbtn close" id="shClose"></button>
  </div>
</div>

<script>
'use strict';
const MG = window.MGH || null;
const L_ = (ko, en) => (MG && MG.L ? MG.L(ko, en) : ko);
const $ = (id) => document.getElementById(id);
const RES = 10;               // H3 해상도 — 한 칸 약 0.01km²
const CELL_KM2 = 0.0104;      // 수도권 위도에서 res10 한 칸 넓이
const STOP_Z = 14;
const RADIUS = { s: 1000, t: 1500, b: 500, bRural: 800 };
const DAY_BONUS = 1.5;        // 그날 첫 체크인은 반경 1.5배
const TRAIL_MAX_ACC = 60;     // 걸으며 밝히기: 이 정확도 이하일 때만
const TRAIL_MAX_KMH = 30;     // 차·지하철로 이동할 땐 경로를 밝히지 않음
const RANGE = { s: 300, t: 300, b: 150 };   // 체크인 가능 거리
const MAX_ACC = 200;          // 위치 정확도가 이보다 나쁘면 체크인 불가
const MAX_KMH = 350;
const LS = 'mgh:explore:v1';
const REGION = { s: 36.85, w: 124.5, n: 38.35, e: 127.9 };
const SIDO = { '11': L_('서울', 'Seoul'), '23': L_('인천', 'Incheon'), '31': L_('경기', 'Gyeonggi') };

/* ---------- 상태 ---------- */
let state = { v: 1, stops: {}, trail: [] };   // stops[id] = {k,n,lat,lng,r,rr,d,t,last,visits} · trail = 걸으며 밝힌 칸
let owner = null;                  // 로그인 사용자 id
let cloudAt = null;
const cells = new Map();           // cell → [lat,lng]
const cellDist = new Map();        // cell → 시군구 코드
let districts = [];                // {c,n,t,bbox,polys}
const stopsById = new Map();       // 불러온 정류장
const tilesLoaded = new Map();     // "x/y" → 'ok'|'loading'|'err'
let me = null;                     // {lat,lng,acc,at}
let watchId = null;

function dist(aLat, aLng, bLat, bLng) {
  const r = Math.PI / 180, dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const fmtM = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m) + 'm');
const fmtN = (n) => n.toLocaleString(MG && MG.lang === 'en' ? 'en-US' : 'ko-KR');
const today = () => new Date().toLocaleDateString('sv-SE');
const kindIcon = (k) => (k === 'b' ? '🚌' : k === 't' ? '🔁' : '🚇');
const kindName = (k) => (k === 'b' ? L_('버스정류장', 'Bus stop') : k === 't' ? L_('환승역', 'Transfer station') : L_('지하철역', 'Station'));
const radiusOf = (s) => (s.k === 'b' ? (s.rural ? RADIUS.bRural : RADIUS.b) : RADIUS[s.k]);
// 저장된 기록의 반경 — 반경 기준이 커지면 예전 체크인도 새 기준만큼 밝혀진다
const recRadius = (r) => Math.max(r.r || 0, r.k === 'b' ? (r.rr ? RADIUS.bRural : RADIUS.b) : RADIUS[r.k] || 0);

/* ---------- 행정구역 ---------- */
function pip(lng, lat, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function districtAt(lat, lng) {
  for (const d of districts) {
    const b = d.bbox;
    if (lng < b[0] || lng > b[2] || lat < b[1] || lat > b[3]) continue;
    for (const p of d.polys) if (pip(lng, lat, p[0]) && !p.slice(1).some((h) => pip(lng, lat, h))) return d.c;
  }
  return null;
}
async function loadDistricts() {
  try {
    const g = await (await fetch('districts.json')).json();
    districts = g.features.map((f) => {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      const bbox = [180, 90, -180, -90];
      for (const p of polys) for (const [x, y] of p[0]) { bbox[0] = Math.min(bbox[0], x); bbox[1] = Math.min(bbox[1], y); bbox[2] = Math.max(bbox[2], x); bbox[3] = Math.max(bbox[3], y); }
      return { c: f.properties.c, n: f.properties.n, t: f.properties.t, bbox, polys };
    });
  } catch (e) { districts = []; }
  buildAreas();
}
/* 탐험률 단위(area): 서울·인천은 구·군, 경기는 시·군 (수원시장안구 → 수원시) */
const areas = new Map(); // key → {k, n, t, sido}
const distArea = {};     // 시·군·구 코드 → area key
function buildAreas() {
  areas.clear();
  for (const d of districts) {
    const m = d.c.startsWith('31') && d.n.match(/^(.+?시)(.+구)$/);
    const key = m ? d.c.slice(0, 4) : d.c;
    const a = areas.get(key) || { k: key, n: m ? m[1] : d.n, t: 0, sido: d.c.slice(0, 2) };
    a.t += d.t;
    areas.set(key, a);
    distArea[d.c] = key;
  }
}
const areaOf = (c) => (c ? areas.get(distArea[c]) : null);
const dName = (c) => { const a = areaOf(c); return a ? a.n : ''; };

/* ---------- 칸 계산 ---------- */
function revealCells(lat, lng, r) {
  const c0 = h3.latLngToCell(lat, lng, RES);
  const k = Math.ceil(r / 105) + 1;
  const out = [];
  for (const c of h3.gridDisk(c0, k)) {
    const p = h3.cellToLatLng(c);
    if (dist(lat, lng, p[0], p[1]) <= r) out.push([c, p]);
  }
  return out;
}
function addStopCells(s) {
  let added = 0;
  for (const [c, p] of revealCells(s.lat, s.lng, recRadius(s))) {
    if (cells.has(c)) continue;
    cells.set(c, p);
    cellDist.set(c, districtAt(p[0], p[1]));
    added++;
  }
  return added;
}
function addCell(c) {
  if (cells.has(c)) return false;
  const p = h3.cellToLatLng(c);
  cells.set(c, p);
  cellDist.set(c, districtAt(p[0], p[1]));
  return true;
}
function rebuildCells() {
  cells.clear(); cellDist.clear();
  for (const id in state.stops) addStopCells(state.stops[id]);
  for (const c of state.trail || []) addCell(c);
  trailSet.clear(); for (const c of state.trail || []) trailSet.add(c);
}

/* 걸으며 밝히기 — 페이지를 켜고 걸으면 지나간 길 주변(약 100m)이 열린다 */
let trailPrev = null, trailAdded = 0, trailSaveT = null;
const trailSet = new Set();
function trailStep(pos) {
  if (pos.acc > TRAIL_MAX_ACC || !inRegion(pos.lat, pos.lng)) return;
  if (trailPrev) {
    const dt = (pos.at - trailPrev.at) / 1000;
    const dm = dist(trailPrev.lat, trailPrev.lng, pos.lat, pos.lng);
    if (dt > 0 && dt < 600 && (dm / dt) * 3.6 > TRAIL_MAX_KMH) { trailPrev = pos; return; }
  }
  trailPrev = pos;
  let n = 0;
  for (const c of h3.gridDisk(h3.latLngToCell(pos.lat, pos.lng, RES), 1)) {
    if (cells.has(c)) continue;
    addCell(c);
    if (!trailSet.has(c)) { trailSet.add(c); state.trail.push(c); }
    n++;
  }
  if (!n) return;
  trailAdded += n;
  updateHeader(); queueFog();
  if (!trailSaveT) trailSaveT = setTimeout(() => { trailSaveT = null; persist(); submit(); }, 30000);
}

/* ---------- 지도 ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: true, preferCanvas: true, minZoom: 8, maxZoom: 18 })
  .setView([37.5547, 126.9707], 12);
// OpenStreetMap 기본 타일 — 키 없이 무료 (출처 표시 필수, 대량 트래픽이면 다른 타일 서버로 옮길 것)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);
map.setMaxBounds([[REGION.s - 1.5, REGION.w - 1], [REGION.n + 1.5, REGION.e + 1.5]]);
const stopLayer = L.layerGroup().addTo(map);
// 아래 패널에 가리지 않도록, 보이는 지도 영역의 가운데로 옮긴다
function focus(lat, lng, zoom, fly) {
  const z = zoom == null ? map.getZoom() : zoom;
  const sh = document.getElementById('sheet');
  const wide = window.innerWidth >= 900;
  const off = sh ? (wide ? [-(sh.offsetWidth + 12) / 2, 0] : [0, sh.offsetHeight / 2]) : [0, 0];
  const c = map.unproject(map.project([lat, lng], z).add(off), z);
  if (fly) map.flyTo(c, z, { duration: 0.6 }); else map.setView(c, z);
}

/* 안개 — 밝힌 칸만 구멍을 뚫는다. 지도 타일 위·정류장 아래 층(pane)에 둔다 */
const fog = $('fog');

let anim = null; // {lat,lng,r,start}
function sizeFog() {

  const hidden = anim && animR < 1 ? anim.cells : null;
  if (z >= 13) {
    fctx.beginPath();
    for (const [c, p] of cells) {
      if (p[0] < b.getSouth() || p[0] > b.getNorth() || p[1] < b.getWest() || p[1] > b.getEast()) continue;

    fctx.beginPath();
    for (const id in state.stops) {
      const st = state.stops[id];
      if (anim && animR < 1 && anim.id === id) continue;
      const rr = recRadius(st);
      const c = map.latLngToContainerPoint([st.lat, st.lng]);
      const e = map.latLngToContainerPoint([st.lat, st.lng + rr / (111320 * Math.cos(st.lat * Math.PI / 180))]);
      const r = Math.max(1.5, e.x - c.x);

    const e = map.latLngToContainerPoint([anim.lat, anim.lng + anim.r / (111320 * Math.cos(anim.lat * Math.PI / 180))]);

/* ---------- 정류장 불러오기 ---------- */
function tileOf(lat, lng) {
  const n = 2 ** STOP_Z, r = (lat * Math.PI) / 180;

const inRegion = (lat, lng) => lat >= REGION.s && lat <= REGION.n && lng >= REGION.w && lng <= REGION.e;
/* 정류장 데이터: 공공데이터포털(국토교통부 버스정류장 · 전국도시철도역사정보)을

let tileIndex = null;
const tileIndexReady = fetch('stops/index.json?v=' + (new URLSearchParams(location.search).get('v') || ''))
  .then((r) => r.json()).then((a) => { tileIndex = new Set(a); }).catch(() => { tileIndex = null; });
async function loadTile(x, y) {
  const key = x + '/' + y;
  if (tilesLoaded.get(key) === 'ok' || tilesLoaded.get(key) === 'loading') return;
  tilesLoaded.set(key, 'loading');
  try {
    await tileIndexReady;
    if (tileIndex && !tileIndex.has(x + '_' + y)) { tilesLoaded.set(key, 'ok'); renderSheet(); return; }
    const res = await fetch(`stops/${x}_${y}.json?v=${new URLSearchParams(location.search).get('v') || ''}`);
    if (res.status === 404) { tilesLoaded.set(key, 'ok'); renderSheet(); return; }
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    for (const [id, k, n, lat, lng, rural, lines] of rows) stopsById.set(id, { id, k, n, lat, lng, rural: !!rural, lines: lines || [] });
    tilesLoaded.set(key, 'ok');
    renderStops(); renderSheet();
  } catch (e) {
    tilesLoaded.set(key, 'err');

}

  if (!inRegion(lat, lng)) return;

}

  const [x1, y1] = tileOf(b.getSouth(), b.getEast());
  if ((x1 - x0 + 1) * (y1 - y0 + 1) > 12) return;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const nb = tileBounds(x, y);

/* ---------- 정류장 표시 ---------- */

/* ---------- 체크인 ---------- */

  if (me.acc > MAX_ACC) return { ok: false, why: L_('위치가 부정확해요', 'Location too rough') };
  const d = dist(me.lat, me.lng, s.lat, s.lng);
  const range = RANGE[s.k];
  if (d > range) return { ok: false, why: L_(`${fmtM(d - range)} 더 가까이`, `${fmtM(d - range)} closer`) };

  if (done && done.last === today()) return { ok: false, why: L_('오늘 체크인 완료', 'Done today') };

  anim = { id: s.id, lat: s.lat, lng: s.lng, r: rec.r, start: performance.now(), cells: new Set([...cells.keys()].filter((c) => !before.has(c))) };

  if (firstToday) sub += ' · ' + L_('☀️ 오늘 첫 체크인 1.5배', '☀️ first of the day ×1.5');

  const sido = { '11': [0, 0], '23': [0, 0], '31': [0, 0] };
  for (const d of districts) { const s = sido[d.c.slice(0, 2)]; if (s) { s[0] += byDist[d.c] || 0; s[1] += d.t; } }
  const all = Object.values(sido).reduce((a, s) => [a[0] + s[0], a[1] + s[1]], [0, 0]);
  const byArea = {};
  for (const c in byDist) { const k = distArea[c]; if (k) byArea[k] = (byArea[k] || 0) + byDist[c]; }

}

/* ---------- 화면 ---------- */

function readLocal() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }

function merge(a, b) {
  const out = { v: 1, stops: {}, trail: [...new Set([...((a && a.trail) || []), ...((b && b.trail) || [])])] };
  for (const src of [a, b]) for (const id in (src && src.stops) || {}) {
    const s = src.stops[id], o = out.stops[id];
    if (!o) { out.stops[id] = { ...s }; continue; }
    o.t = o.t < s.t ? o.t : s.t;
    if ((s.at || 0) > (o.at || 0)) { o.at = s.at; o.last = s.last; }
    o.visits = Math.max(o.visits || 1, s.visits || 1);
    o.r = Math.max(o.r || 0, s.r || 0);
  }
  return out;
}

}

/* 공유 카드 벌집 지도 — areas8.json(서버와 같은 칸 순서)에 밝힌 정도를 담아 보낸다 */
let areas8 = null, areas8P = null;
const areaIdx = {};
function loadAreas8() {
  if (!areas8P) areas8P = fetch('areas8.json?v=' + (new URLSearchParams(location.search).get('v') || ''))
    .then((r) => r.json()).then((j) => { areas8 = j; }).catch(() => { areas8P = null; });
  return areas8P;
}
function honeyCode(key) {
  if (!areas8 || !areas8[key]) return '';
  if (!areaIdx[key]) { const m = new Map(); areas8[key].cells.forEach((c, i) => m.set(c, i)); areaIdx[key] = m; }
  const idx = areaIdx[key], cnt = new Map();
  for (const c of cells.keys()) {
    const i = idx.get(h3.cellToParent(c, 8));
    if (i != null) cnt.set(i, (cnt.get(i) || 0) + 1);
  }
  const bytes = [];
  let prev = -1;
  for (const i of [...cnt.keys()].sort((a, b) => a - b)) {
    const n = cnt.get(i), level = n >= 33 ? 3 : n >= 17 ? 2 : 1;
    let v = (i - prev) * 4 + level; prev = i;
    while (v >= 0x80) { bytes.push((v & 0x7f) | 0x80); v = Math.floor(v / 128); }
    bytes.push(v);
  }
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function shareData() {
  const s = stats();
  const top = s.areaPct[0];
  const gg = s.areaPct.find((x) => x.a.sido === '31'); // 경기는 시·군 단위로
  const r1 = (v) => Math.round(v * 100) / 100;
  return {
    n: ($('shName').value || '').trim().slice(0, 12),
    d: top ? top.a.n : '',
    dp: top ? r1(top.p) : 0,
    s: r1(pct(s.sido['11'][0], s.sido['11'][1])),
    i: r1(pct(s.sido['23'][0], s.sido['23'][1])),
    gc: gg ? gg.a.n : '',
    gk: gg ? gg.a.k : '',
    g: gg ? r1(gg.p) : 0,
    c: s.cells, r: s.rail, b: s.bus, v: s.visitedD.size,
  };
}
function withHoney(x) {
  // 큰 숫자로 나오는 곳(서울·인천·경기 시·군 중 1위)을 벌집으로 그린다
  const cand = [['11', x.s], ['23', x.i], [x.gk, x.g]].filter((c) => c[0] && c[1] > 0);
  if (!cand.length) return x;
  const best = fmtP(Math.max(...cand.map((c) => c[1])));
  const key = cand.find((c) => fmtP(c[1]) === best)[0];
  const m = honeyCode(key);
  return m ? { ...x, a: key, m } : x;
}
function shareQuery(x) {
  const q = new URLSearchParams();
  for (const k in x) if (k !== 'gk' && x[k] !== '' && x[k] !== 0) q.set(k, String(x[k]));
  return q.toString();
}
const fmtP = (p) => (p >= 10 ? p.toFixed(1) : p >= 0.01 ? p.toFixed(2) : p > 0 ? '<0.01' : '0') + '%';
// 서울·인천·경기 중 탐험률이 가장 높은 곳 (표시 값이 같으면 함께)
function leaders(x) {
  const all = [{ ko: '서울', en: 'Seoul', p: x.s }, { ko: '인천', en: 'Incheon', p: x.i }, { ko: x.gc || '경기', en: x.gc || 'Gyeonggi', p: x.g }].filter((r) => r.p > 0);
  if (!all.length) return [];
  const top = fmtP(Math.max(...all.map((r) => r.p)));
  return all.filter((r) => fmtP(r.p) === top);
}
function leadTitle(who, x) {
  const lead = leaders(x);
  if (!lead.length) return L_(`${who}님은 ${fmtN(x.c)}칸을 밝혔어요`, `${who} revealed ${fmtN(x.c)} cells`);
  if (lead.length === 1) return L_(`${who}님은 ${lead[0].ko}의 ${fmtP(lead[0].p)}를 밝혔어요`, `${who} explored ${fmtP(lead[0].p)} of ${lead[0].en}`);
  const last = lead[lead.length - 1].ko, code = last.charCodeAt(last.length - 1) - 0xac00;
  const josa = code >= 0 && code % 28 !== 0 ? '을' : '를';
  return L_(`${who}님은 ${lead.map((r) => r.ko).join('·')}${josa} 각각 ${fmtP(lead[0].p)}씩 밝혔어요`, `${who} explored ${fmtP(lead[0].p)} each of ${lead.map((r) => r.en).join(' & ')}`);
}

  // 전에 위치를 허용했다면 바로 켠다
  try {
    const st = await navigator.permissions.query({ name: 'geolocation' });
    if (st.state === 'granted') { const i = $('intro'); if (i) { i.remove(); if (invite) setTimeout(() => toast(invite), 600); } startGps(); }
  } catch (e) {}
  setupAuth();
})();
</script>
