<style>
  :root{
    --bg:#14201b; --panel:#1d2c25; --panel2:#263a31; --line:#3a5547; --text:#eef5ee; --dim:#9db4a6;
    --gold:#f2c14e; --knight:#e2574c; --thief:#a66bd6; --mage:#5b8def; --priest:#e9b949;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
  #app{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:100%;padding:8px;gap:8px}
  #hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip b{color:var(--gold)}
  #tag{margin-right:auto;font-weight:800;font-size:15px;letter-spacing:-.02em}
  #tag small{font-weight:600;color:var(--dim);font-size:11px;margin-left:6px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  button{font:inherit;color:inherit;cursor:pointer}
  #speed{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
  #stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0c1411}
  canvas{display:block;width:100%;height:auto;touch-action:manipulation}
  #info{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,32,27,.94);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;display:none;align-items:center;gap:10px;font-size:13px}
  #info.on{display:flex}
  #info .t{flex:1;line-height:1.45}
  #info .t b{font-size:14px}
  #info .t span{color:var(--dim)}
  #sell{background:#5a2b2b;border:1px solid #8a4a4a;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap}
  #closeInfo{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  #over{position:absolute;inset:0;background:rgba(8,12,10,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  #over.on{display:flex}
  #over h2{font-size:26px}
  #over p{color:var(--dim)}
  #over button{background:var(--gold);color:#2a1e05;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:16px}
  #bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 6px 8px;text-align:center;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .card canvas{width:52px;height:52px;border-radius:10px;background:var(--panel2);image-rendering:pixelated}
  .card .n{font-weight:800;font-size:14px}
  .card .c{font-weight:700;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
  .card .d{font-size:11px;color:var(--dim);line-height:1.35;word-break:keep-all}
  .card .d em{font-style:normal;font-weight:700;color:var(--text)}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
  .card.poor{opacity:.5}
  #hint{font-size:12px;color:var(--dim);text-align:center;min-height:16px}

  #wtype{color:var(--dim);font-weight:600;font-size:12px;margin-left:2px}
  #info{flex-wrap:wrap}
  #info .t{min-width:180px}
  #promo{background:var(--gold);color:#2a1e05;border:0;border-radius:8px;padding:8px 12px;font-weight:800;white-space:nowrap}
  #promo:disabled{background:var(--panel2);color:var(--dim);cursor:default}
  .card .d i{font-style:normal;font-weight:700;color:var(--c)}
  #cards{position:absolute;inset:0;background:rgba(8,12,10,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
  #cards.on{display:flex}
  #cards h2{font-size:19px;text-align:center}
  #cardList{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:620px}
  .pick{background:var(--panel);border:2px solid var(--c);border-radius:12px;padding:16px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
  .pick:hover{background:var(--panel2)}
  .pick .k{font-size:11px;font-weight:800;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 8px}
  .pick .t{font-size:16px;font-weight:800;word-break:keep-all}
  .pick .d{font-size:13px;color:var(--dim);line-height:1.4;word-break:keep-all}
  @media (max-width:520px){
    #tag{display:none}
    #hud{justify-content:space-between}
    .chip,#speed{padding:6px 10px;font-size:13px}
    .card .d{font-size:10px}
    #info{position:static;border-radius:0;border-width:1px 0 0}
    #hint{font-size:11px}
  }

<script>const ASSET={"ground": "assets/ground.webp", "heroes": "assets/heroes.png", "fx": "assets/fx.png", "mons": {"mon1": "assets/mon/mon1.png", "mon2": "assets/mon/mon2.png", "mon3": "assets/mon/mon3.png", "mon4": "assets/mon/mon4.png", "mon5": "assets/mon/mon5.png", "mon6": "assets/mon/mon6.png", "mon7": "assets/mon/mon7.png", "mon8": "assets/mon/mon8.png", "mon9": "assets/mon/mon9.png", "mon10": "assets/mon/mon10.png", "mon11": "assets/mon/mon11.png", "mon12": "assets/mon/mon12.png", "mon13": "assets/mon/mon13.png", "mon14": "assets/mon/mon14.png", "mon15": "assets/mon/mon15.png", "boss1": "assets/mon/boss1.png", "boss2": "assets/mon/boss2.png", "boss3": "assets/mon/boss3.png", "boss4": "assets/mon/boss4.png", "boss5": "assets/mon/boss5.png"}};
const HJ={"knight": {"idle": [0, 0, 122, 97, 57, 95], "atk": [[124, 0, 151, 97, 65, 95], [277, 0, 180, 126, 67, 115], [459, 0, 162, 93, 67, 89], [623, 0, 185, 143, 67, 133]], "face": [34, 1, 52]}, "assassin": {"idle": [0, 145, 104, 97, 57, 94], "atk": [[106, 145, 142, 107, 62, 94], [250, 145, 189, 96, 67, 90], [441, 145, 165, 94, 67, 102], [608, 145, 172, 95, 67, 95]], "face": [34, 147, 52]}, "mage": {"idle": [0, 254, 116, 110, 54, 106], "atk": [[118, 254, 127, 131, 49, 128], [247, 254, 174, 131, 67, 116], [423, 254, 210, 122, 67, 115], [635, 254, 154, 145, 67, 128]], "face": [31, 255, 52]}, "priest": {"idle": [0, 401, 115, 118, 55, 114], "atk": [[117, 401, 143, 137, 51, 133], [262, 401, 173, 139, 67, 125], [437, 401, 164, 148, 63, 127], [603, 401, 188, 176, 67, 154]], "face": [32, 402, 52]}};
const FXM={"slash": {"row": 0, "n": 10}, "cross": {"row": 1, "n": 9}, "boom": {"row": 2, "n": 9}, "holy": {"row": 3, "n": 12}, "hit": {"row": 4, "n": 5}, "meteor": {"row": 5, "n": 9}, "light": {"row": 6, "n": 14}, "smash": {"row": 7, "n": 10}, "ambush": {"row": 8, "n": 12}, "promo": {"row": 9, "n": 18}};

<script>
(function(){
'use strict';
// ---------- 직업 ----------
// range/aoe/buffR 은 월드 단위(한 칸 = 120). mult = 평타 데미지 배율
const BASE_ATK = 30;
const TIER_MUL = [1, 2.4, 5.5];          // 전직 단계별 공격력
const TIER_COST = [0, 2, 4.5];           // 전직 비용 = 기본 비용 x 배수
const CLASSES = {
  knight: {name:'검사', tiers:['검사','기사','성기사'], key:'knight', color:'#e2574c', cost:60, range:250, cd:0.9, mult:1.5, aoe:0, fx:'slash',
           skill:'강타', scd:6, sdesc:'단일 300% + 기절',
           desc:'사거리 <em>중간</em> · 단일<br>데미지 <em>150%</em><br><i>강타</i> 기절'},
  thief:  {name:'도둑', tiers:['도둑','암살자','스토커'], key:'assassin', color:'#a66bd6', cost:80, range:150, cd:0.7, mult:2.5, aoe:0, fx:'cross',
           skill:'기습', scd:8, sdesc:'멀리 있는 체력 최다 적에게 600%',
           desc:'사거리 <em>짧음</em> · 단일<br>데미지 <em>250%</em><br><i>기습</i> 원거리 암살'},
  mage:   {name:'마법사', tiers:['마법사','프로페서','대마법사'], key:'mage', color:'#5b8def', cost:90, range:370, cd:1.3, mult:1.0, aoe:95, fx:'boom',
           skill:'메테오', scd:10, sdesc:'넓은 범위 250% + 화상 장판',
           desc:'사거리 <em>넓음</em> · 범위<br>데미지 <em>100%</em><br><i>메테오</i> 광역'},
  priest: {name:'복사', tiers:['복사','프리스트','대주교'], key:'priest', color:'#e9b949', cost:110, range:370, cd:1.5, mult:0.35, aoe:95, fx:'holy', buffR:200, buff:2.0,
           skill:'홀리라이트', scd:9, sdesc:'적 받는 피해 +50%, 아군 공속 +30%',
           desc:'약한 범위 공격<br>주변 아군 <em>200%</em><br><i>홀리라이트</i> 약화'}
};
const ORDER = ['knight','thief','mage','priest'];

// ---------- 몬스터 유형 ----------
const TYPES = {
  normal: {label:'일반',   hp:1,    spd:1,    n:1,   gap:0.75, gold:1,    sc:0.5,  imgs:['mon3','mon5','mon6','mon12','mon13'], tip:''},
  fast:   {label:'고속',   hp:0.6,  spd:1.7,  n:1,   gap:0.6,  gold:1,    sc:0.46, imgs:['mon2','mon11','mon8'],  tip:'빠릅니다 — 검사 계열의 강타(기절)로 묶으세요'},
  tank:   {label:'중장갑', hp:3.2,  spd:0.72, n:0.5, gap:1.3,  gold:2.2,  sc:0.62, imgs:['mon14','mon15'],        tip:'범위 공격 피해 50% 감소 — 검사·도둑 계열이 유효합니다'},
  swarm:  {label:'떼거리', hp:0.35, spd:1.05, n:2.4, gap:0.28, gold:0.45, sc:0.4,  imgs:['mon1','mon9','mon7'],   tip:'숫자가 많습니다 — 마법사 계열과 메테오가 유효합니다'},
  stealth:{label:'은신',   hp:0.9,  spd:1.1,  n:0.8, gap:0.8,  gold:1.3,  sc:0.5,  imgs:['mon4','mon10'],         tip:'복사 계열 사거리 안에서만 조준됩니다 (범위 피해는 맞음)'}
};
const WAVE_SEQ = ['normal','fast','swarm','tank',null,'stealth','swarm','fast','tank',null];

// ---------- 3택 카드 ----------
const CARDS = [
  {t:'강타 연마',   d:'강타 쿨타임 -20%',      c:'knight', f:M=>M.scd.knight*=0.8},
  {t:'묵직한 일격', d:'강타 기절 시간 +0.5초',      c:'knight', f:M=>M.stun+=0.5},
  {t:'급소 공략',   d:'기습 데미지 +40%',      c:'thief',  f:M=>M.ambush*=1.4},
  {t:'그림자 걸음', d:'도둑 계열 사거리 +20%',           c:'thief',  f:M=>M.range.thief*=1.2},
  {t:'거대 운석',   d:'메테오 범위 +25%',           c:'mage',   f:M=>M.meteorR*=1.25},
  {t:'마력 증폭',   d:'마법사 계열 평타 범위 +20%',        c:'mage',   f:M=>M.mageAoe*=1.2},
  {t:'긴 기도',     d:'홀리라이트 지속 +1.5초',     c:'priest', f:M=>M.holyDur+=1.5},
  {t:'넓은 축복',   d:'복사 계열 버프 범위 +20%',    c:'priest', f:M=>M.buffR*=1.2},
  {t:'무기 손질',   d:'전 직업 공격력 +15%',        c:null,     f:M=>M.atk*=1.15},
  {t:'전투 함성',   d:'전 직업 공격 속도 +12%',     c:null,     f:M=>M.haste*=1.12},
  {t:'전리품',      d:'즉시 골드 +150',             c:null,     f:(M,S)=>{S.gold+=150;}},
  {t:'현상금',      d:'처치 골드 +25%',             c:null,     f:M=>M.gold*=1.25},
  {t:'응급 처치',   d:'생명 +5',                    c:null,     f:(M,S)=>{S.life+=5;}},
  {t:'전직 지원금', d:'전직 비용 -15%',             c:null,     f:M=>M.promo*=0.85}
];
function freshMods(){ return {atk:1,haste:1,gold:1,promo:1,stun:1,ambush:1,meteorR:1,mageAoe:1,holyDur:3,buffR:1,
  scd:{knight:1,thief:1,mage:1,priest:1}, range:{knight:1,thief:1,mage:1,priest:1}}; }

// ---------- 맵 (속성 타워 디펜스와 동일한 길·칸) ----------
const CW=1080, CH=1000, GRID=120;
const FX_=0.85, FY_=0.85*Math.sin(56*Math.PI/180), OY=125;
const w2s=(x,y)=>({x:540+(x-600)*FX_, y:OY+y*FY_});
const s2w=(x,y)=>({x:600+(x-540)/FX_, y:(y-OY)/FY_});
const ROUTE = (function(){
  const T=[[0,0],[0,3],[3,3],[6,3],[9,3],[9,0],[6,0],[6,3],[6,6],[6,9],[9,9],[9,6],[6,6],[3,6],[0,6],[0,9],[3,9],[3,6],[3,3],[3,0],[4,0]];
  const p=T.map(([i,j])=>({x:i*GRID+60,y:j*GRID+60})); p.push({x:600,y:60},{x:600,y:-70}); return p;
})();
const CUM=[0]; for(let i=1;i<ROUTE.length;i++) CUM.push(CUM[i-1]+Math.hypot(ROUTE[i].x-ROUTE[i-1].x,ROUTE[i].y-ROUTE[i-1].y));
const ROUTE_LEN=CUM[CUM.length-1];
function posAt(d){
  if(d<=0) return {x:ROUTE[0].x,y:ROUTE[0].y};
  for(let i=1;i<CUM.length;i++) if(d<=CUM[i]){ const t=(d-CUM[i-1])/(CUM[i]-CUM[i-1]);
    return {x:ROUTE[i-1].x+(ROUTE[i].x-ROUTE[i-1].x)*t, y:ROUTE[i-1].y+(ROUTE[i].y-ROUTE[i-1].y)*t}; }
  const l=ROUTE[ROUTE.length-1]; return {x:l.x,y:l.y};
}
function slotOf(x,y){
  const i=Math.floor(x/GRID), j=Math.floor(y/GRID);
  if(i<0||j<0||i>9||j>9||i%3===0||j%3===0) return null;
  return {i,j,x:i*GRID+60,y:j*GRID+60};
}
const SLOTS=[]; for(let j=0;j<10;j++) for(let i=0;i<10;i++){ const s=slotOf(i*GRID+1,j*GRID+1); if(s) SLOTS.push(s); }

// ---------- 에셋 ----------
function load(src){ const im=new Image(); im.src=src; return im; }
const IMG={ground:load(ASSET.ground), heroes:load(ASSET.heroes), fx:load(ASSET.fx), mons:{}};
for(const k in ASSET.mons) IMG.mons[k]=load(ASSET.mons[k]);

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ---------- 상태 ----------
let S, M;
function reset(){
  M=freshMods();
  S={gold:260, life:20, wave:0, heroes:[], mons:[], fx:[], shots:[], floats:[], zones:[], ghosts:[], pulses:[], queue:[], rest:2.5,
     pick:null, sel:null, hover:null, speed:1, over:false, kills:0, time:0, wtype:'normal', banner:0, choosing:false, picked:[]};
  $('over').classList.remove('on'); $('info').classList.remove('on'); $('cards').classList.remove('on'); syncHud(); syncBar();
}
function waveTypes(w){
  if(w%5===0) return ['boss'];
  const a=WAVE_SEQ[(w-1)%10];
  if(w<=10) return [a];
  const pool=Object.keys(TYPES).filter(k=>k!==a); return [a,pool[(w*7)%pool.length]];
}
function startWave(){
  S.wave++;
  const w=S.wave, ts=waveTypes(w), hp=70*Math.pow(1.27,w-1), spd=78+Math.min(40,w*2), g=5+w*0.6;
  let t=0; const push=(k,i)=>{ const T=TYPES[k];
    S.queue.push({t, type:k, hp:hp*T.hp, spd:spd*T.spd, img:T.imgs[(w+i)%T.imgs.length], boss:false, gold:Math.max(1,Math.round(g*T.gold))}); t+=T.gap; };
  if(ts[0]==='boss'){
    for(let i=0;i<6;i++) push('normal',i);
    S.queue.push({t:t+0.5, type:'boss', hp:hp*14, spd:55, img:'boss'+(((w/5-1)%5)+1), boss:true, gold:120+w*4});
    S.wtype='boss';
  }else{
    const base=8+Math.min(14,w*2);
    for(const k of ts){ const n=Math.max(2,Math.round(base*TYPES[k].n/ts.length)); for(let i=0;i<n;i++) push(k,i); }
    S.wtype=ts.join('+');
  }
  S.banner=3.2; syncHud();
}
function spawn(q){ const p=posAt(0);
  S.mons.push({d:0,x:p.x,y:p.y,hp:q.hp,max:q.hp,spd:q.spd,img:q.img,boss:q.boss,type:q.type,gold:q.gold,flash:0,bob:Math.random()*6,stun:0,vul:0,seen:true}); }

// ---------- 랭킹 ----------
// 점수 = 도달 라운드 × 1,000,000 + (999,999 − 게임 시간(초)) — 라운드가 높을수록, 같으면 시간이 짧을수록 위
// 시간은 배속과 무관한 게임 내 시간이라 x1·x3 어느 쪽으로 해도 공평하다
function submitRanking(round,sec){
  if(!window.MGH||round<1) return;
  MGH.submitScore('class-td', round*1000000+Math.max(0,999999-sec), {round:round, sec:sec});
}

// ---------- 전투 ----------
const rangeOf=h=>CLASSES[h.cls].range*M.range[h.cls];
const buffR=()=>CLASSES.priest.buffR*M.buffR;
function isBuffed(h){
  if(h.cls==='priest') return false;
  for(const p of S.heroes) if(p.cls==='priest' && dist(p,h)<=buffR()) return true;
  return false;
}
const atkOf=h=>BASE_ATK*TIER_MUL[h.tier]*M.atk*(h.buffed?CLASSES.priest.buff:1);
const dmgOf=h=>atkOf(h)*CLASSES[h.cls].mult;
const promoCost=h=>h.tier>=2?0:Math.round(CLASSES[h.cls].cost*TIER_COST[h.tier+1]*M.promo/5)*5;
function hurt(m,dmg,gold,aoe){
  if(m.hp<=0) return;
  if(aoe && m.type==='tank') dmg*=0.5;
  if(m.vul>0) dmg*=1.5;
  m.hp-=dmg; m.flash=0.12;
  S.floats.push({x:m.x,y:m.y,t:0,txt:Math.round(dmg),col:m.vul>0?'#ffb04a':gold?'#ffd866':'#ffffff',big:dmg>=BASE_ATK*6});
  if(m.hp<=0){ const g=Math.round(m.gold*M.gold); S.gold+=g; S.kills++;
    S.floats.push({x:m.x,y:m.y+10,t:0,txt:'+'+g+'G',col:'#f2c14e',big:false,slow:true}); syncHud(); syncBar(); }
}
function addFx(name,x,y,scale,lift){ S.fx.push({name,x,y,t:0,scale,lift:lift||0,dur:FXM[name].n*0.05}); }
function shout(h,txt){ S.floats.push({x:h.x,y:h.y-70,t:0,txt,col:CLASSES[h.cls].color,big:true,slow:true,skill:true}); }
const canTarget=m=>m.hp>0 && m.seen;
function strike(h,tx,ty,target){
  const c=CLASSES[h.cls], dmg=dmgOf(h);
  if(c.aoe){
    const r=c.aoe*(h.cls==='mage'?M.mageAoe:1);
    for(const m of S.mons) if(Math.hypot(m.x-tx,m.y-ty)<=r) hurt(m,dmg,h.buffed,true);
    addFx(c.fx,tx,ty,r*2*FX_/50, h.cls==='priest'?0:14);
  }else if(target){
    hurt(target,dmg,h.buffed,false); addFx('hit',target.x,target.y,1.3,22);
  }
}
// 스킬: 쓸 대상이 없으면 false
function castSkill(h){
  const a=atkOf(h), R=rangeOf(h);
  if(h.cls==='knight'){
    let best=null; for(const m of S.mons) if(canTarget(m)&&dist(m,h)<=R&&(!best||m.hp>best.hp)) best=m;
    if(!best) return false;
    hurt(best,a*3,h.buffed,false); best.stun=Math.max(best.stun,(best.boss?0.5:1)*M.stun);
    addFx('smash',best.x,best.y,2.6,26); addFx('slash',best.x,best.y,2.4,26); h.flip=best.x<h.x;
  }else if(h.cls==='thief'){
    let best=null; for(const m of S.mons) if(canTarget(m)&&dist(m,h)<=R*2.8&&(!best||m.hp>best.hp)) best=m;
    if(!best) return false;
    hurt(best,a*6*M.ambush,h.buffed,false);
    addFx('ambush',best.x,best.y,2.6,26); addFx('cross',best.x,best.y,2.2,26);
    S.ghosts.push({h,x:best.x+(best.x<h.x?40:-40),y:best.y,flip:best.x<h.x?false:true,t:0}); h.flip=best.x<h.x;
  }else if(h.cls==='mage'){
    const r=150*M.meteorR; let best=null,bn=0;
    for(const m of S.mons){ if(!canTarget(m)||dist(m,h)>R*1.2) continue; let n=0; for(const o of S.mons) if(o.hp>0&&dist(o,m)<=r) n+=o.boss?4:1; if(n>bn){bn=n;best=m;} }
    if(!best) return false;
    const ahead=posAt(best.d+best.spd*0.45);
    S.shots.push({h,meteor:true,tx:ahead.x,ty:ahead.y,r,dmg:a*2.5,buffed:h.buffed,t:0,dur:0.45}); h.flip=best.x<h.x;
  }else{
    let any=false; for(const m of S.mons) if(m.hp>0&&dist(m,h)<=R){ any=true; break; }
    if(!any) return false;
    for(const m of S.mons) if(m.hp>0&&dist(m,h)<=R){ m.vul=M.holyDur; hurt(m,a*1.0,false,true); }
    for(const o of S.heroes) if(o!==h&&dist(o,h)<=buffR()) o.haste=M.holyDur;
    S.pulses.push({x:h.x,y:h.y,r:R,t:0}); addFx('holy',h.x,h.y,3,30);
  }
  h.anim=0; h.sk=true; h.adur=0.56; shout(h,CLASSES[h.cls].skill+'!'); return true;
}
function update(dt){
  S.time+=dt; S.banner=Math.max(0,S.banner-dt);
  // 웨이브
  if(S.queue.length){ for(const q of S.queue) q.t-=dt; while(S.queue.length&&S.queue[0].t<=0) spawn(S.queue.shift()); }
  else if(!S.mons.length){
    if(S.wave>0&&S.wave%3===0&&!S.carded){ S.carded=true; offerCards(); return; }
    S.rest-=dt; if(S.rest<=0){ S.rest=2.5; S.carded=false; startWave(); }
  }
  // 몬스터
  const priests=S.heroes.filter(h=>h.cls==='priest');
  for(const m of S.mons){
    m.flash=Math.max(0,m.flash-dt); m.vul=Math.max(0,m.vul-dt);
    if(m.stun>0) m.stun-=dt; else m.d+=m.spd*dt;
    const p=posAt(m.d); m.x=p.x; m.y=p.y;
    m.seen = m.type!=='stealth' || priests.some(p=>dist(p,m)<=rangeOf(p));
    if(m.d>=ROUTE_LEN){ m.hp=0; S.life-=m.boss?5:1; syncHud(); }
  }
  // 화상 장판
  for(const z of S.zones){ z.t+=dt; z.tick-=dt; if(z.tick<=0){ z.tick=0.5; for(const m of S.mons) if(m.hp>0&&Math.hypot(m.x-z.x,m.y-z.y)<=z.r) hurt(m,z.dmg,false,true); } }
  S.zones=S.zones.filter(z=>z.t<3);
  // 영웅
  for(const h of S.heroes){
    const c=CLASSES[h.cls];
    h.buffed=isBuffed(h); h.haste=Math.max(0,h.haste-dt);
    const sp=M.haste*(h.haste>0?1.3:1);
    h.cd-=dt*sp; h.scd-=dt; if(h.anim>=0){ h.anim+=dt; if(h.anim>h.adur) h.anim=-1; }
    if(h.scd<=0 && castSkill(h)){ h.scd=h.smax=c.scd*M.scd[h.cls]*(1-0.1*h.tier); h.cd=Math.max(h.cd,0.35); continue; }
    if(h.cd>0) continue;
    const R=rangeOf(h); let best=null;
    for(const m of S.mons){ if(!canTarget(m)) continue; if(dist(m,h)<=R && (!best||m.d>best.d)) best=m; }
    if(!best) continue;
    h.cd=c.cd; h.anim=0; h.sk=false; h.adur=0.3; h.flip=best.x<h.x;
    if(h.cls==='mage') S.shots.push({h,x:h.x,y:h.y,tx:best.x,ty:best.y,t:0,dur:0.28});
    else S.shots.push({h,target:best,tx:best.x,ty:best.y,t:0,dur:0.14,hidden:true});
  }
  for(const s of S.shots){ s.t+=dt; if(s.t<s.dur) continue; s.done=true;
    if(s.meteor){ for(const m of S.mons) if(Math.hypot(m.x-s.tx,m.y-s.ty)<=s.r) hurt(m,s.dmg,s.buffed,true);
      addFx('meteor',s.tx,s.ty,s.r*2*FX_/44,20); S.zones.push({x:s.tx,y:s.ty,r:s.r*0.8,t:0,tick:0.5,dmg:s.dmg*0.12}); }
    else strike(s.h,s.target?s.target.x:s.tx,s.target?s.target.y:s.ty,s.target); }
  S.shots=S.shots.filter(s=>!s.done);
  S.mons=S.mons.filter(m=>m.hp>0);
  for(const f of S.fx) f.t+=dt; S.fx=S.fx.filter(f=>f.t<f.dur);
  for(const u of S.pulses) u.t+=dt; S.pulses=S.pulses.filter(u=>u.t<0.6);
  for(const g of S.ghosts) g.t+=dt; S.ghosts=S.ghosts.filter(g=>g.t<0.35);
  for(const f of S.floats) f.t+=dt; S.floats=S.floats.filter(f=>f.t<(f.slow?0.9:0.6));
  if(S.life<=0 && !S.over){ S.over=true; S.life=0; syncHud();
    const sec=Math.floor(S.time);
    $('overText').textContent=S.wave+'라운드 도달 · '+Math.floor(sec/60)+'분 '+(sec%60)+'초 · 처치 '+S.kills+'마리'; $('over').classList.add('on');
    submitRanking(S.wave,sec); }
}

// ---------- 그리기 ----------
function ring(wx,wy,r,stroke,fill,dash){
  ctx.beginPath();
  for(let i=0;i<=48;i++){ const a=i/48*Math.PI*2, p=w2s(wx+Math.cos(a)*r,wy+Math.sin(a)*r); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=3; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]); }
}
function tile(s,stroke,fill){
  const a=w2s(s.x-50,s.y-50), b=w2s(s.x+50,s.y+50);
  ctx.beginPath(); ctx.roundRect(a.x,a.y,b.x-a.x,b.y-a.y,10);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  ctx.strokeStyle=stroke; ctx.lineWidth=2.5; ctx.setLineDash([9,7]); ctx.stroke(); ctx.setLineDash([]);
}
function label(txt,x,y,size,fill,stroke){ ctx.font='800 '+size+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.lineWidth=4;
  ctx.strokeStyle=stroke||'rgba(0,0,0,.75)'; ctx.fillStyle=fill; ctx.strokeText(txt,x,y); ctx.fillText(txt,x,y); }
const HS=0.83; // 영웅 표시 배율 (새 공격 시트 기준)
function heroFrame(h){ const J=HJ[CLASSES[h.cls].key];
  if(h.anim<0) return J.idle; const n=h.sk?4:3;   // 평타는 공격 3컷, 스킬은 마무리 컷까지 4컷
  return J.atk[Math.min(n-1,Math.floor(h.anim/h.adur*n))]; }
function drawHero(h){
  const c=CLASSES[h.cls], p=w2s(h.x,h.y+22), f=heroFrame(h), sc=HS*(1+0.06*h.tier);
  const breathe=h.anim>=0?0:Math.sin(S.time*3+h.x)*1.2;
  if(h.tier===2){ const g=ctx.createRadialGradient(p.x,p.y-30,4,p.x,p.y-30,58); g.addColorStop(0,c.color+'88'); g.addColorStop(1,c.color+'00');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y-30,58,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x,p.y,24,9,0,0,Math.PI*2); ctx.fill();
  if(h.buffed){ const a=0.5+0.3*Math.sin(S.time*5);
    ctx.strokeStyle='rgba(255,214,90,'+a+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(p.x,p.y,30,12,0,0,Math.PI*2); ctx.stroke(); }
  if(h.haste>0){ ctx.strokeStyle='rgba(140,230,255,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(p.x,p.y,35,14,0,0,Math.PI*2); ctx.stroke(); }
  ctx.save(); ctx.translate(p.x,p.y); if(h.flip) ctx.scale(-1,1);
  ctx.imageSmoothingEnabled=true; ctx.drawImage(IMG.heroes,f[0],f[1],f[2],f[3],-f[4]*sc,-f[5]*sc+breathe,f[2]*sc,f[3]*sc); ctx.imageSmoothingEnabled=false;
  ctx.restore();
  // 스킬 쿨타임 바 + 전직 별
  const k=1-Math.max(0,h.scd)/h.smax;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(p.x-21,p.y+10,42,6);
  ctx.fillStyle=k>=1?'#fff':c.color; ctx.fillRect(p.x-20,p.y+11,40*k,4);
  if(h.tier>0) label('★'.repeat(h.tier),p.x,p.y+30,13,'#ffd65a','#3a2600');
  if(h.buffed) label('▲x2',p.x,p.y-104*sc/HS,16,'#ffd65a','#3a2600');
}
function drawGhost(g){ const f=HJ[CLASSES.thief.key].atk[3], p=w2s(g.x,g.y+22);
  ctx.save(); ctx.globalAlpha=0.75*(1-g.t/0.35); ctx.translate(p.x,p.y); if(g.flip) ctx.scale(-1,1);
  ctx.drawImage(IMG.heroes,f[0],f[1],f[2],f[3],-f[4]*HS,-f[5]*HS,f[2]*HS,f[3]*HS); ctx.restore(); }
function drawMon(m){
  const im=IMG.mons[m.img]; if(!im.complete||!im.naturalWidth) return;
  const sc=m.boss?0.66:TYPES[m.type].sc, w=im.naturalWidth*sc, hh=im.naturalHeight*sc, p=w2s(m.x,m.y+14);
  const bob=m.stun>0?0:Math.abs(Math.sin(S.time*7+m.bob))*4;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x,p.y,w*0.36,w*0.13,0,0,Math.PI*2); ctx.fill();
  if(m.vul>0){ ctx.strokeStyle='rgba(255,176,74,.9)'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(p.x,p.y,w*0.42,w*0.16,0,0,Math.PI*2); ctx.stroke(); }
  if(m.type==='stealth') ctx.globalAlpha=m.seen?0.85:0.3;
  if(m.flash>0) ctx.filter='brightness(2.2)';
  ctx.drawImage(im,p.x-w/2,p.y-hh-bob,w,hh); ctx.filter='none'; ctx.globalAlpha=1;
  if(m.type==='stealth'&&!m.seen) return;
  const bw=m.boss?90:m.type==='tank'?58:m.type==='swarm'?32:46, by=p.y-hh-12-bob;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(p.x-bw/2-1,by-1,bw+2,m.boss?10:7);
  ctx.fillStyle=m.boss?'#ff5a5a':m.type==='tank'?'#9fb4c8':m.type==='fast'?'#ffd24a':m.type==='stealth'?'#c49bff':'#6fe06a';
  ctx.fillRect(p.x-bw/2,by,bw*Math.max(0,m.hp/m.max),m.boss?8:5);
  if(m.stun>0) label('💫',p.x,by-6,20,'#fff');
}
function drawFx(f){
  const F=FXM[f.name], i=Math.min(F.n-1,Math.floor(f.t/0.05)), p=w2s(f.x,f.y), sz=64*f.scale;
  ctx.drawImage(IMG.fx,i*64,F.row*64,64,64,p.x-sz/2,p.y-sz/2-f.lift,sz,sz);
}
const typeLabel=()=>S.wtype==='boss'?'보스':S.wtype.split('+').map(k=>TYPES[k].label).join(' + ');
function draw(){
  ctx.fillStyle='#0c1411'; ctx.fillRect(0,0,CW,CH);
  if(IMG.ground.complete) ctx.drawImage(IMG.ground,0,0,CW,CH);
  for(const z of S.zones){ const a=(1-z.t/3)*(0.3+0.08*Math.sin(S.time*12)); ring(z.x,z.y,z.r,'rgba(255,140,40,'+(a+0.25)+')','rgba(255,110,30,'+a+')'); }
  for(const u of S.pulses){ const k=u.t/0.6, a=1-k; ring(u.x,u.y,u.r*(0.25+0.75*Math.sqrt(k)),'rgba(255,224,130,'+a+')','rgba(255,214,90,'+(a*0.22)+')'); }
  if(S.pick) for(const s of SLOTS){ if(S.heroes.some(h=>h.x===s.x&&h.y===s.y)) continue;
    const hv=S.hover&&S.hover.x===s.x&&S.hover.y===s.y; tile(s,hv?'#fff':'rgba(255,255,255,.55)',hv?'rgba(255,255,255,.22)':'rgba(255,255,255,.07)'); }
  const showR=(cls,x,y)=>{ const c=CLASSES[cls]; ring(x,y,c.range*M.range[cls],c.color,'rgba(255,255,255,.08)');
    if(c.buffR) ring(x,y,buffR(),'#ffd65a','rgba(255,214,90,.14)',[10,8]); };
  if(S.sel) showR(S.sel.cls,S.sel.x,S.sel.y);
  else if(S.pick&&S.hover&&!S.heroes.some(h=>h.x===S.hover.x&&h.y===S.hover.y)) showR(S.pick,S.hover.x,S.hover.y);
  const ents=[]; for(const h of S.heroes) ents.push({y:h.y,f:()=>drawHero(h)}); for(const m of S.mons) ents.push({y:m.y,f:()=>drawMon(m)});
  for(const g of S.ghosts) ents.push({y:g.y,f:()=>drawGhost(g)});
  ents.sort((a,b)=>a.y-b.y); for(const e of ents) e.f();
  for(const s of S.shots){ if(s.hidden) continue; const k=s.t/s.dur;
    if(s.meteor){ const b=w2s(s.tx,s.ty), x=b.x+(1-k)*170, y=b.y-(1-k)*430;
      ctx.strokeStyle='rgba(255,170,60,.55)'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x+44,y-110); ctx.lineTo(x,y); ctx.stroke();
      ctx.fillStyle='#ff8a2a'; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(x-3,y+3,13,0,Math.PI*2); ctx.fill();
      ring(s.tx,s.ty,s.r,'rgba(255,120,40,.7)',null,[8,8]); continue; }
    const a=w2s(s.x,s.y), b=w2s(s.tx,s.ty), x=a.x+(b.x-a.x)*k, y=a.y-40+(b.y-a.y+40)*k-Math.sin(k*Math.PI)*30;
    ctx.fillStyle='rgba(150,110,255,.35)'; ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#b9a2ff'; ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); }
  for(const f of S.fx) drawFx(f);
  for(const f of S.floats){ const p=w2s(f.x,f.y), k=f.t/(f.slow?0.9:0.6);
    ctx.globalAlpha=1-k*k; label(f.txt,p.x,p.y-46-k*34,f.skill?22:f.big?25:19,f.col,f.skill?'#fff':null); }
  ctx.globalAlpha=1;
  if(!S.queue.length&&!S.mons.length&&!S.over&&!S.choosing) label('다음 웨이브 준비',CW/2,70,30,'#fff');
  else if(S.banner>0){ ctx.globalAlpha=Math.min(1,S.banner); label('웨이브 '+S.wave+' · '+typeLabel(),CW/2,64,32,S.wtype==='boss'?'#ff8a8a':'#fff');
    const tip=S.wtype==='boss'?'보스가 옵니다 — 기습과 홀리라이트를 겹치세요':S.wtype.split('+').map(k=>TYPES[k].tip).filter(Boolean)[0];
    if(tip) label(tip,CW/2,98,19,'#ffe9a8'); ctx.globalAlpha=1; }
}

// ---------- UI ----------
function syncHud(){ $('wave').textContent=Math.max(1,S.wave); $('gold').textContent=S.gold; $('life').textContent=Math.max(0,S.life);
  $('wtype').textContent=S.wave?typeLabel():'준비'; if(S.sel) showInfo(S.sel); }
function syncBar(){
  for(const k of ORDER){ const el=$('card-'+k); el.classList.toggle('sel',S.pick===k); el.classList.toggle('poor',S.gold<CLASSES[k].cost); }
  $('hint').textContent=S.pick?CLASSES[S.pick].name+' 선택됨 — 잔디 칸을 눌러 배치 (다시 누르면 취소)':'직업을 고른 뒤 잔디 칸에 배치하세요. 배치된 캐릭터를 누르면 전직·판매를 할 수 있습니다.';
}
function buildBar(){
  const bar=$('bar');
  for(const k of ORDER){ const c=CLASSES[k], b=document.createElement('button');
    b.className='card'; b.id='card-'+k; b.style.setProperty('--c',c.color);
    b.innerHTML='<canvas width="56" height="56"></canvas><div class="n">'+c.name+'</div><div class="c">💰 '+c.cost+'</div><div class="d">'+c.desc+'</div>';
    b.onclick=()=>{ S.pick=S.pick===k?null:k; S.sel=null; $('info').classList.remove('on'); syncBar(); };
    bar.appendChild(b);
    const g=b.querySelector('canvas').getContext('2d'), F=HJ[c.key].face; g.imageSmoothingEnabled=true;
    const paint=()=>g.drawImage(IMG.heroes,F[0],F[1],F[2],F[2],0,0,56,56);
    IMG.heroes.complete?paint():IMG.heroes.addEventListener('load',paint);
  }
}
function showInfo(h){
  const c=CLASSES[h.cls], pc=promoCost(h);
  $('infoText').innerHTML='<b style="color:'+c.color+'">'+c.tiers[h.tier]+'</b> '+'★'.repeat(h.tier)+' · 공격 <b>'+Math.round(dmgOf(h))+'</b>'+(h.buffed?' <span style="color:#ffd65a">(버프 x2)</span>':'')+
    '<br><span>'+c.skill+': '+c.sdesc+' · '+(c.scd*M.scd[h.cls]*(1-0.1*h.tier)).toFixed(1)+'초</span>';
  const pb=$('promo');
  if(h.tier>=2){ pb.textContent='최종 전직'; pb.disabled=true; }
  else{ pb.textContent='전직 → '+c.tiers[h.tier+1]+' 💰'+pc; pb.disabled=S.gold<pc; }
  $('sell').textContent='판매 +'+Math.floor(h.spent/2); $('info').classList.add('on');
}
function place(cls,s){ const c=CLASSES[cls]; if(S.gold<c.cost||S.heroes.some(h=>h.x===s.x&&h.y===s.y)) return null;
  S.gold-=c.cost; const h={cls,x:s.x,y:s.y,cd:0.3,anim:-1,adur:0.3,sk:false,flip:false,buffed:false,tier:0,haste:0,scd:c.scd*0.5,smax:c.scd,spent:c.cost};
  S.heroes.push(h); syncHud(); syncBar(); return h; }
function promote(h){ const pc=promoCost(h); if(h.tier>=2||S.gold<pc) return false;
  S.gold-=pc; h.spent+=pc; h.tier++; addFx('promo',h.x,h.y,3,34); shout(h,CLASSES[h.cls].tiers[h.tier]+' 전직!'); syncHud(); syncBar(); return true; }
function offerCards(){
  const pool=CARDS.filter(c=>!c.c||S.heroes.some(h=>h.cls===c.c)), pick=[];
  while(pick.length<3&&pool.length) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  S.choosing=true; S.offer=pick;
  const box=$('cardList'); box.innerHTML='';
  pick.forEach((c,i)=>{ const b=document.createElement('button'); b.className='pick';
    b.style.setProperty('--c',c.c?CLASSES[c.c].color:'#f2c14e');
    b.innerHTML='<div class="k">'+(c.c?CLASSES[c.c].name+' 계열':'공통')+'</div><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div>';
    b.onclick=()=>pickCard(i); box.appendChild(b); });
  $('cardTitle').textContent='웨이브 '+S.wave+' 클리어! 보상을 고르세요';
  $('cards').classList.add('on');
}
function pickCard(i){ if(!S.choosing) return; const c=S.offer[i]; c.f(M,S); S.picked.push(c.t); S.choosing=false;
  $('cards').classList.remove('on'); syncHud(); syncBar(); }
function evPos(e){ const r=cv.getBoundingClientRect(); return s2w((e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height); }
cv.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse'){ const w=evPos(e); S.hover=slotOf(w.x,w.y); } });
cv.addEventListener('pointerleave',()=>{ S.hover=null; });
cv.addEventListener('pointerdown',e=>{
  if(S.over||S.choosing) return;
  const w=evPos(e), s=slotOf(w.x,w.y); if(!s){ S.sel=null; $('info').classList.remove('on'); return; }
  const h=S.heroes.find(h=>h.x===s.x&&h.y===s.y);
  if(h){ S.sel=h; S.pick=null; h.buffed=isBuffed(h); showInfo(h); syncBar(); return; }
  S.sel=null; $('info').classList.remove('on');
  if(S.pick){ if(S.gold<CLASSES[S.pick].cost){ $('hint').textContent='골드가 부족합니다 ('+CLASSES[S.pick].cost+' 필요)'; return; }
    place(S.pick,s); if(e.pointerType!=='mouse') S.hover=null; }
});
$('promo').onclick=()=>{ if(S.sel&&promote(S.sel)) showInfo(S.sel); };
$('sell').onclick=()=>{ if(!S.sel) return; S.gold+=Math.floor(S.sel.spent/2); S.heroes=S.heroes.filter(h=>h!==S.sel); S.sel=null;
  $('info').classList.remove('on'); syncHud(); syncBar(); };
$('closeInfo').onclick=()=>{ S.sel=null; $('info').classList.remove('on'); };
$('speed').onclick=()=>{ S.speed=S.speed===1?2:S.speed===2?3:1; $('speed').textContent='▶ x'+S.speed; };
$('retry').onclick=()=>{ const sp=S.speed; reset(); S.speed=sp; };

// ---------- 루프 ----------
let last=0;
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0); last=t;
  if(!S.over&&!S.choosing){ for(let i=0;i<S.speed;i++){ update(dt); if(S.choosing||S.over) break; } }
  draw(); requestAnimationFrame(frame);
}
buildBar(); reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
