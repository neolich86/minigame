<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="/play/archer">
<script src="/mgh/bridge.js"></script><script src="/mgh/i18n/archer.js"></script><script src="/mgh/result.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>궁수 서바이버 — Archer Survivor</title>
<meta name="description" content="사방에서 몰려오는 몬스터를 자동 사격으로 처치하고, 레벨업마다 스킬을 골라 성장하는 뱀서라이크 로그라이트.">
<meta name="theme-color" content="#12161c">
<meta property="og:title" content="궁수 서바이버">
<meta property="og:description" content="자동 사격 궁수로 끝없이 몰려오는 몬스터를 버텨내세요. 5분마다 보스 등장.">
<meta property="og:type" content="website">
<style>
:root{
  --bg-void:#0d1116;
  --bg-deep:#12161c;
  --panel:#1b212a;
  --panel-2:#232b36;
  --line:#39434f;
  --gold:#f5b73d;
  --gold-lt:#ffe1a0;
  --gold-dk:#a97a18;
  --cloak:#5d7f52;
  --blood:#d94b3c;
  --xp:#4fb0e8;
  --ink:#e8e2d6;
  --ink-dim:#93a0ad;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg-void)}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:15px;border:2px solid #0c0f13;border-radius:3px;background:#0f1318;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
.bar > i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);transition:transform .14s ease-out;display:block}
#hpFill{background:linear-gradient(180deg,#f2705d,#c0392b 60%,#8e2418)}
#xpFill{background:linear-gradient(180deg,#ffe1a0,var(--gold) 55%,#c08a12)}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.4px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.topRow{display:flex;align-items:center;gap:8px}
.lvBadge{
  flex:none;min-width:52px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.5px;
  padding:3px 7px;border-radius:3px;color:#241a05;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk));
  border:2px solid #0c0f13;box-shadow:0 2px 0 rgba(0,0,0,.4)
}
.topRow .bar{flex:1}
#statLine{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--ink-dim);letter-spacing:.3px;text-shadow:0 1px 3px #000}
#statLine span{display:inline-flex;align-items:center;gap:4px}
#timeTxt{font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink);font-weight:800}
#btnPause{
  pointer-events:auto;position:absolute;right:10px;top:calc(66px + env(safe-area-inset-top));
  width:36px;height:36px;border-radius:4px;border:2px solid var(--line);
  background:rgba(27,33,42,.85);color:var(--ink-dim);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center
}
#btnPause:active{background:var(--panel-2)}

/* skill chips */
#chips{display:flex;flex-wrap:wrap;gap:3px;max-width:min(62vw,300px);margin-top:2px}
.chip{
  display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;
  padding:2px 5px;border-radius:3px;background:rgba(18,22,28,.8);border:1px solid var(--line);color:var(--ink-dim)
}
.chip u{text-decoration:none;color:var(--gold);font-weight:900}

/* ---------- joystick ---------- */
#stick{position:fixed;width:120px;height:120px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
#stick.on{opacity:.75}
#stick .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(245,183,61,.45);background:rgba(13,17,22,.35)}
#stick .nub{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-lt),var(--gold) 45%,var(--gold-dk));border:3px solid #0c0f13}

/* ---------- overlays ---------- */
.veil{
  position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;background:rgba(9,12,16,.86);backdrop-filter:blur(3px);overflow-y:auto
}
.veil.show{display:flex}
.title{
  font-size:clamp(30px,8vw,54px);font-weight:900;letter-spacing:-1px;line-height:1;text-align:center;
  background:linear-gradient(180deg,#fff5dd,var(--gold) 50%,#9b6f11);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))
}
.sub{margin-top:8px;font-size:13px;color:var(--ink-dim);text-align:center;line-height:1.7;max-width:340px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);font-size:11px;font-weight:700}
.btn{
  margin-top:22px;padding:13px 40px;border:none;border-radius:5px;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:900;letter-spacing:1px;color:#241a05;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold) 50%,var(--gold-dk));
  box-shadow:0 4px 0 #6d4c07,0 8px 18px rgba(0,0,0,.5);transition:transform .06s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6d4c07}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 #10141a;font-size:14px;padding:10px 26px}

/* level up */
#lvup{background:rgba(9,12,16,.9)}
.lvHead{text-align:center;margin-bottom:16px}
.lvHead h2{font-size:clamp(22px,6vw,32px);font-weight:900;color:var(--gold);letter-spacing:-.5px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.lvHead p{font-size:12px;color:var(--ink-dim);margin-top:4px;letter-spacing:2px;font-weight:700}
#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.card{
  pointer-events:auto;flex:1 1 190px;max-width:210px;min-width:150px;cursor:pointer;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:2px solid var(--line);border-radius:7px;padding:14px 12px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  transition:transform .1s,border-color .1s,box-shadow .1s;position:relative;overflow:hidden
}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--rc,var(--line))}
.card{border-color:color-mix(in srgb,var(--rc,#39434f) 55%,#1b212a)}
.card:hover{border-color:var(--rc,var(--line));box-shadow:0 0 22px -6px var(--rc,#000)}
.card .ic{width:46px;height:46px;flex:none}
.card h3{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.3px}
.card p{font-size:12px;color:var(--ink-dim);line-height:1.5;min-height:34px}
.card .lvl{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--rc,var(--ink-dim))}
.card .key{position:absolute;left:7px;top:6px;font-size:10px;font-weight:900;color:var(--ink-dim);opacity:.6}
.newTag{position:absolute;right:7px;top:6px;font-size:9px;font-weight:900;letter-spacing:1px;color:#241a05;background:var(--gold);padding:1px 5px;border-radius:2px}

/* results */
#over .grid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;margin-top:20px;width:100%;max-width:340px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--ink-dim);letter-spacing:1px;font-weight:700}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:2px}
#overTitle{font-size:clamp(26px,7vw,42px);font-weight:900;color:var(--blood);text-shadow:0 3px 0 rgba(0,0,0,.6);letter-spacing:-1px}

/* boss banner + toast */
#boss{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:15;opacity:0}
#boss.play{animation:bossIn 2.6s ease-out forwards}
#boss b{display:inline-block;font-size:clamp(24px,7vw,44px);font-weight:900;color:var(--blood);letter-spacing:4px;text-shadow:0 0 20px #000,0 3px 0 #2a0c08}
#boss i{display:block;font-style:normal;font-size:12px;letter-spacing:6px;color:var(--gold);margin-top:6px;font-weight:800}
@keyframes bossIn{0%{opacity:0;transform:scale(1.5)}18%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#hpBoss{width:min(74vw,420px);max-width:100%;margin:2px auto 0;display:none}
#hpBoss.on{display:block}
#hpBoss .nm{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--blood);text-align:center;margin-bottom:3px;text-shadow:0 1px 3px #000}
#hpBoss .bar{height:10px}
#hpBoss .bar i{background:linear-gradient(180deg,#ff8a73,#c0392b 55%,#6e1a11)}
#buffBanner{display:none;margin:2px auto 0;width:fit-content;font-size:11px;font-weight:900;letter-spacing:1px;
  padding:3px 10px;border-radius:3px;color:#241a05;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk));
  border:2px solid #0c0f13;box-shadow:0 2px 0 rgba(0,0,0,.4);
  animation:buffPulse 1s ease-in-out infinite}
#buffBanner.on{display:block}
@keyframes buffPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#slotMachine{display:none;margin:3px auto 0;width:fit-content}
#slotMachine.on{display:block}
#slotMachine .slotWindow{
  padding:3px 14px;border-radius:4px;text-align:center;
  background:linear-gradient(180deg,#1b212a,#0c0f13);
  border:2px solid var(--gold-dk);box-shadow:inset 0 0 8px rgba(0,0,0,.7), 0 2px 0 rgba(0,0,0,.4);
  overflow:hidden
}
#slotMachine #slotText{
  display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--gold-lt);
  text-shadow:0 0 6px rgba(245,183,61,.6)
}
#slotMachine.spin #slotText{filter:blur(1.5px);animation:slotShake .08s linear infinite}
#slotMachine.landed{animation:slotLand .4s ease-out}
#slotMachine.landed .slotWindow{border-color:var(--gold)}
@keyframes slotShake{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
@keyframes slotLand{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="topRow">
    <div class="lvBadge" id="lvTxt">LV 1</div>
    <div class="bar"><i id="xpFill"></i><b id="xpTxt">0 / 15</b></div>
  </div>
  <div class="bar"><i id="hpFill"></i><b id="hpTxt">100 / 100</b></div>
  <div id="slotMachine"><div class="slotWindow"><span id="slotText">?</span></div></div>
  <div id="statLine">
    <span id="killTxt">☠ 0</span>
    <span id="timeTxt">00:00</span>
    <span id="shieldTxt"></span>
  </div>
  <div id="hpBoss"><div class="nm" id="bossNm">BOSS</div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="buffBanner"></div>
  <div id="chips"></div>
  <button id="btnPause" aria-label="일시정지">❚❚</button>
</div>

<div id="boss"><b id="bossWord">B O S S</b><i id="bossSub">경계하라</i></div>

<div id="stick"><div class="ring"></div><div class="nub" id="nub"></div></div>

<!-- start -->
<div class="veil show" id="start">
  <div class="title">궁수 서바이버</div>
  <div class="sub">
    사방에서 몰려오는 몬스터를 처치하세요.<br>
    레벨업마다 스킬을 고르고<br>
    <b style="color:var(--blood)">5분마다 등장하는 보스</b>를 처치하세요.
  </div>
  <button class="btn" id="btnStart">사냥 시작</button>
  <div class="sub" style="margin-top:18px;font-size:11px;opacity:.8">
    이동 <span class="kbd">W A S D</span> <span class="kbd">←↑↓→</span> · 모바일은 화면을 끌어서 조작<br>
    스킬 선택 <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> · 일시정지 <span class="kbd">ESC</span>
  </div>
</div>

<!-- level up -->
<div class="veil" id="lvup">
  <div class="lvHead">
    <h2 id="lvupTitle">LEVEL UP</h2>
    <p>강화할 능력을 선택하세요</p>
  </div>
  <div id="cards"></div>
</div>

<!-- pause -->
<div class="veil" id="pause">
  <div class="title" style="font-size:clamp(24px,7vw,40px)">일시정지</div>
  <div class="sub" id="pauseStats"></div>
  <button class="btn" id="btnResume">계속하기</button>
  <button class="btn ghost" id="btnQuit">처음부터</button>
</div>

<!-- game over -->
<div class="veil" id="over">
  <div id="overTitle">쓰러졌다</div>
  <div class="sub" id="overSub">더 깊이 갈 수 있었다.</div>
  <div class="grid">
    <div class="stat"><i>생존 시간</i><b id="oTime">00:00</b></div>
    <div class="stat"><i>도달 레벨</i><b id="oLv">1</b></div>
    <div class="stat"><i>처치 수</i><b id="oKill">0</b></div>
    <div class="stat"><i>보스 격파</i><b id="oBoss">0</b></div>
  </div>
  <button class="btn" id="btnRetry">다시 도전</button>
  <button class="btn" id="btnVs" style="display:none;margin-top:10px;background:linear-gradient(90deg,#ff7a3d,#ffb43d);color:#1d0f00">🔥 친구에게 도전하기</button>
</div>

/* 몬스터 / 보스 이미지는 SPR(mon1~mon15, boss1~boss5)에 base64로 내장되어 있습니다.
   교체하려면 boot() 근처에서 SPR['mon1'] 등을 다른 data URL로 덮어쓰면 됩니다. */
const MONSTER_KEYS = Array.from({length:15},(_,i)=>'mon'+(i+1));
const BOSS_KEYS = Array.from({length:5},(_,i)=>'boss'+(i+1));

/* ---------------------------------------------------------- 기본 유틸 */
if(typeof CanvasRenderingContext2D!=='undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(typeof r==='number'?r:(r&&r[0])||0, Math.abs(w)/2, Math.abs(h)/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}
const TAU = Math.PI*2;
const rnd = (a=1,b=0)=> b + Math.random()*(a-b);
const rint = (a,b)=> Math.floor(rnd(b+1,a));
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp = (a,b,t)=> a+(b-a)*t;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
function fmtTime(s){const m=Math.floor(s/60),x=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

/* ---------------------------------------------------------- 캔버스 */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = true;
  // 화면이 작을수록(모바일) 시야가 좁게 느껴지지 않도록 살짝 축소해 더 넓은 범위를 보여준다
  ZOOM = clamp(Math.min(W,H)/620, 0.62, 1.0);
}
addEventListener('resize', resize); resize();

/* ---------------------------------------------------------- 이미지 로드 */
const IMG = {};
let loaded = 0, total = 0;
function loadAll(cb){
  const keys = Object.keys(SPR);
  total = keys.length;
  if(!total) return cb();
  keys.forEach(k=>{
    const im = new Image();
    im.onload = im.onerror = ()=>{ if(++loaded>=total) cb(); };
    im.src = SPR[k];
    IMG[k]=im;
  });
}

/* ==========================================================================
   몬스터 아트 — 오프스크린 캔버스에 프리렌더
   ========================================================================== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const OUT = '#161a20';

function shade(g,x0,y0,x1,y1,c1,c2){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr}
function eyes(g,x,y,r,gap,col='#fff',pup='#141820'){
  for(const s of [-1,1]){
    g.beginPath();g.ellipse(x+s*gap,y,r,r*1.15,0,0,TAU);g.fillStyle=col;g.fill();
    g.beginPath();g.ellipse(x+s*gap+s*r*.18,y+r*.15,r*.45,r*.6,0,0,TAU);g.fillStyle=pup;g.fill();
  }
}
function body(g,fn,fill,line=OUT,lw=3.2){
  g.beginPath();fn();g.fillStyle=fill;g.fill();g.lineWidth=lw;g.strokeStyle=line;g.stroke();
}

/* 각 몬스터 그리기: (g, S, f)  S=기준 크기, f=0|1 애니 프레임 — 현재 미사용(실사 이미지로 대체), 폴백용으로만 보관 */
const ART = {
  /* 슬라임 — 납작하고 넓은 젤리 돔 */
  slime(g,S,f){
    const cx=S*0.5, by=S*0.88, sq=f?0.07:-0.05;
    const w=S*0.33*(1+sq), h=S*0.40*(1-sq*1.5);
    body(g,()=>{
      g.moveTo(cx-w,by);

  /* 골렘 — 각진 바위 덩어리, 빛나는 코어 */
  golem(g,S,f){

const ELEM = {
  none :{key:'none' ,tint:null,      name:''    ,hp:1   ,dmg:1  ,spd:1   },

  bolt :{key:'bolt' ,tint:'#ffe14d', name:'뇌전',hp:1   ,dmg:1.1,spd:1.35},

const SPRITE_CACHE = {};
function monsterSprite(type, elem, sizeH, boss){
  const key = type+'|'+elem+'|'+sizeH+'|'+(boss?1:0);
  if(SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const src = IMG[type];
  const aspect = (src && src.width && src.height) ? src.width/src.height : 1;
  const H = sizeH, Wd = Math.max(1, Math.round(H*aspect));
  const pad = Math.ceil(H*(boss?0.16:0.10));
  const c = mkCanvas(Wd+pad*2, H+pad*2);
  c._pad = pad;
  const g = c.getContext('2d');
  g.save(); g.translate(pad,pad);
  if(src && src.width) g.drawImage(src,0,0,Wd,H);
  else (ART.slime)(g,H,0); // 이미지 로드 실패 시에만 폴백
  g.restore();

  const tint = ELEM[elem]?.tint;
  if(tint){
    g.save();
    g.globalCompositeOperation='source-atop';
    g.globalAlpha=.24; g.fillStyle=tint; g.fillRect(0,0,c.width,c.height);
    g.restore();
  }

  if(boss){
    // 실루엣 기반 붉은 림 글로우로 위협감 부여 (원본 보스 아트는 그대로 유지)
    const sil = mkCanvas(c.width,c.height), sg = sil.getContext('2d');
    sg.drawImage(c,0,0);
    sg.globalCompositeOperation='source-in';
    sg.fillStyle='#ff4028'; sg.fillRect(0,0,c.width,c.height);
    const out = mkCanvas(c.width,c.height), og = out.getContext('2d');
    out._pad = pad;
    const k = Math.max(1.4, H*0.016);
    og.globalAlpha=.6;
    for(let i=0;i<10;i++){ const a=i/10*TAU; og.drawImage(sil, Math.cos(a)*k, Math.sin(a)*k) }
    og.globalAlpha=1; og.drawImage(c,0,0);
    SPRITE_CACHE[key]=out; return out;
  }
  SPRITE_CACHE[key]=c;
  return c;
}

let groundPat = null;
function buildGround(){
  const S=256, c=mkCanvas(S,S), g=c.getContext('2d');
  g.fillStyle='#222a23'; g.fillRect(0,0,S,S);

function timeScale(){ const m = game.t/60; return 1 + m*0.30 + Math.pow(m,1.85)*0.030 }
function elemForTime(){
  const t = game.t;
  if(t<150) return 'none';
  const pool = ['none','none','fire','ice'];
  if(t>210) pool.push('pois','bolt');
  if(t>300) pool.push('dark','bolt','pois');
  if(t>420) pool.push('dark','dark');
  return pick(pool);
}
function spawnEnemy(){
  const avail = MTYPES.filter(m=>game.t>=m.t);
  const w = avail.map((m,i)=> i===avail.length-1?3:(i>=avail.length-3?2.4:1));
  let tot=w.reduce((a,b)=>a+b,0), r=Math.random()*tot, mi=0;
  for(let i=0;i<avail.length;i++){ r-=w[i]; if(r<=0){mi=i;break} }
  const M = avail[mi];
  const el = ELEM[elemForTime()];
  const ts = timeScale();
  const ang = rnd(TAU);
  const rad = Math.hypot(W,H)*0.5/1 + 70;
  enemies.push({
    k:M.k, name:M.name, el:el.key,
    x:P.x+Math.cos(ang)*rad, y:P.y+Math.sin(ang)*rad,
    hp:M.hp*ts*el.hp, hpMax:M.hp*ts*el.hp,
    spd:M.spd*el.spd*(1+Math.min(0.55,game.t/700))*rnd(1.08,0.92),
    dmg:M.dmg*el.dmg*(1+game.t/380), r:M.r, xp:M.xp*(0.7+ts*0.22),
    size:M.size, face:1, ph:rnd(TAU), flash:0, kx:0, ky:0, boss:false, hitT:0, trapT:0,
    freezeT:0, chill:0, poisonStk:0, poisonT:0, slowT:0
  });
}
function spawnBoss(tier){
  const B = BOSSES[(tier-1)%BOSSES.length];
  const mul = 1 + (tier-1)*0.55;
  // 보스 체력은 '현재 화력 기준 몇 초짜리 싸움인가'로 맞춘다 → 항상 팽팽한 전투
  // 단, 관통(pierce)과 폭발(aoe)은 실제로 보스 '자기 자신'에게는 추가 피해를 주지 않으므로
  // (관통은 이미 맞은 대상 재타격 불가, 폭발은 원래 타격 대상 제외) 단일 보스 화력 추정에서 제외한다.
  // 멀티샷도 부채꼴로 퍼져 나가 단일 목표에는 일부만 명중하므로 보정한다.
  const effMulti = 1 + (P.multi-1)*0.4;
  let estDPS = (P.dmg*effMulti*P.aspd/0.56)*(1+P.crit*1.2)
                 +(P.aura*(P.dmg*0.6+3)*2)
                 +(P.bolt*P.dmg*1.6/3)+(P.trap*(P.dmg*0.9)*0.6);
  if(P.meteor>0) estDPS += (P.meteor>=2?2:1)*P.dmg*(2.4+P.meteor*0.5)/6.5;
  if(P.blackhole>0) estDPS += P.dmg*(2.0+P.blackhole*0.6)/11;
  if(P.poison>0) estDPS += P.dmg*(0.5+P.poison*0.25)/0.4*0.5;
  if(P.roulette>0){
    const interval = P.roulette===1?30:P.roulette===2?20:10;
    const uptime = Math.min(1, 7/interval);
    estDPS *= (1 + uptime*0.4);
  }
  // 안전장치: 시작 스탯(공격력15·관통1) 기준 DPS로도 40초 안에는 반드시 잡히도록 하는 하한선.
  // 실제 플레이어 DPS는 이 값 이상만 나오므로(스탯이 줄어드는 스킬은 없음) 항상 40초 이내가 보장된다.
  // 시간 경과에 따라 무한히 불어나던 이전 공식(시간배율×티어배율)을 제거해 재현했다.
  const relPower = B.hp / 49.2; // 보스별 상대 강함 (트리 0.69 ~ 드래곤 1.38)
  const BASELINE_DPS = 15*1*1/0.56; // ≈26.8 (시작 스탯: 공격력15·배속1·공속1, 단일 대상 기준)
  const floorHP = BASELINE_DPS * 27 * relPower;
  const dpsHP = estDPS*(16+tier*2.4)*relPower;
  const bossHP = Math.max(floorHP, dpsHP);
  const ang = rnd(TAU), rad = Math.hypot(W,H)*0.5+110;
  const e = {
    k:B.k, name:B.name+(tier>5?` +${tier-5}`:''), el: tier>=3?'dark': tier>=2?'fire':'none',
    x:P.x+Math.cos(ang)*rad, y:P.y+Math.sin(ang)*rad,
    hp:bossHP, hpMax:bossHP,
    spd:Math.max(B.spd, 104)*(1+tier*0.035), dmg:(B.dmg*1.7+16)*(1+game.t/380),
    r:B.r, xp:B.xp*mul, size:B.size,
    face:1, ph:0, flash:0, kx:0, ky:0, boss:true, tier:tier, hitT:0, rageT:0, trapT:0,
    freezeT:0, chill:0, poisonStk:0, poisonT:0, slowT:0
  };
  enemies.push(e);
  game.boss = e;
  // 보스 등장 시 기존에 몰려있던 일반 몬스터를 정리해 보스전 화살이 막히지 않도록 함
  if(enemies.length>1){
    const others = enemies.filter(o=>!o.boss);
    if(others.length>10){
      others.sort((a,b)=>dist2(P.x,P.y,b.x,b.y)-dist2(P.x,P.y,a.x,a.y));
      const removeN = others.length-10;
      for(let i=0;i<removeN;i++){
        const idx = enemies.indexOf(others[i]);
        if(idx>=0) enemies.splice(idx,1);
      }
    }
  }
  bossWord.textContent = 'B O S S';
  bossSub.textContent = e.name;
  bossEl.classList.remove('play'); void bossEl.offsetWidth; bossEl.classList.add('play');
  bossNm.textContent = e.name;
  hpBossEl.classList.add('on');
  shake(0.5, 9);
}

const stickEl=document.getElementById('stick'), nubEl=document.getElementById('nub');

function tStart(e){
  if(game?.paused||game?.picking||game?.over) return;
  const t=e.changedTouches?e.changedTouches[0]:e;
  if(e.target.closest('button')) return;
  touch.on=true; touch.id=t.identifier??'m'; touch.ox=t.clientX; touch.oy=t.clientY; touch.dx=0;touch.dy=0;
  stickEl.style.left=(t.clientX-60)+'px'; stickEl.style.top=(t.clientY-60)+'px';
  stickEl.classList.add('on'); nubEl.style.transform='';
}
function tMove(e){
  if(!touch.on)return;
  const list=e.changedTouches?[...e.changedTouches]:[e];
  const t=list.find(x=>(x.identifier??'m')===touch.id); if(!t)return;
  let dx=t.clientX-touch.ox, dy=t.clientY-touch.oy;
  const d=Math.hypot(dx,dy), max=46;
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  touch.dx=dx/max; touch.dy=dy/max;
  nubEl.style.transform=`translate(${dx}px,${dy}px)`;
  e.preventDefault();
}
function tEnd(){ touch.on=false;touch.dx=0;touch.dy=0;stickEl.classList.remove('on') }

const GRID=96; let grid=new Map();
function gkey(x,y){return ((x/GRID)|0)+','+((y/GRID)|0)}
function rebuildGrid(){
  grid.clear();
  for(const e of enemies){
    const k=gkey(e.x,e.y);
    let a=grid.get(k); if(!a){a=[];grid.set(k,a)} a.push(e);
  }
}
function near(x,y,rad,cb){
  const c0=((x-rad)/GRID)|0,c1=((x+rad)/GRID)|0,r0=((y-rad)/GRID)|0,r1=((y+rad)/GRID)|0;
  for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++){
    const a=grid.get(c+','+r); if(!a)continue;
    for(const e of a) cb(e);
  }
}

function update(dt){
  game.t += dt;

  /* --- 이동 --- */
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx--; if(keys['d']||keys['arrowright'])mx++;
  if(keys['w']||keys['arrowup'])my--;  if(keys['s']||keys['arrowdown'])my++;
  if(touch.on){mx+=touch.dx;my+=touch.dy}
  const ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml}
  const moving = ml>0.08;
  const buffSpd = P.buffType==='spd3' ? 3 : 1;
  P.x+=mx*P.spd*buffSpd*dt; P.y+=my*P.spd*buffSpd*dt;
  P.anim += dt*(moving?9.5:3.4);
  if(moving && Math.abs(mx)>0.05) P.face = mx>0?1:-1;

  cam.x = lerp(cam.x, P.x, 1-Math.pow(0.0006,dt));
  cam.y = lerp(cam.y, P.y, 1-Math.pow(0.0006,dt));

  /* --- 스폰 --- */
  let rate = Math.min(11, 0.70 + game.t/95 + Math.pow(game.t/60,1.35)*0.28);
  if(game.boss) rate *= 0.05;          // 보스전 동안 잡몹 압박 대폭 완화 (몬스터 벽에 화살이 막히는 문제 방지)
  game.spawnT += dt*rate;
  const cap = game.boss? 12 : 160;
  while(game.spawnT>=1){ game.spawnT-=1; if(enemies.length<cap) spawnEnemy(); }

  if(!game.boss && game.t>=game.nextBossT){
    game.bossTier++; spawnBoss(game.bossTier); game.nextBossT += BOSS_INTERVAL;
  }

  rebuildGrid();

  /* --- 자동 공격 --- */
  P.atkT -= dt;
  if(P.atkT<=0){
    let best=null,bd=P.range*P.range;
    for(const e of enemies){ const d=dist2(P.x,P.y,e.x,e.y); if(d<bd){bd=d;best=e} }
    // 보스가 사거리 안이면 우선 조준 (잡몹에 가려 보스를 못 때리는 문제 방지)
    if(game.boss && dist2(P.x,P.y,game.boss.x,game.boss.y) < P.range*P.range*1.15) best=game.boss;
    if(best){
      const base = Math.atan2(best.y-P.y,best.x-P.x);
      P.face = Math.cos(base)>0?1:-1;
      const n=P.multi, spread=Math.min(0.52, 0.11*(n-1));
      for(let i=0;i<n;i++){
        const a = base + (n>1? (i/(n-1)-0.5)*2*spread : 0);
        shoot(a);
      }
      P.atkT = 0.56/(P.aspd*(P.buffType==='aspd2'?2:1));
      P.atkAnim = 0;
    }
  }
  if(P.atkAnim>=0){ P.atkAnim += dt; if(P.atkAnim>0.34) P.atkAnim=-1 }

  /* --- 가시 오라 (지속 범위 피해) --- */
  if(P.aura>0){
    P.auraT -= dt;
    if(P.auraT<=0){
      P.auraT = 0.5;
      const R = 64+P.aura*17, dmg = pdmg()*(0.9+P.aura*0.55);
      near(P.x,P.y,R,e=>{ if(dist2(P.x,P.y,e.x,e.y)<R*R) hurt(e,dmg,e.x,e.y,false) });
      ring(P.x,P.y,R,'#c9ff5a',.4);
      fx.push({aura:1,x:P.x,y:P.y,r:R,t:0,life:.4});
    }
  }

  /* --- 가시 장판 (근접 시 1회 밀쳐내는 장판) --- */
  if(P.trap>0){
    const TR = 58;
    const dmg = pdmg()*(0.7+P.trap*0.35);
    near(P.x,P.y,TR,e=>{
      if(e.trapT>0) return;
      if(dist2(P.x,P.y,e.x,e.y) < TR*TR){
        hurt(e, dmg, e.x, e.y, false);
        const a = Math.atan2(e.y-P.y, e.x-P.x);
        e.kx += Math.cos(a)*360; e.ky += Math.sin(a)*360;
        e.trapT = 1.1;
        fx.push({trap:1,x:e.x,y:e.y,r:38,t:0,life:.35});
        ring(e.x,e.y,42,'#d9b25a',.3);
      }
    });
  }

  /* --- 벼락 (3초마다 무작위 대상에게 낙뢰) --- */
  if(P.bolt>0){
    P.boltT -= dt;
    if(P.boltT<=0){
      P.boltT = 3.0;
      const visible = enemies.filter(e=>Math.abs(e.x-cam.x)<(W/2)/ZOOM+40 && Math.abs(e.y-cam.y)<(H/2)/ZOOM+40);
      const pool = visible.length? visible : enemies;
      const targets = [];
      const usedIdx = new Set();
      for(let i=0;i<P.bolt && pool.length;i++){
        let idx = rint(0,pool.length-1), tries=0;
        while(usedIdx.has(idx) && tries<6){ idx=rint(0,pool.length-1); tries++; }
        usedIdx.add(idx); targets.push(pool[idx]);
      }
      const dmg = pdmg()*1.6, R=72;
      for(const t of targets){
        if(!t) continue;
        fx.push({bolt:1,x:t.x,y:t.y,t:0,life:.32});
        near(t.x,t.y,R,o=>{ if(dist2(t.x,t.y,o.x,o.y)<R*R) hurt(o,dmg,o.x,o.y,false) });
        shake(0.1,3);
      }
    }
  }

  /* --- 운석 낙하 --- */
  if(P.meteor>0){
    P.meteorT -= dt;
    if(P.meteorT<=0){
      P.meteorT = 3.0;
      const count = P.meteor>=2 ? 2 : 1;
      const R = 95 + (P.meteor>=4?45:0);
      for(let i=0;i<count;i++){
        const ang = rnd(TAU), rad = rnd(Math.min(W,H)*0.42, 60);
        meteors.push({
          x:P.x+Math.cos(ang)*rad, y:P.y+Math.sin(ang)*rad,
          r:R, t:0.7, dmg:pdmg()*(2.4+P.meteor*0.5), fire:P.meteor>=3
        });
      }
    }
  }
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.t -= dt;
    if(m.t<=0){
      near(m.x,m.y,m.r,o=>{
        if(dist2(m.x,m.y,o.x,o.y)<m.r*m.r){
          hurt(o,m.dmg,o.x,o.y,false);
          const a=Math.atan2(o.y-m.y,o.x-m.x);
          o.kx += Math.cos(a)*420; o.ky += Math.sin(a)*420;
        }
      });
      ring(m.x,m.y,m.r,'#ff8a3c',.5); ring(m.x,m.y,m.r*1.4,'#ffd88a',.4);
      burst(m.x,m.y,24,'#ff9c4a',300,.6,4);
      if(m.fire) zones.push({x:m.x,y:m.y,r:m.r*0.72,type:'fire',t:0,life:3.2,tickT:0});
      meteors.splice(i,1);
    }
  }

  /* --- 블랙홀 --- */
  if(P.blackhole>0){
    P.blackholeT -= dt;
    if(P.blackholeT<=0){
      P.blackholeT = 11;
      const ang = rnd(TAU), rad = rnd(Math.min(W,H)*0.35, 80);
      blackholes.push({
        x:P.x+Math.cos(ang)*rad, y:P.y+Math.sin(ang)*rad,
        r:90+P.blackhole*14, t:0, life:2.6, dmg:pdmg()*(2.0+P.blackhole*0.6)
      });
    }
  }
  for(let i=blackholes.length-1;i>=0;i--){
    const bh=blackholes[i];
    bh.t += dt;
    near(bh.x,bh.y,bh.r,e=>{
      const dx=bh.x-e.x, dy=bh.y-e.y, d=Math.hypot(dx,dy)||1;
      if(d<bh.r){
        const pull = Math.min(d, (e.boss?140:320)*dt);
        e.x += dx/d*pull; e.y += dy/d*pull;
        e.slowT = 0.3;
      }
    });
    if(bh.t>=bh.life){
      near(bh.x,bh.y,bh.r*1.15,e=>{ if(dist2(bh.x,bh.y,e.x,e.y)<(bh.r*1.15)**2) hurt(e,bh.dmg,e.x,e.y,false) });
      ring(bh.x,bh.y,bh.r*1.3,'#c47bff',.5); ring(bh.x,bh.y,bh.r*1.7,'#7a3cff',.45);
      burst(bh.x,bh.y,26,'#a35bff',280,.6,4);
      shake(0.35,9);
      blackholes.splice(i,1);
    }
  }

  /* --- 독구름 --- */
  if(P.poison>0){
    if(!poisonCloud) poisonCloud = {x:P.x+60,y:P.y,ang:rnd(TAU),turnT:2,tickT:0};
    const pc = poisonCloud;
    pc.turnT -= dt;
    if(pc.turnT<=0){ pc.turnT=rnd(3,1.4); pc.ang += rnd(2.2,-2.2); }
    const leash = 240;
    const dx=P.x-pc.x, dy=P.y-pc.y, d=Math.hypot(dx,dy);
    let mvx=Math.cos(pc.ang), mvy=Math.sin(pc.ang);
    if(d>leash){ mvx=dx/d; mvy=dy/d; }
    pc.x += mvx*46*dt; pc.y += mvy*46*dt;
    const R = 110+P.poison*24;
    pc.tickT -= dt;
    if(pc.tickT<=0){
      pc.tickT = 0.4;
      const dmg = pdmg()*(0.5+P.poison*0.25);
      near(pc.x,pc.y,R,e=>{
        if(dist2(pc.x,pc.y,e.x,e.y)<R*R){
          hurt(e,dmg,e.x,e.y,false);
          e.poisonStk = Math.min(P.poison+1, (e.poisonStk||0)+1);
          e.poisonT = Math.min(e.poisonT||0.55, 0.55); e.poisonDecayT = 1.4;
        }
      });
    }
  }

  /* --- 행운의 룰렛 (슬롯머신 연출) --- */
  const ROULETTE_BUFFS = ['aspd2','spd3','crit100','dmg2','invuln'];
  if(P.roulette>0){
    if(P.rouletteResultT>0) P.rouletteResultT -= dt; // 당첨 플래시는 버프 지속과 무관하게 항상 감소
    if(P.buffT>0){
      P.buffT -= dt;
      if(P.buffT<=0){ P.buffType=null; }
    } else if(P.rouletteSpin>0){
      // 슬롯머신이 도는 중: 빠르게 후보 이름을 바꿔가며 표시
      P.rouletteSpin -= dt;
      P.rouletteSwapT -= dt;
      if(P.rouletteSwapT<=0){
        P.rouletteSwapT = 0.06 + (1-clamp(P.rouletteSpin/1.6,0,1))*0.12;
        P.rouletteSpinTxt = pick(ROULETTE_BUFFS);
      }
      if(P.rouletteSpin<=0){
        // 당첨: 실제 버프 확정 적용
        P.buffType = pick(ROULETTE_BUFFS);
        P.rouletteSpinTxt = P.buffType;
        P.buffT = 7;
        P.rouletteResultT = 1.1;
        const names=BUFF_NAMES;
        popText(P.x,P.y-46,names[P.buffType],'#ffe14d',true);
        ring(P.x,P.y,90,'#ffe14d',.5);
        burst(P.x,P.y,22,'#ffe14d',260,.55,3);
      }
    } else if(P.rouletteResultT<=0){
      P.rouletteT -= dt;
      if(P.rouletteT<=0){
        P.rouletteT = P.roulette===1?30 : P.roulette===2?20 : 10;
        P.rouletteSpin = 1.6;
        P.rouletteSwapT = 0;
        P.rouletteSpinTxt = pick(ROULETTE_BUFFS);
      }
    }
  }

  /* --- 장판 (화염 등) --- */
  for(let i=zones.length-1;i>=0;i--){
    const z=zones[i];
    z.t += dt; z.tickT -= dt;
    if(z.tickT<=0){
      z.tickT = 0.45;
      const dmg = pdmg()*0.55;
      near(z.x,z.y,z.r,e=>{ if(dist2(z.x,z.y,e.x,e.y)<z.r*z.r) hurt(e,dmg,e.x,e.y,false) });
    }
    if(z.t>=z.life) zones.splice(i,1);
  }

  /* --- 탄환 --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt;
    if(b.t>2.4){bullets.splice(i,1);continue}
    let done=false;
    near(b.x,b.y,26,e=>{
      if(done||b.hit.has(e))return;
      if(dist2(b.x,b.y,e.x,e.y) < (e.r+9)**2){
        b.hit.add(e);
        const killed = hurt(e, b.dmg, b.x, b.y, true, b.ang);
        if(P.aoe>0){
          const R=52+P.aoe*15;
          ring(b.x,b.y,R,'#ffb03a',.3);
          burst(b.x,b.y,7,'#ff8a2a',210,.35,3);
          near(b.x,b.y,R,o=>{ if(o!==e && dist2(b.x,b.y,o.x,o.y)<R*R) hurt(o, b.dmg*0.65, o.x,o.y,false) });
          shake(0.09,2.4);
        }
        if(b.bounce>0){
          let best=null,bd=240*240;
          near(b.x,b.y,240,o=>{ if(b.hit.has(o))return; const d=dist2(b.x,b.y,o.x,o.y); if(d<bd){bd=d;best=o} });
          if(best){
            const a=Math.atan2(best.y-b.y,best.x-b.x);
            b.ang=a; b.vx=Math.cos(a)*b.sp; b.vy=Math.sin(a)*b.sp; b.bounce--; b.t=0;
            burst(b.x,b.y,5,'#8fe0ff',150,.25,2);
            return;
          }
        }
        if(b.pierce>0) b.pierce--;
        else { bullets.splice(i,1); done=true; }
      }
    });
  }

  /* --- 적 --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.ph += dt*(e.boss?4:6.2);
    e.flash = Math.max(0,e.flash-dt*7);
    if(e.trapT>0) e.trapT-=dt;
    if(e.freezeT>0){
      const wasFrozen=true;
      e.freezeT -= dt;
      if(e.freezeT<=0){
        e.freezeT=0;
      }
    }
    if(e.slowT>0) e.slowT-=dt;
    if(e.chill>0 && e.freezeT<=0) e.chill = Math.max(0, e.chill - dt*0.18);
    if(e.poisonStk>0){
      e.poisonT -= dt;
      if(e.poisonT<=0){
        const poisonDmg = e.poisonStk * pdmg() * 0.22;
        hurt(e, poisonDmg, e.x, e.y-e.r*0.4, false);
        fx.push({poisontick:1, x:e.x, y:e.y-e.r*0.5, t:0, life:.3});
        e.poisonT = 0.55;
      }
      e.poisonDecayT = (e.poisonDecayT||0) - dt;
      if(e.poisonDecayT<=0){ e.poisonStk = Math.max(0,e.poisonStk-1); e.poisonDecayT = 1.4; }
    }

    const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
    e.face = dx>0?1:-1;
    let sx=dx/d, sy=dy/d, spd=e.spd;
    if(e.boss){ if(d>380) spd*=2.1; else if(d>240) spd*=1.45; }
    if(e.freezeT>0) spd=0;
    else if(e.slowT>0) spd*=0.42;
    // 분리
    near(e.x,e.y,e.r*2.1,o=>{
      if(o===e)return;
      const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy)||1, min=(e.r+o.r)*0.86;
      if(od<min){ const f=(min-od)/min*(o.boss?0.15:1); sx+=ox/od*f*1.5; sy+=oy/od*f*1.5 }
    });
    const sl=Math.hypot(sx,sy)||1;
    e.x += (sx/sl)*spd*dt + e.kx*dt;
    e.y += (sy/sl)*spd*dt + e.ky*dt;
    e.kx*=Math.pow(0.0009,dt); e.ky*=Math.pow(0.0009,dt);

    // 접촉 피해 (완전히 얼어붙은 몬스터는 공격 불가)
    if(d < e.r+P.r && P.invuln<=0 && e.freezeT<=0){
      damagePlayer(e.dmg*(e.boss?1:0.5));
      P.invuln = 0.62;
      const a=Math.atan2(dy,dx);
      e.kx-= Math.cos(a)*260; e.ky-=Math.sin(a)*260;
    }
    if(e.hp<=0){
      killEnemy(e,i);
    }
  }

  /* --- 보석 --- */
  const pr = P.pick, pr2 = pr*pr;
  const forcePull = Math.max(0, gems.length-60);
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    if(i<forcePull) g.pull=true;
    const d2=dist2(g.x,g.y,P.x,P.y);
    if(d2<pr2 || g.pull){
      g.pull=true;
      const d=Math.sqrt(d2)||1;
      const sp = 180+ (1-clamp(d/pr,0,1))*640;
      g.x += (P.x-g.x)/d*sp*dt; g.y += (P.y-g.y)/d*sp*dt;
      if(d<18){
        if(g.nuke) triggerNuke(g.x,g.y);
        else if(g.timestop) triggerTimeStop(g.x,g.y);
        else if(g.mimic) triggerMimicBox(g.x,g.y);
        else gainXP(g.v);
        gems.splice(i,1); continue;
      }
    }
    g.ph += dt*4;
  }

  /* --- 플레이어 상태 --- */
  P.invuln-=dt; P.hitFlash=Math.max(0,P.hitFlash-dt*4);
  if(P.regen>0 && P.hp<P.hpMax){ P.hp=Math.min(P.hpMax,P.hp+P.regen*dt); }
  if(P.shieldMax>0 && P.shield<P.shieldMax){
    P.shieldT-=dt;
    if(P.shieldT<=0){ P.shield++; P.shieldT=Math.max(4,10-P.shieldMax); ring(P.x,P.y,42,'#6fd3ff',.4) }
  }

  /* --- 파티클 --- */
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=dt;
    if(f.t>=f.life){fx.splice(i,1);continue}
    if(f.vx!==undefined){ f.x+=f.vx*dt;f.y+=f.vy*dt; f.vx*=Math.pow(0.02,dt);f.vy*=Math.pow(0.02,dt); f.vy+=90*dt }
  }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.t+=dt; t.y-=38*dt; if(t.t>=t.life)texts.splice(i,1) }
  if(game.shakeT>0){ game.shakeT-=dt; if(game.shakeT<=0)game.shakeM=0 }

  syncHUD();
}

function shoot(ang){
  const sp = 560;
  const crit = P.buffType==='crit100' || Math.random()<P.crit;
  const willBounce = P.bounce>0;
  bullets.push({
    x:P.x+Math.cos(ang)*20, y:P.y-4+Math.sin(ang)*20,
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, sp, ang,
    dmg: pdmg()*(crit?2.2:1), crit,
    pierce:P.pierce, bounce: willBounce?P.bounce:0, ricochet:willBounce, t:0, hit:new Set()
  });
}

function pdmg(){ return P.dmg * (P.buffType==='dmg2' ? 2 : 1); }

function hurt(e, dmg, hx, hy, fromBullet, ang){
  if(e.hp<=0) return false;
  if(e.freezeT>0) dmg *= 1.4;
  e.hp -= dmg;
  e.flash = 1;
  if(P.knock>0 && !e.boss && fromBullet){
    const a = ang ?? Math.atan2(e.y-P.y,e.x-P.x);
    e.kx += Math.cos(a)*P.knock*95; e.ky += Math.sin(a)*P.knock*95;
  }
  const crit = dmg>pdmg()*1.6;
  popText(hx, hy-e.r-4, Math.round(dmg), crit?'#ffd34d':'#fff4dd', crit);
  burst(hx,hy,crit?7:4, crit?'#ffd34d':'#ffb347', 190,.3,2.4);
  return e.hp<=0;
}

function killEnemy(e, idx){
  if(idx===undefined) idx = enemies.indexOf(e);
  if(idx<0) return;
  const wasFrozen = e.freezeT>0;
  enemies.splice(idx,1);
  game.kills++;
  const col = ELEM[e.el]?.tint || '#9ad06a';
  burst(e.x,e.y, e.boss?46:11, col, e.boss?330:200, e.boss?.8:.45, e.boss?5:3);
  if(e.boss){
    ring(e.x,e.y,190,'#ff5a3c',.7); ring(e.x,e.y,260,'#ffd34d',.9);
    shake(0.6,14);
    game.bossKills++;
    game.boss=null; hpBossEl.classList.remove('on');
    P.hp = Math.min(P.hpMax, P.hp + P.hpMax*0.3);
    popText(P.x,P.y-40,'+체력 회복','#7fe08a',true);
    for(let i=0;i<14;i++) dropGem(e.x+rnd(70,-70), e.y+rnd(70,-70), e.xp/14);
  } else {
    dropGem(e.x,e.y,e.xp);
    const r = Math.random();
    if(r<0.001) dropNuke(e.x,e.y);
    else if(r<0.0017) dropTimeStop(e.x,e.y);
    else if(r<0.0024) dropMimicBox(e.x,e.y);
  }
}
function dropGem(x,y,v){ gems.push({x,y,v,ph:rnd(TAU),pull:false}) }
function dropNuke(x,y){ gems.push({x,y,v:0,ph:rnd(TAU),pull:true,nuke:true}) }
function dropTimeStop(x,y){ gems.push({x,y,v:0,ph:rnd(TAU),pull:true,timestop:true}) }
function dropMimicBox(x,y){ gems.push({x,y,v:0,ph:rnd(TAU),pull:true,mimic:true}) }

function spawnIcicles(x,y,n){
  for(let i=0;i<n;i++){
    let best=null,bd=280*280;
    near(x,y,280,o=>{ const d=dist2(x,y,o.x,o.y); if(d<bd){bd=d;best=o} });
    const ang = best? Math.atan2(best.y-y,best.x-x) : rnd(TAU);
    bullets.push({
      x,y, vx:Math.cos(ang)*420, vy:Math.sin(ang)*420, sp:420, ang,
      dmg:pdmg()*0.9, crit:false, pierce:0, bounce:0, ricochet:false,
      t:0, hit:new Set(), icicle:true
    });
  }
  burst(x,y,10,'#bfeeff',180,.4,3);
}
function iceExplosion(x,y,lvl){
  const R = 70 + lvl*16, dmg = pdmg()*(1.1+lvl*0.4);
  near(x,y,R,o=>{ if(dist2(x,y,o.x,o.y)<R*R) hurt(o,dmg,o.x,o.y,false) });
  ring(x,y,R,'#bfeeff',.4);
  fx.push({iceburst:1,x,y,r:R,t:0,life:.4});
  burst(x,y,16,'#dff6ff',230,.5,3);
  shake(0.18,4);
}

function gainXP(v){
  P.xp += v*P.xpMul;
  while(P.xp>=P.xpNeed){
    P.xp -= P.xpNeed;
    P.lv++;
    P.xpNeed = Math.floor(7 + P.lv*5.5 + Math.pow(P.lv,1.9));
    ring(P.x,P.y,120,'#ffd34d',.55);
    burst(P.x,P.y,18,'#ffd34d',260,.6,3);
    queueLevelUp();
  }
}

function triggerNuke(x,y){
  // 화면 내 일반 몬스터 전멸 (보스는 영향받지 않음)
  const onScreen = enemies.filter(e=>!e.boss && Math.abs(e.x-cam.x)<(W/2)/ZOOM+60 && Math.abs(e.y-cam.y)<(H/2)/ZOOM+60);
  for(const e of onScreen) hurt(e, 999999, e.x, e.y, false);
  popText(x,y-30,'몬스터 전멸!','#ff9c3c',true);
  ring(P.x,P.y,Math.max(W,H)*0.6,'#ffb347',.6);
  ring(P.x,P.y,Math.max(W,H)*0.4,'#fff2c0',.5);
  burst(x,y,40,'#ffb347',360,.7,4);
  shake(0.5,12);
}

function triggerTimeStop(x,y){
  // 화면 내 모든 적을 잠깐 정지 (일반 몹 4초, 보스 1.5초). 정지 중 피해 +40% (freezeT 상태 재사용)
  for(const e of enemies){
    e.freezeT = Math.max(e.freezeT, e.boss ? 1.5 : 4);
    e.chill = 0;
  }
  popText(x,y-30,'시간 정지!','#8fe0ff',true);
  ring(P.x,P.y,Math.max(W,H)*0.55,'#bfeeff',.6);
  burst(x,y,30,'#bfeeff',260,.6,3);
  shake(0.25,6);
}

function triggerMimicBox(x,y){
  // 즉시 보너스 스킬 선택 카드 1회 제공
  popText(x,y-30,'미믹 상자! 보너스 스킬','#ffb347',true);
  ring(P.x,P.y,80,'#ffb347',.5);
  burst(x,y,24,'#ffd9a0',240,.55,3);
  queueLevelUp();
}

function damagePlayer(d){
  if(P.buffType==='invuln'){
    ring(P.x,P.y,40,'#ffe14d',.25);
    return;
  }
  if(P.shield>0){
    P.shield--; P.shieldT = Math.max(4,10-P.shieldMax);
    ring(P.x,P.y,50,'#6fd3ff',.35);
    popText(P.x,P.y-42,'방어!','#6fd3ff',true);
    shake(0.12,3); return;
  }
  d = Math.min(d, P.hpMax*0.40);   // 풀피에서 한 방에 죽지는 않는다
  P.hp -= d; P.hitFlash=1; shake(0.16,5);
  popText(P.x,P.y-42,'-'+Math.round(d),'#ff6a55');
  if(P.hp<=0){ P.hp=0; gameOver() }
}

/* ==========================================================================
   렌더
   ========================================================================== */
function draw(){
  const sx = game.shakeT>0? rnd(game.shakeM,-game.shakeM):0;
  const sy = game.shakeT>0? rnd(game.shakeM,-game.shakeM):0;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#222a23'; ctx.fillRect(0,0,W,H);

  // 월드 좌표계 진입: 화면 중심 기준으로 이동 + 축소(ZOOM)해서 더 넓은 범위를 보여준다
  ctx.save();
  ctx.translate(W/2+sx, H/2+sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cam.x, -cam.y);

  // 바닥 (월드 좌표 기준으로 패턴을 그대로 채우면 카메라를 따라 자연스럽게 타일링된다)
  {
    const halfW=(W/2)/ZOOM+300, halfH=(H/2)/ZOOM+300;
    ctx.fillStyle=groundPat;
    ctx.fillRect(cam.x-halfW, cam.y-halfH, halfW*2, halfH*2);
  }

  // 장판 (화염 등, 바닥층)
  for(const z of zones){
    const k = 1-z.t/z.life;
    if(z.type==='fire'){
      ctx.save(); ctx.globalAlpha=clamp(k*0.55+0.15,0.15,0.6);
      const grd = ctx.createRadialGradient(z.x,z.y,0,z.x,z.y,z.r);
      grd.addColorStop(0,'rgba(255,150,60,.55)'); grd.addColorStop(1,'rgba(255,90,30,0)');
      ctx.fillStyle=grd; ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();
      ctx.globalAlpha=clamp(k+0.2,0,1); ctx.strokeStyle='#ff9c4a'; ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
      ctx.restore();
    }
  }

  // 블랙홀
  for(const bh of blackholes){
    const t=performance.now()/1000;
    ctx.save(); ctx.translate(bh.x,bh.y);
    ctx.fillStyle='#0a0a12'; ctx.beginPath();ctx.arc(0,0,bh.r*0.28,0,TAU);ctx.fill();
    for(let i=0;i<3;i++){
      const rr=bh.r*(0.42+i*0.18);
      ctx.strokeStyle='#8a4fd6'; ctx.globalAlpha=0.55-i*0.14; ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(0,0,rr,t*(2.4-i*0.5),t*(2.4-i*0.5)+4.6);ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // 독구름
  if(poisonCloud && P.poison>0){
    const R=110+P.poison*24, t=performance.now()/1000;
    ctx.save(); ctx.globalAlpha=0.30;
    const grd=ctx.createRadialGradient(poisonCloud.x,poisonCloud.y,0,poisonCloud.x,poisonCloud.y,R);
    grd.addColorStop(0,'rgba(140,220,70,.55)'); grd.addColorStop(1,'rgba(80,160,50,0)');
    ctx.fillStyle=grd; ctx.beginPath();ctx.arc(poisonCloud.x,poisonCloud.y,R,0,TAU);ctx.fill();
    ctx.globalAlpha=0.5;
    for(let i=0;i<5;i++){
      const a=i/5*TAU+t*0.4, rr=R*0.55;
      ctx.beginPath();ctx.arc(poisonCloud.x+Math.cos(a)*rr,poisonCloud.y+Math.sin(a)*rr*0.6,8+i%2*4,0,TAU);
      ctx.fillStyle='#9adf5a'; ctx.fill();
    }
    ctx.restore();
  }

  // 운석 예고 & 낙하
  for(const m of meteors){
    const k = 1-m.t/0.7;
    ctx.save(); ctx.globalAlpha=0.55;
    ctx.strokeStyle='#ff5a2c'; ctx.lineWidth=3; ctx.setLineDash([8,7]);
    ctx.beginPath();ctx.arc(m.x,m.y,m.r*clamp(k+0.15,0.15,1),0,TAU);ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=0.18; ctx.fillStyle='#ff5a2c';
    ctx.beginPath();ctx.arc(m.x,m.y,m.r*clamp(k+0.15,0.15,1),0,TAU);ctx.fill();
    ctx.restore();
    // 낙하하는 운석 본체 (예고 후반부에 하늘에서 접근)
    if(k>0.35){
      const fall = clamp((k-0.35)/0.65,0,1);
      ctx.save();
      ctx.translate(m.x*0+m.x, m.y - (1-fall)*420);
      ctx.globalAlpha=1;
      ctx.fillStyle='#8a4022';
      ctx.beginPath();ctx.arc(0,0,20+fall*6,0,TAU);ctx.fill();
      ctx.fillStyle='#ff7a3c';
      ctx.beginPath();ctx.arc(-4,-4,10,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(255,140,60,.5)'; ctx.lineWidth=8;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-60-fall*30);ctx.stroke();
      ctx.restore();
    }
  }

  // 보석
  for(const g of gems){
    const b=Math.sin(g.ph)*2;
    if(g.nuke){
      const t=performance.now()/1000, pulse=1+Math.sin(t*7)*0.14;
      ctx.save(); ctx.translate(g.x,g.y+b);
      ctx.rotate(Math.sin(t*4)*0.15);
      ctx.shadowColor='#ff6a2c'; ctx.shadowBlur=18;
      const s=11*pulse;
      // 폭발 아이콘: 방사형 스파이크 + 코어
      ctx.fillStyle='#ff7a33';
      for(let i=0;i<8;i++){
        const a=i/8*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*s*0.35, Math.sin(a)*s*0.35);
        ctx.lineTo(Math.cos(a-0.16)*s, Math.sin(a-0.16)*s);
        ctx.lineTo(Math.cos(a+0.16)*s, Math.sin(a+0.16)*s);
        ctx.closePath(); ctx.fill();
      }
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff2c0';
      ctx.beginPath();ctx.arc(0,0,s*0.42,0,TAU);ctx.fill();
      ctx.restore();
      continue;
    }
    if(g.timestop){
      const t=performance.now()/1000, pulse=1+Math.sin(t*6)*0.12;
      ctx.save(); ctx.translate(g.x,g.y+b);
      ctx.shadowColor='#8fe0ff'; ctx.shadowBlur=16;
      const s=10*pulse;
      ctx.strokeStyle='#bfeeff'; ctx.lineWidth=2.4; ctx.fillStyle='#e8faff';
      ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#2a6f8a'; ctx.lineWidth=1.6; ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*0.7);ctx.moveTo(0,0);ctx.lineTo(s*0.5,s*0.15);ctx.stroke();
      ctx.restore();
      continue;
    }
    if(g.mimic){
      const t=performance.now()/1000, pulse=1+Math.sin(t*5)*0.10;
      ctx.save(); ctx.translate(g.x,g.y+b);
      ctx.shadowColor='#ffb347'; ctx.shadowBlur=16;
      const s=11*pulse;
      ctx.fillStyle='#8a6640'; ctx.strokeStyle='#3d2a15'; ctx.lineWidth=1.6;
      ctx.beginPath();ctx.roundRect(-s,-s*0.6,s*2,s*1.2,2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e8c46a';
      ctx.beginPath();ctx.roundRect(-s*0.18,-s*0.7,s*0.36,s*0.5,1);ctx.fill();
      ctx.restore();
      continue;
    }
    const big = g.v>6;
    ctx.save(); ctx.translate(g.x,g.y+b);
    ctx.shadowColor= big?'#ffd34d':'#4fb0e8'; ctx.shadowBlur=10;
    ctx.fillStyle= big?'#ffd34d':'#5fc0f5';
    const s= big?7:5;
    ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.72,0);ctx.lineTo(0,s);ctx.lineTo(-s*.72,0);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=.5;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.72,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // 적 (y정렬)
  const vis = enemies.filter(e=>Math.abs(e.x-cam.x)<(W/2)/ZOOM+90 && Math.abs(e.y-cam.y)<(H/2)/ZOOM+90);
  vis.sort((a,b)=>a.y-b.y);
  for(const e of vis) drawEnemy(e);

  // 플레이어
  drawPlayer();

  // 탄환
  for(const b of bullets){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.ang);
    if(b.icicle){
      ctx.globalAlpha=.4; ctx.strokeStyle='#bfeeff'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(-4,0);ctx.stroke();
      ctx.globalAlpha=1; ctx.shadowColor='#8fe0ff'; ctx.shadowBlur=10;
      ctx.fillStyle='#dff6ff'; ctx.strokeStyle='#6fc4e8'; ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-4);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();
      continue;
    }
    const trailCol = b.ricochet? '#9fe8ff' : (b.crit?'#fff0b0':'#ffb840');
    ctx.globalAlpha=.35; ctx.strokeStyle=trailCol;
    ctx.lineWidth= b.crit?5:3.4; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-4,0);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.shadowColor= b.ricochet? '#6fd3ff' : (b.crit?'#fff2c0':'#ffb03a'); ctx.shadowBlur= b.crit?16:9;
    if(IMG.arrow){ const s=b.crit?1.25:1; ctx.drawImage(IMG.arrow,-17*s,-4*s,34*s,8*s) }
    else{ ctx.fillStyle='#ffd34d'; ctx.fillRect(-14,-2.5,28,5) }
    ctx.restore();
  }

  // 파티클
  for(const f of fx){
    const k=1-f.t/f.life;
    ctx.globalAlpha=k;
    if(f.aura){
      ctx.globalAlpha=k*0.30;
      ctx.fillStyle='#c9ff5a';
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.6+0.4*(1-k)),0,TAU);ctx.fill();
      ctx.globalAlpha=k*0.6; ctx.strokeStyle='#d7ff8a'; ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.stroke();
    } else if(f.iceburst){
      ctx.save(); ctx.globalAlpha=k*0.7;
      ctx.strokeStyle='#bfeeff'; ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.5+0.5*(1-k)),0,TAU);ctx.stroke();
      ctx.globalAlpha=k*0.22; ctx.fillStyle='#dff6ff';
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.5+0.5*(1-k)),0,TAU);ctx.fill();
      ctx.restore();
    } else if(f.freeze){
      ctx.save(); ctx.translate(f.x,f.y); ctx.globalAlpha=k;
      ctx.strokeStyle='#8fe0ff'; ctx.lineWidth=2.4; ctx.lineCap='round';
      for(let i=0;i<6;i++){
        const a=i/6*TAU;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*14*(1-k+0.3),Math.sin(a)*14*(1-k+0.3));ctx.stroke();
      }
      ctx.restore();
    } else if(f.poisontick){
      ctx.save(); ctx.globalAlpha=k*0.8; ctx.fillStyle='#9adf5a';
      ctx.beginPath();ctx.arc(f.x,f.y-(1-k)*14,3.4,0,TAU);ctx.fill();
      ctx.restore();
    } else if(f.trap){
      ctx.save(); ctx.translate(f.x,f.y);
      ctx.globalAlpha=k*0.85;
      ctx.strokeStyle='#e8c46a'; ctx.fillStyle='rgba(232,196,106,.18)';
      ctx.lineWidth=2.4;
      ctx.beginPath();ctx.ellipse(0,4,f.r*(0.4+0.6*(1-k)),f.r*0.38*(0.4+0.6*(1-k)),0,0,TAU);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f0d488';
      for(let i=0;i<6;i++){
        const a=i/6*TAU, rr=f.r*0.5*(0.4+0.6*(1-k));
        ctx.save();ctx.translate(Math.cos(a)*rr, 4+Math.sin(a)*rr*0.38);ctx.rotate(a);
        ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(3,0);ctx.lineTo(0,-10*k);ctx.closePath();ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    } else if(f.bolt){
      ctx.save(); ctx.translate(f.x,f.y);
      ctx.globalAlpha=clamp(k*1.4,0,1);
      const bh=520;
      ctx.strokeStyle='#fff6c8'; ctx.lineWidth=5*k+1.5; ctx.lineCap='round';
      ctx.shadowColor='#ffe14d'; ctx.shadowBlur=22;
      ctx.beginPath();
      let px=0,py=-bh;
      ctx.moveTo(px,py);
      for(let s=1;s<=6;s++){
        px += rnd(16,-16); py = -bh + (bh)*(s/6);
        ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.shadowBlur=0;
      ctx.globalAlpha=k*0.5; ctx.fillStyle='#ffe14d';
      ctx.beginPath();ctx.ellipse(0,4,26*(0.5+0.5*k),9*(0.5+0.5*k),0,0,TAU);ctx.fill();
      ctx.restore();
    } else if(f.ring){
      ctx.strokeStyle=f.col; ctx.lineWidth=3*k+.6;
      ctx.beginPath();ctx.arc(f.x,f.y,lerp(f.r0,f.r1,1-k*k),0,TAU);ctx.stroke();
    } else {
      ctx.fillStyle=f.col; ctx.beginPath();ctx.arc(f.x,f.y,f.r*k,0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // 데미지 텍스트
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of texts){
    const k=1-t.t/t.life;
    ctx.globalAlpha=clamp(k*1.6,0,1);
    ctx.font=`900 ${t.big?19:14}px system-ui,sans-serif`;
    ctx.lineWidth=3.4; ctx.strokeStyle='rgba(8,10,14,.85)';
    ctx.strokeText(t.txt,t.x,t.y); ctx.fillStyle=t.col; ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // 보스 방향 지시
  if(game.boss){
    const e=game.boss;
    if(Math.abs(e.x-cam.x)>(W/2)/ZOOM-40 || Math.abs(e.y-cam.y)>(H/2)/ZOOM-40){
      const a=Math.atan2(e.y-cam.y,e.x-cam.x);
      const rx=Math.min(W/2-38,Math.abs(Math.cos(a))*9999)*Math.sign(Math.cos(a));
      const ry=Math.min(H/2-38,Math.abs(Math.sin(a))*9999)*Math.sign(Math.sin(a));
      const m=Math.min((W/2-38)/Math.abs(Math.cos(a)||1e-6),(H/2-38)/Math.abs(Math.sin(a)||1e-6));
      const px=W/2+Math.cos(a)*m, py=H/2+Math.sin(a)*m;
      ctx.save();ctx.translate(px,py);ctx.rotate(a);
      ctx.fillStyle='rgba(217,75,60,.9)';
      ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-9,-9);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }

  // 비네트
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,7,10,.44)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  if(P.hitFlash>0){ ctx.fillStyle=`rgba(190,40,30,${P.hitFlash*0.22})`; ctx.fillRect(0,0,W,H) }
}

function drawShadow(x,y,rx){
  ctx.globalAlpha=.32;ctx.fillStyle='#05070a';
  ctx.beginPath();ctx.ellipse(x,y,rx,rx*0.34,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
}

function drawEnemy(e){
  if(e.boss){
    const t=performance.now()/1000, pr=e.r*(2.3+Math.sin(t*2.4)*0.14);
    const rg=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,pr);
    rg.addColorStop(0,'rgba(190,40,28,.30)');rg.addColorStop(.55,'rgba(150,30,22,.13)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(e.x,e.y,pr,0,TAU);ctx.fill();
  }
  const flyer = (e.k==='mon2'||e.k==='mon11'||e.k==='mon13'||e.k==='mon4');
  const bob = Math.abs(Math.sin(e.ph))* (flyer?4:2);
  const c = monsterSprite(e.k, e.el, Math.round(e.size), e.boss);
  drawShadow(e.x, e.y+e.r*0.62, e.r*0.85);
  ctx.save();
  ctx.translate(e.x, e.y - bob);
  if(e.face<0) ctx.scale(-1,1);
  const dy = -(c.height - c._pad);
  ctx.drawImage(c, -c.width/2, dy);
  if(e.flash>0){
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=e.flash*0.75;
    ctx.drawImage(c, -c.width/2, dy);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();

  // 상태 이상 오버레이: 빙결(파란 결정) / 중독(초록 거품)
  if(e.freezeT>0){
    ctx.save();
    ctx.globalAlpha=0.30; ctx.fillStyle='#bfeeff';
    ctx.beginPath();ctx.ellipse(e.x, e.y-bob-e.size*0.28, e.size*0.34, e.size*0.42,0,0,TAU);ctx.fill();
    ctx.globalAlpha=0.8; ctx.strokeStyle='#eaffff'; ctx.lineWidth=1.6; ctx.lineCap='round';
    for(let i=0;i<5;i++){
      const a=i/5*TAU;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y-bob-e.size*0.28);
      ctx.lineTo(e.x+Math.cos(a)*e.size*0.30, e.y-bob-e.size*0.28+Math.sin(a)*e.size*0.30);
      ctx.stroke();
    }
    ctx.restore();
  } else if(e.chill>0.15){
    ctx.save();ctx.globalAlpha=e.chill*0.28;ctx.fillStyle='#8fe0ff';
    ctx.beginPath();ctx.arc(e.x,e.y-bob-e.size*0.3,e.size*0.30,0,TAU);ctx.fill();ctx.restore();
  }
  if(e.poisonStk>0){
    ctx.save(); ctx.globalAlpha=0.65;
    const pt=performance.now()/1000;
    for(let i=0;i<Math.min(3,e.poisonStk);i++){
      const bob2=Math.sin(pt*3+i*2)*3;
      ctx.fillStyle='#9adf5a';
      ctx.beginPath();ctx.arc(e.x-e.size*0.18+i*e.size*0.18, e.y-bob-e.size*0.5+bob2, 2.6,0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  if(e.boss){
    // 아래에서 위로 은은히 새어나오는 붉은 기운
  } else if(e.hp<e.hpMax){
    const w=e.r*1.7, h=3.4, y=e.y-e.r*1.55;
    ctx.fillStyle='rgba(6,8,11,.8)';ctx.fillRect(e.x-w/2-1,y-1,w+2,h+2);
    ctx.fillStyle= e.el!=='none'? (ELEM[e.el].tint):'#d9463c';
    ctx.fillRect(e.x-w/2,y,w*clamp(e.hp/e.hpMax,0,1),h);
  }
}

function drawPlayer(){
  let key, fr;
  const moving = touch.on&&(Math.abs(touch.dx)+Math.abs(touch.dy)>0.08) ||
                 keys['a']||keys['d']||keys['w']||keys['s']||
                 keys['arrowleft']||keys['arrowright']||keys['arrowup']||keys['arrowdown'];
  if(P.atkAnim>=0){
    fr = clamp(Math.floor(P.atkAnim/0.34*5),0,4);
    key = 'atk_'+fr;
  } else if(moving){
    key='run_'+(Math.floor(P.anim)%4);
  } else {
    key='idle_'+(Math.floor(P.anim*0.6)%3);
  }
  const im = IMG[key]||IMG.idle_0;
  const S=76;
  drawShadow(P.x,P.y+13,15);

  // 사거리(희미)
  ctx.save();ctx.globalAlpha=.035;ctx.strokeStyle='#f5b73d';ctx.lineWidth=1.5;
  ctx.setLineDash([7,9]);ctx.beginPath();ctx.arc(P.x,P.y,P.range,0,TAU);ctx.stroke();ctx.restore();

  // 가시 오라 범위(은은)
  if(P.aura>0){
    const R=64+P.aura*17;
    ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle='#c9ff5a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(P.x,P.y,R,0,TAU);ctx.stroke();ctx.restore();
  }
  // 가시 장판 감지 범위(은은, 점선)
  if(P.trap>0){
    ctx.save();ctx.globalAlpha=.09;ctx.strokeStyle='#e8c46a';ctx.lineWidth=1.5;
    ctx.setLineDash([5,6]);
    ctx.beginPath();ctx.arc(P.x,P.y,58,0,TAU);ctx.stroke();ctx.restore();
  }

  ctx.save();
  ctx.translate(P.x, P.y - Math.abs(Math.sin(P.anim*0.9))*(moving?2.5:1.2));
  if(P.face<0) ctx.scale(-1,1);
  if(im) ctx.drawImage(im, -S/2, -S*0.80, S, S);
  if(P.invuln>0 && Math.floor(P.invuln*14)%2===0){
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;
    if(im) ctx.drawImage(im, -S/2, -S*0.80, S, S);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();

  // 방패
  if(P.shield>0){
    const t=performance.now()/1000;
    for(let i=0;i<P.shield;i++){
      const a=t*1.6+i/P.shield*TAU, R=30;
      ctx.save();ctx.globalAlpha=.85;
      ctx.translate(P.x+Math.cos(a)*R, P.y-6+Math.sin(a)*R*0.5);
      ctx.shadowColor='#6fd3ff';ctx.shadowBlur=10;
      ctx.fillStyle='#8fe3ff';ctx.beginPath();ctx.arc(0,0,4.2,0,TAU);ctx.fill();
      ctx.restore();
    }
    ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#6fd3ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(P.x,P.y-6,32,0,TAU);ctx.stroke();ctx.restore();
  }
}

/* ==========================================================================
   HUD / UI
   ========================================================================== */
const $ = id=>document.getElementById(id);
const hpFill=$('hpFill'),hpTxt=$('hpTxt'),xpFill=$('xpFill'),xpTxt=$('xpTxt'),lvTxt=$('lvTxt'),
      killTxt=$('killTxt'),timeTxt=$('timeTxt'),shieldTxt=$('shieldTxt'),chipsEl=$('chips'),
      cardsEl=$('cards'),lvupEl=$('lvup'),startEl=$('start'),overEl=$('over'),pauseEl=$('pause'),
      bossEl=$('boss'),bossWord=$('bossWord'),bossSub=$('bossSub'),hpBossEl=$('hpBoss'),
      bossFill=$('bossFill'),bossNm=$('bossNm'),lvupTitle=$('lvupTitle'),buffBannerEl=$('buffBanner'),
      slotMachineEl=$('slotMachine'),slotTextEl=$('slotText');

const BUFF_NAMES = {aspd2:'⚡ 공격속도 ×2', spd3:'🏃 이동속도 ×3', crit100:'🎯 치명타 100%', dmg2:'💥 공격력 ×2', invuln:'✨ 무적'};
function syncHUD(){
  hpFill.style.transform=`scaleX(${clamp(P.hp/P.hpMax,0,1)})`;
  hpTxt.textContent=`${Math.ceil(P.hp)} / ${P.hpMax}`;
  xpFill.style.transform=`scaleX(${clamp(P.xp/P.xpNeed,0,1)})`;
  xpTxt.textContent=`${Math.floor(P.xp)} / ${P.xpNeed}`;
  lvTxt.textContent='LV '+P.lv;
  killTxt.textContent='☠ '+game.kills;
  timeTxt.textContent=fmtTime(game.t);
  shieldTxt.textContent = P.shieldMax? '🛡 '+P.shield+'/'+P.shieldMax : '';
  if(game.boss){ bossFill.style.transform=`scaleX(${clamp(game.boss.hp/game.boss.hpMax,0,1)})` }
  if(P.buffType){
    buffBannerEl.classList.add('on');
    buffBannerEl.textContent = `${BUFF_NAMES[P.buffType]} (${Math.ceil(P.buffT)}s)`;
  } else {
    buffBannerEl.classList.remove('on');
  }
  if(P.rouletteSpin>0){
    slotMachineEl.classList.add('on','spin'); slotMachineEl.classList.remove('landed');
    slotTextEl.textContent = BUFF_NAMES[P.rouletteSpinTxt] || '???';
  } else if(P.rouletteResultT>0){
    slotMachineEl.classList.add('on','landed'); slotMachineEl.classList.remove('spin');
    slotTextEl.textContent = BUFF_NAMES[P.rouletteSpinTxt] || '???';
  } else {
    slotMachineEl.classList.remove('on','spin','landed');
  }
}
function syncChips(){
  chipsEl.innerHTML='';
  for(const id in P.ups){
    const u=UPMAP[id];
    const d=document.createElement('div');d.className='chip';
    d.innerHTML=`${u.name}<u>${P.ups[id]}</u>`;
    chipsEl.appendChild(d);
  }
}

/* --- 레벨업 카드 --- */
let lvQueue=0;
function queueLevelUp(){ lvQueue++; if(!game.picking) showLevelUp() }
function showLevelUp(){
  if(lvQueue<=0)return;
  game.picking=true;
  const avail = UPGRADES.filter(u=>(P.ups[u.id]||0)<u.max);
  const weights = avail.map(u=>({n:'n',r:'r',e:'e',l:'l'}[u.rar]));
  const wmap={n:1,r:0.7,e:0.45,l:0.25};
  const pool=[];
  avail.forEach(u=>{
    let w = wmap[u.rar]*(P.ups[u.id]?1.35:1);
    if(P.lv<4 && u.rar==='l') w*=0.25;
    for(let i=0;i<Math.round(w*20);i++) pool.push(u);
  });
  const chosen=[];
  while(chosen.length<3 && pool.length){
    const u=pick(pool);
    if(!chosen.includes(u)) chosen.push(u);
    if(chosen.length>=avail.length) break;
  }
  lvupTitle.textContent = `LEVEL ${P.lv}`;
  cardsEl.innerHTML='';
  chosen.forEach((u,i)=>{
    const cur=P.ups[u.id]||0, nxt=cur+1;
    const col=RC[u.rar];
    const card=document.createElement('div');
    card.className='card'; card.tabIndex=0; card.dataset.up=u.id; card.style.setProperty('--rc',col);
    const ic=iconCanvas(u.ic,col);
    card.innerHTML=`
      <span class="key">${i+1}</span>
      ${cur===0?'<span class="newTag">NEW</span>':''}
      <img class="ic" src="${ic.toDataURL()}" alt="">
      <h3>${u.name}</h3>
      <p>${u.desc(nxt)}</p>
      <div class="lvl">${RNAME[u.rar]} · Lv ${nxt}/${u.max}</div>`;
    const go=()=>{
      u.apply(P); P.ups[u.id]=nxt;
      syncChips();
      lvQueue--;
      cardsEl.innerHTML='';
      if(lvQueue>0){ showLevelUp() }
      else { game.picking=false; lvupEl.classList.remove('show'); last=performance.now() }
    };
    card.onclick=go;
    card.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go()};
    cardsEl.appendChild(card);
  });
  lvupEl.classList.add('show');
  if(!chosen.length){ lvQueue=0; game.picking=false; lvupEl.classList.remove('show') }
}

/* --- 상태 전환 --- */
function togglePause(){
  if(game.picking||game.over)return;
  game.paused=!game.paused;
  pauseEl.classList.toggle('show',game.paused);
  if(game.paused){
    $('pauseStats').innerHTML=`생존 ${fmtTime(game.t)} · LV ${P.lv} · 처치 ${game.kills}`;
  } else last=performance.now();
}
function gameOver(){
  if(game.over)return;
  game.over=true;
  if(window.MGH) MGH.submitScore('archer', Math.floor(game.t), {lv:P.lv, kills:game.kills, boss:game.bossKills});
  shake(0.7,16);
  $('oTime').textContent=fmtTime(game.t);
  $('oLv').textContent=P.lv;
  $('oKill').textContent=game.kills;
  $('oBoss').textContent=game.bossKills;
  $('overSub').textContent = game.bossKills>0
    ? `보스 ${game.bossKills}체를 쓰러뜨렸다. 다음엔 더 멀리.`
    : '보스의 그림자조차 보지 못했다.';
  setTimeout(()=>overEl.classList.add('show'), 700);
  const secs = Math.floor(game.t);
  const vsBtn = $('btnVs');
  vsBtn.style.display = 'none';
  if(window.MGH && MGH.result && secs >= 10){
    const L2 = (ko,en)=> MGH.L ? MGH.L(ko,en) : ko;
    const vsOpts = {
      board:'archer', score:secs, fmt:s=>fmtTime(s),
      game:'ARCHER SURVIVOR', icon:'🏹', accent:'#ff9b4a',
      label:L2('내 생존','MY SURVIVAL'), friend:L2('친구','Friend'), question:L2('누가 오래 버티나?','Who survives longer?'),
      sub:`LV ${P.lv} · ${L2('처치','Kills')} ${game.kills}${game.bossKills?` · ${L2('보스','Boss')} ${game.bossKills}`:''}`,
      meta:{lv:P.lv, kills:game.kills, boss:game.bossKills},
      shareText:L2(`🏹 궁수 서바이버 ${fmtTime(secs)} 생존! 누가 더 오래 버티나 대결하자`, `🏹 I survived ${fmtTime(secs)} in Archer Survivor. Can you last longer?`)
    };
    vsBtn.textContent = L2('🔥 친구에게 도전하기','🔥 Challenge a friend');
    vsBtn.style.display = '';
    vsBtn.onclick = ()=> MGH.result.open(vsOpts);
    setTimeout(()=> MGH.result.open(vsOpts), 1100);
  }
}
function startGame(){
  reset();
  startEl.classList.remove('show'); startEl.style.display='none';
  overEl.classList.remove('show'); pauseEl.classList.remove('show'); lvupEl.classList.remove('show');
  lvQueue=0;
  last=performance.now();
}
$('btnStart').onclick=startGame;
$('btnRetry').onclick=startGame;
$('btnResume').onclick=togglePause;
$('btnQuit').onclick=()=>{pauseEl.classList.remove('show');game.paused=false;startGame()};
$('btnPause').onclick=e=>{e.stopPropagation();togglePause()};

/* ==========================================================================
   루프
   ========================================================================== */
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05,(now-last)/1000)||0;
  last=now;
  if(!game) return;
  if(!game.over && !game.paused && !game.picking && startEl.style.display==='none'){
    update(dt);
  }
  draw();
}

/* ---------- 부팅 ---------- */
(function boot(){
  loadAll(()=>{
    buildGround();
    reset();
    last=performance.now();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
