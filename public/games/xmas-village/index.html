<!doctype html>
<html lang="ko">
<head>
<script src="/mgh/bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>크리스마스 소원 마을</title>
<meta name="description" content="눈 내리는 밤의 크리스마스 마을. 눈사람이 되어 마을을 걷고, 한가운데 커다란 트리에 소원을 걸어 보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(22,26,52,.62);--line:rgba(255,255,255,.14);--ink:#f4f2ff;--sub:#b9bcd8;--gold:#ffd88a;--pink:#ffd6dc}
html,body{margin:0;height:100%;background:#050814;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.ui{position:fixed;z-index:5;transition:opacity .6s}
body:not(.in) .ui{opacity:0;pointer-events:none}
body.cine .ui{opacity:0;pointer-events:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}
/* 상단 칩 */
.chips{top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;border:1px solid var(--line)}
.chip b{color:var(--gold)}
/* 소원 패널 */
.wish{left:18px;top:calc(18px + env(safe-area-inset-top));width:300px;border-radius:22px;padding:18px 18px 16px;box-sizing:border-box}
.wish h2{margin:0;font-size:20px}
.wish p{margin:6px 0 14px;color:var(--sub);font-size:13px;line-height:1.5}
.wish .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{position:relative;aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);padding:0;overflow:hidden}
.grid button img{width:100%;height:100%;object-fit:contain}
.grid button.on{border-color:var(--gold);background:rgba(255,216,138,.16);box-shadow:0 0 14px rgba(255,216,138,.35)}
.grid button.lock img{filter:brightness(.3) saturate(.2)}
.grid button.lock::after{content:'🔒\A' attr(data-day) '일차';white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:900;line-height:1.5;color:#fff;text-shadow:0 1px 3px #000}
.wish textarea{margin-top:14px;width:100%;box-sizing:border-box;height:78px;resize:none;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:14px;padding:12px}
.wish .cnt{text-align:right;font-size:11px;color:var(--sub);margin-top:-22px;margin-right:10px;position:relative;pointer-events:none}
.wish .btns{display:flex;gap:8px;margin-top:12px}
.wish .pv{flex:none;border:1px solid var(--line);border-radius:14px;padding:14px 14px;font-weight:900;font-size:14px;background:rgba(255,255,255,.08)}
.wish .pv.on{background:rgba(255,216,138,.2);border-color:var(--gold)}
.wish .att{margin-top:12px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;line-height:1.5}
.wish .att b{color:var(--gold)}
.wish .go{flex:1;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#fff0f2,#ffd6dc);color:#3a1a22}
.wish .go:disabled{opacity:.5}
/* 미리보기 */
.prev{right:18px;top:calc(18px + env(safe-area-inset-top));width:300px;height:300px;border-radius:22px;overflow:hidden}
.prev canvas{width:100%;height:100%}
.prev .tag{position:absolute;left:12px;top:12px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.45)}
/* 내 눈사람 카드 */
.me{left:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px}
.me .av{position:relative;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a4580,#1a1f40);overflow:visible}
.me .av img{width:100%;height:100%}
.me .av button{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:0;border-radius:999px;background:#ffd6dc;color:#3a1a22;font-size:10px;font-weight:900;padding:2px 7px;white-space:nowrap}
.me b{display:block;font-size:15px}
.me small{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin-top:3px}
.me small i{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
/* 하단 메뉴 */
.menu{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;padding:6px;border-radius:22px;gap:2px}
.menu button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:800;min-width:66px}
.menu button span{font-size:19px;line-height:1}
.menu button.on{background:rgba(255,255,255,.12)}
.right{right:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:8px}
.right button{border:1px solid var(--line);border-radius:18px;padding:0 18px;height:52px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px}
.right .sq{width:52px;padding:0;justify-content:center;font-size:18px}
.hint{left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12.5px;color:#d6d9f2;white-space:nowrap;text-shadow:0 1px 4px #000;pointer-events:none}
.pop{left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:6px;padding:6px;border-radius:18px}
.pop.show{display:flex}
.pop button{border:0;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.toast{left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-8px);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.joy{left:22px;bottom:calc(110px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(20,26,52,.35);border:1px solid var(--line);display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.35)}
@media (pointer:coarse){.joy{display:block}}
/* 꾸미기 */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,6,18,.55)}
.modal.show{display:flex}
.modal .box{width:min(420px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;border-radius:22px;padding:18px;box-sizing:border-box}
.modal h3{margin:0 0 12px;font-size:18px}
.modal label{display:block;font-size:12px;color:var(--sub);font-weight:800;margin:12px 0 6px}
.modal input{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
.opts button.on{border-color:var(--gold);background:rgba(255,216,138,.18)}
.opts .sw{width:30px;height:30px;padding:0;border-radius:50%}
.modal .row{display:flex;gap:8px;margin-top:18px}
.modal .row button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}
/* 소원 카드 · 목록 · 로그인 */
#wcard{z-index:24}#loginBox{z-index:26}
.wcard canvas{width:100%;aspect-ratio:1;border-radius:16px;display:block}
.wcard .who{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
.wcard .who b{color:var(--ink);font-size:14px}
.wcard .acts{display:flex;gap:8px;margin-top:12px}
.wcard .acts button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:11px 6px;font-weight:900;font-size:14px}
.wcard .acts .heart.on{background:rgba(255,120,140,.2);border-color:#ff8fa0;color:#ffd6dc}
.wcard .acts .close{background:#ffd6dc;color:#3a1a22;border:0}
.msgs .box{width:min(520px,calc(100vw - 20px));height:min(680px,calc(100vh - 40px));display:flex;flex-direction:column}
.msgs .tabs{display:flex;gap:6px;margin-bottom:10px}
.msgs .tabs button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px;font-weight:900;font-size:13px}
.msgs .tabs button.on{background:rgba(255,216,138,.18);border-color:var(--gold);color:var(--gold)}
.msgs .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.msgs .it{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.msgs .it img{width:44px;height:44px;flex:none}
.msgs .it .tx{flex:1;min-width:0}
.msgs .it .tx b{display:block;font-family:"Nanum Pen Script",cursive;font-size:21px;font-weight:400;line-height:1.15;word-break:break-all}
.msgs .it .tx small{color:var(--sub);font-size:11.5px}
.msgs .it .hc{flex:none;font-size:12px;color:#ffb3c0;font-weight:800}
.msgs .empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:14px;line-height:1.6}
.msgs .more{margin-top:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-weight:800}
.login p{color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 14px}
.login .lb{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;font-size:15px;margin-top:8px}
.intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a2050,#050814);transition:opacity 1s}
.intro .box{text-align:center;padding:24px}
.intro h1{font-size:30px;margin:0 0 10px}
.intro p{color:var(--sub);margin:0;font-size:14px;line-height:1.6}
.intro .bar{margin:18px auto 0;width:200px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.intro .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.credit{position:fixed;right:8px;top:calc(4px + env(safe-area-inset-top));font-size:9px;color:rgba(255,255,255,.3);z-index:4;pointer-events:none}
body.cine .credit{opacity:0}
.cinehint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.55);display:none;z-index:6;pointer-events:none}
body.cine .cinehint{display:block}
/* 모바일 */
@media (max-width:760px), (pointer:coarse) and (max-width:1100px){
  .chips{top:calc(10px + env(safe-area-inset-top));left:0;right:0;transform:none;max-width:none;padding:2px 12px}
  .chip{padding:7px 11px;font-size:12px}
  .wish .x{position:sticky;top:0;float:right;margin:-6px -6px 0 0;z-index:2;background:rgba(40,46,80,.9)}
  .wish{left:10px;right:10px;width:auto;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:22px;max-height:64vh;overflow:auto;z-index:8}
  .prev{right:12px;top:calc(56px + env(safe-area-inset-top));width:150px;height:150px;border-radius:18px}
  .me{left:10px;bottom:calc(84px + env(safe-area-inset-bottom));padding:6px 14px 6px 6px}
  .me .av{width:44px;height:44px}.me b{font-size:13px}
  .menu{left:10px;right:10px;transform:none;justify-content:space-around;bottom:calc(10px + env(safe-area-inset-bottom))}
  .menu button{min-width:0;padding:7px 6px;font-size:11px}
  .right{bottom:calc(84px + env(safe-area-inset-bottom));right:10px}
  .right button{height:44px;padding:0 12px;font-size:13px}.right .sq{width:44px}
  .right .fs{display:none}
  .hint{bottom:calc(150px + env(safe-area-inset-bottom));font-size:11.5px}
  .pop{bottom:calc(144px + env(safe-area-inset-bottom));max-width:calc(100vw - 20px)}
  .pop button{padding:10px 11px}
  .joy{bottom:calc(160px + env(safe-area-inset-bottom))}
  body.popopen .joy,body.popopen .hint{opacity:0;pointer-events:none}
  .me{max-width:calc(100vw - 150px);box-sizing:border-box}
  .me>div:last-child{min-width:0}
  .me b,.me small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right .lbl{display:none}
  .right #bTree{width:44px;padding:0;justify-content:center;font-size:18px}
  body.panel .me,body.panel .right,body.panel .joy,body.panel .menu{opacity:0;pointer-events:none}
}
@media (max-width:760px), (pointer:coarse) and (max-width:1100px){.menu button{white-space:nowrap}}
@media (max-width:380px){.menu{padding:5px}.menu button{font-size:10px;padding:7px 1px;letter-spacing:-.3px}.menu button span{font-size:17px}}
</style>
</head>
<body>
<div class="ui chips">
  <div class="chip glass" id="cToday">✨ 오늘의 소원</div>
</div>

<section class="ui wish glass" id="wish">
  <button class="x" id="wishClose" aria-label="접기">✕</button>
  <h2>소원을 걸어보세요</h2>
  <p>특별한 장식품에 소원을 적어<br>트리에 걸어보세요.</p>
  <div class="grid" id="grid"></div>
  <textarea id="wishText" maxlength="50" placeholder="소원을 적어주세요…"></textarea>
  <div class="cnt"><span id="wishCnt">0</span>/50</div>
  <div class="att" id="att"></div>
  <div class="btns"><button class="pv" id="wishPrev">👀 미리보기</button><button class="go" id="wishGo">🎄 트리에 걸기</button></div>
</section>
<div class="ui prev glass" id="prev"><canvas id="prevCv" width="600" height="600"></canvas><span class="tag">내 소원 미리보기</span></div>

<div class="ui me glass">
  <div class="av"><img id="meImg" alt=""><button id="bDeco">꾸미기</button></div>
  <div><b id="meName"></b><small><i></i>지금 <span id="ppl">1</span>명이 함께 있어요</small></div>
</div>
<div class="ui hint" id="hint">방향키 또는 바닥을 클릭해서 걸어요 · 드래그로 둘러보기 (위로 끌면 하늘)</div>
<div class="ui pop glass" id="playPop">
  <button data-e="wave">👋 손 흔들기</button><button data-e="jump">⛄ 폴짝</button><button data-e="sit">🪵 앉기</button>
</div>
<nav class="ui menu glass">
  <button id="mWish"><span>🎄</span>소원 걸기</button>
  <button id="mMove"><span>🚶</span>이동하기</button>
  <button id="mPlay"><span>🙂</span>놀기</button>
  <button id="mCine"><span>🌙</span>눈멍하기</button>
  <button id="mMsg"><span>💬</span>메시지 보기</button>
  <button id="mShot"><span>📷</span>사진찍기</button>
</nav>
<div class="ui right">
  <button class="glass" id="bTree" title="트리로 가기">📍<span class="lbl"> 트리로 가기</span></button>
  <button class="glass sq" id="bSound">🔈</button>
  <button class="glass sq fs" id="bFull">⛶</button>
</div>
<div class="ui joy" id="joy"><i></i></div>
<div class="ui toast glass" id="toast"></div>
<div class="credit">트리·전구·울타리: goryana (CC0)</div>
<div class="cinehint">화면을 누르면 돌아와요</div>

<div class="modal" id="deco"><div class="box glass">
  <h3>⛄ 내 눈사람 꾸미기</h3>
  <label>이름 (8자까지)</label><input id="dName" maxlength="8">
  <label>모자</label><div class="opts" id="dHat"></div>
  <label>모자 색</label><div class="opts" id="dHatC"></div>
  <label>목도리 색</label><div class="opts" id="dScarf"></div>
  <label>단추 색</label><div class="opts" id="dBtn"></div>
  <label>손에 든 것</label><div class="opts" id="dHold"></div>
  <div class="row"><button id="dCancel" style="background:rgba(255,255,255,.1)">닫기</button><button id="dSave" style="background:#ffd6dc;color:#3a1a22">저장</button></div>
</div></div>

<div class="modal" id="wcard"><div class="box glass wcard">
  <canvas id="wcCv" width="600" height="600"></canvas>
  <div class="who"><b id="wcNick"></b><span id="wcDate"></span></div>
  <div class="acts"><button class="heart" id="wcHeart">🤍 0</button><button id="wcMore">🚩 신고</button><button class="close" id="wcClose">닫기</button></div>
</div></div>
<div class="modal msgs" id="msgs"><div class="box glass">
  <h3>💬 모두의 소원</h3>
  <div class="tabs"><button data-s="new" class="on">최신</button><button data-s="top">❤️ 인기</button><button data-s="mine">내 소원</button></div>
  <div class="list" id="msgList"></div>
  <div class="row"><button id="msgClose" style="background:rgba(255,255,255,.1)">닫기</button></div>
</div></div>
<div class="modal login" id="loginBox"><div class="box glass">
  <h3>🎄 로그인하고 소원을 걸어요</h3>
  <p>소원 걸기 · ❤️ · 신고는 로그인한 사람만 할 수 있어요.<br>마을 구경과 소원 읽기는 로그인 없이도 돼요.</p>
  <button class="lb" id="lgK" style="background:#fee500;color:#191600">카카오로 로그인</button>
  <button class="lb" id="lgG" style="background:#fff;color:#222">Google로 로그인</button>
  <button class="lb" id="lgE" style="background:rgba(255,255,255,.12)">이메일로 로그인</button>
  <div class="row"><button id="lgClose" style="background:rgba(255,255,255,.08)">닫기</button></div>
</div></div>
<div class="intro" id="intro"><div class="box"><h1>🎄 크리스마스 소원 마을</h1><p>눈 내리는 마을을 짓고 있어요…</p><div class="bar"><i id="bar"></i></div></div></div>

      const { sz, lines } = fit(44, 26, 290, 4);

    me.root.position.set(me.x, me.sitting ? .02 : 0, me.z); me.root.rotation.y = me.f;
    if (me.sitting) { me.root.rotation.y = me.sitting.f; me.root.userData.body.position.y = 0; }
    const wave = emoteAnim(me, me.root, now);
    if (!me.sitting) animateSnowman(me.root, t, moving, wave); else animateSnowman(me.root, t, false, wave);
    netSend(false);
  }
  // 다른 사람들
  for (const r of remotes.values()) {
    if (!r.root) continue; const dx = r.tx - r.x, dz = r.tz - r.z, L = Math.hypot(dx, dz), mv = L > .05;
    if (L > 8) { r.x = r.tx; r.z = r.tz; } else if (mv) { const s = Math.min(L, Math.max(3, L * 4) * dt); r.x += dx / L * s; r.z += dz / L * s; }
    let d = r.tf - r.f; d = Math.atan2(Math.sin(d), Math.cos(d)); r.f += d * Math.min(1, dt * 10);
    r.root.position.set(r.x, 0, r.z); r.root.rotation.y = r.f;
    animateSnowman(r.root, t, mv && !r.s, emoteAnim(r, r.root, now));
  }
  // 걸린 장식: 살랑살랑 · 새로 건 장식은 톡 하고 커진다
  for (const h of hung) { h.obj.rotation.z = Math.sin(t * 1.3 + h.ph) * .08; if (h.born) { const k = Math.min(1, (now - h.born) / 700); h.obj.scale.setScalar(h.sc * (k < 1 ? 1.4 * Math.sin(k * Math.PI * .75) / Math.sin(Math.PI * .75) : 1)); if (k >= 1) h.born = 0; } }
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.life -= dt * .9; s.s.position.addScaledVector(s.v, dt); s.v.multiplyScalar(.95); s.s.material.opacity = s.life; if (s.life <= 0) { scene.remove(s.s); sparks.splice(i, 1); } }
  // 카메라
  if (mode === 'cine') {
    const a = t * .06; camera.position.set(Math.sin(a) * 30, 6 + Math.sin(t * .05) * 3, Math.cos(a) * 30); camera.lookAt(0, 9 + Math.sin(t * .04) * 3, 0);
  } else if (me.root) {
    yaw += (tYaw - yaw) * Math.min(1, dt * 5); pitch += (tPitch - pitch) * Math.min(1, dt * 5); dist += (tDist - dist) * Math.min(1, dt * 5);
    tgt.set(me.x, 1.6, me.z);
    // 아래로 끌면 내려다보고, 위로 끌면 카메라가 눈 바닥까지 내려가 하늘을 올려다본다
    const cp = Math.cos(pitch), dx = -Math.sin(yaw) * cp, dy = -Math.sin(pitch), dz = -Math.cos(yaw) * cp;
    camPos.set(me.x - dx * dist, 2.8 - dy * dist, me.z - dz * dist);
    if (camPos.y < .45) { const k = (2.8 - .45) / Math.max(.001, dy); camPos.set(me.x - dx * Math.min(dist, k), .45, me.z - dz * Math.min(dist, k)); }
    camera.position.lerp(camPos, Math.min(1, dt * 6)); camera.lookAt(camera.position.x + dx, camera.position.y + dy, camera.position.z + dz);
  } else { const a = t * .05; camera.position.set(Math.sin(a) * 40, 12, Math.cos(a) * 40); camera.lookAt(0, 8, 0); }
  composer.render();
  requestAnimationFrame(frame);
}
frame();
window.__xv = { me, wishes, camera, get V() { return V; }, setCam: (y, p, d) => { tYaw = yaw = y; tPitch = pitch = p; tDist = dist = d; }, goto: (x, z, f) => { me.x = x; me.z = z; if (f !== undefined) me.f = f; } };
</script>
